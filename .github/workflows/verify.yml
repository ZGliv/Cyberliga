name: Verify release

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Application release gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: "127.0.0.1"
      PORT: "48173"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use current Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Verify project invariants
        run: npm run verify

      - name: Start preview server
        shell: bash
        run: |
          set -euo pipefail

          log_file="$RUNNER_TEMP/cyberliga-server.log"
          pid_file="$RUNNER_TEMP/cyberliga-server.pid"
          base_url="http://${HOST}:${PORT}"

          setsid npm run dev >"$log_file" 2>&1 &
          server_pid=$!
          printf '%s\n' "$server_pid" >"$pid_file"

          for attempt in {1..30}; do
            if ! kill -0 -- "-$server_pid" 2>/dev/null; then
              echo "Preview server exited before becoming ready."
              cat "$log_file"
              exit 1
            fi

            if curl --fail --silent --show-error --output /dev/null "$base_url/"; then
              echo "Preview server is ready after attempt $attempt."
              exit 0
            fi

            sleep 1
          done

          echo "Preview server did not become ready within 30 seconds."
          cat "$log_file"
          exit 1

      - name: Smoke-test public routes
        shell: bash
        run: |
          set -euo pipefail

          base_url="http://${HOST}:${PORT}"
          routes=(
            "/"
            "/world.html"
            "/league.html"
            "/social.html"
            "/moment.html"
            "/clip.html"
            "/characterlab.html"
            "/ops.html"
            "/index.html"
            "/football.html"
            "/hoops.html"
            "/hockey.html"
            "/baseball.html"
            "/fight.html"
          )

          for route in "${routes[@]}"; do
            safe_name=${route//\//_}
            headers="$RUNNER_TEMP/headers${safe_name}.txt"
            body="$RUNNER_TEMP/body${safe_name}.html"

            curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --dump-header "$headers" \
              --output "$body" \
              "$base_url$route"

            test -s "$body"
            grep -Eiq '^content-type:[[:space:]]*text/html([;[:space:]]|$)' "$headers"
            grep -Eiq '<!doctype[[:space:]]+html|<html([[:space:]>])' "$body"
            echo "Verified $route"
          done

      - name: Smoke-test canonical APIs
        shell: bash
        run: |
          set -euo pipefail

          base_url="http://${HOST}:${PORT}"
          routes=(
            "/api/config"
            "/api/live?sport=soccer"
            "/api/live?sport=american-football"
            "/api/league?sport=american-football"
          )

          index=0
          for route in "${routes[@]}"; do
            headers="$RUNNER_TEMP/api-headers-$index.txt"
            body="$RUNNER_TEMP/api-body-$index.json"
            curl \
              --fail \
              --silent \
              --show-error \
              --dump-header "$headers" \
              --output "$body" \
              "$base_url$route"
            grep -Eiq '^content-type:[[:space:]]*application/json([;[:space:]]|$)' "$headers"
            node -e 'const fs=require("fs"); JSON.parse(fs.readFileSync(process.argv[1],"utf8"));' "$body"
            echo "Verified $route"
            index=$((index + 1))
          done

      - name: Stop preview server
        if: ${{ always() }}
        shell: bash
        run: |
          set -u

          pid_file="$RUNNER_TEMP/cyberliga-server.pid"
          log_file="$RUNNER_TEMP/cyberliga-server.log"

          if [[ -f "$pid_file" ]]; then
            server_pid=$(<"$pid_file")
            if kill -0 -- "-$server_pid" 2>/dev/null; then
              kill -- "-$server_pid" 2>/dev/null || true
              for _ in {1..10}; do
                kill -0 -- "-$server_pid" 2>/dev/null || break
                sleep 1
              done
              if kill -0 -- "-$server_pid" 2>/dev/null; then
                kill -KILL -- "-$server_pid" 2>/dev/null || true
              fi
            fi
          fi

          if [[ -f "$log_file" ]]; then
            echo "Preview server log:"
            cat "$log_file"
          fi
