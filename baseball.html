<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:," />
<link rel="stylesheet" href="arena-score-fit.css" />
<link rel="stylesheet" href="broadcast-spine.css" />
<title>CYBERLIGA DIAMOND — LIVE BASEBALL</title>
<script src="watchonly.js"></script>
<script src="arena-score-fit.js" defer></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#02030a; }
  canvas { display:block; }
  .sr-only { position:absolute!important; width:1px!important; height:1px!important; padding:0!important; margin:-1px!important; overflow:hidden!important; clip:rect(0,0,0,0)!important; white-space:nowrap!important; border:0!important; }
  #hud { position:fixed; inset:0; pointer-events:none; font-family:'Rajdhani',sans-serif; }

  #scoreboard {
    position:absolute; top:22px; left:50%; transform:translateX(-50%);
    display:flex; align-items:stretch; width:min(700px, calc(100vw - 320px)); height:46px;
    max-width:calc(100vw - 32px);
    background:linear-gradient(180deg, rgba(8,12,28,.92), rgba(4,6,16,.92));
    border:1px solid rgba(88,255,180,.28); border-radius:8px;
    box-shadow:0 0 24px rgba(88,255,180,.15), inset 0 1px 0 rgba(255,255,255,.06);
    overflow:hidden; backdrop-filter:blur(6px);
  }
  .team { display:flex; align-items:center; min-width:0; gap:10px; padding:0 16px; overflow:hidden; font-family:'Orbitron'; font-weight:700; font-size:15px; letter-spacing:2px; }
  .team #nameA, .team #nameB {
    --score-fit-max:15px; --score-fit-min:9px; --score-fit-floor:6.25px; --score-fit-tracking:2px; --score-fit-min-tracking:0px;
    min-width:0; overflow:hidden; text-overflow:clip; white-space:nowrap;
  }
  .team .dot { width:10px; height:10px; border-radius:2px; transform:rotate(45deg); }
  #score {
    display:flex; align-items:center; padding:0 18px; font-family:'Orbitron'; font-weight:900; font-size:22px; color:#fff;
    background:rgba(88,255,180,.08); border-left:1px solid rgba(88,255,180,.22); border-right:1px solid rgba(88,255,180,.22);
    text-shadow:0 0 12px rgba(88,255,180,.6); min-width:92px; justify-content:center; letter-spacing:3px;
    transition:transform .12s;
  }
  #score.pop { transform:scale(1.18); }

  #countbar {
    position:absolute; top:74px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:14px;
    background:rgba(4,6,16,.82); border:1px solid rgba(255,255,255,.1); border-radius:6px; padding:4px 16px;
  }
  #playstatus {
    position:absolute; top:116px; left:50%; transform:translateX(-50%);
    min-width:190px; padding:5px 14px; border-radius:999px; text-align:center;
    font-family:'Orbitron'; font-weight:900; font-size:10px; letter-spacing:2.4px; color:#dffff0;
    background:rgba(3,8,17,.78); border:1px solid rgba(88,255,180,.22);
    box-shadow:0 0 18px rgba(88,255,180,.12); transition:color .15s, border-color .15s, box-shadow .15s;
  }
  #playstatus.hot { color:#fff3a8; border-color:rgba(255,211,77,.7); box-shadow:0 0 25px rgba(255,211,77,.32); }
  #venuebug {
    position:absolute; top:22px; right:22px; width:min(270px,22vw); padding:8px 12px 7px;
    border-right:3px solid var(--venue,#58ffb4); text-align:right;
    background:linear-gradient(90deg,transparent,rgba(3,8,17,.8));
    text-shadow:0 2px 10px #000;
  }
  #venuebug strong { display:block; font:900 11px/1 'Orbitron'; letter-spacing:2px; color:var(--venue,#8effc8); }
  #venuebug span { display:block; margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:700 10px/1 'Rajdhani'; letter-spacing:1.4px; color:rgba(242,255,250,.68); }
  #pitchread {
    position:absolute; left:22px; bottom:49px; width:min(310px,28vw); padding:9px 12px 8px;
    border-left:3px solid var(--pitch,#58ffb4); border-top:1px solid rgba(255,255,255,.1);
    background:linear-gradient(90deg,rgba(3,8,17,.88),rgba(3,8,17,.38));
    box-shadow:0 8px 24px rgba(0,0,0,.3); color:#eafff5;
  }
  #pitchread strong { display:block; font:900 10px/1 'Orbitron'; letter-spacing:2px; color:var(--pitch,#8effc8); }
  #pitchread span { display:block; margin-top:5px; font:700 12px/1 'Rajdhani'; letter-spacing:1.25px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #pitchread small { display:block; margin-top:5px; font:800 9px/1 'Orbitron'; letter-spacing:1.7px; color:rgba(234,255,245,.58); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .live { width:7px; height:7px; border-radius:50%; background:#ff2d55; animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1; box-shadow:0 0 8px #ff2d55;} 50%{opacity:.3;} }
  #inn { font-family:'Orbitron'; font-weight:700; font-size:14px; color:#9dffd0; letter-spacing:2px; }
  #count { font-family:'Orbitron'; font-weight:700; font-size:14px; color:#e8fff4; letter-spacing:2px; }
  #count em { font-style:normal; font-size:10px; color:#58ffb4; letter-spacing:1px; }
  #outs { display:flex; gap:5px; align-items:center; }
  #outs i { width:9px; height:9px; border-radius:50%; border:1px solid rgba(255,90,110,.6); background:transparent; }
  #outs i.on { background:#ff4d5e; box-shadow:0 0 8px rgba(255,60,80,.9); }
  #minibases { position:relative; width:30px; height:30px; }
  #minibases b { position:absolute; width:10px; height:10px; transform:rotate(45deg); border:1px solid rgba(88,255,180,.55); background:rgba(88,255,180,.06); border-radius:1.5px; }
  #minibases b.on { background:#58ffb4; box-shadow:0 0 10px rgba(88,255,180,.95); }
  #mb2 { top:0; left:10px; } #mb1 { top:10px; left:20px; } #mb3 { top:10px; left:0; }

  #flash { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; opacity:0; transition:opacity .22s; }
  #flash.show { opacity:1; }
  #flash.compact {
    inset:116px 22px auto auto; width:min(390px,calc(100vw - 44px)); min-height:0;
    align-items:flex-end; justify-content:center; padding:11px 15px 10px;
    border-left:3px solid var(--fc,#58ffb4); border-top:1px solid rgba(255,255,255,.12); border-radius:4px;
    background:linear-gradient(90deg,rgba(3,8,17,.55),rgba(3,8,17,.94));
    box-shadow:0 12px 32px rgba(0,0,0,.38); backdrop-filter:blur(6px);
  }
  #flash.compact #flashtext { font-size:clamp(18px,2.2vw,26px);letter-spacing:4px; line-height:1; text-align:right; }
  #flash.compact #flashsub { max-width:100%; margin-top:4px; font-size:12px;letter-spacing:2px; line-height:1.05; text-align:right; }
  #flash.feature:not(.compact) #flashtext { font-size:clamp(42px,7vw,84px); }
  #flashtext {
    font-family:'Orbitron'; font-weight:900; font-size:clamp(54px, 10vw, 124px); letter-spacing:14px;
    color:#fff; text-shadow:0 0 28px var(--fc,#58ffb4), 0 0 86px var(--fc,#58ffb4);
  }
  #flash.long #flashtext { font-size:clamp(42px,7vw,82px); letter-spacing:8px; white-space:nowrap; }
  #flash.show #flashtext { animation:slam .45s cubic-bezier(.2,1.6,.3,1); }
  @keyframes slam { 0%{ transform:scale(2.3); opacity:0; } 100%{ transform:scale(1); opacity:1; } }
  #flashsub { font-family:'Rajdhani'; font-weight:700; font-size:19px; letter-spacing:6px; color:rgba(255,255,255,.88); margin-top:6px; }
  #pitchcall {
    position:absolute; left:50%; top:51%; z-index:52; min-width:220px; padding:8px 18px 7px;
    transform:translate(-50%,-50%) scale(.84); opacity:0; text-align:center;
    border:1px solid rgba(255,255,255,.2); border-radius:999px; pointer-events:none;
    background:linear-gradient(180deg,rgba(7,13,29,.98),rgba(2,4,13,.95));
    box-shadow:0 10px 32px rgba(0,0,0,.58),0 0 30px var(--call,#58ffb4),inset 0 1px rgba(255,255,255,.1);
    transition:opacity .12s,transform .18s cubic-bezier(.2,1.45,.35,1),border-color .15s;
  }
  #pitchcall.show { opacity:1; transform:translate(-50%,-50%) scale(1); border-color:var(--call,#58ffb4); }
  #pitchcall.contact { top:34%; }
  #pitchcall.strikeout { top:27%; }
  #pitchcall strong { display:block; font:900 18px/1 'Orbitron'; letter-spacing:4px; color:var(--call,#fff); text-shadow:0 0 14px var(--call,#58ffb4); }
  #pitchcall span { display:block; margin-top:4px; font:700 11px/1 'Rajdhani'; letter-spacing:2.4px; color:#f2fffa; }

  #ticker {
    position:absolute; bottom:0; left:0; right:0; height:34px; display:flex; align-items:center; overflow:hidden;
    background:linear-gradient(180deg, rgba(4,6,16,.85), rgba(2,3,10,.95));
    border-top:1px solid rgba(88,255,180,.22);
  }
  #tickerlabel { position:relative; z-index:2; flex:0 0 auto; padding:0 14px; height:100%; display:flex; align-items:center; background:linear-gradient(180deg,#0a211f,#061513); box-shadow:8px 0 18px rgba(2,3,10,.8); font-family:'Orbitron'; font-weight:700; font-size:11px; color:#8effc8; letter-spacing:3px; border-right:1px solid rgba(88,255,180,.28); }
  #tickertext { white-space:nowrap; flex-shrink:0; font-size:15px; font-weight:600; color:rgba(228,255,242,.85); letter-spacing:1px; will-change:transform; transform:translateX(100vw); }

  #vignette { position:absolute; inset:0; background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,10,.55) 100%); }
  #scanlines { position:absolute; inset:0; background:repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0 1px, transparent 1px 3px); mix-blend-mode:overlay; }
  #watermark { position:absolute; bottom:50px; right:18px; font-family:'Orbitron'; font-weight:900; font-size:13px; letter-spacing:4px; color:rgba(142,255,200,.42); }

  #badge {
    position:absolute;
    top:calc(env(safe-area-inset-top, 0px) + 22px);
    left:calc(env(safe-area-inset-left, 0px) + 22px);
    z-index:60;
  }
  #leaguepill {
    pointer-events:auto; text-decoration:none;
    min-height:42px; display:inline-flex; align-items:center; justify-content:center; padding:0 16px; white-space:nowrap;
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:13px; line-height:1; letter-spacing:2px; color:#8effc8;
    border:1px solid rgba(88,255,180,.4); border-radius:99px;
    background:rgba(4,8,20,.7); box-shadow:0 0 12px rgba(88,255,180,.18);
    transition:color .15s, border-color .15s, box-shadow .15s;
  }
  #leaguepill:hover { color:#fff; background:rgba(88,255,180,.16); border-color:rgba(88,255,180,.7); box-shadow:0 0 18px rgba(88,255,180,.5); }
  #leaguepill:focus-visible { color:#fff; outline:2px solid #fff; outline-offset:3px; }

  #bigcard { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(2,3,10,.45); backdrop-filter:blur(3px); }
  #bigcard.show { display:flex; }
  #bigcard .panel { background:linear-gradient(180deg, rgba(8,12,28,.97), rgba(3,5,14,.97)); border:1px solid rgba(88,255,180,.32); border-radius:14px; padding:30px 48px; text-align:center; box-shadow:0 0 60px rgba(88,255,180,.16); min-width:420px; }
  #bigcard h1 { font-family:'Orbitron'; font-size:30px; letter-spacing:8px; color:#8effc8; margin-bottom:10px; text-shadow:0 0 18px rgba(88,255,180,.5); }
  #bigcard h2 { font-family:'Orbitron'; font-size:24px; color:#fff; margin-bottom:14px; letter-spacing:2px; }
  #bigcard .sub { font-size:15px; font-weight:600; color:#bdffe0; letter-spacing:3px; margin-bottom:6px; }
  #bigcard table { width:100%; border-collapse:collapse; font-size:14px; color:#e4fff2; margin-top:8px; }
  #bigcard td, #bigcard th { padding:4px 12px; border-bottom:1px solid rgba(255,255,255,.08); }
  #bigcard th { color:#7dffc0; font-size:11px; letter-spacing:2px; }
  #bigcard td.n { text-align:left; font-weight:700; }

  @media (max-width:700px) {
    #hud { isolation:isolate; min-height:100dvh; }
    #vignette {
      z-index:2;
      background:
        linear-gradient(180deg, rgba(2,3,10,.9) 0%, rgba(2,3,10,.72) 18%, transparent 42%, transparent 64%, rgba(2,3,10,.72) 100%),
        radial-gradient(ellipse at center, transparent 48%, rgba(0,0,10,.55) 100%);
    }
    #scanlines { z-index:3; opacity:.72; }
    #badge {
      top:calc(env(safe-area-inset-top, 0px) + 10px); left:calc(env(safe-area-inset-left, 0px) + 10px); z-index:70;
    }
    #leaguepill {
      min-height:42px; padding:0 14px; font-size:12px; letter-spacing:1.6px;
      background:rgba(5,12,24,.82); box-shadow:0 0 18px rgba(88,255,180,.22), inset 0 1px 0 rgba(255,255,255,.08);
    }
    #scoreboard {
      top:calc(env(safe-area-inset-top, 0px) + 53px); left:10px; right:10px; transform:none;
      width:auto; max-width:none; height:44px;
      display:grid; grid-template-columns:minmax(0, 1fr) auto minmax(0, 1fr);
      border-radius:12px; z-index:60;
      background:linear-gradient(180deg, rgba(8,14,30,.96), rgba(2,4,14,.92));
      box-shadow:0 10px 28px rgba(0,0,0,.38), 0 0 24px rgba(88,255,180,.2), inset 0 1px 0 rgba(255,255,255,.07);
    }
    .team { min-width:0; gap:5px; padding:0 6px; font-size:9px; letter-spacing:.35px; white-space:nowrap; overflow:hidden; }
    .team #nameA, .team #nameB {
      --score-fit-max:9px; --score-fit-min:6.8px; --score-fit-floor:6.2px; --score-fit-tracking:.35px; --score-fit-min-tracking:-.35px;
      min-width:0; max-width:100%; flex:1 1 auto; overflow:hidden; text-overflow:clip;
      font-size:clamp(6.8px,2vw,9px)!important; letter-spacing:.35px!important;
    }
    #teamB { justify-content:flex-end; text-align:right; }
    .team .dot { width:8px; height:8px; flex:0 0 8px; }
    #score { min-width:64px; height:100%; padding:0 6px; font-size:17px; letter-spacing:1.5px; }
    #countbar {
      top:calc(env(safe-area-inset-top, 0px) + 107px);
      gap:8px; min-height:31px; padding:4px 10px; border-radius:999px;
      max-width:calc(100vw - 20px); z-index:60;
      background:rgba(5,9,22,.82); border-color:rgba(88,255,180,.16); box-shadow:0 8px 22px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.06);
    }
    #playstatus {
      top:calc(env(safe-area-inset-top, 0px) + 145px); min-width:168px; max-width:calc(100vw - 24px);
      padding:5px 11px; font-size:9px; letter-spacing:1.7px; z-index:60; background:rgba(5,9,22,.82);
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    #venuebug {
      top:calc(env(safe-area-inset-top, 0px) + 178px); left:14px; right:14px; transform:none;
      width:auto; padding:5px 10px; border-right:0; border-bottom:2px solid var(--venue,#58ffb4);
      text-align:center; background:rgba(3,8,17,.72); z-index:59;
    }
    #venuebug strong { font-size:9px; letter-spacing:1.5px; }
    #venuebug span { display:none; }
    #pitchread {
      left:10px; right:10px; bottom:calc(43px + env(safe-area-inset-bottom, 0px)); width:auto; padding:6px 9px;
      z-index:64; background:rgba(3,8,17,.84); border-left-width:2px;
    }
    #pitchread strong { font-size:9.5px; letter-spacing:1.25px; }
    #pitchread span { margin-top:4px; font-size:11.5px; letter-spacing:.6px; }
    #pitchread small { margin-top:4px; font-size:8.5px; letter-spacing:.7px; }
    #inn, #count { font-size:12px; letter-spacing:1.2px; white-space:nowrap; }
    #count em { font-size:9px; }
    #outs i { width:8px; height:8px; }
    #minibases { width:24px; height:24px; transform:scale(.9); transform-origin:center; }
    #flash { z-index:45; }
    #flash.compact {
      inset:218px 10px auto 10px; width:auto; padding:9px 11px 8px;
      align-items:flex-start; background:linear-gradient(90deg,rgba(3,8,17,.94),rgba(3,8,17,.62));
    }
    #flash.compact #flashtext { font-size:18px; letter-spacing:3px; text-align:left; }
    #flash.compact #flashsub { font-size:11px; letter-spacing:1.55px; text-align:left; padding:0; }
    #flashtext { max-width:100vw; font-size:clamp(38px, 13vw, 68px); letter-spacing:5px; line-height:.98; text-align:center; overflow-wrap:anywhere; }
    #flash.long #flashtext { font-size:clamp(27px,8.6vw,38px); letter-spacing:3px; white-space:nowrap; overflow-wrap:normal; }
    #flashsub { max-width:calc(100vw - 28px); font-size:14px; letter-spacing:2.6px; line-height:1.15; text-align:center; padding:0 16px; }
    #pitchcall { top:46%; min-width:190px; max-width:calc(100vw - 28px); padding:7px 14px 6px; }
    #pitchcall.strikeout { top:68%; }
    #pitchcall strong { font-size:15px; letter-spacing:2.8px; }
    #pitchcall span { font-size:10px; letter-spacing:1.6px; }
    #bigcard { z-index:80; padding:12px; }
    #bigcard .panel {
      min-width:0; width:min(100%, 430px); max-height:calc(100vh - 24px); max-height:calc(100dvh - 24px);
      overflow:auto; padding:22px 16px; border-radius:12px;
    }
    #bigcard h1 { font-size:23px; letter-spacing:4px; }
    #bigcard h2 { font-size:19px; }
    #ticker {
      height:calc(35px + env(safe-area-inset-bottom, 0px)); padding-bottom:env(safe-area-inset-bottom, 0px);
      z-index:65; background:linear-gradient(180deg, rgba(5,9,22,.92), rgba(2,3,10,.98));
    }
    #tickerlabel { padding:0 10px; font-size:10px; letter-spacing:2px; }
    #tickertext { font-size:13px; letter-spacing:.6px; }
    #watermark { display:none; }
  }
  @media (max-width:380px) {
    #badge { left:calc(env(safe-area-inset-left, 0px) + 8px); }
    #scoreboard { left:8px; right:8px; width:auto; height:42px; }
    .team { padding:0 5px; gap:4px; font-size:8px; letter-spacing:.25px; }
    .team #nameA, .team #nameB { --score-fit-max:8px; --score-fit-min:6.5px; --score-fit-floor:6px; --score-fit-tracking:.25px; --score-fit-min-tracking:-.45px; }
    .team .dot { width:7px; height:7px; flex-basis:7px; }
    #score { min-width:60px; font-size:16px; letter-spacing:1.2px; }
    #countbar { max-width:calc(100vw - 16px); gap:6px; padding:4px 8px; }
    #inn, #count { font-size:11px; }
    #tickerlabel { padding:0 8px; font-size:9px; letter-spacing:1.4px; }
    #tickertext { font-size:12px; }
  }
</style>
</head>
<body>
<div id="hud">
  <div id="badge"><a id="leaguepill" class="watch-only-exit" href="world.html" aria-label="Back to the Cyberliga globe">← GLOBE</a></div>
  <div id="scoreboard">
    <div class="team" id="teamA"><span class="dot"></span><span id="nameA" data-score-fit>NEON FC</span></div>
    <div id="score" class="arena-score-readout" role="group" aria-label="Match score"><span class="score-value" id="sA" aria-label="Away score">0</span><span class="score-separator" aria-hidden="true"></span><span class="score-reader">to</span><span class="score-value" id="sB" aria-label="Home score">0</span></div>
    <div class="team" id="teamB"><span id="nameB" data-score-fit>VOLT UTD</span><span class="dot"></span></div>
  </div>
  <div id="countbar">
    <span class="live"></span><span id="inn">&#9650; 1</span>
    <span id="count"><em>B-S</em> 0-0</span>
    <span id="outs"><i></i><i></i><i></i></span>
    <span id="minibases"><b id="mb3"></b><b id="mb2"></b><b id="mb1"></b></span>
  </div>
  <div id="playstatus">FIRST PITCH LOADING</div>
  <div id="venuebug"><strong id="venuename">THE LONG AFTERNOON</strong><span id="venueline">ONE PITCH AT A TIME</span></div>
  <div id="pitchread"><strong id="pitchreadtop">MATCHUP LOADING</strong><span id="pitchreadbody">PITCHER VS BATTER</span><small id="pitchreadmeta">SCOUTING THE FIRST MATCHUP</small></div>
  <div id="pitchcall" role="status" aria-live="polite"><strong id="pitchcalltext"></strong><span id="pitchcallsub"></span></div>
  <div id="flash"><div id="flashtext"></div><div id="flashsub"></div></div>
  <div id="ticker"><div id="tickerlabel">DIAMOND</div><div id="tickertext"></div></div>
  <div id="bigcard"><div class="panel" id="cardpanel"></div></div>
  <div id="vignette"></div><div id="scanlines"></div>
</div>

    const th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1), v=power*(0.45+Math.random()*0.8);
    p.life=1.0+Math.random()*0.6;

    p.vx=v*Math.sin(ph)*Math.cos(th); p.vy=v*Math.cos(ph)*0.85; p.vz=v*Math.sin(ph)*Math.sin(th);
    p.s.material.color.setHex(Math.random()<0.3?0xffffff:colorHex);
  }

function sparkStep(dt){
  for (const p of sparks){
    if (p.life<=0){ p.s.material.opacity=0; continue; }
    p.life-=dt;
    p.vy-=9*dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt;
    p.s.position.set(p.x,Math.max(0.1,p.y),p.z);
    const k=clamp(p.life/1.2,0,1);
    p.s.material.opacity=k*0.85;
    const sc=0.5+(1-k)*1.3; p.s.scale.set(sc,sc,1);
  }
}

let AC=null, crowdGain=null, crowdLevel=0.05;
function noiseBurst(filterType, freq, dur, peak){
  if (!AC) return;
  const t=AC.currentTime, src=AC.createBufferSource(); src.buffer=AC._noise;
  const f=AC.createBiquadFilter(); f.type=filterType; f.frequency.value=freq;
  const g=AC.createGain();
  g.gain.setValueAtTime(peak,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  src.connect(f); f.connect(g); g.connect(AC._m); src.start(t); src.stop(t+dur+0.05);
}
const crack = ()=>{ noiseBurst('highpass',2400,0.09,0.22); noiseBurst('bandpass',900,0.05,0.12); };
const glovePop = ()=>noiseBurst('lowpass',360,0.1,0.16);
const bang = ()=>noiseBurst('lowpass',200,0.5,0.12);
function callBeep(up){ // two-tone ump call: up = SAFE, down = OUT
  if (!AC) return;
  const t=AC.currentTime;
  [up?420:560, up?620:380].forEach((f,i)=>{
    const o=AC.createOscillator(); o.type='square'; o.frequency.value=f;
    const g=AC.createGain();
    g.gain.setValueAtTime(0.0001,t+i*0.09); g.gain.linearRampToValueAtTime(0.06,t+i*0.09+0.015);
    g.gain.exponentialRampToValueAtTime(0.001,t+i*0.09+0.12);
    o.connect(g); g.connect(AC._m); o.start(t+i*0.09); o.stop(t+i*0.09+0.16);
  });
}
function horn(){
  if (!AC) return;
  const t=AC.currentTime;
  [146.83,185.0,110].forEach((f,i)=>{
    const o=AC.createOscillator(); o.type='sawtooth'; o.frequency.value=f;
    const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900;
    const g=AC.createGain();
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(i===2?0.09:0.15,t+0.05);
    g.gain.setValueAtTime(i===2?0.09:0.15,t+1.1); g.gain.linearRampToValueAtTime(0.0001,t+1.7);
    o.connect(lp); lp.connect(g); g.connect(AC._m); o.start(t); o.stop(t+1.8);
  });
}

// every player's resting assignment for the current situation
function dutySpot(p){
  const bt=batTeam(), ft=fldTeam();
  if (p.duty==='fielder'){
    const s=SPOTS[p.fieldPos], spot={x:s.x,z:s.z};
    if(S.defense==='DOUBLE-PLAY DEPTH' && (p.fieldPos===3||p.fieldPos===4)){ spot.x-=1.8; spot.z*=.78; }
    else if(S.defense==='INFIELD IN' && p.fieldPos>=2&&p.fieldPos<=5){ spot.x-=3.2; spot.z*=.82; }
    else if(S.defense==='NO-DOUBLES' && p.fieldPos>=6){ spot.x+=2.2; }
    else if(S.defense==='PULL SHIFT' && p.fieldPos>=2&&p.fieldPos<=8){ spot.z+=p.fieldPos%2===0?2.2:1.2; }
    return spot;
  }
  if (p.duty==='batter')  return { x:-0.5, z:1.15 };
  if (p.duty==='walkup') return { x:-5.8, z:(p.side===0?1:-1)*8.7 };
  if (p.duty==='exit') return { x:-6.4, z:(p.side===0?1:-1)*9.6 };

function steerIdle(){
  for (const t of teams) for (const p of t.players){
    if (p.path) continue;               // runners on scripted paths steer themselves
    const s=dutySpot(p);
    p.tx=s.x; p.tz=s.z; p.sprint=6;

function updatePlayers(dt){
  for (const p of allPlayers()){
    // scripted base-running path
    if (p.path){
      if(p.path.delay>0){p.path.delay=Math.max(0,p.path.delay-dt);p.tx=p.x;p.tz=p.z;}
      else{
        const wp=p.path[p.pathI];
        if (wp){
          const dx=wp.x-p.x, dz=wp.z-p.z, d=Math.hypot(dx,dz);
          if (d<0.45) p.pathI++;
          else { p.tx=wp.x; p.tz=wp.z; p.sprint=p.path.speed || RUNSPD; }
        }
        if (!p.path[p.pathI]){ // arrived
          const done=p.path.done; p.path=null; p.pathI=0;
          if (done) done(p);
        }
      }
    }
    const dx=p.tx-p.x, dz=p.tz-p.z, dist=Math.hypot(dx,dz);
    let dvx=0,dvz=0;
    if (dist>0.08){ const sp=p.sprint*clamp(dist/1.3,0,1); dvx=dx/dist*sp; dvz=dz/dist*sp; }
    const k=dampK(9,dt);
    p.vx+=(dvx-p.vx)*k; p.vz+=(dvz-p.vz)*k;
    p.x+=p.vx*dt; p.z+=p.vz*dt;
    if (!isFinite(p.x)||!isFinite(p.z)){ const s=dutySpot(p); p.x=s.x; p.z=s.z; p.vx=p.vz=0; }
    if (p.air){ p.jumpV-=26*dt; p.jumpY+=p.jumpV*dt; if (p.jumpY<=0){ p.jumpY=0; p.air=false; } }
    const sp=Math.hypot(p.vx,p.vz);
    let face;
    if ((p.duty==='batter'||(p===S.batter&&p.path?.delay>0&&S.swingT>=0)) && (S.state==='SETUP'||S.state==='WINDUP'||S.state==='PITCH'||S.state==='RESOLVE'||S.state==='STRIKEOUT_HOLD'||S.state==='LIVE'||S.state==='HOMER'))
      face=Math.PI; // chest faces the plate; the lead shoulder and eyes point toward the mound
    else face = sp>0.7 ? Math.atan2(p.vx,p.vz) : Math.atan2(ball.pos.x-p.x, ball.pos.z-p.z);
    p.heading=lerpAngle(p.heading, face, dampK(8,dt));
    p.rig.group.position.set(p.x, p.jumpY, p.z);
    p.rig.group.rotation.y=p.heading;
    p.rig.update(dt, clamp(sp/RUNSPD,0,1), { turn:0 });
  }

  ump.group.rotation.y=Math.PI/2;

}

  say(w ? `THAT IS THE BALLGAME — ${w.def.name} WIN IT ${Math.max(a.runs,b.runs)}-${Math.min(a.runs,b.runs)}` : 'A DRAW AT THE DIAMOND DOME — THE LEAGUE LOGS IT AND MOVES ON');
  window._games && window._games.push({ teams:[TEAM_A.name,TEAM_B.name], score:[a.runs,b.runs], inn:S.inning,
    dur:+(tGlobal-lastGameT).toFixed(0), clips:S.clips.slice() });
  lastGameT = tGlobal;
  const [ni, nj] = FIXTURES[(fixtureIdx + 1) % FIXTURES.length];
  showCard(`<h1>FINAL</h1><h2>${TEAM_A.name} ${a.runs} — ${b.runs} ${TEAM_B.name}</h2>
    <div class="sub">${w ? `${w.def.name} WIN AT THE DIAMOND DOME` : 'NOBODY BLINKED — A DRAW'}</div>
    <table><tr><th></th><th>R</th><th>H</th><th>E</th><th>HR</th><th>K</th></tr>
    <tr><td class="n" style="color:${TEAM_A.css}">${TEAM_A.name}</td><td>${a.runs}</td><td>${a.hits}</td><td>${a.errors}</td><td>${a.hrs}</td><td>${a.strikeouts}</td></tr>
    <tr><td class="n" style="color:${TEAM_B.css}">${TEAM_B.name}</td><td>${b.runs}</td><td>${b.hits}</td><td>${b.errors}</td><td>${b.hrs}</td><td>${b.strikeouts}</td></tr></table>
    <p style="margin-top:14px;font-size:14px;letter-spacing:3px;color:#7dffc0">NEXT — ${TEAMS[ni].name} vs ${TEAMS[nj].name} — <span id="nextin">${BASEBALL_PACING.final}</span>s</p>`);
  if(!suppressBaseballSpinePresentation)baseballBroadcastSpine?.finale(baseballMomentDirector?.top()||[]);
  S.broadcastBeat=`FINAL · ${w?w.def.name:'DRAW'}`;

// ---------- ball physics ----------
function ballStep(dt) {
  const b = ball;
  if (b.mode === 'IDLE') { if (teams.length) { const P = pitcherP(); b.pos.set(P.x - 0.45, 1.35, P.z); } return; }
  if (b.mode === 'CARRY') { const c = S.play && S.play.carrier; if (c) b.pos.set(c.x, 1.1 + c.jumpY, c.z); return; }
  if (b.mode === 'PITCH') {
    b.vel.z += b.curve*dt; b.vel.y -= GRAV*0.12*dt;   // laser-guided with a hint of drop
    b.pos.addScaledVector(b.vel, dt);
  } else { // LIVE / THROWN
    b.vel.y -= GRAV*dt;
    b.pos.addScaledVector(b.vel, dt);
    if (b.pos.y <= 0.17 && b.vel.y < 0) {
      b.pos.y = 0.17;
      if (Math.abs(b.vel.y) > 2.5) {
        b.vel.y *= -0.45; b.vel.x *= 0.75; b.vel.z *= 0.75;
        if (S.play) S.play.bounced = true;
      } else { b.vel.y = 0; if (S.play) S.play.bounced = true; }
    }
    if (b.pos.y <= 0.18) { b.vel.x *= Math.exp(-1.4*dt); b.vel.z *= Math.exp(-1.4*dt); } // roll friction
  }
  if (!isFinite(b.pos.x) || !isFinite(b.pos.y) || !isFinite(b.pos.z)) {
    b.mode = 'IDLE'; b.pos.set(MOUND_X - 0.5, 1.4, 0); b.vel.set(0, 0, 0);  // watchdog: ball never escapes the sim
  }
}

// ---------- state machine ----------
S.swingT = -1; S.swung = false;
function stateStep(dt) {
  S.t += dt;
  if (S.swingT >= 0) S.swingT += dt;
  switch (S.state) {
    case 'SETUP': {
      if (S.swingT > .86) S.swingT=-1;
      if (S.t > BASEBALL_PACING.setup) {
        S.pitchPlan=planPitch();S.broadcastBeat=`PITCH DESIGN · ${S.pitchPlan.name} · ${S.pitchPlan.location}`;
        S.swingT=-1;S.swung=false;setState('WINDUP');
      }
      break;
    }
    case 'WINDUP': {
      if (S.t > BASEBALL_PACING.windup || S.t > 4) throwPitch();         // readable leg-load before release
      break;
    }
    case 'PITCH': {
      const plan = S.pitchPlan;
      const trigger=plan&&plan.swingStyle==='EARLY'?3.65:plan&&plan.swingStyle==='LATE'?1.15:plan&&plan.swingStyle==='CHECK'?2.55:2.15;
      if (plan && plan.swing && !S.swung && ball.pos.x < trigger) { S.swung = true; S.swingT = 0; }
      if (ball.pos.x <= 0.02) { resolvePitch(false); break; }
      if (S.t > 2.5) { resolvePitch(true); break; }   // watchdog: lost pitch = ball
      break;
    }
    case 'RESOLVE': { // dead-ball beat: fouls + walks settle here
      const isWalk = S.play && S.play.type === 'WALK';
      if (S.t > (isWalk ? BASEBALL_PACING.walkHold : BASEBALL_PACING.foulHold) && (allSettled() || S.t > 4.8)) {
        if (isWalk) afterPlay();
        else { S.play = null; ball.mode = 'IDLE'; setState('SETUP'); cut('plate'); }
      }
      break;
    }
    case 'STRIKEOUT_HOLD': {
      // The swing begins shortly before the pitch reaches the plate. Hold this
      // side-on cut until hands, barrel and hips reach their authored finish.
      if((S.swingT>=.92&&S.t>.56)||S.t>BASEBALL_PACING.strikeoutHold){
        const hold=S.strikeoutHold;S.strikeoutHold=null;S.swingT=-1;S.swung=false;
        if(hold?.sideChange)sideChange();
        else beginBatterChange(hold?.reason||'AFTER THE STRIKEOUT');
      }
      break;
    }
    case 'BATTER_CHANGE': {
      const incoming=S.transition&&S.transition.incoming;
      if((incoming&&incoming.duty==='batter'&&S.t>BASEBALL_PACING.batterChangeMin)||S.t>BASEBALL_PACING.batterChangeMax){
        for(const p of batTeam().players){p.path=null;p.pathI=0;if(p!==incoming&&p.duty==='exit')p.duty='dugout';}
        if(incoming)incoming.duty='batter';
        snapAll();S.transition=null;setState('SETUP');cut('plate');
      }
      break;
    }
    case 'LIVE': {
      const pl = S.play;
      if (!pl) { setState('SETUP'); break; }
      if(S.camMode==='contact'&&S.t>.52)cut('chase');
      // chaser converges on the landing point (or intercepts the roller)
      if (pl.chaser && !pl.fielded && !pl.resolved) {
        if (pl.type === 'GROUND') { pl.chaser.tx = ball.pos.x + ball.vel.x*0.25; pl.chaser.tz = ball.pos.z + ball.vel.z*0.25; }
        else { pl.chaser.tx = pl.lx; pl.chaser.tz = pl.lz; }
        const range=playerTrait(pl.chaser,'range');
        pl.chaser.sprint = pl.forcedResult==='sac_fly' ? 9.4 : 7.45+range*1.25;
      }
      if (pl.type === 'GROUND') { // first baseman covers the bag
        const fb = fldTeam().players[2];
        if (fb !== pl.chaser) { fb.tx = BASES[0].x; fb.tz = BASES[0].z; fb.sprint = 8; }
      }
      if (pl.collect && pl.chaser) {   // jog over, pick it up, then visibly relay if needed
        pl.chaser.tx = ball.pos.x; pl.chaser.tz = ball.pos.z;
        if (dxz(pl.chaser.x, pl.chaser.z, ball.pos.x, ball.pos.z) < 0.8 && ball.pos.y < 0.6) {
          ball.mode = 'CARRY'; pl.carrier = pl.chaser;
          const challenge=pl.hitCredited?chooseRelayChallenge(pl):null;
          if(challenge) { prepareRelay(pl,challenge); break; }
          pl.collect = false; pl.resolved=true;
        }
      }
      if (!pl.resolved) {
        if (pl.type === 'FLY' || pl.type === 'LINER') {
          const catchRadius=pl.forcedResult==='sac_fly'?2.35:1.2;
          if (pl.canCatch && !pl.bounced && ball.vel.y < 0 && ball.pos.y < 1.7 && pl.chaser &&
              dxz(pl.chaser.x, pl.chaser.z, ball.pos.x, ball.pos.z) < catchRadius) { catchOut(pl); break; }
          if (pl.bounced && !pl.hitCredited) { creditHit(pl); break; }
        } else { // GROUND
          if (ball.pos.y < 0.6) {
            for (const p of infielders().concat([pitcherP()])) {
              if (dxz(p.x, p.z, ball.pos.x, ball.pos.z) < 0.95) {
                if (pl.fieldClean) fieldGrounder(pl, p);
                else { say(`${p.name} CAN'T HANDLE THE HOT SHOT — ${S.batter.name} IS ABOARD`); creditHit(pl,true); }
                break;
              }
            }
          }
          if (S.play === pl && !pl.fielded && Math.hypot(ball.pos.x, ball.pos.z) > 19.5) creditHit(pl); // through the infield
        }
      }
      if (pl.resolved && S.t > BASEBALL_PACING.liveSettle && allSettled()) { afterPlay(); break; }
      if (S.t > 9) { forceSettle(); afterPlay(); }    // watchdog: play never hangs
      break;
    }
    case 'THROW': { // force plays, relay turns, and the race to the bag
      const pl = S.play;
      if (!pl) { setState('SETUP'); break; }
      pl.bobbleT -= dt;
      pl.fielder.tx = pl.fielder.x; pl.fielder.tz = pl.fielder.z; // plant and throw
      for(const target of pl.throwQueue||[]){
        if(!target.receiver) continue;
        const spot=throwTargetSpot(target);
        target.receiver.tx=spot.x;target.receiver.tz=spot.z;target.receiver.sprint=8.4;
      }
      if(pl.tagPlay) resolveRelayTag(pl);
      if (!pl.tagPlay&&!pl.activeThrow&&!pl.resolved&&pl.bobbleT <= 0 && S.t > 0.2) beginThrow(pl);
      if (pl.activeThrow && !pl.resolved) {
        pl.activeThrow.elapsed += dt;
        if (pl.activeThrow.elapsed >= pl.activeThrow.time) resolveThrow(pl,pl.activeThrow);
      }
      if (pl.resolved && S.t > BASEBALL_PACING.throwSettle && allSettled()) { afterPlay(); break; }
      if (S.t > 4.5) { forceSettle(); afterPlay(); }  // watchdog
      break;
    }
    case 'HOMER': {
      const pl = S.play;
      if (!pl) { setState('SETUP'); break; }
      if(S.camMode==='contact'&&S.t>.52)cut('homer');
      const dist = Math.hypot(ball.pos.x, ball.pos.z);
      if (!pl.cleared && dist >= WALL_R - 0.2) {
        pl.cleared = true;
        burst(ball.pos.x, Math.max(3.2, ball.pos.y), ball.pos.z, batTeam().def.glow, 44, 11);
        horn(); ledPulse = 1; swellCrowd(1);
        pl.homeRunCleared=true;
        say(`THE DRIVE CLEARS THE WALL — EVERY RUNNER STILL HAS TO COMPLETE THE CIRCUIT`);
      }
      if (pl.cleared) {
        pl.fwT += dt;
        if (pl.fwT > 0.55) {
          pl.fwT = 0;
          burst(14 + (Math.random()*2 - 1)*12, 6 + Math.random()*5, (Math.random()*2 - 1)*16,
            pick([0x58ffb4, batTeam().def.glow, 0xffffff]), 26, 9);
        }
        if (dist > WALL_R + 10) ball.mode = 'IDLE';
      }
      if (S.t > 6.4 && allSettled()) { afterPlay(); break; }
      if (S.t > 9.5) { forceSettle(); afterPlay(); }  // watchdog
      break;
    }
    case 'POSTPLAY': {
      if(S.t>BASEBALL_PACING.postplay) completeAfterPlay();
      break;
    }
    case 'SIDECHG': {
      if (S.t > BASEBALL_PACING.sideChange) {
        for(const p of allPlayers()){p.path=null;p.pathI=0;if(p.duty==='exit')p.duty='dugout';}
        placeExtraRunner(batTeam());nextBatter(false);snapAll();S.transition=null;setState('SETUP');cut('plate');
      }
      break;
    }
    case 'FINAL': {
      const n = $('nextin'); if (n) n.textContent = String(Math.max(0, Math.ceil(BASEBALL_PACING.final - S.t)));
      if (S.t > BASEBALL_PACING.final) { fixtureIdx = (fixtureIdx + 1) % FIXTURES.length; S.halfRuns = 0; setupMatch(); }
      break;
    }
  }
  // global watchdog: any state that somehow stalls gets reset behind a cut
  if (S.state === S.lastState) { S.stuckT = (S.stuckT || 0) + dt; } else { S.stuckT = 0; S.lastState = S.state; }
  if (S.stuckT > 20 && S.state !== 'FINAL') {
    S.stuckT = 0; forceSettle(); S.play = null; ball.mode = 'IDLE';
    say('TIME IS CALLED — THE CREW RESETS THE DIAMOND');
    nextBatter(true); setState('SETUP'); cut('plate');
  }
}

// ---------- poses + props ----------
function posePlayers() {
  if (!teams.length) return;
  const pitcher = pitcherP(), catcher = fldTeam().players[1];
  for(const p of allPlayers()){
    p.rig.group.scale.set(1,1,1);
    p.gear.traverse(o=>{
      if(o.userData.fieldOnly)o.visible=p.duty==='fielder';
      if(o.userData.batterOnly)o.visible=p.duty==='batter'||p.duty==='walkup';
    });
  }
  if (S.state === 'WINDUP') pitcher.rig.poseThrowIn(clamp(S.t/BASEBALL_PACING.windup, 0, 1));
  catcher.rig.poseGKSet(tGlobal);
  if(S.callT>0&&(S.callTone==='strike'||S.callTone==='ball')) catcher.rig.poseGKCatch(1);
  if(S.callT>0&&S.callTone==='strike') ump.posePointToSpot(tGlobal);
  else if(S.callT>0&&S.callTone==='ball') ump.poseWhistle(tGlobal);
  if(S.state==='LIVE'&&S.play&&S.play.chaser) S.play.chaser.rig.poseGKShuffle(tGlobal,Math.sign(S.play.lz-S.play.chaser.z)||1);
  if(S.state==='THROW'&&S.play&&S.play.fielder) S.play.fielder.rig.poseThrowIn(clamp((S.t-.15)/.32,0,1));
  if(S.state==='HOMER'||(S.clipT>0&&S.clipMoment.includes('DOUBLE PLAY'))){
    const celebrating=S.state==='HOMER'?batTeam():fldTeam();
    for(const p of celebrating.players) if(p.duty==='dugout') p.rig.poseCelebrate(tGlobal,p.role%4);
  }
  const swingActor=S.batter&&(S.batter.duty==='batter'||(S.batter.path?.delay>0&&S.swingT>=0))?S.batter:null;
  if (swingActor) {
    const style=S.pitchPlan&&S.pitchPlan.swingStyle||'ON TIME';
    swingActor.rig.group.rotation.y=swingActor.heading+battingBodyTurn(style,S.swingT);
    if(S.swingT>=0){
      const swingK=clamp(S.swingT/.82,0,1), brace=Math.sin(swingK*Math.PI);
      swingActor.rig.group.scale.set(1+.05*brace,1-.035*brace,1+.08*brace);
    }
    if (S.swingT >= 0) swingActor.rig.poseSkill(0, clamp(S.swingT/.68, 0, 1));
    else swingActor.rig.poseGKSet(tGlobal*1.3 + 2);
  }
  const showBat = swingActor &&
    (S.state === 'SETUP' || S.state === 'WINDUP' || S.state === 'PITCH' || S.state === 'RESOLVE' || S.state === 'STRIKEOUT_HOLD' || ((S.state==='LIVE'||S.state==='HOMER')&&S.swingT<.92));
  if(showBat){
    armMat.emissive.setHex(batTeam().def.col); // dark sleeve stays distinct even in a white uniform
  }
  updateBattingRig(!!showBat);
}

// ---------- trail / fx ----------
function trailStep() {
  if (ball.mode === 'PITCH' || ball.mode === 'LIVE' || ball.mode === 'THROWN') {
    trailHist.unshift({ x: ball.pos.x, y: ball.pos.y, z: ball.pos.z });
    if (trailHist.length > TRAIL_N) trailHist.pop();
  } else if (trailHist.length) trailHist.length = Math.max(0, trailHist.length - 2);
  for (let i = 0; i < TRAIL_N; i++) {
    const h = trailHist[i], s = trail[i];
    if (!h) { s.material.opacity = 0; continue; }
    s.position.set(h.x, h.y, h.z);
    s.material.opacity = 0.5*(1 - i/TRAIL_N);
    const sc = 0.42*(1 - i/TRAIL_N) + 0.08; s.scale.set(sc, sc, 1);
  }
}
function ballVisualStep(dt) {
  ballShadow.position.x = ball.pos.x;
  ballShadow.position.z = ball.pos.z;
  const heightK = clamp(ball.pos.y/7, 0, 1);
  const active = ball.mode !== 'IDLE';
  const sh = (active ? 0.92 : 0.58)*(1 + heightK*0.55);
  ballShadow.scale.set(sh, sh, 1);
  ballShadow.material.opacity = (active ? 0.34 : 0.18)*(1 - heightK*0.7);

  impactT = Math.max(0, impactT - dt*2.9);
  impactFlash.material.opacity = impactT*0.75;
  const fsc = 0.55 + (1-impactT)*1.55;
  impactFlash.scale.set(fsc, fsc, 1);
  swingArc.material.opacity = impactT*0.62;
  const asc = 0.82 + (1-impactT)*0.4;
  swingArc.scale.set(asc, asc, asc);
}
function crowdStep(dt){
  crowdWave += dt*(1.15 + crowdPulse*2.4);
  const pop=crowdPulse, homeGlow=TEAM_B ? TEAM_B.glow : 0x58ffb4, awayGlow=TEAM_A ? TEAM_A.glow : 0xff5ec4;
  const reaction=S.crowdReaction;
  crowdResponseColor.setHex(reaction?.mode==='AWAY_POCKET'?awayGlow:reaction?.mode==='HOME_ROAR'?homeGlow:venueAccent);
  crowdHomeColor.setHex(homeGlow);
  crowdAccentColor.setHex(venueAccent);
  if(reaction)reaction.elapsed+=dt;
  const reactionLife=reaction?clamp(1-reaction.elapsed/reaction.duration,0,1):0;
  for (const m of crowdMembers){
    const ritualOffset=venueRitual==='rings'?Math.sin(m.baseY*.85-crowdWave*4.1):venueRitual==='seam'?Math.sin(m.s.position.z*.24-crowdWave*4.6):venueRitual==='bell'?Math.sin(m.phase>Math.PI?crowdWave*3.5:crowdWave*3.5+Math.PI*.4):Math.sin(crowdWave*3.2 + m.phase);
    const sectionWeight=!reaction?0:reaction.mode==='HOME_ROAR'?(m.section==='home'?1:.28)
      :reaction.mode==='AWAY_POCKET'?(m.section==='away'?1:.18):m.section==='neutral'?.72:1;
    const travel=!reaction?0:reaction.propagation==='VISITOR_POCKET'
      ?clamp(reaction.elapsed*2.2-Math.abs(Math.sin(m.phase*1.7))*.65,0,1)
      :clamp(reaction.elapsed*2.6-(m.phase%(Math.PI*2))/(Math.PI*2)*.72,0,1);
    const authoredBeat=reactionLife*sectionWeight*travel*(reaction?.amplitude||0);
    const hop=ritualOffset+Math.sin(crowdWave*4.2+m.phase)*authoredBeat*.72;
    m.s.position.y = m.baseY + hop*0.025*(1 + pop*2.2+authoredBeat*2.4);
    const sc=m.baseScale*(1 + Math.max(0, hop)*(.07*pop+.08*authoredBeat));
    m.s.scale.set(sc,sc,1);
    m.s.material.opacity = clamp(m.baseOpacity + pop*0.2+authoredBeat*.26 + Math.sin(crowdWave*1.7 + m.phase)*0.045, 0.25, 0.96);
    m.s.material.color.setHex(m.baseCrowdColor??homeGlow).lerp(crowdResponseColor,clamp(authoredBeat*.7,0,.68));
  }
  for (const m of standMats){
    crowdStandColor.setHex(0xaebad8).lerp(crowdHomeColor,0.11+pop*.22).lerp(crowdWhiteColor,pop*.08);
    m.color.copy(crowdStandColor);
  }
  const ritualK=pop*Math.sin(crowdWave*2.4);
  venueIdentityGroup.position.y=venueRitual==='rings'?Math.max(0,ritualK)*.16:0;
  venueIdentityGroup.scale.set(1,1+(venueRitual==='porcelain'?Math.max(0,ritualK)*.018:0),1);
  venueIdentityGroup.rotation.x=venueRitual==='wing'?ritualK*.006:0;
  crowdLedColor.copy(crowdHomeColor).lerp(crowdAccentColor,.35+.25*Math.max(0,ritualK));
  ledMat.color.copy(crowdLedColor);
  if(reaction&&reaction.elapsed>=reaction.duration)S.crowdReaction=null;
}
function markerStep(){
  const pl=S.play, live=pl && (S.state==='LIVE' || S.state==='THROW' || S.state==='HOMER');
  if (live && !pl.resolved) {
    const isThrow=S.state==='THROW'&&pl.activeThrow;
    const throwSpot=isThrow?(pl.activeThrow.spot||BASES[pl.activeThrow.base]):null;
    const isRoll=pl.type==='GROUND' && !pl.fielded;
    landingMarker.visible=true;
    landingMarker.position.x=throwSpot?throwSpot.x:isRoll?ball.pos.x:pl.lx;
    landingMarker.position.z=throwSpot?throwSpot.z:isRoll?ball.pos.z:pl.lz;
    landingMarker.material.color.setHex(isThrow?0xffd34d:pl.type==='HOMER'?0xffd34d:pl.type==='GROUND'?0x58ffb4:0x37e0ff);
    landingMarker.material.opacity=0.24+Math.sin(tGlobal*8)*0.08;
    const sc=1+Math.sin(tGlobal*5.5)*0.08;
    landingMarker.scale.set(sc,sc,1);
  } else {
    landingMarker.material.opacity*=0.82;
    landingMarker.visible=landingMarker.material.opacity>0.02;
  }
  const p=live && !pl.resolved ? (pl.fielder || pl.chaser) : null;
  if (p) {
    fielderMarker.visible=true;
    fielderMarker.position.set(p.x,0.075,p.z);
    fielderMarker.material.color.setHex(classicSideVisual(p.side));
    fielderMarker.material.opacity=0.32+Math.sin(tGlobal*7)*0.1;
  } else {
    fielderMarker.material.opacity*=0.82;
    fielderMarker.visible=fielderMarker.material.opacity>0.02;
  }
}
function timerStep(dt, touchDom){
  zoneT = Math.max(0, zoneT - dt*1.6);
  ledPulse = Math.max(0, ledPulse - dt*0.5);
  crowdPulse = Math.max(0, crowdPulse - dt*0.72);
  S.clipT=Math.max(0,S.clipT-dt);
  S.callT=Math.max(0,S.callT-dt);
  if(touchDom) elPitchCall.classList.toggle('show',S.callT>0);
  if (flashTimer > 0) {
    flashTimer -= dt;
    if (flashTimer <= 0 && touchDom) elFlash.classList.remove('show');
  } else if (touchDom) elFlash.classList.remove('show');
  if (AC && crowdGain) {
    crowdLevel += (0.05 - crowdLevel)*dampK(0.25, dt);
    crowdGain.gain.value += (crowdLevel - crowdGain.gain.value)*dampK(3, dt);
  }
}
const ledCol = new THREE.Color();
function fxStep(dt) {
  timerStep(dt, true);
  zone.material.opacity = zoneT*0.5;
  if (TEAM_B) { ledCol.setHex(TEAM_B.glow); ledCol.lerp(new THREE.Color(0xffffff), ledPulse*0.8); ledMat.color.copy(ledCol); }
  crowdStep(dt);
  markerStep();
  pitchGuideStep();
}

// ---------- camera ----------
const camPos = new THREE.Vector3(-10.8, 5.2, 2.4), camLook = new THREE.Vector3(MOUND_X*0.9, 0.9, 0);
const tmpP = new THREE.Vector3(), tmpL = new THREE.Vector3();
function cameraStep(dt) {
  const portrait = innerWidth <= 700 && innerHeight > innerWidth*1.2;
  const wholePlay = portrait && ['chase','run','field','homer','result','changeover'].includes(S.camMode);
  // During a live ball the phone becomes a portrait scorebook view: +x runs
  // vertically and z runs horizontally. Fit the bases, all active defenders /
  // runners and the ball instead of following one actor out of frame.
  camera.up.set(wholePlay?1:0,wholePlay?0:1,0);
  const fitPortraitDiamond=()=>{
    let minX=-3,maxX=30,minZ=-15,maxZ=15;
    for(const p of allPlayers()){
      if(!['fielder','runner','batter','exit'].includes(p.duty))continue;
      minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);
      minZ=Math.min(minZ,p.z);maxZ=Math.max(maxZ,p.z);
    }
    if(ball.mode!=='IDLE'){
      minX=Math.min(minX,ball.pos.x);maxX=Math.max(maxX,ball.pos.x);
      minZ=Math.min(minZ,ball.pos.z);maxZ=Math.max(maxZ,ball.pos.z);
    }
    const cx=(minX+maxX)/2,cz=(minZ+maxZ)/2;
    const spanX=maxX-minX+8,spanZ=maxZ-minZ+7;
    const portraitAspect=Math.max(.38,innerWidth/innerHeight);
    const visibleSpan=Math.max(spanX,spanZ/portraitAspect);
    const height=clamp(visibleSpan/(2*Math.tan(THREE.MathUtils.degToRad(74/2))),46,78);
    tmpP.set(cx,height,cz);tmpL.set(cx,.2,cz);
  };
  switch (S.camMode) {
    case 'contact':
      // Three-quarter profile holds through the complete hip/hand/bat arc
      // before the broadcast follows the flight.
      tmpP.set(portrait?-5.2:-2.0,portrait?7.1:4.15,portrait?12:8.2);
      tmpL.set(portrait?.8:.15,1.05,.45);
      break;
    case 'chase': {
      const ballBeat=S.state==='LIVE'&&S.t<.92&&ball.mode==='LIVE';
      if(!ballBeat&&S.play&&!S.play.wideCut){S.play.wideCut=true;S.camCut=true;}
      if (!ballBeat) {
        // After the initial contact/flight read, cut to one elevated picture
        // containing the diamond, every active runner, the fielder and throw.
        if(portrait)fitPortraitDiamond();
        else {
          tmpP.set(2.5,23.5,24);
          tmpL.set(clamp(ball.pos.x*.18+10,8,15),.45,clamp(ball.pos.z*.08,-1.5,1.5));
        }
      } else if (portrait) {
        // A low, trailing camera is unreadably tight at portrait aspect ratios.
        // Hold the diamond in frame while preserving the short ball-flight beat.
        fitPortraitDiamond();
      } else {
        const sp = Math.hypot(ball.vel.x, ball.vel.z) || 1;
        tmpP.set(ball.pos.x - ball.vel.x/sp*6.5, Math.max(2.2, ball.pos.y + 2.4), ball.pos.z - ball.vel.z/sp*6.5);
        tmpL.copy(ball.pos);
      }
      break;
    }
    case 'run':
      if(portrait)fitPortraitDiamond();
      else {tmpP.set(2.5,23.5,24);tmpL.set(DIAG/2*1.08,0.4,0);}
      break;
    case 'field':
      if(portrait)fitPortraitDiamond();
      else {tmpP.set(2.5,23.5,24);tmpL.set(clamp(ball.pos.x*.15+9,7.5,15),.45,clamp(ball.pos.z*.08,-2,2));}
      break;
    case 'dugout': {
      const side=S.transition?.side||1;
      const incoming=S.transition?.incoming;
      const focusX=incoming?.x??-2.7,focusZ=incoming?.z??side*4.3;
      tmpP.set(focusX-(portrait?5.8:6.8),portrait?8.8:5.7,focusZ+side*(portrait?7.2:6.1));
      tmpL.set(focusX,1.05,focusZ);
      break;
    }
    case 'changeover':
      if(portrait)fitPortraitDiamond();
      else {tmpP.set(4,25.5,26);tmpL.set(10.5,.35,0);}
      break;
    case 'homer':
      if(portrait)fitPortraitDiamond();
      else{
        tmpP.set(-8,4+Math.min(S.t,5)*1.2,3.2);
        tmpL.set(ball.pos.x,Math.max(1.5,ball.pos.y*.8),ball.pos.z);
      }
      break;
    case 'result': {
      if(portrait)fitPortraitDiamond();
      else{
        const actor=S.resultActor||S.batter||pitcherP();
        const side=actor.z>=0?1:-1;
        tmpP.set(actor.x-5.8,3.5,actor.z+side*5.2);
        tmpL.set(actor.x,1.15,actor.z);
      }
      break;
    }
    case 'card': {
      const a = tGlobal*0.07;
      tmpP.set(12 + Math.cos(a)*24, 9.5, Math.sin(a)*24);
      tmpL.set(DIAG/2, 1, 0);
      break;
    }
    default: // 'plate' — broadcast home: elevated behind the catcher
      // Stay in front of the home-plate seating sprites while gaining context
      // through height and FOV; pulling straight back puts crowd dots between
      // the viewer and the hitter on narrow phones.
      tmpP.set(portrait?-8.8:-10.8, portrait?9.8:5.2, (portrait?3.2:2.4) + Math.sin(tGlobal*0.13)*0.5);
      tmpL.set(MOUND_X*(portrait?0.82:0.9), portrait?0.85:0.9, portrait?0.35:0);
  }
  if (S.camCut) { camPos.copy(tmpP); camLook.copy(tmpL); S.camCut = false; }
  else {
    camPos.lerp(tmpP, dampK(S.camMode==='field'?1.45:1.8, dt));
    camLook.lerp(tmpL, dampK(S.camMode==='field'?2.1:2.6, dt));
  }
  camera.position.copy(camPos);
  const desiredFov=portrait?(S.camMode==='plate'?65:S.camMode==='card'?50:['chase','run','field','homer','result','changeover'].includes(S.camMode)?74:S.camMode==='dugout'?58:S.camMode==='contact'?58:65):S.camMode==='dugout'?39:S.camMode==='contact'?38:S.camMode==='changeover'?46:S.camMode==='result'?36:42;
  camera.fov += (desiredFov-camera.fov)*dampK(7,dt);
  camera.updateProjectionMatrix();
  camera.lookAt(camLook);
}

// ---------- main loop ----------
setupMatch();

function renderGameToText(){ return JSON.stringify(gameSnapshot()); }
window.render_game_to_text = renderGameToText;
window._dbg = gameSnapshot;
window._ff = secs => { const n = Math.max(1, Math.round(secs/0.05)); for (let i = 0; i < n; i++) tick(0.05, i < n - 1); };
window._games = [];
window._baseballTest={
  reset(seed='cyberliga-baseball-test'){
    setupMatch(); seedSim(seed); return gameSnapshot();
  },
  deterministic(seed='cyberliga-baseball-twin'){
    if(rafId){ cancelAnimationFrame(rafId); rafId=0; }
    if(hiddenTimer){ clearInterval(hiddenTimer); hiddenTimer=0; }
    tGlobal=0; window._games.length=0; setupMatch(); seedSim(seed); return gameSnapshot();
  },
  scenario(result,pitch='FOUR-SEAM',situation={}){
    forceSettle();
    for(const p of batTeam().players) if(p!==S.batter){ p.duty='dugout'; p.baseIdx=-1; p.path=null; }
    S.bases=[null,null,null]; S.outs=result==='side_change'?2:0; S.balls=result==='walk'?3:0; S.strikes=(result==='strikeout'||result==='side_change'||result==='called_strikeout')?2:0; S.play=null; ball.mode='IDLE';
    const requestedBases=Array.isArray(situation.bases)?situation.bases.filter(base=>Number.isInteger(base)&&base>=0&&base<=2):[];
    if(requestedBases.length){
      const runners=batTeam().players.filter(p=>p!==S.batter);
      requestedBases.forEach((base,index)=>{const runner=runners[index];if(!runner)return;runner.duty='runner';runner.baseIdx=base;S.bases[base]=runner;});
    }else if(result==='double_play'){
      const runner=batTeam().players.find(p=>p!==S.batter); runner.duty='runner'; runner.baseIdx=0; S.bases[0]=runner;
    }else if(result==='sac_fly'&&!S.bases[2]){
      const runner=batTeam().players.find(p=>p!==S.batter); runner.duty='runner'; runner.baseIdx=2; S.bases[2]=runner;
    }else if(result==='tag_up_all'&&!requestedBases.length){
      batTeam().players.filter(p=>p!==S.batter).slice(0,3).forEach((runner,i)=>{
        runner.duty='runner';runner.baseIdx=i;S.bases[i]=runner;
      });
    }
    flashTimer=0; elFlash.classList.remove('show'); S.callT=0; elPitchCall.classList.remove('show');
    snapAll(); S.forceNext={result:(result==='strikeout'||result==='side_change')?'late_whiff':result==='called_strikeout'?'called_strike':result==='walk'?'ball':result,pitch}; setState('SETUP'); cut('plate'); return gameSnapshot();
  },
  forceNext(result,pitch='FOUR-SEAM'){ S.forceNext={result,pitch}; return {result,pitch}; },
  forceThrowError(){S.forceThrowError=true;return true;},
  forceBullpen(){ return maybeBullpen(true); },
  setPitcherLoad(pitches=50,stress=8){ fldTeam().staff.pitches=pitches;fldTeam().staff.stress=stress;return gameSnapshot(); },
  getPitchTypes(){ return PITCH_TYPES.map(p=>p.name); },

};
function tick(dt, skipRender = false) {
  if(!suppressBaseballSpinePresentation)baseballBroadcastSpine?.tick(dt*1000);
  tGlobal += dt;
  steerIdle();          // duty stations first; live-play steering overrides below
  stateStep(dt);
  if (!skipRender) posePlayers();
  updatePlayers(dt);
  ballStep(dt);
  if (skipRender) { timerStep(dt, false); return; } // hidden-tab catch-up: only the last step touches visuals/DOM
  ballMesh.position.copy(ball.pos);
  ballVisualStep(dt);
  trailStep();
  sparkStep(dt);
  fxStep(dt);
  cameraStep(dt);
  tickerStep(dt);
  hudStep();
  composer.render();
}
window.advanceTime = ms => {
  const total=Math.max(0, Number(ms) || 0);
  const step=1/60, n=Math.max(1, Math.ceil(total/1000/step));
  for (let i=0;i<n;i++) tick(step, i<n-1);
  return renderGameToText();
};
function applyBroadcastTuneIn(){
  if(freshEntryRequested)return;
  const h=hash32(`diamond:${fixtureIdx}:${entryBucket}`);
  const target=Number.isFinite(requestedTuneInSeconds)
    ? clamp(requestedTuneInSeconds,0,720)
    : 20+(h%470); // samples all three regulation innings instead of only first pitch
  const fixtureAtEntry=fixtureIdx, gamesAtEntry=window._games.length;
  const runTo=seconds=>{
    const steps=Math.round(seconds/.05);let actual=0;
    for(let i=0;i<steps;i++){
      tick(.05,true);actual+=.05;
      if(S.state==='FINAL'||fixtureIdx!==fixtureAtEntry)break;
    }
    return actual;
  };
  let actual=0,recued=false;
  suppressBaseballSpinePresentation=true;
  try{
    actual=runTo(target);recued=S.state==='FINAL'||fixtureIdx!==fixtureAtEntry;
    if(recued){
      // Re-seed and re-cue the same fixture to a safe late-middle window. This
      // preserves the 24/7 illusion even when a long explicit offset crosses a
      // particularly fast game ending.
      fixtureIdx=fixtureAtEntry;setupMatch();seedSim(`cyberliga-baseball:recue:${fixtureAtEntry}:${entryBucket}`);
      window._games.length=gamesAtEntry;actual=runTo(300+(h%111));
      if(S.state==='FINAL'){
        setupMatch();seedSim(`cyberliga-baseball:recue-2:${fixtureAtEntry}:${entryBucket}`);
        window._games.length=gamesAtEntry;actual=runTo(240);
      }
    }
  }finally{suppressBaseballSpinePresentation=false;}
  S.entryMode='live-tune-in';S.tuneInSeconds=actual;S.entryTargetSeconds=target;S.entryBucket=entryBucket;S.entryRecued=recued;
  S.entryPhase={inning:S.inning,half:S.half===0?'TOP':'BOTTOM',outs:S.outs,state:S.state};
  if(S.state==='FINAL')baseballBroadcastSpine?.finale(baseballMomentDirector?.top()||[]);
  else queueBaseballWhoToWatch();
  tick(0,false);
}
applyBroadcastTuneIn();
// ---------- tick driver (hidden-tab resilience, same pattern as the other arenas) ----------
// rAF stops entirely in hidden tabs, so when hidden we drive tick() from setInterval:
// each fire replays elapsed real time as fixed 0.05s sim steps (capped at 1s of
// catch-up per fire), rendering only the last one. Exactly ONE driver runs at a time.
let rafId = 0, hiddenTimer = 0, prevT = performance.now();
function rafLoop(now) {
  rafId = requestAnimationFrame(rafLoop);
  const dt = Math.min(0.05, (now - prevT)/1000);
  prevT = now;
  if (dt <= 0) return;
  tick(dt);
}
function startDriver() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
  if (hiddenTimer) { clearInterval(hiddenTimer); hiddenTimer = 0; }
  if (document.hidden) {
    let lastFire = performance.now();
    hiddenTimer = setInterval(() => {
      const now = performance.now();
      const steps = Math.min(Math.floor((now - lastFire)/50), 20);
      if (steps <= 0) return;
      lastFire = now;
      prevT = now; // so a foreground return does not inherit a huge delta
      for (let i = 0; i < steps; i++) tick(0.05, i < steps - 1);
    }, 50);
  } else { prevT = performance.now(); rafLoop(prevT); }
}
const MANUAL_QA=new URLSearchParams(location.search).has('manual');
if(!MANUAL_QA){ document.addEventListener('visibilitychange', startDriver); startDriver(); }

function resizeScene() {
  camera.aspect = innerWidth/innerHeight;
  camera.fov = innerWidth <= 700 && innerHeight > innerWidth*1.2 ? 65 : 42;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
}
addEventListener('resize',resizeScene);
