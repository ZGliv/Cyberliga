<!DOCTYPE html>
<html lang="en">
<head>

<title>CYBERLIGA DIAMOND — AUTONOMOUS AI BASEBALL</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#02030a; }
  canvas { display:block; }
  #hud { position:fixed; inset:0; pointer-events:none; font-family:'Rajdhani',sans-serif; }

    transition:transform .12s;

  #score.pop { transform:scale(1.18); }

  #countbar {
    position:absolute; top:74px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:14px;

  #playstatus {

  #gameplan .gp-kicker { font:900 9px/1 'Orbitron'; letter-spacing:2.5px; color:#72ffc0; margin-bottom:9px; }
  #gameplan .gp-row { display:grid; grid-template-columns:52px 1fr; gap:8px; align-items:baseline; margin-top:5px; }
  #gameplan .gp-label { font:700 9px/1.1 'Orbitron'; letter-spacing:1.1px; color:#7f93a8; }
  #gameplan .gp-value { min-width:0; font:700 13px/1.15 'Rajdhani'; letter-spacing:.7px; color:#effff7; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #gameplan .gp-value.hot { color:#ffd34d; text-shadow:0 0 10px rgba(255,211,77,.34); }

  #gameplan .gp-meter i { display:block; height:100%; width:0; background:linear-gradient(90deg,#58ffb4,#ffd34d,#ff5e75); box-shadow:0 0 8px #58ffb4; transition:width .2s; }
  #pitchtrail { display:flex; align-items:center; gap:5px; min-height:22px; margin-top:10px; overflow:hidden; }
  #pitchtrail .pitch-empty { font:700 9px/1 'Orbitron'; letter-spacing:1.2px; color:#617287; }
  #pitchtrail b {
    flex:0 0 auto; display:grid; place-items:center; width:22px; height:22px; border-radius:50%;
    font:900 8px/1 'Orbitron'; color:#b9cad8; border:1px solid rgba(185,202,216,.28); background:rgba(255,255,255,.035);

  #pitchtrail b.strike { color:#ff8b9b; border-color:rgba(255,94,117,.6); background:rgba(255,94,117,.1); }

  #pitchtrail b.live { color:#ffe48a; border-color:rgba(255,211,77,.66); background:rgba(255,211,77,.1); animation:none; }
  #pitchtrail b.out { color:#d8b4ff; border-color:rgba(190,130,255,.6); background:rgba(190,130,255,.1); }
  .live { width:7px; height:7px; border-radius:50%; background:#ff2d55; animation:pulse 1.2s infinite; }

  #inn { font-family:'Orbitron'; font-weight:700; font-size:14px; color:#9dffd0; letter-spacing:2px; }
  #count { font-family:'Orbitron'; font-weight:700; font-size:14px; color:#e8fff4; letter-spacing:2px; }
  #count em { font-style:normal; font-size:10px; color:#58ffb4; letter-spacing:1px; }
  #outs { display:flex; gap:5px; align-items:center; }

  #minibases { position:relative; width:30px; height:30px; }

  #minibases b.on { background:#58ffb4; box-shadow:0 0 10px rgba(88,255,180,.95); }
  #mb2 { top:0; left:10px; } #mb1 { top:10px; left:20px; } #mb3 { top:10px; left:0; }

  #flash { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; opacity:0; transition:opacity .22s; }

  #flashtext {

  #flashsub { font-family:'Rajdhani'; font-weight:700; font-size:19px; letter-spacing:6px; color:rgba(255,255,255,.88); margin-top:6px; }

  #ticker {

  #tickerlabel { flex:0 0 auto; padding:0 14px; height:100%; display:flex; align-items:center; background:rgba(88,255,180,.12); font-family:'Orbitron'; font-weight:700; font-size:11px; color:#8effc8; letter-spacing:3px; border-right:1px solid rgba(88,255,180,.28); }

  #wordmark em { font-style:normal; color:#fff; }
  #erapill { font-family:'Orbitron'; font-weight:700; font-size:9px; letter-spacing:2px; color:#bdffe0; border:1px dashed rgba(142,255,200,.45); border-radius:99px; padding:3px 10px; background:rgba(4,8,20,.55); }

  #bigcard { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(2,3,10,.45); backdrop-filter:blur(3px); }
  #bigcard.show { display:flex; }
  #bigcard .panel { background:linear-gradient(180deg, rgba(8,12,28,.97), rgba(3,5,14,.97)); border:1px solid rgba(88,255,180,.32); border-radius:14px; padding:30px 48px; text-align:center; box-shadow:0 0 60px rgba(88,255,180,.16); min-width:420px; }
  #bigcard h1 { font-family:'Orbitron'; font-size:30px; letter-spacing:8px; color:#8effc8; margin-bottom:10px; text-shadow:0 0 18px rgba(88,255,180,.5); }
  #bigcard h2 { font-family:'Orbitron'; font-size:24px; color:#fff; margin-bottom:14px; letter-spacing:2px; }
  #bigcard .sub { font-size:15px; font-weight:600; color:#bdffe0; letter-spacing:3px; margin-bottom:6px; }
  #bigcard table { width:100%; border-collapse:collapse; font-size:14px; color:#e4fff2; margin-top:8px; }
  #bigcard td, #bigcard th { padding:4px 12px; border-bottom:1px solid rgba(255,255,255,.08); }
  #bigcard th { color:#7dffc0; font-size:11px; letter-spacing:2px; }
  #bigcard td.n { text-align:left; font-weight:700; }

  #soundpill { position:absolute; bottom:46px; left:18px; font-family:'Rajdhani'; font-weight:700; font-size:13px; letter-spacing:2px; color:#8effc8; border:1px solid rgba(88,255,180,.35); padding:4px 12px; border-radius:99px; background:rgba(4,8,20,.7); }
  #controls { position:absolute; bottom:44px; right:18px; display:flex; gap:6px; pointer-events:auto; }
  #controls button {
    min-width:36px; height:28px; padding:0 9px; border-radius:999px; cursor:pointer;
    font-family:'Orbitron'; font-weight:700; font-size:9px; letter-spacing:1px; color:#bfffe0;
    border:1px solid rgba(88,255,180,.32); background:rgba(4,8,20,.76);
  }
  #controls button:hover, #controls button:focus-visible { color:#fff; border-color:#58ffb4; outline:none; box-shadow:0 0 14px rgba(88,255,180,.35); }
  @media (max-width:700px) {
    #hud { isolation:isolate; min-height:100dvh; }

      z-index:2;
      background:
        linear-gradient(180deg, rgba(2,3,10,.9) 0%, rgba(2,3,10,.72) 18%, transparent 42%, transparent 64%, rgba(2,3,10,.72) 100%),

    #scanlines { z-index:3; opacity:.72; }
    #badge {
      top:calc(env(safe-area-inset-top, 0px) + 10px); left:10px; right:10px;

    }
    #leaguepill {
      min-height:30px; display:inline-flex; align-items:center;

      background:rgba(5,12,24,.82); box-shadow:0 0 18px rgba(88,255,180,.22), inset 0 1px 0 rgba(255,255,255,.08);
    }
    #wordmark {
      justify-self:end; min-width:0; max-width:100%; overflow:hidden; text-overflow:ellipsis;

    }
    #erapill { display:none; }
    #scoreboard {
      top:calc(env(safe-area-inset-top, 0px) + 53px); width:calc(100vw - 20px); max-width:460px; height:44px;

      background:linear-gradient(180deg, rgba(8,14,30,.96), rgba(2,4,14,.92));
      box-shadow:0 10px 28px rgba(0,0,0,.38), 0 0 24px rgba(88,255,180,.2), inset 0 1px 0 rgba(255,255,255,.07);
    }
    .team { min-width:0; gap:7px; padding:0 9px; font-size:10.5px; letter-spacing:.75px; white-space:nowrap; overflow:hidden; }
    .team #nameA, .team #nameB { min-width:0; flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; }
    #teamB { justify-content:flex-end; text-align:right; }
    .team .dot { width:8px; height:8px; flex:0 0 8px; }
    #score { min-width:72px; height:100%; padding:0 8px; font-size:18px; letter-spacing:1.8px; }
    #countbar {
      top:calc(env(safe-area-inset-top, 0px) + 107px);
      gap:8px; min-height:31px; padding:4px 10px; border-radius:999px;
      max-width:calc(100vw - 20px); z-index:60;
      background:rgba(5,9,22,.82); border-color:rgba(88,255,180,.16); box-shadow:0 8px 22px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.06);
    }
    #playstatus {
      top:calc(env(safe-area-inset-top, 0px) + 145px); min-width:168px; max-width:calc(100vw - 24px);
      padding:5px 11px; font-size:9px; letter-spacing:1.7px; z-index:60; background:rgba(5,9,22,.82);
    }
    #gameplan {
      top:calc(env(safe-area-inset-top, 0px) + 180px); left:10px; right:10px; width:auto;
      display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:5px 8px; align-items:center;
      padding:8px 10px; border-radius:10px; z-index:58; background:rgba(4,9,20,.78);
    }
    #gameplan .gp-kicker { grid-column:1 / -1; margin:0; font-size:7px; letter-spacing:1.8px; }
    #gameplan .gp-row { display:none; margin:0; min-width:0; }

    #pitchtrail b { width:18px; height:18px; font-size:7px; }

    #inn, #count { font-size:12px; letter-spacing:1.2px; white-space:nowrap; }

    #bigcard h2 { font-size:19px; }
    #ticker {
      height:calc(35px + env(safe-area-inset-bottom, 0px)); padding-bottom:env(safe-area-inset-bottom, 0px);

    }

    #tickertext { font-size:13px; letter-spacing:.6px; }

      left:10px; right:10px; bottom:calc(42px + env(safe-area-inset-bottom, 0px)); z-index:66;

  @media (max-width:380px) {
    #badge { left:8px; right:8px; }

    #score { min-width:66px; font-size:16px; letter-spacing:1.5px; }

    #inn, #count { font-size:11px; }
    #tickerlabel { padding:0 8px; font-size:9px; letter-spacing:1.4px; }
    #tickertext { font-size:12px; }
    #soundpill { left:8px; right:8px; font-size:10px; letter-spacing:1px; }
  }
</style>

<div id="hud">
  <div id="badge"><a id="leaguepill" href="world.html">&#x2b21; WORLD MAP</a><span id="wordmark">CYBERLIGA <em>DIAMOND</em></span><span id="erapill">EXHIBITION ERA</span></div>

    <div class="team" id="teamA"><span class="dot"></span><span id="nameA">NEON FC</span></div>

    <span class="live"></span><span id="inn">&#9650; 1</span>
    <span id="count"><em>B-S</em> 0-0</span>
    <span id="outs"><i></i><i></i><i></i></span>
    <span id="minibases"><b id="mb3"></b><b id="mb2"></b><b id="mb1"></b></span>

  <div id="bigcard"><div class="panel" id="cardpanel"></div></div>
  <div id="soundpill">&#128266; CLICK ANYWHERE FOR SOUND</div>
  <div id="controls" aria-label="Game controls"><button id="pausebtn" type="button" title="Pause or resume (P)">P</button><button id="rematchbtn" type="button" title="Start a new fixture (R)">R</button><button id="fullbtn" type="button" title="Toggle fullscreen (F)">F</button></div>
  <div id="vignette"></div><div id="scanlines"></div>
  <div id="watermark">CYBERLIGA DIAMOND</div>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { buildBlobRig } from './blobrig.js';

// ---------- helpers ----------
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

const FX0=-16, FX1=42, FZ0=-36, FZ1=36; // texture world window
function makeFieldTex(){
  const c=document.createElement('canvas'); c.width=2048; c.height=2048*(FZ1-FZ0)/(FX1-FX0)|0;
  const g=c.getContext('2d');
  const px=x=>(x-FX0)/(FX1-FX0)*c.width, pz=z=>(z-FZ0)/(FZ1-FZ0)*c.height, sc=m=>m/(FX1-FX0)*c.width;
  g.fillStyle='#04060f'; g.fillRect(0,0,c.width,c.height);
  // turf: dark cyber green inside the wall arc + foul territory wedge
  g.save();
  g.beginPath(); g.moveTo(px(-3.4),pz(0));
  g.arc(px(0),pz(0),sc(WALL_R+1.2),-FOUL-0.18,FOUL+0.18); g.closePath();
  g.fillStyle='#07130e'; g.fill();
  g.clip();
  // mow stripes (radial arcs)
  for (let r=4;r<WALL_R+2;r+=3){
    g.beginPath(); g.arc(px(0),pz(0),sc(r),-FOUL-0.2,FOUL+0.2);
    g.lineWidth=sc(3); g.strokeStyle=(r/3|0)%2?'rgba(140,255,190,0.030)':'rgba(0,0,0,0.07)'; g.stroke();
  }
  // grass noise
  for (let i=0;i<7000;i++){
    g.fillStyle=`rgba(${20+Math.random()*30|0},${60+Math.random()*40|0},${40+Math.random()*26|0},0.05)`;
    g.fillRect(Math.random()*c.width, Math.random()*c.height, 2.5, 2.5);
  }
  // warning track
  g.beginPath(); g.arc(px(0),pz(0),sc(WALL_R+0.6),-FOUL-0.05,FOUL+0.05);
  g.arc(px(0),pz(0),sc(WALL_R-2.4),FOUL+0.05,-FOUL-0.05,true); g.closePath();
  g.fillStyle='#241a10'; g.fill();
  // dirt infield: rounded diamond behind the base square
  const dirt='#2e2013';
  g.beginPath(); g.arc(px(MOUND_X*1.02),pz(0),sc(BP*1.06),0,Math.PI*2); g.fillStyle=dirt; g.fill();
  // infield grass cut (inner square minus paths)
  g.beginPath();
  g.moveTo(px(2.6),pz(0));
  g.lineTo(px(DIAG/2),pz(DIAG/2-2.6)); g.lineTo(px(DIAG-2.6),pz(0)); g.lineTo(px(DIAG/2),pz(-DIAG/2+2.6));
  g.closePath(); g.fillStyle='#08150f'; g.fill();
  // mound + home dirt circles
  g.beginPath(); g.arc(px(MOUND_X),pz(0),sc(2.5),0,Math.PI*2); g.fillStyle=dirt; g.fill();
  g.beginPath(); g.arc(px(0),pz(0),sc(3.1),0,Math.PI*2); g.fillStyle=dirt; g.fill();
  // dirt noise
  g.save();
  g.beginPath(); g.arc(px(MOUND_X*1.02),pz(0),sc(BP*1.08),0,Math.PI*2);
  g.arc(px(0),pz(0),sc(3.2),0,Math.PI*2); g.clip();
  for (let i=0;i<2600;i++){
    g.fillStyle=`rgba(${70+Math.random()*50|0},${48+Math.random()*34|0},${26+Math.random()*20|0},0.07)`;
    g.fillRect(Math.random()*c.width, Math.random()*c.height, 2.5, 2.5);
  }
  g.restore();
  // base paths (lighter dirt lanes)
  g.strokeStyle='#3a2a18'; g.lineWidth=sc(1.5); g.lineCap='round';
  g.beginPath(); g.moveTo(px(0),pz(0));
  g.lineTo(px(DIAG/2),pz(DIAG/2)); g.lineTo(px(DIAG),pz(0)); g.lineTo(px(DIAG/2),pz(-DIAG/2)); g.closePath(); g.stroke();
  // glowing foul lines out to the wall
  g.lineCap='butt';
  for (const s of [1,-1]){
    g.strokeStyle='rgba(220,255,240,0.85)'; g.shadowColor='#8effc8'; g.shadowBlur=14; g.lineWidth=sc(0.22);
    g.beginPath(); g.moveTo(px(0.4*Math.SQRT1_2),pz(s*0.4*Math.SQRT1_2));
    g.lineTo(px((WALL_R+0.5)*Math.SQRT1_2),pz(s*(WALL_R+0.5)*Math.SQRT1_2)); g.stroke();
  }
  g.shadowBlur=0;
  // batter boxes + plate marks
  g.strokeStyle='rgba(228,255,242,0.7)'; g.lineWidth=sc(0.09);
  for (const s of [1,-1]) g.strokeRect(px(-1.05), pz(s*0.55+(s>0?0:-1.5)), sc(1.5), sc(1.5));
  // CYBERLIGA arc text in the outfield
  g.save(); g.translate(px(0),pz(0));
  g.font=`900 ${sc(3.2)|0}px Orbitron, sans-serif`; g.textAlign='center'; g.textBaseline='middle';
  g.fillStyle='rgba(88,255,180,0.10)';
  const word='CYBERLIGA', span=0.62;
  for (let i=0;i<word.length;i++){
    const a=-span/2+span*i/(word.length-1);
    g.save(); g.rotate(a); g.translate(sc(27),0); g.rotate(Math.PI/2); g.fillText(word[i],0,0); g.restore();
  }
  g.restore();
  const tex=new THREE.CanvasTexture(c); tex.anisotropy=8; tex.colorSpace=THREE.SRGBColorSpace;
  return { tex, redraw:()=>{} };
}

for (let i=0;i<140;i++){
  const s=new THREE.Sprite(new THREE.SpriteMaterial({ map:dotTex, color:0xffffff,
    transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false }));
  scene.add(s); sparks.push({ s, life:0, vx:0, vy:0, vz:0, x:0, y:0, z:0 });
}
let sparkIdx=0;
function burst(x,y,z,colorHex,n=26,power=9){
  for (let i=0;i<n;i++){
    const p=sparks[sparkIdx++%sparks.length];
    const th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1), v=power*(0.45+Math.random()*0.8);
    p.life=1.0+Math.random()*0.6;
    p.x=x; p.y=y; p.z=z;
    p.vx=v*Math.sin(ph)*Math.cos(th); p.vy=v*Math.cos(ph)*0.85; p.vz=v*Math.sin(ph)*Math.sin(th);
    p.s.material.color.setHex(Math.random()<0.3?0xffffff:colorHex);
  }
  bang();
}
function sparkStep(dt){
  for (const p of sparks){
    if (p.life<=0){ p.s.material.opacity=0; continue; }
    p.life-=dt;
    p.vy-=9*dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt;
    p.s.position.set(p.x,Math.max(0.1,p.y),p.z);
    const k=clamp(p.life/1.2,0,1);
    p.s.material.opacity=k*0.85;
    const sc=0.5+(1-k)*1.3; p.s.scale.set(sc,sc,1);
  }
}

// ---------- audio (WebAudio synth — armed on first click) ----------
let AC=null, crowdGain=null, crowdLevel=0.05;
addEventListener('pointerdown', ()=>{
  if (AC) return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  const master=AC.createGain(); master.gain.value=0.6; master.connect(AC.destination); AC._m=master;
  const len=AC.sampleRate*1.5, buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
  for (let i=0;i<len;i++) d[i]=Math.random()*2-1;
  AC._noise=buf;
  const src=AC.createBufferSource(); src.buffer=buf; src.loop=true;
  const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=300; bp.Q.value=0.5;
  crowdGain=AC.createGain(); crowdGain.gain.value=0;
  src.connect(bp); bp.connect(crowdGain); crowdGain.connect(master); src.start();
  document.getElementById('soundpill').style.display='none';
}, { once:true });
function noiseBurst(filterType, freq, dur, peak){
  if (!AC) return;
  const t=AC.currentTime, src=AC.createBufferSource(); src.buffer=AC._noise;
  const f=AC.createBiquadFilter(); f.type=filterType; f.frequency.value=freq;
  const g=AC.createGain();
  g.gain.setValueAtTime(peak,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  src.connect(f); f.connect(g); g.connect(AC._m); src.start(t); src.stop(t+dur+0.05);
}
const crack = ()=>{ noiseBurst('highpass',2400,0.09,0.22); noiseBurst('bandpass',900,0.05,0.12); };
const glovePop = ()=>noiseBurst('lowpass',360,0.1,0.16);
const bang = ()=>noiseBurst('lowpass',200,0.5,0.12);
function callBeep(up){ // two-tone ump call: up = SAFE, down = OUT
  if (!AC) return;
  const t=AC.currentTime;
  [up?420:560, up?620:380].forEach((f,i)=>{
    const o=AC.createOscillator(); o.type='square'; o.frequency.value=f;
    const g=AC.createGain();
    g.gain.setValueAtTime(0.0001,t+i*0.09); g.gain.linearRampToValueAtTime(0.06,t+i*0.09+0.015);
    g.gain.exponentialRampToValueAtTime(0.001,t+i*0.09+0.12);
    o.connect(g); g.connect(AC._m); o.start(t+i*0.09); o.stop(t+i*0.09+0.16);
  });
}
function horn(){
  if (!AC) return;
  const t=AC.currentTime;
  [146.83,185.0,110].forEach((f,i)=>{
    const o=AC.createOscillator(); o.type='sawtooth'; o.frequency.value=f;
    const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900;
    const g=AC.createGain();
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(i===2?0.09:0.15,t+0.05);
    g.gain.setValueAtTime(i===2?0.09:0.15,t+1.1); g.gain.linearRampToValueAtTime(0.0001,t+1.7);
    o.connect(lp); lp.connect(g); g.connect(AC._m); o.start(t); o.stop(t+1.8);
  });
}
function swellCrowd(amount=0.25){
  crowdPulse=Math.min(1, Math.max(crowdPulse, amount));
  crowdLevel=Math.min(0.52, crowdLevel + amount*0.18);
}

function dutySpot(p){
  const bt=batTeam(), ft=fldTeam();
  if (p.duty==='fielder'){
    const s=SPOTS[p.fieldPos], spot={x:s.x,z:s.z};
    if(S.defense==='DOUBLE-PLAY DEPTH' && (p.fieldPos===3||p.fieldPos===4)){ spot.x-=1.8; spot.z*=.78; }
    else if(S.defense==='INFIELD IN' && p.fieldPos>=2&&p.fieldPos<=5){ spot.x-=3.2; spot.z*=.82; }
    else if(S.defense==='NO-DOUBLES' && p.fieldPos>=6){ spot.x+=2.2; }
    else if(S.defense==='PULL SHIFT' && p.fieldPos>=2&&p.fieldPos<=8){ spot.z+=p.fieldPos%2===0?2.2:1.2; }
    return spot;
  }
  if (p.duty==='batter')  return { x:-0.5, z:1.15 };
  if (p.duty==='runner')  return BASES[p.baseIdx];
  // dugout rows behind the foul lines; batting side z>0 for team0, z<0 for team1
  const sgn=p.side===0?1:-1, i=p.role;
  return { x:-4.2-(i%3)*1.3, z:sgn*(8.5+Math.floor(i/3)*1.6) };
}

}

}

function steerIdle(){
  for (const t of teams) for (const p of t.players){
    if (p.path) continue;               // runners on scripted paths steer themselves
    const s=dutySpot(p);
    p.tx=s.x; p.tz=s.z; p.sprint=6;
  }
}
function updatePlayers(dt){
  for (const p of allPlayers()){
    // scripted base-running path
    if (p.path){
      const wp=p.path[p.pathI];
      if (wp){
        const dx=wp.x-p.x, dz=wp.z-p.z, d=Math.hypot(dx,dz);
        if (d<0.45) p.pathI++;
        else { p.tx=wp.x; p.tz=wp.z; p.sprint=p.path.speed || RUNSPD; }
      }
      if (!p.path[p.pathI]){ // arrived
        const done=p.path.done; p.path=null; p.pathI=0;
        if (done) done(p);
      }
    }
    const dx=p.tx-p.x, dz=p.tz-p.z, dist=Math.hypot(dx,dz);
    let dvx=0,dvz=0;
    if (dist>0.08){ const sp=p.sprint*clamp(dist/1.3,0,1); dvx=dx/dist*sp; dvz=dz/dist*sp; }
    const k=dampK(9,dt);
    p.vx+=(dvx-p.vx)*k; p.vz+=(dvz-p.vz)*k;
    p.x+=p.vx*dt; p.z+=p.vz*dt;
    if (!isFinite(p.x)||!isFinite(p.z)){ const s=dutySpot(p); p.x=s.x; p.z=s.z; p.vx=p.vz=0; }
    if (p.air){ p.jumpV-=26*dt; p.jumpY+=p.jumpV*dt; if (p.jumpY<=0){ p.jumpY=0; p.air=false; } }
    const sp=Math.hypot(p.vx,p.vz);
    let face;
    if (p.duty==='batter' && (S.state==='SETUP'||S.state==='WINDUP'||S.state==='PITCH'))
      face=Math.PI/2; // square to the mound, side-on stance reads from the plate cam
    else face = sp>0.7 ? Math.atan2(p.vx,p.vz) : Math.atan2(ball.pos.x-p.x, ball.pos.z-p.z);
    p.heading=lerpAngle(p.heading, face, dampK(8,dt));
    p.rig.group.position.set(p.x, p.jumpY, p.z);
    p.rig.group.rotation.y=p.heading;
    p.rig.update(dt, clamp(sp/RUNSPD,0,1), { turn:0 });
  }
  // umpire faces the play
  ump.update(dt, 0);
}

function forceSettle() {
  const occupying=new Set(S.bases.filter(Boolean));
  for (const p of allPlayers()) {
    p.path=null; p.pathI=0;
    if(p.duty==='runner'&&!occupying.has(p)){ p.duty='dugout'; p.baseIdx=-1; }
  }
  S.bases.forEach((p,i)=>{
    if(!p) return;
    p.duty='runner'; p.baseIdx=i; p.x=BASES[i].x; p.z=BASES[i].z; p.tx=p.x; p.tz=p.z; p.vx=p.vz=0;
  });
}

// ---------- runners ----------
function sendRunner(p, from, to, onDone, speed=RUNSPD) {
  const wps = [];
  for (let b = from + 1; b <= to; b++) wps.push({ x: BASES[b].x, z: BASES[b].z });
  if (!wps.length) { onDone && onDone(p); return; }
  p.duty = 'runner'; p.path = wps; p.pathI = 0; p.sprint = speed; wps.speed = speed;
  wps.done = pp => { onDone && onDone(pp); };
}
function updateScore() { elSA.textContent = String(teams[0].runs); elSB.textContent = String(teams[1].runs); }
function scoreRun(p) {
  const tm = teams[0].players.includes(p) ? teams[0] : teams[1];
  tm.runs++; S.halfRuns = (S.halfRuns || 0) + 1; updateScore(); popScore();
  swellCrowd(0.56);
  say(`${p.name} COMES HOME — ${TEAM_A.name} ${teams[0].runs}, ${TEAM_B.name} ${teams[1].runs}`);
  p.duty = 'dugout'; p.baseIdx = -1;
}
function advanceOnHit(n, batter) {
  for (let i = 2; i >= 0; i--) {
    const p = S.bases[i]; if (!p) continue;
    S.bases[i] = null;
    const to = i + n;
    const speed = RUNSPD*(n >= 2 ? 1.05 : 1) + (i >= 1 ? 0.55 : 0);
    if (to >= 3) sendRunner(p, i, 3, scoreRun, speed);
    else { S.bases[to] = p; p.baseIdx = to; sendRunner(p, i, to, null, speed); }
  }
  if (n >= 4) sendRunner(batter, -1, 3, scoreRun, RUNSPD*0.9);
  else { S.bases[n-1] = batter; batter.baseIdx = n - 1; sendRunner(batter, -1, n - 1, null, RUNSPD*(n >= 2 ? 1.08 : 1.02)); }
}

// ---------- pitch planning + the at-bat ----------
function playerTrait(player,key){ return ((hash32(`${player.name}:${key}`)%1000)/1000); }
function configureGamePlan(){
  const onFirst=!!S.bases[0], onThird=!!S.bases[2], late=S.inning>=INNINGS;
  if(S.strikes===2) S.approach='PROTECT THE PLATE';
  else if(S.balls===3) S.approach='HUNT ONE ZONE';
  else if(onThird&&S.outs<2) S.approach='LIFT A RUN HOME';
  else if(onFirst&&S.outs<2) S.approach='CONTROL THE BARREL';
  else S.approach=playerTrait(S.batter,'patience')>.52?'SELECTIVE DAMAGE':'ATTACK EARLY';
  if(onThird&&S.outs<2) S.defense='INFIELD IN';
  else if(onFirst&&S.outs<2) S.defense='DOUBLE-PLAY DEPTH';
  else if(late&&fldTeam().runs>batTeam().runs) S.defense='NO-DOUBLES';
  else if(playerTrait(S.batter,'pull')>.72) S.defense='PULL SHIFT';
  else S.defense='STRAIGHT UP';
  if(S.strikes===2&&S.balls<3) S.intent='EXPAND THE CHASE ZONE';
  else if(S.balls===3) S.intent='LAND A GET-ME-OVER';
  else if(onFirst&&S.outs<2) S.intent='INDUCE THE GROUNDER';
  else S.intent='CHANGE EYE LEVELS';
}
function planPitch() {
  configureGamePlan();
  const forced=S.forceNext; S.forceNext=null;
  let type=forced&&forced.pitch ? PITCH_TYPES.find(p=>p.name===forced.pitch) : null;
  if(!type&&S.strikes===2&&S.balls<3) type=spick(PITCH_TYPES.slice(3));
  if(!type&&S.balls===3) type=spick(PITCH_TYPES.slice(0,2));
  if(!type&&S.bases[0]&&S.outs<2&&simRandom()<.54) type=spick([PITCH_TYPES[1],PITCH_TYPES[5]]);
  type=type||weightedPitch();
  const fatigue=clamp(fldTeam().pitches/115,0,.9);
  let zoneP=S.strikes===2?.44:S.balls===3?.86:.64;
  if(S.intent==='INDUCE THE GROUNDER') zoneP+=.08;
  let inZone=forced&&forced.result==='ball'?false:forced&&forced.result==='called_strike'?true:simRandom()<zoneP;
  const edge=inZone&&(S.strikes===2||S.balls<2)&&simRandom()<.58;
  const high=simRandom()<.5, armSide=simRandom()<.5?1:-1;
  const aimY=inZone?(high?1.20:.75)+(simRandom()-.5)*.16:(high?1.55:.34)+(simRandom()-.5)*.16;
  const aimZ=inZone?(edge?armSide*(.43+simRandom()*.08):(simRandom()-.5)*.48):armSide*(.66+simRandom()*.3);
  const speed=lerp(type.velo[0],type.velo[1],simRandom())*(1-fatigue*.055);
  const curve=type.breakX*(.84+simRandom()*.3), press=S.strikes===2?.18:0;
  let swingP=inZone?.72:.18;
  if(S.approach==='PROTECT THE PLATE') swingP+=inZone?.2:.17;
  else if(S.approach==='HUNT ONE ZONE') swingP+=inZone?.1:-.13;
  else if(S.approach==='ATTACK EARLY') swingP+=.1;
  let swing=forced&&['called_strike','ball'].includes(forced.result)?false:forced?true:simRandom()<clamp(swingP+press,0.03,.97);
  const commandMiss=fatigue*.11, pq=clamp((speed-17)/10*.42+Math.abs(curve)/1.4*.3+type.whiff*.8,0,1);
  const contact=clamp((inZone?.8:.48)-pq*.22-commandMiss+(S.strikes===2?.04:0),.2,.94);
  const vertical=aimY<.55?'LOW':aimY>1.38?'HIGH':aimY>1.05?'UP':'DOWN';
  const horizontal=Math.abs(aimZ)<.22?'MIDDLE':aimZ>0?'ARM-SIDE':'GLOVE-SIDE';
  return { name:type.name,speed,inZone,curve,drop:type.drop,groundBias:type.ground,aimY,aimZ,swing,contact,
    location:`${vertical} ${horizontal}`,foulP:S.strikes===2?.34:.25,forcedResult:forced&&forced.result||null };
}
function throwPitch() {
  const plan = S.pitchPlan;
  fldTeam().pitches++;
  S.lastPitch={name:plan.name,location:plan.location,speedMph:Math.round(plan.speed*4),result:'LIVE'};
  ball.pos.set(MOUND_X - 0.55, 1.5, 0);
  const T = (MOUND_X - 0.55)/plan.speed;
  ball.vel.set(-plan.speed,
    (plan.aimY - 1.5)/T + 0.5*GRAV*(0.12+plan.drop*.045)*T,
    (plan.aimZ - 0)/T - 0.5*plan.curve*T);
  ball.curve = plan.curve;
  ball.mode = 'PITCH';
  setState('PITCH');
}
function strikeOut(how) {
  S.outs++; callBeep(false); glovePop();
  fldTeam().strikeouts++; commitPitch('STRIKEOUT','out');
  swellCrowd(0.22);
  flashMsg('K', `${S.batter.name} ${how}`, '#ff4d5e');
  say(`PUNCHED OUT — ${S.batter.name} ${how} — ${S.outs} ${S.outs === 1 ? 'OUT' : 'OUTS'}`);
  S.batter.duty = 'dugout'; ball.mode = 'IDLE'; S.play = null;
  if (S.outs >= 3) sideChange();
  else { nextBatter(true); setState('SETUP'); cut('plate'); }
}
function walk() {
  batTeam().walks++; commitPitch('WALK','ball');
  say(`BALL FOUR — ${S.batter.name} TAKES HIS BASE`);
  flashMsg('WALK', `${S.batter.name} WORKS THE COUNT`, '#58ffb4');
  callBeep(true); swellCrowd(0.18);
  // forced chain only: runners move up when pushed
  const moves = []; let carrier = S.batter, from = -1, i = 0;
  while (true) {
    if (i > 2) { moves.push({ p: carrier, from, to: 3 }); break; }
    const occ = S.bases[i];
    moves.push({ p: carrier, from, to: i }); S.bases[i] = carrier;
    if (!occ) break;
    carrier = occ; from = i; i++;
  }
  for (const m of moves) {
    if (m.to === 3) sendRunner(m.p, m.from, 3, scoreRun);
    else { m.p.baseIdx = m.to; sendRunner(m.p, m.from, m.to); }
  }
  ball.mode = 'IDLE'; S.play = { type:'WALK', resolved:true };
  setState('RESOLVE'); cut('plate');
}
function foulBall() {
  crack(); swellCrowd(0.16); impactBurst(0.45);
  if (S.strikes < 2) S.strikes++;
  // dead ball sprayed backward into the netting
  ball.pos.set(0.1, 1.1, 0);
  ball.vel.set(-(3 + simRandom()*5), 7 + simRandom()*5, (simRandom() < 0.5 ? -1 : 1)*(5 + simRandom()*8));
  ball.mode = 'LIVE';
  S.play = { type:'FOUL', resolved:true };
  commitPitch('FOUL','strike');
  say(spick([`${S.batter.name} SPOILS IT FOUL`, 'FOUL BALL — STILL ALIVE', `${S.batter.name} FIGHTS IT OFF`]));
  setState('RESOLVE'); cut('plate');
}
function inPlay(plan) {
  crack(); swellCrowd(0.36);
  const bt = batTeam();
  const quality = clamp(plan.contact + (plan.inZone ? 0.05 : -0.08) + (simRandom()*0.52 - 0.28), 0, 1);
  impactBurst(0.55 + quality*0.55);
  const r = simRandom(), homerChance = clamp((quality - 0.83)*0.23, 0.008, 0.075);
  let type;
  const forced=plan.forcedResult;
  if(forced==='homer') type='HOMER';
  else if(['ground','double_play','error'].includes(forced)) type='GROUND';
  else if(forced==='fly'||forced==='sac_fly') type='FLY';
  else if(forced==='liner'||['single','double','triple'].includes(forced)) type='LINER';
  else if (r < homerChance) type = 'HOMER';
  else if (quality < 0.42) type = r < 0.68 ? 'GROUND' : 'LINER';
  else if (quality > 0.72) type = r < homerChance + 0.32 ? 'LINER' : r < homerChance + 0.68 ? 'FLY' : 'GROUND';
  else type = r < homerChance + (plan.groundBias||0)*.45 ? 'GROUND' : r < homerChance + .7 ? 'FLY' : 'LINER';
  const ang = (simRandom()*2 - 1)*(FOUL - 0.16);
  let v, e;
  if (type === 'HOMER')      { v = 28 + quality*3.2 + simRandom()*1.8; e = 0.59 + simRandom()*0.18; }
  else if (type === 'FLY')   { v = 15 + quality*6 + simRandom()*4;   e = 0.7 + simRandom()*0.23; }
  else if (type === 'LINER') { v = 17 + quality*7 + simRandom()*3;   e = 0.22 + simRandom()*0.16; }
  else                       { v = 13.5 + quality*6 + simRandom()*4; e = 0.02 + simRandom()*0.11; }
  if(forced==='sac_fly'){ v=23.5; e=.72; }
  ball.pos.set(0.1, 1.05, 0);
  ball.vel.set(Math.cos(ang)*Math.cos(e)*v, Math.sin(e)*v, Math.sin(ang)*Math.cos(e)*v);
  ball.mode = 'LIVE';
  // predicted landing point drives the chase
  const vy = ball.vel.y, tl = (vy + Math.sqrt(vy*vy + 2*GRAV*ball.pos.y))/GRAV;
  const lx = ball.pos.x + ball.vel.x*tl, lz = ball.pos.z + ball.vel.z*tl;
  let chaser = null, best = 1e9;
  for (const p of fldTeam().players) {
    if (p.fieldPos === 1) continue;                 // catcher holds the plate
    const d = dxz(p.x, p.z, lx, lz) + (p.fieldPos === 0 ? 2 : 0);
    if (d < best) { best = d; chaser = p; }
  }
  const routePressure = best/Math.max(1.2, tl*8);
  const canCatch = type === 'GROUND' ? false : forced==='sac_fly'?true:forced&&['single','double','triple'].includes(forced)?false:
    simRandom() < clamp((type === 'FLY' ? 0.92 : 0.64) - quality*0.43 - routePressure*0.2, type === 'FLY' ? 0.28 : 0.12, 0.9);
  const fieldClean = forced==='double_play'?true:type !== 'GROUND' || forced==='error'?false:simRandom() > clamp(quality*0.22 + 0.08, 0.08, 0.26);
  const aboard=S.bases.filter(Boolean).length;
  const originalBases=S.bases.slice();
  S.play = { type, quality, chaser, lx, lz, resolved:false, bounced:false, fielded:false,
             fielder:null, bobbleT:0, thrown:false, throwT:0, tt:0, cleared:false, fwT:0, collect:false, caught:false,
             canCatch, fieldClean, routePressure:+routePressure.toFixed(2),
             originalBases, forcedResult:forced, launchAngle:Math.round(e*180/Math.PI), exitVelo:Math.round(v*2.45),
             grandSlam:type==='HOMER' && aboard===3, moonshot:type==='HOMER' && quality>0.9 };
  S.lastPitch.result=`IN PLAY · ${type}`;
  if (type === 'HOMER') {
    bt.hits++; bt.hrs++;
    commitPitch('HOME RUN','live');
    advanceOnHit(4, S.batter);                      // everyone trots while it flies
    setState('HOMER'); cut('homer');
    return;
  }
  if (type === 'GROUND') {
    // Only forced runners break on contact; unforced runners read the ball and hold.
    const force0=!!originalBases[0], force1=force0&&!!originalBases[1], force2=force1&&!!originalBases[2];
    S.bases=[null,null,null];
    if(originalBases[2]){
      if(force2) sendRunner(originalBases[2],2,3,scoreRun,RUNSPD*1.02);
      else { S.bases[2]=originalBases[2]; originalBases[2].baseIdx=2; }
    }
    if(originalBases[1]){
      const to=force1?2:1; S.bases[to]=originalBases[1]; originalBases[1].baseIdx=to;
      if(force1) sendRunner(originalBases[1],1,2,null,RUNSPD*1.03);
    }
    if(originalBases[0]){
      const to=force0?1:0; S.bases[to]=originalBases[0]; originalBases[0].baseIdx=to;
      if(force0) sendRunner(originalBases[0],0,1,null,RUNSPD*1.05);
    }
    S.bases[0]=S.batter; S.batter.baseIdx=0;
    sendRunner(S.batter,-1,0,null,RUNSPD*(1.03+quality*.08));
  } else {
    // fly/liner: batter runs it out, runners hold until it drops
    sendRunner(S.batter, -1, 0, pp => { pp.baseIdx = 0; if (!S.play || !S.play.caught) S.bases[0] = pp; }, RUNSPD*(1.02 + quality*0.06));
  }
  say(`${S.batter.name} PUTS IT IN PLAY — ${type === 'GROUND' ? 'ON THE GROUND' : type === 'FLY' ? 'HIGH INTO THE NIGHT' : 'A FROZEN ROPE'}`);
  setState('LIVE'); cut('chase');
}
function resolvePitch(forcedBall = false) {
  const plan = S.pitchPlan;
  if(plan&&plan.forcedResult==='swing_miss') plan.contact=0;
  if(plan&&plan.forcedResult==='foul'){ foulBall(); return; }
  if(plan&&['ground','double_play','error','fly','sac_fly','liner','single','double','triple','homer'].includes(plan.forcedResult)){ inPlay(plan); return; }
  if (forcedBall || !plan || !plan.swing) {
    if (!forcedBall && plan && plan.inZone) {
      S.strikes++; zoneT = 1; callBeep(false); glovePop();
      say(`STRIKE ${S.strikes} LOOKING ON ${S.batter.name}`);
      if (S.strikes >= 3) { strikeOut('CAUGHT LOOKING'); return; }
      commitPitch('CALLED STRIKE','strike');
    } else {
      S.balls++; glovePop();
      say(spick([`BALL ${S.balls} — JUST OFF THE PLATE`, `BALL ${S.balls} — THE LASERS SAY NO`, `BALL ${S.balls} OUTSIDE`]));
      if (S.balls >= 4) { walk(); return; }
      commitPitch('BALL','ball');
    }
    ball.mode = 'IDLE'; setState('SETUP');
    return;
  }
  // swing
  if (simRandom() >= plan.contact) {
    S.strikes++; glovePop();
    say(`${S.batter.name} SWINGS THROUGH IT — STRIKE ${S.strikes}`);
    if (S.strikes >= 3) { strikeOut('GOES DOWN SWINGING'); return; }
    commitPitch('SWINGING STRIKE','strike');
    ball.mode = 'IDLE'; setState('SETUP');
    return;
  }
  if (simRandom() < plan.foulP) { foulBall(); return; }
  inPlay(plan);
}

// ---------- play resolution ----------
function catchOut(pl) {
  const outsBefore=S.outs;
  pl.resolved = true; pl.caught = true;
  const c = pl.chaser;
  c.jumpV = 4.6; c.air = true;                        // the hop
  ball.mode = 'CARRY'; pl.carrier = c;
  const wallRobbery=Math.hypot(ball.pos.x,ball.pos.z)>28.5;
  glovePop(); callBeep(false); swellCrowd(wallRobbery ? 0.82 : 0.28);
  S.outs++;
  if (S.bases[0] === S.batter) S.bases[0] = null;
  S.batter.path = null; S.batter.duty = 'dugout'; S.batter.baseIdx = -1;
  if (wallRobbery) {
    recordClip(`WALL ROBBERY · ${c.name}`,3.2);
    flashMsg('WALL ROBBERY', `${c.name} STEALS EXTRA BASES`, c.side===0 ? TEAM_A.css : TEAM_B.css);
    burst(ball.pos.x,Math.max(2.2,ball.pos.y),ball.pos.z,c.side===0 ? TEAM_A.glow : TEAM_B.glow,34,8);
    say(`${c.name} CLIMBS THE NEON WALL AND ROBS IT — A SEASON-SAVING CATCH`);
  } else {
    flashMsg('OUT', `${c.name} SNAGS IT`, '#ff4d5e');
    say(`${c.name} CAMPS UNDER IT — ${pl.type === 'LINER' ? 'LINE DRIVE SPEARED' : 'FLY BALL SECURED'} — OUT NUMBER ${S.outs}`);
  }
  if(pl.type==='FLY'&&outsBefore<2){
    const r3=S.bases[2], r2=S.bases[1], deep=Math.hypot(pl.lx,pl.lz)>19;
    if(r3&&deep){ S.bases[2]=null; sendRunner(r3,2,3,scoreRun,RUNSPD*1.06); pl.tagUp='SAC FLY'; say(`${r3.name} TAGS — THE THROW COMES HOME, BUT THE RUN SCORES`); }
    else if(r2&&deep&&simRandom()<.72){ S.bases[1]=null; S.bases[2]=r2; r2.baseIdx=2; sendRunner(r2,1,2,null,RUNSPD*1.05); pl.tagUp='ADVANCE TO THIRD'; }
  }
  commitPitch(pl.type==='LINER'?'LINE OUT':pl.tagUp==='SAC FLY'?'SACRIFICE FLY':'FLY OUT','out');
  cut('chase');
}
function creditHit(pl,asError=false) {
  pl.resolved = true; pl.collect = true;
  const bt = batTeam();
  if(asError){ fldTeam().errors++; pl.error=true; }
  else bt.hits++;
  const dist = Math.hypot(ball.pos.x, ball.pos.z);
  let n;
  if (pl.type === 'GROUND') n = 1;
  else {
    n = dist > 26 ? 3 : dist > 20 ? 2 : 1;
    if (pl.type === 'LINER' && dist > 23) n = Math.max(n, 2);
    n = Math.min(n, 3);
  }
  if(pl.forcedResult==='double') n=2;
  if(pl.forcedResult==='triple') n=3;
  if(pl.forcedResult==='single') n=1;
  if (pl.type !== 'GROUND') {
    const batter = S.batter;
    batter.path = null;
    if (S.bases[0] === batter) S.bases[0] = null;
    advanceOnHit(n, batter);
  }
  if(pl.type==='GROUND'){
    for(const p of pl.originalBases||[]) if(p&&p.path) p.path.speed=RUNSPD*1.03;
  }
  const names = ['SINGLE', 'DOUBLE', 'TRIPLE'];
  commitPitch(asError?'REACHED ON ERROR':names[n-1],asError?'out':'live');
  swellCrowd(n === 1 ? 0.36 : n === 2 ? 0.52 : 0.68);
  flashMsg(asError?'ERROR':names[n-1], asError?`${S.batter.name} REACHES — THE DEFENSE BLINKED`:`${S.batter.name} ${n === 1 ? 'TURNS FOR FIRST' : n === 2 ? 'DIGS FOR TWO' : 'IS FLYING FOR THREE'}`, asError?'#ffd34d':'#58ffb4');
  say(asError?`${pl.chaser.name} CAN'T SECURE IT — SCORE IT E${pl.chaser.position}`:`${S.batter.name} RIPS A ${names[n-1]} ${dist > 24 ? 'OFF THE WALL' : 'INTO THE GAP'}`);
  callBeep(true); cut('run');
}
function fieldGrounder(pl, p) {
  pl.fielded = true; pl.fielder = p;
  ball.mode = 'CARRY'; pl.carrier = p;
  glovePop(); swellCrowd(0.18);
  const bobbleChance = clamp(0.06 + (pl.quality || 0)*0.1 + (pl.routePressure || 0)*0.04, 0.05, 0.22);
  if (pl.forcedResult!=='double_play'&&simRandom() < bobbleChance) { pl.bobbleT = 0.62; say(`${p.name} BOBBLES IT — THE RUNNER SMELLS BLOOD`); }
  const lead=pl.originalBases&&pl.originalBases[0];
  const loaded=lead&&pl.originalBases[1]&&pl.originalBases[2];
  pl.throwQueue=[];
  if(loaded&&S.defense==='INFIELD IN'&&S.outs<2) pl.throwQueue.push({base:3,runner:pl.originalBases[2],label:'FORCE AT HOME'});
  else if(lead&&S.outs<2) pl.throwQueue.push({base:1,runner:lead,label:'FORCE AT SECOND'});
  pl.throwQueue.push({base:0,runner:S.batter,label:pl.throwQueue.length?'TURN TWO':'PLAY AT FIRST'});
  if(pl.forcedResult==='double_play'&&lead) pl.throwQueue=[{base:1,runner:lead,label:'FORCE AT SECOND'},{base:0,runner:S.batter,label:'TURN TWO'}];
  pl.throwIndex=0; pl.activeThrow=null;
  setState('THROW'); cut('run');
}
function receiverForBase(base,thrower){
  const ft=fldTeam();
  if(base===0) return ft.players[2];
  if(base===1) return dxz(ft.players[3].x,ft.players[3].z,BASES[1].x,BASES[1].z)<dxz(ft.players[4].x,ft.players[4].z,BASES[1].x,BASES[1].z)?ft.players[3]:ft.players[4];
  if(base===2) return ft.players[5];
  if(base===3) return ft.players[1];
  return thrower;
}
function beginThrow(pl){
  const target=pl.throwQueue[pl.throwIndex];
  if(!target){ pl.resolved=true; return; }
  const from=pl.fielder, receiver=receiverForBase(target.base,from), spot=BASES[target.base];
  target.receiver=receiver; receiver.tx=spot.x; receiver.tz=spot.z; receiver.sprint=8.4;
  const d=dxz(from.x,from.z,spot.x,spot.z), fatigue=clamp(fldTeam().pitches/120,0,.9);
  const T=Math.max(.24,d/(27-fatigue*2.5));
  target.error=pl.forcedResult!=='double_play'&&simRandom()<clamp(.018+d*.0015+fatigue*.035,.018,.085);
  const missZ=target.error?(simRandom()<.5?-1:1)*(1.8+simRandom()*1.4):0;
  ball.pos.set(from.x,1.3,from.z);
  ball.vel.set((spot.x-from.x)/T,(.95-1.3)/T+.5*GRAV*T,(spot.z+missZ-from.z)/T);
  ball.mode='THROWN'; target.time=T; target.elapsed=0; pl.activeThrow=target;
  say(`${from.name} ${target.label} — ${receiver.name} TO THE BAG`);
}
function eraseRunner(runner){
  for(let i=0;i<3;i++) if(S.bases[i]===runner) S.bases[i]=null;
  runner.path=null; runner.pathI=0; runner.duty='dugout'; runner.baseIdx=-1;
}
function resolveThrow(pl,target){
  const spot=BASES[target.base], runner=target.runner;

  const forcedOut=pl.forcedResult==='double_play';
  const out=!target.error&&!arrived&&(forcedOut||target.elapsed<=target.time+.08);
  ball.mode='CARRY'; pl.carrier=target.receiver; glovePop(); callBeep(!out);
  if(target.error){
    fldTeam().errors++; pl.error=true; pl.resolved=true;
    flashMsg('THROWING ERROR',`${target.receiver.name} CAN'T SAVE IT`,'#ffd34d');
    say(`THE THROW SAILS — E${pl.fielder.position}, EVERYBODY IS SAFE`); swellCrowd(.5);
    if(target.base===0) batTeam().hits+=0;
    commitPitch('THROWING ERROR','out');
    return;
  }
  if(!out){
    pl.resolved=true;
    if(target.base===0) batTeam().hits++;
    flashMsg('SAFE',`${runner.name} BEATS ${target.label}`,'#58ffb4');
    say(`${runner.name} IS SAFE — THE THROW ARRIVES A HALF-BEAT LATE`); swellCrowd(.4);
    commitPitch(target.base===0?'INFIELD SINGLE':'FIELDER’S CHOICE','live');
    return;
  }
  eraseRunner(runner); S.outs++; pl.outsOnPlay=(pl.outsOnPlay||0)+1;
  flashMsg('OUT',`${target.label} · ${S.outs} OUT${S.outs===1?'':'S'}`,'#ff4d5e');
  say(`${target.receiver.name} RECORDS ${target.label} — ${S.outs} OUT${S.outs===1?'':'S'}`); swellCrowd(.3);
  pl.throwIndex++;
  if(pl.throwIndex<pl.throwQueue.length&&S.outs<3){

}

}

// ---------- ball physics ----------
function ballStep(dt) {
  const b = ball;
  if (b.mode === 'IDLE') { if (teams.length) { const P = pitcherP(); b.pos.set(P.x - 0.45, 1.35, P.z); } return; }
  if (b.mode === 'CARRY') { const c = S.play && S.play.carrier; if (c) b.pos.set(c.x, 1.1 + c.jumpY, c.z); return; }
  if (b.mode === 'PITCH') {
    b.vel.z += b.curve*dt; b.vel.y -= GRAV*0.12*dt;   // laser-guided with a hint of drop
    b.pos.addScaledVector(b.vel, dt);
  } else { // LIVE / THROWN
    b.vel.y -= GRAV*dt;
    b.pos.addScaledVector(b.vel, dt);
    if (b.pos.y <= 0.17 && b.vel.y < 0) {
      b.pos.y = 0.17;
      if (Math.abs(b.vel.y) > 2.5) {
        b.vel.y *= -0.45; b.vel.x *= 0.75; b.vel.z *= 0.75;
        if (S.play) S.play.bounced = true;
      } else { b.vel.y = 0; if (S.play) S.play.bounced = true; }
    }
    if (b.pos.y <= 0.18) { b.vel.x *= Math.exp(-1.4*dt); b.vel.z *= Math.exp(-1.4*dt); } // roll friction
  }
  if (!isFinite(b.pos.x) || !isFinite(b.pos.y) || !isFinite(b.pos.z)) {
    b.mode = 'IDLE'; b.pos.set(MOUND_X - 0.5, 1.4, 0); b.vel.set(0, 0, 0);  // watchdog: ball never escapes the sim
  }
}

// ---------- state machine ----------
S.swingT = -1; S.swung = false;
function stateStep(dt) {
  S.t += dt;
  if (S.swingT >= 0) S.swingT += dt;
  switch (S.state) {
    case 'SETUP': {
      if (S.t > 0.7) { S.pitchPlan = planPitch(); S.swingT = -1; S.swung = false; setState('WINDUP'); }
      break;
    }
    case 'WINDUP': {
      if (S.t > 0.8 || S.t > 4) throwPitch();         // pitch is always thrown (watchdog inclusive)
      break;
    }
    case 'PITCH': {
      const plan = S.pitchPlan;
      if (plan && plan.swing && !S.swung && ball.pos.x < 2.1) { S.swung = true; S.swingT = 0; }
      if (ball.pos.x <= 0.02) { resolvePitch(false); break; }
      if (S.t > 2.5) { resolvePitch(true); break; }   // watchdog: lost pitch = ball
      break;
    }
    case 'RESOLVE': { // dead-ball beat: fouls + walks settle here
      const isWalk = S.play && S.play.type === 'WALK';
      if (S.t > (isWalk ? 1.6 : 1.3) && (allSettled() || S.t > 4.5)) {
        if (isWalk) afterPlay();
        else { S.play = null; ball.mode = 'IDLE'; setState('SETUP'); cut('plate'); }
      }
      break;
    }
    case 'LIVE': {
      const pl = S.play;
      if (!pl) { setState('SETUP'); break; }
      // chaser converges on the landing point (or intercepts the roller)
      if (pl.chaser && !pl.fielded && !pl.resolved) {
        if (pl.type === 'GROUND') { pl.chaser.tx = ball.pos.x + ball.vel.x*0.25; pl.chaser.tz = ball.pos.z + ball.vel.z*0.25; }
        else { pl.chaser.tx = pl.lx; pl.chaser.tz = pl.lz; }
        pl.chaser.sprint = pl.forcedResult==='sac_fly' ? 9.4 : 8;
      }
      if (pl.type === 'GROUND') { // first baseman covers the bag
        const fb = fldTeam().players[2];
        if (fb !== pl.chaser) { fb.tx = BASES[0].x; fb.tz = BASES[0].z; fb.sprint = 8; }
      }
      if (pl.resolved && pl.collect && pl.chaser) {   // jog over and pick it up
        pl.chaser.tx = ball.pos.x; pl.chaser.tz = ball.pos.z;
        if (dxz(pl.chaser.x, pl.chaser.z, ball.pos.x, ball.pos.z) < 0.8 && ball.pos.y < 0.6) {
          ball.mode = 'CARRY'; pl.carrier = pl.chaser; pl.collect = false;
        }
      }
      if (!pl.resolved) {
        if (pl.type === 'FLY' || pl.type === 'LINER') {
          const catchRadius=pl.forcedResult==='sac_fly'?2.35:1.2;
          if (pl.canCatch && !pl.bounced && ball.vel.y < 0 && ball.pos.y < 1.7 && pl.chaser &&
              dxz(pl.chaser.x, pl.chaser.z, ball.pos.x, ball.pos.z) < catchRadius) { catchOut(pl); break; }
          if (pl.bounced) { creditHit(pl); break; }
        } else { // GROUND
          if (ball.pos.y < 0.6) {
            for (const p of infielders().concat([pitcherP()])) {
              if (dxz(p.x, p.z, ball.pos.x, ball.pos.z) < 0.95) {
                if (pl.fieldClean) fieldGrounder(pl, p);
                else { say(`${p.name} CAN'T HANDLE THE HOT SHOT — ${S.batter.name} IS ABOARD`); creditHit(pl,true); }
                break;
              }
            }
          }
          if (S.play === pl && !pl.fielded && Math.hypot(ball.pos.x, ball.pos.z) > 19.5) creditHit(pl); // through the infield
        }
      }
      if (pl.resolved && S.t > 1.4 && allSettled()) { afterPlay(); break; }
      if (S.t > 9) { forceSettle(); afterPlay(); }    // watchdog: play never hangs
      break;
    }
    case 'THROW': { // force plays, relay turns, and the race to the bag
      const pl = S.play;
      if (!pl) { setState('SETUP'); break; }
      pl.bobbleT -= dt;
      pl.fielder.tx = pl.fielder.x; pl.fielder.tz = pl.fielder.z; // plant and throw
      if (!pl.activeThrow && pl.bobbleT <= 0 && S.t > 0.2) beginThrow(pl);
      if (pl.activeThrow && !pl.resolved) {
        pl.activeThrow.elapsed += dt;
        if (pl.activeThrow.elapsed >= pl.activeThrow.time) resolveThrow(pl,pl.activeThrow);
      }
      if (pl.resolved && S.t > 1.2 && allSettled()) { afterPlay(); break; }
      if (S.t > 4.5) { forceSettle(); afterPlay(); }  // watchdog
      break;
    }
    case 'HOMER': {
      const pl = S.play;
      if (!pl) { setState('SETUP'); break; }
      const dist = Math.hypot(ball.pos.x, ball.pos.z);
      if (!pl.cleared && dist >= WALL_R - 0.2) {
        pl.cleared = true;
        burst(ball.pos.x, Math.max(3.2, ball.pos.y), ball.pos.z, batTeam().def.glow, 44, 11);
        horn(); ledPulse = 1; swellCrowd(1);
        const moment=pl.grandSlam ? 'GRAND SLAM' : pl.moonshot ? 'MOONSHOT' : 'HOME RUN';
        recordClip(`${moment} · ${S.batter.name}`,4);
        flashMsg(moment, pl.grandSlam ? `${S.batter.name} CLEARS THE BASES` : `${S.batter.name} GOES YARD`, batTeam().def.css);
        say(pl.grandSlam ? `GRAND SLAM — ${S.batter.name} EMPTIES THE DIAMOND AND THE DOME ERUPTS`
                         : `THAT BALL IS GONE — ${S.batter.name} SENDS IT OVER THE WALL AND INTO LOW ORBIT`);
      }
      if (pl.cleared) {
        pl.fwT += dt;
        if (pl.fwT > 0.55) {
          pl.fwT = 0;
          burst(14 + (Math.random()*2 - 1)*12, 6 + Math.random()*5, (Math.random()*2 - 1)*16,
            pick([0x58ffb4, batTeam().def.glow, 0xffffff]), 26, 9);
        }

      if (S.t > 9.5) { forceSettle(); afterPlay(); }  // watchdog

    case 'SIDECHG': {

      break;
    }
    case 'FINAL': {

    }
  }

  if (S.state === S.lastState) { S.stuckT = (S.stuckT || 0) + dt; } else { S.stuckT = 0; S.lastState = S.state; }

    say('UMP-BOT 3000 CALLS TIME — RESETTING THE DIAMOND');
    nextBatter(true); setState('SETUP'); cut('plate');
  }
}

// ---------- poses + props ----------
function posePlayers() {
  if (!teams.length) return;
  const pitcher = pitcherP(), catcher = fldTeam().players[1];
  if (S.state === 'WINDUP') pitcher.rig.poseThrowIn(clamp(S.t/0.9, 0, 1));   // lean-back squash
  catcher.rig.poseGKSet(tGlobal);
  if(S.state==='LIVE'&&S.play&&S.play.chaser) S.play.chaser.rig.poseGKShuffle(tGlobal,Math.sign(S.play.lz-S.play.chaser.z)||1);
  if(S.state==='THROW'&&S.play&&S.play.fielder) S.play.fielder.rig.poseThrowIn(clamp((S.t-.15)/.32,0,1));
  if(S.state==='HOMER'||(S.clipT>0&&S.clipMoment.includes('DOUBLE PLAY'))){
    const celebrating=S.state==='HOMER'?batTeam():fldTeam();
    for(const p of celebrating.players) if(p.duty==='dugout') p.rig.poseCelebrate(tGlobal,p.role%4);
  }
  if (S.batter && S.batter.duty === 'batter') {
    if (S.swingT >= 0) S.batter.rig.poseSkill(0, clamp(S.swingT/0.5, 0, 1));
    else S.batter.rig.poseGKSet(tGlobal*1.3 + 2);
  }
  // bat
  const showBat = S.batter && S.batter.duty === 'batter' &&
    (S.state === 'SETUP' || S.state === 'WINDUP' || S.state === 'PITCH' || S.state === 'RESOLVE');

  if (showBat) {
    bat.position.set(S.batter.x + 0.1, 1.18, S.batter.z);

    if (S.swingT >= 0) {

}

// ---------- trail / fx ----------
function trailStep() {
  if (ball.mode === 'PITCH' || ball.mode === 'LIVE' || ball.mode === 'THROWN') {
    trailHist.unshift({ x: ball.pos.x, y: ball.pos.y, z: ball.pos.z });
    if (trailHist.length > TRAIL_N) trailHist.pop();
  } else if (trailHist.length) trailHist.length = Math.max(0, trailHist.length - 2);
  for (let i = 0; i < TRAIL_N; i++) {
    const h = trailHist[i], s = trail[i];
    if (!h) { s.material.opacity = 0; continue; }
    s.position.set(h.x, h.y, h.z);
    s.material.opacity = 0.5*(1 - i/TRAIL_N);
    const sc = 0.42*(1 - i/TRAIL_N) + 0.08; s.scale.set(sc, sc, 1);
  }
}
function ballVisualStep(dt) {

  ballShadow.position.z = ball.pos.z;

  const active = ball.mode !== 'IDLE';
  const sh = (active ? 0.92 : 0.58)*(1 + heightK*0.55);
  ballShadow.scale.set(sh, sh, 1);
  ballShadow.material.opacity = (active ? 0.34 : 0.18)*(1 - heightK*0.7);

  impactT = Math.max(0, impactT - dt*2.9);
  impactFlash.material.opacity = impactT*0.75;

  impactFlash.scale.set(fsc, fsc, 1);
  swingArc.material.opacity = impactT*0.62;

}
function crowdStep(dt){
  crowdWave += dt*(1.15 + crowdPulse*2.4);
  const pop=crowdPulse, homeGlow=TEAM_B ? TEAM_B.glow : 0x58ffb4;
  for (const m of crowdMembers){
    const hop=Math.sin(crowdWave*3.2 + m.phase);
    m.s.position.y = m.baseY + hop*0.025*(1 + pop*2.6);
    const sc=m.baseScale*(1 + Math.max(0, hop)*0.09*pop);
    m.s.scale.set(sc,sc,1);
    m.s.material.opacity = clamp(m.baseOpacity + pop*0.28 + Math.sin(crowdWave*1.7 + m.phase)*0.05, 0.25, 0.96);
    if (pop > 0.25 && Math.random() < dt*1.9) m.s.material.color.setHex(Math.random() < 0.35 ? homeGlow : pick(crowdPalette));
  }
  for (const m of standMats){
    const c=new THREE.Color(0xaebad8);

function markerStep(){

function timerStep(dt, touchDom){
  zoneT = Math.max(0, zoneT - dt*1.6);

  } else if (touchDom) elFlash.classList.remove('show');

const ledCol = new THREE.Color();
function fxStep(dt) {

// ---------- camera ----------
const camPos = new THREE.Vector3(-10.8, 5.2, 2.4), camLook = new THREE.Vector3(MOUND_X*0.9, 0.9, 0);
const tmpP = new THREE.Vector3(), tmpL = new THREE.Vector3();
function cameraStep(dt) {
  switch (S.camMode) {
    case 'chase': {
      const sp = Math.hypot(ball.vel.x, ball.vel.z) || 1;
      tmpP.set(ball.pos.x - ball.vel.x/sp*6.5, Math.max(2.2, ball.pos.y + 2.4), ball.pos.z - ball.vel.z/sp*6.5);
      tmpL.copy(ball.pos);
      break;
    }
    case 'run':
      tmpP.set(-2.5, 14.5, 11);
      tmpL.set(DIAG/2*0.8, 0.4, 0);
      break;
    case 'homer':
      tmpP.set(-8, 4 + Math.min(S.t, 5)*1.2, 3.2);
      tmpL.set(ball.pos.x, Math.max(1.5, ball.pos.y*0.8), ball.pos.z);
      break;
    case 'card': {
      const a = tGlobal*0.07;

    }
    default: // 'plate' — broadcast home: elevated behind the catcher
      tmpP.set(-10.8, 5.2, 2.4 + Math.sin(tGlobal*0.13)*0.5);
      tmpL.set(MOUND_X*0.9, 0.9, 0);
  }
  if (S.camCut) { camPos.copy(tmpP); camLook.copy(tmpL); S.camCut = false; }  // hard cut hides resets
  else { camPos.lerp(tmpP, dampK(3.2, dt)); camLook.lerp(tmpL, dampK(5, dt)); }
  camera.position.copy(camPos);
  camera.lookAt(camLook);
}

// ---------- main loop ----------
setupMatch();
function gameSnapshot(){
  const pl=S.play;
  const activeRunners=allPlayers().filter(p=>p.duty==='runner' || p.duty==='batter').map(p=>({
    name:p.name, duty:p.duty, base:p.baseIdx, position:{x:+p.x.toFixed(2),z:+p.z.toFixed(2)},
    target:p.path && p.path[p.pathI] ? {x:+p.path[p.pathI].x.toFixed(2),z:+p.path[p.pathI].z.toFixed(2)} : null
  }));
  const [nextA,nextB]=FIXTURES[(fixtureIdx+1)%FIXTURES.length];
  return {
    note:'Coordinates are diamond-space x/z meters: home plate is (0,0), center field is +x, first base is +z, third base is -z.',
    paused, fullscreen:!!document.fullscreenElement,
    controls:{pause:'P',rematch:'R',fullscreen:'F',exit:'Escape'},
    fixture:{index:fixtureIdx,total:FIXTURES.length,teams:teams.map(t=>t.def.name),next:[TEAMS[nextA].name,TEAMS[nextB].name]},
    status:elPlayStatus.textContent, clipMoment:S.clipMoment || null, clipSeconds:+S.clipT.toFixed(1), clipsThisGame:S.clips.slice(),
    state:S.state, t:+S.t.toFixed(2), inning:S.inning, half:S.half,
    outs:S.outs, balls:S.balls, strikes:S.strikes,
    gamePlan:{offense:S.approach,defense:S.defense,pitchIntent:S.intent,pitcherWorkload:teams.length?fldTeam().pitches:0},
    pitchHistory:S.pitchHistory.map(p=>({name:p.name,speedMph:p.speedMph,location:p.location,result:p.result,count:p.count})),
    recentEvents:S.playLog.slice(-12),
    score:teams.length ? [teams[0].runs, teams[1].runs] : [0,0],
    hits:teams.length ? [teams[0].hits, teams[1].hits] : [0,0],
    hrs:teams.length ? [teams[0].hrs, teams[1].hrs] : [0,0],
    bases:S.bases.map(b => b ? b.name : null), activeRunners,
    batter:S.batter && S.batter.name,
    pitch:S.pitchPlan ? {name:S.pitchPlan.name,speedMph:Math.round(S.pitchPlan.speed*4),location:S.pitchPlan.location,inZone:!!S.pitchPlan.inZone,curve:+S.pitchPlan.curve.toFixed(2),swing:!!S.pitchPlan.swing} : null,
    lastPitch:S.lastPitch,
    ball:{ mode:ball.mode, pos:[+ball.pos.x.toFixed(1), +ball.pos.y.toFixed(1), +ball.pos.z.toFixed(1)], vel:[+ball.vel.x.toFixed(1),+ball.vel.y.toFixed(1),+ball.vel.z.toFixed(1)] },
    play:pl ? {
      type:pl.type, quality:pl.quality == null ? null : +pl.quality.toFixed(2),
      resolved:!!pl.resolved, bounced:!!pl.bounced, fielded:!!pl.fielded,
      canCatch:pl.canCatch == null ? null : !!pl.canCatch,
      fieldClean:pl.fieldClean == null ? null : !!pl.fieldClean,
      routePressure:pl.routePressure == null ? null : pl.routePressure,
      chaser:pl.chaser && pl.chaser.name,
      fielder:pl.fielder && pl.fielder.name,
      launchAngle:pl.launchAngle,exitVelo:pl.exitVelo,error:!!pl.error,tagUp:pl.tagUp||null,outsOnPlay:pl.outsOnPlay||0,
      activeThrow:pl.activeThrow ? {label:pl.activeThrow.label,toBase:pl.activeThrow.base===3?'HOME':pl.activeThrow.base+1,receiver:pl.activeThrow.receiver&&pl.activeThrow.receiver.name,error:!!pl.activeThrow.error} : null,
      grandSlam:!!pl.grandSlam, moonshot:!!pl.moonshot,
      target:[+(pl.lx || 0).toFixed(1), +(pl.lz || 0).toFixed(1)]
    } : null,
    defense:teams.length?fldTeam().players.filter(p=>p.duty==='fielder').map(p=>({name:p.name,position:p.position,x:+p.x.toFixed(1),z:+p.z.toFixed(1)})):[],
    teams:teams.map(t => ({name:t.def.name,runs:t.runs,hits:t.hits,homeRuns:t.hrs,errors:t.errors,walks:t.walks,strikeouts:t.strikeouts,pitches:t.pitches,nextBatter:t.players[t.batIdx%t.players.length].name})),
    crowd:{ members:crowdMembers.length, pulse:+crowdPulse.toFixed(2) }
  };
}
function renderGameToText(){ return JSON.stringify(gameSnapshot()); }
window.render_game_to_text = renderGameToText;
window._dbg = gameSnapshot;
window._ff = secs => { const n = Math.max(1, Math.round(secs/0.05)); for (let i = 0; i < n; i++) tick(0.05, i < n - 1); };
window._games = [];
window._baseballTest={
  reset(seed='cyberliga-baseball-test'){
    setupMatch(); seedSim(seed); return gameSnapshot();
  },
  deterministic(seed='cyberliga-baseball-twin'){
    if(rafId){ cancelAnimationFrame(rafId); rafId=0; }
    if(hiddenTimer){ clearInterval(hiddenTimer); hiddenTimer=0; }
    paused=false; tGlobal=0; window._games.length=0; setupMatch(); seedSim(seed); return gameSnapshot();
  },
  scenario(result,pitch='FOUR-SEAM'){
    forceSettle();
    for(const p of batTeam().players) if(p!==S.batter){ p.duty='dugout'; p.baseIdx=-1; p.path=null; }
    S.bases=[null,null,null]; S.outs=0; S.balls=0; S.strikes=0; S.play=null; ball.mode='IDLE';
    if(result==='double_play'){
      const runner=batTeam().players.find(p=>p!==S.batter); runner.duty='runner'; runner.baseIdx=0; S.bases[0]=runner;
    }else if(result==='sac_fly'){
      const runner=batTeam().players.find(p=>p!==S.batter); runner.duty='runner'; runner.baseIdx=2; S.bases[2]=runner;
    }
    snapAll(); S.forceNext={result,pitch}; setState('SETUP'); cut('plate'); return gameSnapshot();
  },
  forceNext(result,pitch='FOUR-SEAM'){ S.forceNext={result,pitch}; return {result,pitch}; },
  getPitchTypes(){ return PITCH_TYPES.map(p=>p.name); },
  getSeed(){ return simSeed>>>0; }
};
function tick(dt, skipRender = false) {
  if (paused) { if (!skipRender) { hudStep(); composer.render(); } return; }
  tGlobal += dt;
  steerIdle();          // duty stations first; live-play steering overrides below
  stateStep(dt);
  if (!skipRender) posePlayers();
  updatePlayers(dt);
  ballStep(dt);
  if (skipRender) { timerStep(dt, false); return; } // hidden-tab catch-up: only the last step touches visuals/DOM
  ballMesh.position.copy(ball.pos);
  ballVisualStep(dt);
  trailStep();
  sparkStep(dt);
  fxStep(dt);
  cameraStep(dt);
  tickerStep(dt);
  hudStep();
  composer.render();
}
window.advanceTime = ms => {
  const total=Math.max(0, Number(ms) || 0);
  const step=1/60, n=Math.max(1, Math.ceil(total/1000/step));
  for (let i=0;i<n;i++) tick(step, i<n-1);
  return renderGameToText();
};
// ---------- tick driver (hidden-tab resilience, same pattern as the other arenas) ----------
// rAF stops entirely in hidden tabs, so when hidden we drive tick() from setInterval:
// each fire replays elapsed real time as fixed 0.05s sim steps (capped at 1s of
// catch-up per fire), rendering only the last one. Exactly ONE driver runs at a time.
let rafId = 0, hiddenTimer = 0, prevT = performance.now();
function rafLoop(now) {
  rafId = requestAnimationFrame(rafLoop);
  const dt = Math.min(0.05, (now - prevT)/1000);
  prevT = now;
  if (dt <= 0) return;
  tick(dt);
}
function startDriver() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
  if (hiddenTimer) { clearInterval(hiddenTimer); hiddenTimer = 0; }
  if (document.hidden) {
    let lastFire = performance.now();
    hiddenTimer = setInterval(() => {
      const now = performance.now();
      const steps = Math.min(Math.floor((now - lastFire)/50), 20);
      if (steps <= 0) return;
      lastFire = now;
      prevT = now; // so foreground resume doesn't inherit a huge delta
      for (let i = 0; i < steps; i++) tick(0.05, i < steps - 1);
    }, 50);
  } else { prevT = performance.now(); rafLoop(prevT); }
}
document.addEventListener('visibilitychange', startDriver);
startDriver();

function resizeScene() {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
}
function togglePause(){ paused=!paused; elPauseBtn.textContent=paused?'▶':'P'; hudStep(); }
function rematch(){ paused=false; elPauseBtn.textContent='P'; setupMatch(); hudStep(); }
async function toggleFullscreen(){
  try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); }
  catch(e) { say('FULLSCREEN IS UNAVAILABLE IN THIS BROWSER'); }
}
elPauseBtn.addEventListener('click',e=>{e.stopPropagation();togglePause();});
elRematchBtn.addEventListener('click',e=>{e.stopPropagation();rematch();});
elFullBtn.addEventListener('click',e=>{e.stopPropagation();toggleFullscreen();});
addEventListener('resize',resizeScene);
document.addEventListener('fullscreenchange',()=>{ resizeScene(); elFullBtn.textContent=document.fullscreenElement?'×':'F'; });
addEventListener('keydown',e=>{
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k=e.key.toLowerCase();
  if (k==='p') { e.preventDefault(); togglePause(); }
  else if (k==='r') { e.preventDefault(); rematch(); }
  else if (k==='f') { e.preventDefault(); toggleFullscreen(); }
  else if (e.key==='Escape') {
    if (document.fullscreenElement) { e.preventDefault(); document.exitFullscreen(); }
    else location.href='world.html';
  }
});
</script>
