<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { buildBlobRig } from './blobrig.js';

// ============ HELPERS / CONSTANTS ============
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a+(b-a)*t;
const dampK = (k,dt)=>1-Math.exp(-k*dt);
function lerpAngle(a,b,t){ let d=b-a; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2; return a+d*t; }
function hashText(text) {
  let h=2166136261;
  for (const c of String(text)) { h^=c.charCodeAt(0); h=Math.imul(h,16777619); }
  return h>>>0;
}
let fightSeed=1;
function seedFight(text){ fightSeed=hashText(text)||1; }
function frand(){ fightSeed^=fightSeed<<13; fightSeed^=fightSeed>>>17; fightSeed^=fightSeed<<5; return (fightSeed>>>0)/4294967296; }
const pick = a=>a[Math.floor(frand()*a.length)];

const RING_R = 4.9;                      // octagon vertex radius
const RING_Y = 0.95;                     // platform top height
const FIGHT_R = 3.9;                     // soft clamp radius for fighters
const ROUND_LEN = 60, ROUNDS = 3, REST_LEN = 7;
const FIGHT_DMG = 0.34;                  // global damage scale (pacing knob: ~KO half the cards, judges the rest)

  const oct=(r)=>{ g.beginPath(); for(let i=0;i<8;i++){ const a=i/8*Math.PI*2+Math.PI/8;

// View-only broadcasts never wait for or install an activation gesture. Keep
// the optional synth dormant so simulation timing is wholly autonomous.
let AC = null, crowdGain = null, crowdLevel = 0.05, thudCd = 0;
function noiseBurst(filterType, freq, dur, peak) {
  if (!AC) return;
  const t = AC.currentTime, src = AC.createBufferSource(); src.buffer = AC._noise;
  const f = AC.createBiquadFilter(); f.type = filterType; f.frequency.value = freq;
  const g = AC.createGain();
  g.gain.setValueAtTime(peak, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f); f.connect(g); g.connect(AC._m); src.start(t); src.stop(t + dur + 0.05);
}
const punchThud = v => { if (thudCd <= 0) { noiseBurst('lowpass', 200 + v*120, 0.14, 0.16 + v*0.16); thudCd = 0.07; } };
const whiff = () => noiseBurst('bandpass', 900, 0.07, 0.05);
const blockClack = () => noiseBurst('highpass', 2100, 0.05, 0.08);
function bell(n = 1) {
  if (!AC) return;
  for (let i = 0; i < n; i++) {
    const t = AC.currentTime + i*0.45;
    const o = AC.createOscillator(); o.type = 'triangle'; o.frequency.value = 1180;
    const o2 = AC.createOscillator(); o2.type = 'sine'; o2.frequency.value = 1770;
    const g = AC.createGain();
    g.gain.setValueAtTime(0.22, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.9);
    o.connect(g); o2.connect(g); g.connect(AC._m);
    o.start(t); o.stop(t + 1); o2.start(t); o2.stop(t + 1);
  }
}
function countBeep() {
  if (!AC) return;
  const t = AC.currentTime, o = AC.createOscillator(); o.type = 'square'; o.frequency.value = 720;
  const g = AC.createGain();
  g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
  o.connect(g); g.connect(AC._m); o.start(t); o.stop(t + 0.2);
}
function koHorn() {
  if (!AC) return;
  const t = AC.currentTime;
  [98, 147, 196].forEach((f, i) => {
    const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 800;
    const g = AC.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(i === 0 ? 0.1 : 0.14, t + 0.05);
    g.gain.setValueAtTime(i === 0 ? 0.1 : 0.14, t + 1.0); g.gain.linearRampToValueAtTime(0.0001, t + 1.6);
    o.connect(lp); lp.connect(g); g.connect(AC._m); o.start(t); o.stop(t + 1.7);
  });
}

function resolveStrike(f) {

  let caughtSlipping = false;
  if (o.act === 'dodge') {
    if (!bodyShot && o.actT < 0.26) {
      whiff(); miss(); say(fill(pick(COMM.dodge), f.name, o.name));
      o.counterT = 0.9; f.comboN = 0; f.comboQ = null;

    const away = Math.atan2(o.x - f.x, o.z - f.z);
    o.vx += Math.sin(away)*2.2 + Math.cos(away)*o.slipDir*0.85; o.vz += Math.cos(away)*2.2 - Math.sin(away)*o.slipDir*0.85;
    whiff(); miss(); say(fill(pick(COMM.dodge), f.name, o.name));

    f.comboN = 0; f.comboQ = null;

  if (f.surgeT > 0) dmg *= 1.16;
  dmg *= 0.86 + rangeFit*0.18;                 // short/long shots lose sting at the edge of range
  dmg *= 1 + (1 - o.stam/100)*0.3;          // tired fighters take more
  if (f.stam < 25) dmg *= 0.7;              // gassed punches lose steam
  if (o.openT > 0) dmg *= 1.12;             // the jab opened the door
  if (caughtSlipping || stunned) dmg *= 1.3; // clean shot on a compromised head

  const minImpactY = bodyShot ? RING_Y + 0.55 : RING_Y + 0.9;
  const ix = lerp(gloveTmp.x, o.x, 0.55), iz = lerp(gloveTmp.z, o.z, 0.55),

  if(caughtSlipping||stunned||o.recovT>0){f.counters++;rs.counters++;}
  punchThud(k.heavy ? 0.9 : 0.45);
  punchHeat = 1; shake = Math.min(1, shake + (k.heavy ? 0.5 : 0.22));
  crowdLevel = Math.min(0.4, crowdLevel + (k.heavy ? 0.12 : 0.05));
  // hit reaction — head snaps on anything clean
  o.act = 'hit'; o.actT = 0; o.hitStun = bodyShot ? 0.44 : (k.heavy ? 0.42 : 0.32);
  o.headSnap = bodyShot ? 0.22 : (k.heavy ? 1 : 0.6);
  o.bodyShot = bodyShot ? 1 : 0;
  o.torsoShock = bodyShot ? 1 : (k.heavy ? 0.55 : 0.28);
  o.hitSide = f.strikeArm === 'L' ? -1 : 1;
  const kb = (k.heavy ? 3.6 : 2.2) / Math.max(0.5, o.chin);
  const dx = o.x - f.x, dz = o.z - f.z, dd = Math.hypot(dx, dz) || 1e-6;
  o.vx += dx/dd*(bodyShot ? kb*0.45 : kb); o.vz += dz/dd*(bodyShot ? kb*0.45 : kb);

  // jabs probe and build openings; landed shots can chain a combo

  if (bodyShot && frand() < 0.65) o.openT = Math.max(o.openT, 0.9);
  if (!k.heavy && frand() < f.comboTend && f.stam > 18)
    f.comboQ = (f.style.id==='PRESSURE' ? pick([['CROSS','BODY','HOOK'],['BODY','HOOK'],['JAB','CROSS','BODY']])
             : f.style.id==='OUTBOXER' ? pick([['CROSS'],['JAB','CROSS'],['CROSS','JAB']])

  else if (f.comboN >= 3) { say(fill(pick(COMM.combo), f.name, o.name, String(f.comboN))); f.comboN = 0; }
  else say(fill(pick(COMM[k.comm]), f.name, o.name));

  if (bodyShot) pKD *= o.stam < 18 ? 0.62 : 0.28;

function knockdown(att, vic) {

  // three-knockdown rule: the third trip to the canvas in one round ends it
  S.threeKD = S.kdRound[S.round-1][att.side] >= 3;
  // theater: decide the script now — comeback chance scales with what's left
  if (vic.hp <= 0 || S.threeKD) S.getUpAt = 11;
  else {
    const hurt = 1 - vic.hp/100;
    const stayDown = frand() < clamp(hurt*0.14 - (vic.chin - 1)*0.25, 0.03, 0.12);
    S.getUpAt = stayDown ? 11 : clamp(3 + Math.floor(hurt*6 + frand()*2), 3, 8);
  }
  if (S.threeKD) say('THAT IS THREE KNOCKDOWNS THIS ROUND — THE REF IS WAVING IT OFF', true);
  flashMsg('KNOCKDOWN!', `${vic.name} IS DOWN`, att.club.css, 1.6);
  say(fill(pick(COMM.kd), att.name, vic.name), true);
  punchThud(1); flashBurst = Math.max(flashBurst, 1);
  crowdLevel = 0.38; shake = 1;
  S.slowmo = vic.hp <= 0 ? 1.5 : 0.8;   // slow-mo on the big blow
  recordClip(`KNOCKDOWN · ${att.name}`,4);
  refP.tx = vic.x * 0.5; refP.tz = vic.z * 0.5;
  setState('KNOCKDOWN'); cut();
}

// ============ FIGHTER AI + MOVEMENT ============
// range model: >2.6 out (footwork) · 1.9–2.6 jab range · 1.1–1.9 power range · <1.1 clinch (auto-split)
function fighterBrain(f, dt) {
  const o = opp(f);
  const d = Math.hypot(o.x - f.x, o.z - f.z);
  f.decT -= dt;
  if (f.decT > 0) return;
  f.decT = 0.28 + frand()*0.55;
  // combo continuation: a landed shot chains the next punch immediately
  if (f.comboQ && f.comboQ.length && f.stam > 10) {
    const next = f.comboQ.shift();
    if (!f.comboQ.length) f.comboQ = null;
    if (d < STRIKES[next].reach + 0.45) { startStrike(f, next); return; }
    f.comboQ = null;
  }
  // counters: punish a whiffed power shot (recovery frames) or a shattered guard
  if ((o.recovT > 0 || o.act === 'stun') && d < 2.35 && f.stam > 14 &&
      frand() < 0.5 + f.counterTend*0.45) {
    const kind = d < 1.9 ? (frand() < 0.5 ? 'HOOK' : 'UPPER') : 'CROSS';
    startStrike(f, kind);
    if (o.recovT > 0) say(fill(pick(COMM.counter), f.name, o.name));
    return;
  }
  // slip earned a counter window — fire before it closes
  if (f.counterT > 0 && d < 2.4 && f.stam > 12) {
    f.counterT = 0;
    startStrike(f, d < 1.9 ? 'HOOK' : 'CROSS');
    return;
  }
  // read: shell up against an incoming heavy
  if (o.act === 'strike' && o.strike && o.strike.heavy && f.act === 'move' &&
      frand() < f.blockTend*0.5) {
    f.act = 'block'; f.actT = 0; f.decT = 0.45;
    return;
  }
  // urgency: behind on the cards late ⇒ swing for the fences
  let aggr = f.aggr + (S.round === ROUNDS && f.hp < o.hp ? 0.3 : 0) + (1 - S.clock/ROUND_LEN)*0.12 + (f.surgeT>0 ? 0.42 : 0);
  if (f.stam < 18) aggr *= 0.4;                       // gassed — buy time
  if (S.noAction > 5) aggr = 1;                       // forced engage: crowd wants blood
  if (d < 2.45 && frand() < aggr) {
    if (f.stam > 22 && o.act === 'move' && frand() < (f.style.id==='COUNTER'?.32:.13)*f.counterTend*(o.openT > 0 ? 0.35 : 1)) {
      startFeint(f);
      return;
    }
    // pick a punch by range: power range ⇒ hooks/uppercuts, jab range ⇒ jab/cross
    const r = frand();
    let kind;
    const bodyBias=f.style.body+(f.plan.includes('BODY')?.16:0);
    if (d < 1.75) kind = r < bodyBias ? 'BODY' : r < bodyBias+.27 ? 'HOOK' : r < bodyBias+.43 ? 'UPPER' : r < .9 ? 'CROSS' : 'JAB';
    else if (d < 2.12) kind = r < bodyBias*.65 ? 'BODY' : r < .48 ? 'JAB' : r < .82 ? 'CROSS' : 'HOOK';
    else kind = r < (f.style.id==='OUTBOXER'?.78:.65) ? 'JAB' : 'CROSS';
    // no opening yet? probe with the jab before committing power
    if (o.openT <= 0 && STRIKES[kind].heavy && frand() < (f.style.id==='BRAWLER'?.22:.5)) kind = 'JAB';
    if (f.stam < STRIKES[kind].stam + 4) kind = 'JAB';
    startStrike(f, kind);
    return;
  }
  // footwork plan (reachPref: some fighters live long, some live in the pocket)
  if (frand() < (f.style.id==='OUTBOXER'?.42:.24)) f.circ = -f.circ;
  if (f.stam < 30 && frand() < 0.72) f.wantDist = 3.3;
  else if (frand() < aggr) f.wantDist = f.style.range*(.9+frand()*.16);
  else f.wantDist = (f.style.range+.35+frand()*.55);
}
function moveFighter(f, dt) {
  const o = opp(f);
  f.actT += dt; f.invulnT -= dt; f.comboT -= dt;
  f.openT -= dt; f.counterT -= dt; f.recovT -= dt;
  f.surgeT=Math.max(0,f.surgeT-dt);
  f.bodyShot = Math.max(0, f.bodyShot - dt*2.4);
  f.torsoShock = Math.max(0, f.torsoShock - dt*3.2);
  if (f.comboT <= 0) f.comboN = 0;
  if (S.state==='FIGHT' && f.hp<28 && !f.lastStand) {
    f.lastStand=true; f.surgeT=6; f.stam=Math.max(f.stam,55); f.guard=Math.max(f.guard,48);
    recordClip(`LAST STAND · ${f.name}`,3.5);
    flashMsg('LAST STAND', `${f.name} REFUSES TO FOLD`, f.club.css, 1.5);
    say(`${f.name} IS HURT BUT THE ENGINE JUST REDLINED — SIX SECONDS OF PURE SURVIVAL`,true);
    flashBurst=Math.max(flashBurst,1); crowdLevel=.42;
  }
  // act phase exits
  if (f.act === 'strike') {
    if (!f.strikeDone && f.actT >= f.strikeDur*0.52) { f.strikeDone = true; resolveStrike(f); }
    if (f.actT >= f.strikeDur) {
      // whiffed power shot ⇒ recovery frames: the counter window opens
      if (!f.strikeLanded && f.strike.heavy) {
        f.recovT = 0.55;
        if (frand() < 0.3) say(fill(pick(COMM.whiffc), f.name, o.name));
      }
      f.act = 'move'; f.actT = 0;
    }
  } else if (f.act === 'hit'    && f.actT > f.hitStun) { f.act = 'move'; f.actT = 0; }
  else if (f.act === 'feint'  && f.actT > 0.28) { f.act = 'move'; f.actT = 0; }
  else if (f.act === 'dodge'  && f.actT > 0.4)  { f.act = 'move'; f.actT = 0; }
  else if (f.act === 'block'  && f.actT > 0.55) { f.act = 'move'; f.actT = 0; }
  else if (f.act === 'stun'   && f.actT > 1.35) { f.act = 'move'; f.actT = 0; f.guard = Math.max(f.guard, 40); }
  else if (f.act === 'getup'  && f.actT > 0.9)  { f.act = 'move'; f.actT = 0; f.invulnT = 1.2; }
  // guard meter recovers when the hands are free
  if (f.act === 'move') f.guard = Math.min(100, f.guard + dt*8);
  // blocking costs gas
  if (f.act === 'block') f.stam = Math.max(0, f.stam - dt*4);
  // steering (only when free + fight live)
  if (S.state === 'FIGHT' && f.act === 'move') {
    fighterBrain(f, dt);
    if (f.act === 'move') {
      const dx = o.x - f.x, dz = o.z - f.z, d = Math.hypot(dx, dz) || 1e-6;
      const nx = dx/d, nz = dz/d;
      const radial = (d - f.wantDist);                  // + ⇒ close in
      const weave = Math.sin(simClockTotal*4.7 + f.side*2.1) * clamp((2.4 - d)/1.2, 0, 1) * 0.65;
      const tangX = -nz*(f.circ + weave), tangZ = nx*(f.circ + weave);      // circle the opponent
      const spd = f.stam < 20 ? 4.5 : 7;
      const pressure = o.openT > 0 ? 1.2 : 0;
      f.vx += (nx*clamp(radial + pressure*0.18, -1, 1)*spd + tangX*(2.25 + pressure))*dt*2.35;
      f.vz += (nz*clamp(radial + pressure*0.18, -1, 1)*spd + tangZ*(2.25 + pressure))*dt*2.35;
      f.stam = Math.min(100, f.stam + dt*(d > 2.6 ? 5.5 : 2.8));  // breathe at range
    }
  } else if (f.act === 'down') {
    f.vx *= Math.exp(-6*dt); f.vz *= Math.exp(-6*dt);
  }
  // integrate + friction
  f.vx *= Math.exp(-3.2*dt); f.vz *= Math.exp(-3.2*dt);
  f.x += f.vx*dt; f.z += f.vz*dt;
  // octagon ropes (circle clamp at fight radius) — only once they're in the ring
  if (f.y >= RING_Y - 0.01) {
    const rr = Math.hypot(f.x, f.z);
    if (rr > FIGHT_R) {
      const nx = f.x/rr, nz = f.z/rr;
      f.x = nx*FIGHT_R; f.z = nz*FIGHT_R;
      const vn = f.vx*nx + f.vz*nz;
      if (vn > 0) { f.vx -= 1.6*vn*nx; f.vz -= 1.6*vn*nz; }  // rope bounce
    }
  }
  if (!isFinite(f.x) || !isFinite(f.z)) { f.x = CORNER[f.side].x; f.z = CORNER[f.side].z; f.vx = f.vz = 0; }
  // separation — no clipping through each other
  const o2 = opp(f);
  const ddx = o2.x - f.x, ddz = o2.z - f.z, dd = Math.hypot(ddx, ddz);
  if (dd < 1.14 && dd > 1e-4) {
    const push = (1.14 - dd)/2, px = ddx/dd, pz = ddz/dd;
    f.x -= px*push; f.z -= pz*push; o2.x += px*push; o2.z += pz*push;
  }
}

// ============ WALK-ONS / ROUND FLOW ============
function walkStep(f, tx, tz, dt, spd = 3.0) {
  const dx = tx - f.x, dz = tz - f.z, d = Math.hypot(dx, dz);
  if (d > 0.3) { f.vx += dx/d*spd*dt*3.2; f.vz += dz/d*spd*dt*3.2; }
  // climb through the ropes: rise to canvas height once they reach the apron
  const rr = Math.hypot(f.x, f.z);
  const wantY = rr < RING_R + 0.9 ? RING_Y : 0;
  f.y += (wantY - f.y)*dampK(6, dt);
  return d < 0.5;
}

function cornerAdjust(f) {
  const o=opp(f), mine=S.roundStats[S.round-1][f.side], theirs=S.roundStats[S.round-1][o.side];
  const behind=(mine.damage+mine.landed*.32)<(theirs.damage+theirs.landed*.32);
  if(f.stam<34){ f.plan='BUY SPACE · JAB AND BREATHE'; f.wantDist=3.05; f.aggr*=.92; f.cornerNote='CORNER: SAVE THE GAS'; }
  else if(o.cut>=2){ f.plan='TOUCH THE CUT · STRAIGHTS'; f.aggr*=1.06; f.cornerNote='CORNER: RED TARGET'; }
  else if(behind){ f.plan=f.style.id==='OUTBOXER'?'TAKE CENTER · DOUBLE JAB':'PRESS NOW · BODY TO HEAD'; f.aggr*=1.08; f.cornerNote='CORNER: ROUND NEEDED'; }
  else { f.plan=f.style.plans[Math.min(S.round,f.style.plans.length-1)]; f.cornerNote='CORNER: STAY DISCIPLINED'; }

        sp.target.position.set(f.x, f.y + 1, f.z);
        cornerSpots[1 - S.walkIdx].intensity *= Math.exp(-1.2*dt);
        const arrived = walkStep(f, CORNER[f.side].x, CORNER[f.side].z, dt, 2.6);
        if ((arrived && S.t > 2.6) || S.t > 9) {

function refStep(dt) {

  const slip = f.act === 'dodge' ? Math.sin(clamp(f.actT/0.4, 0, 1)*Math.PI)*(f.slipDir || 1) : 0;
  const strikeK = f.act === 'strike' ? clamp(f.actT/f.strikeDur, 0, 1) : 0;
  const strikeDrive = f.act === 'strike' ? Math.sin(strikeK*Math.PI) : 0;
  const stance = f.stanceW + (fight ? 0.08 : 0);
  const lead = f.side === 0 ? -1 : 1;

  k.detail.position.y = -crouch - recoil*0.08;
  k.chest.rotation.x = crouch*0.9 + recoil*0.28 + (f.bodyShot > 0 ? 0.18*f.bodyShot : 0);
  k.chest.rotation.z = -slip*0.18 + twistWant*0.14;
  k.chest.position.z = strikeDrive*0.04 - recoil*0.04;
  k.trunks.rotation.z = -slip*0.1 + twistWant*0.08;
  k.belt.rotation.z = k.trunks.rotation.z;

  const lift = Math.min(sp/5, 1);
  k.lFoot.position.set(-stance, 0.08, 0.16 + lead*0.1 + step*0.05*lift);
  k.rFoot.position.set( stance, 0.08, -0.16 - lead*0.1 - step*0.05*lift);
  k.lFoot.rotation.y = -0.18 + twistWant*0.08 + alt*0.08*lift;
  k.rFoot.rotation.y =  0.18 + twistWant*0.08 - alt*0.08*lift;
  k.lFoot.scale.set(1 + Math.max(0, step)*0.12*lift, 1, 1 + pocket*0.08);
  k.rFoot.scale.set(1 + Math.max(0, -step)*0.12*lift, 1, 1 + pocket*0.08);

  k.lShoulder.position.y = SH_Y + 0.02 - crouch + strikeDrive*(f.strikeArm === 'L' ? 0.04 : -0.01);
  k.rShoulder.position.y = SH_Y + 0.02 - crouch + strikeDrive*(f.strikeArm === 'R' ? 0.04 : -0.01);

const trailWorld=new THREE.Vector3();
function updatePunchTrail(f,dt){
  const trail=f.punchTrail,isPunch=f.act==='strike'||f.act==='feint';
  if(isPunch){
    f.rig.group.updateMatrixWorld(true);
    const arm=f.act==='strike'?f.strikeArm:f.feintArm;
    f.arms[arm].glove.getWorldPosition(trailWorld);
    if(!trail.active){for(let i=0;i<trail.count;i++){trail.array[i*3]=trailWorld.x;trail.array[i*3+1]=trailWorld.y;trail.array[i*3+2]=trailWorld.z;}trail.active=true;}
    else for(let i=trail.count-1;i>0;i--){trail.array[i*3]=trail.array[(i-1)*3];trail.array[i*3+1]=trail.array[(i-1)*3+1];trail.array[i*3+2]=trail.array[(i-1)*3+2];}
    trail.array[0]=trailWorld.x;trail.array[1]=trailWorld.y;trail.array[2]=trailWorld.z;
    const k=f.act==='strike'?Math.sin(clamp(f.actT/f.strikeDur,0,1)*Math.PI):.42;
    trail.material.opacity=.18+k*.82;trail.pointMaterial.opacity=.12+k*.72;trail.line.visible=trail.points.visible=true;trail.geometry.attributes.position.needsUpdate=true;
  }else{
    trail.material.opacity*=Math.exp(-14*dt);trail.pointMaterial.opacity=trail.material.opacity*.8;
    if(trail.material.opacity<.02){trail.material.opacity=trail.pointMaterial.opacity=0;trail.line.visible=trail.points.visible=false;trail.active=false;}
  }
}
function updateRigs(dt) {
  for (const f of fighters) {
    const o = opp(f), sp = Math.hypot(f.vx, f.vz);
    const inRing = f.y > RING_Y*0.55;
    const want = (!inRing && sp > 0.7) ? Math.atan2(f.vx, f.vz) : Math.atan2(o.x - f.x, o.z - f.z);
    f.heading = lerpAngle(f.heading, want, dampK(9, dt));
    f.rig.group.position.set(f.x, f.y, f.z);
    const mobileBoost=innerWidth<700?1.24:1;
    f.rig.group.scale.set(f.renderScale[0]*mobileBoost,f.renderScale[1]*mobileBoost,f.renderScale[2]*mobileBoost);
    f.walkPh += dt*(2 + sp*2.6);
    if (f.act === 'strike') {
      const k = clamp(f.actT/f.strikeDur, 0, 1);
      if (f.strikeK === 'HOOK' || f.strikeK === 'BODY') f.rig.poseSkill(0, k); // whip through hooks/body work
      else if (f.strikeK === 'UPPER') f.rig.poseHeader(k);      // dip and rise through it
      else f.rig.poseJockey(simClockTotal*1.15+f.side*1.7,f.circ); // straights stay planted; articulated arms do the punching
    }
    else if (f.act === 'hit') f.rig.poseFall(0.42*clamp(f.actT*3, 0, 1));
    else if (f.act === 'block') f.rig.poseShield(1, f.circ);
    else if (f.act === 'stun') f.rig.poseLimp(simClockTotal + f.side);
    else if (f.act === 'dodge') f.rig.poseDive(f.circ, Math.sin(clamp(f.actT/0.4, 0, 1)*Math.PI)*0.85);
    else if (f.act === 'down') f.rig.poseFall(clamp(f.actT*1.7, 0, 1));      // squash flat on the canvas
    else if (f.act === 'getup') f.rig.poseGetUp(clamp(f.actT/0.9, 0, 1));
    else if ((S.state === 'KO_SEQ' || S.state === 'DECISION') && S.winner === f) f.rig.poseCelebrate(S.t);
    else if (S.state === 'ROUND_END') f.rig.poseExhausted(simClockTotal + f.side);
    else if (S.state === 'FIGHT') {
      if (f.stam < 20) f.rig.poseExhausted(simClockTotal + f.side);
      else f.rig.poseJockey(simClockTotal*1.15 + f.side*1.7, f.circ);        // guard up, bouncing
    }
    // ---- arms: ease each joint toward its target ----
    let twistWant = 0;
    for (const armKey of ['L', 'R']) {
      const { T, twist, k } = armTargetsFor(f, armKey, dt);
      twistWant += twist;
      const a = f.arms[armKey], c = a.cur, ke = dampK(k, dt);
      c.sx += (T.sx - c.sx)*ke; c.sy += (T.sy - c.sy)*ke;
      c.sz += (T.sz - c.sz)*ke; c.ex += (T.ex - c.ex)*ke;
      a.sh.rotation.set(c.sx, c.sy, c.sz);
      a.el.rotation.x = c.ex;
      const isStrikeGlove = f.act === 'strike' && f.strikeArm === armKey;
      const isFeintGlove = f.act === 'feint' && f.feintArm === armKey;
      const punchK = isStrikeGlove ? Math.sin(clamp(f.actT/f.strikeDur, 0, 1)*Math.PI) : isFeintGlove ? Math.sin(clamp(f.actT/0.28, 0, 1)*Math.PI)*0.45 : 0;
      a.glove.scale.set(1 + punchK*0.16, 1 + punchK*0.06, 1 + punchK*0.28);
    }
    f.twistCur += (twistWant - f.twistCur)*dampK(20, dt);
    f.rig.group.rotation.y = f.heading + f.twistCur;
    updateBoxerDetails(f, dt, sp, twistWant);
    f.armJolt *= Math.exp(-5*dt);
    f.headSnap *= Math.exp(-6*dt);
    // ---- head + shoulders follow the body on knockdown topple ----
    const downK = f.act === 'down' ? clamp(f.actT*1.7, 0, 1)
                : f.act === 'getup' ? 1 - clamp(f.actT/0.9, 0, 1) : 0;
    const hp = f.rig.headPivot;
    if (downK > 0.002) {
      const a = 1.35*downK, lift = -0.6*downK, ca = Math.cos(a), sa = Math.sin(a);
      hp.position.set(0, 1.05 + lift + 0.93*ca, 0.93*sa);
      hp.rotation.x = a*0.85;
      for (const armKey of ['L', 'R']) {
        const sh = f.arms[armKey].sh;
        sh.position.y = 1.05 + lift + (0.47*ca - SH_Z*sa);
        sh.position.z = 0.47*sa + SH_Z*ca;
      }
    } else {
      hp.position.set(0, 1.98, 0);
      hp.position.y -= f.bodyShot*0.08;
      hp.position.z += f.bodyShot*0.07;
      hp.rotation.x = -f.headSnap*0.55 + f.bodyShot*0.22;            // clean punches snap the head back, body shots fold
      hp.rotation.y = f.hitSide*f.headSnap*0.24;
      hp.rotation.z = f.hitSide*f.headSnap*0.12;
      for (const armKey of ['L', 'R']) { const sh = f.arms[armKey].sh; sh.position.y = SH_Y; sh.position.z = SH_Z; }
    }
    f.rig.update(dt, clamp(sp/6, 0, 1), { accel: clamp(sp/6, 0, 1)*0.35 });
    updatePunchTrail(f,dt);
  }
  for(const c of cornerCrew){
    const base=CORNER[c.side], dir=c.side===0?-1:1;
    c.rig.group.visible=S.state==='ROUND_END'||S.state==='WALKON'||S.state==='KO_SEQ'||S.state==='DECISION';
    c.rig.group.position.set(base.x+dir*(.82+c.i*.55),RING_Y,base.z+(c.i?-.62:.62));
    c.rig.group.rotation.y=Math.atan2(fighters[c.side].x-c.rig.group.position.x,fighters[c.side].z-c.rig.group.position.z);
    if(S.state==='ROUND_END') c.rig.poseArgue(simClockTotal+c.phase); else c.rig.poseJockey(simClockTotal*.55+c.phase,dir);
    c.rig.update(dt,0);
  }
}

// ============ CAMERA (orbiting ringside broadcast) ============
const camPos = new THREE.Vector3(0, 5, 13), camLook = new THREE.Vector3(0, RING_Y + 1, 0);
const tmpP = new THREE.Vector3(), tmpL = new THREE.Vector3();
let orbA = 0.8,broadcastA=Math.PI/2;
function cameraStep(dt) {
  orbA += dt*(0.085 + punchHeat*0.05);
  const [A, B] = fighters;
  const mx = (A.x + B.x)/2, mz = (A.z + B.z)/2;
  if (S.state === 'WALKON' && S.walkIdx < 2) {           // hero shot tracking the walker
    const f = fighters[S.walkIdx], s = f.side === 0 ? 1 : -1;
    if(innerWidth<700) tmpP.set(f.x + s*8.4, 4.8, f.z + 11.2);
    else tmpP.set(f.x + s*5.2, 2.3, f.z + 5.8);
    tmpL.set(f.x, f.y + 1.4, f.z);
  } else if (S.state === 'KNOCKDOWN' || (S.state === 'KO_SEQ' && S.t < 3.4)) { // low, close, slow orbit
    const v = S.downF || (S.winner ? opp(S.winner) : A);
    if(innerWidth<700){
      // Keep the whole ring, standing fighter and referee in the story.  The old
      // four-metre orbit turned a knockdown into a full-screen torso on phones.
      const a=orbA*.34, focusX=lerp(mx,v.x,.22), focusZ=lerp(mz,v.z,.22);
      tmpP.set(focusX+Math.cos(a)*22.6,RING_Y+9.4,focusZ+Math.sin(a)*22.6);
      tmpL.set(focusX,RING_Y+.9,focusZ);
    }else{
      const a = orbA*0.5;
      tmpP.set(v.x + Math.cos(a)*4.4, RING_Y + 1.6, v.z + Math.sin(a)*4.4);
      tmpL.set(v.x, RING_Y + 0.7, v.z);
    }
  } else if (S.state === 'KO_SEQ' || S.state === 'DECISION') {
    const portrait=innerWidth<700, rad=portrait?22.6:9.5, h=portrait?9.4:4.2;
    tmpP.set(Math.cos(orbA*0.6)*rad, RING_Y+h, Math.sin(orbA*0.6)*rad);
    tmpL.set(0, RING_Y + 1, 0);
  } else {                                               // locked ringside broadcast, punch-in when leather flies
    const portrait=innerWidth<700;
    // Desktop retains its punch-in.  Portrait stays wide through impact so a
    // glove landing never crops the opponent, referee or ring geometry.
    const rad = portrait?23.2:11.2-punchHeat*1.9;
    const h = portrait?9.15:5.05-punchHeat*.7;
    const lineA=Math.atan2(B.z-A.z,B.x-A.x);let sideA=lineA+Math.PI/2;
    if(Math.cos(sideA-broadcastA)<0)sideA+=Math.PI;
    broadcastA=lerpAngle(broadcastA,sideA,dampK(4.2,dt));
    if(portrait){
      // Anchor the phone broadcast to the cage instead of following the pocket.
      // The exchange can drift without walking an octagon edge off-screen.
      tmpP.set(Math.cos(broadcastA)*rad,h,Math.sin(broadcastA)*rad);
      tmpL.set(mx*.18,RING_Y+1.08,mz*.18);
    }else{
      tmpP.set(mx*.28+Math.cos(broadcastA)*rad,h,mz*.28+Math.sin(broadcastA)*rad);
      tmpL.set(mx,RING_Y+1.08,mz);
    }
  }
  if (camCut) { camPos.copy(tmpP); camLook.copy(tmpL); camCut = false; }   // hard cut
  else { camPos.lerp(tmpP, dampK(3, dt)); camLook.lerp(tmpL, dampK(5, dt)); }
  camera.position.copy(camPos);
  if (shake > 0) {
    camera.position.x += (Math.random() - 0.5)*shake*0.16;
    camera.position.y += (Math.random() - 0.5)*shake*0.16;
  }
  camera.lookAt(camLook);
  const cleanView=S.state==='FIGHT'||S.state==='KNOCKDOWN';
  const cdx=Math.cos(broadcastA),cdz=Math.sin(broadcastA);
  for(const p of ringPosts){
    const far=(p.position.x-mx)*cdx+(p.position.z-mz)*cdz<.35;
    p.post.visible=p.cap.visible=!cleanView||far;
  }
}

function updateFX(dt) {
  impactT = Math.max(0, impactT - dt);
  impactFlash.material.opacity = clamp(impactT*7, 0, 1);
  const isc = 1.2 + (0.18 - impactT)*6;
  impactFlash.scale.set(isc, isc, 1);
  for (const p of sparks) {
    if (p.life <= 0) { p.s.material.opacity = 0; continue; }
    p.life -= dt; p.vy -= 7.5*dt;
    p.x += p.vx*dt; p.y += p.vy*dt; p.z += p.vz*dt;
    p.s.position.set(p.x, Math.max(RING_Y + 0.05, p.y), p.z);
    p.s.material.opacity = clamp(p.life*2.4, 0, 1);
    const sc = 0.25 + p.life*0.5; p.s.scale.set(sc, sc, 1);
  }
  // paparazzi: constant sparse twinkle, storm on big moments
  flashBurst = Math.max(0, flashBurst - dt*0.55);
  for (const f of flashes) {
    f.t -= dt;
    if (f.t <= 0 && Math.random() < (flashBurst > 0 ? 0.05 : 0.0035)) f.t = 0.1 + Math.random()*0.12;
    f.s.material.opacity = f.t > 0 ? clamp(f.t*9, 0, 1) : 0;
  }
  for (const m of standMats) m.color.setHex(flashBurst > 0 ? 0xaab6ce : 0x8e9ab3);
  const cleanBroadcast=S.state==='FIGHT'||S.state==='KNOCKDOWN';
  for (let i = 0; i < ropeMats.length; i++)
    ropeMats[i].opacity = clamp((cleanBroadcast?.11:.48) + 0.07*Math.sin(simClockTotal*2.1 + i*1.7) + punchHeat*0.08, .06, .72);
  fightCrowd.position.y=Math.sin(simClockTotal*2.1)*.012+crowdLevel*.08*Math.abs(Math.sin(simClockTotal*7));
  arenaTruss.material.emissiveIntensity=.34+crowdLevel*1.35+flashBurst*.16;
  punchHeat = Math.max(0, punchHeat - dt*1.1);
  shake = Math.max(0, shake - dt*1.8);
  thudCd -= dt;
  if (AC && crowdGain) {
    crowdLevel += (0.05 + 0.01*Math.sin(simClockTotal*0.6) - crowdLevel)*dampK(0.4, dt);
    crowdGain.gain.value += (crowdLevel - crowdGain.gain.value)*dampK(3, dt);

}

    fightTuneMeta.mode='forced-live';fightTuneMeta.offsetSeconds=0;fightTuneMeta.targetOffsetSeconds=0;
    return resetLiveFight('test');
  },
  exchange(side=0,kind='CROSS',target='head'){
    const f=fighters[clamp(side|0,0,1)],o=opp(f);f.x=f.side?1.02:-1.02;o.x=f.side?-1.02:1.02;f.z=o.z=0;f.act='move';o.act='stun';o.actT=0;f.stam=100;o.invulnT=0;o.openT=2;
    startStrike(f,STRIKES[kind]?kind:'CROSS');f.targetZone=target==='body'?'body':f.targetZone;cut();return fightSnapshot();
  },
  forceDecision(){
    S.round=3;S.clock=0;S.roundDmg=[[15,11],[10,17],[18,13]];S.kdRound=[[0,0],[0,0],[1,0]];
    S.roundStats=[[{...roundStat(),landed:12,head:8,body:4,damage:15},{...roundStat(),landed:9,head:7,body:2,damage:11}],
      [{...roundStat(),landed:7,head:4,body:3,damage:10},{...roundStat(),landed:13,head:10,body:3,damage:17}],
      [{...roundStat(),landed:14,head:10,body:4,counters:2,damage:18},{...roundStat(),landed:10,head:8,body:2,damage:13}]];
    S.cardShown=false;setState('DECISION');return fightSnapshot();
  },
  forceStoppage(side=0,method='KO'){
    const winner=fighters[clamp(side|0,0,1)],loser=opp(winner);elCard.classList.remove('show');S.cardShown=false;S.cards=null;
    S.kdRound[S.round-1]=[0,0];S.kdRound[S.round-1][winner.side]=method==='TKO'?3:1;
    loser.hp=0;S.downF=loser;S.threeKD=method==='TKO';winFight(winner,method==='TKO'?'TKO':'KO');return fightSnapshot();
  },
  fresh(){setupCard();fightTuneMeta.mode='forced-fresh';fightTuneMeta.targetOffsetSeconds=0;fightTuneMeta.offsetSeconds=0;fightTuneMeta.entryState='WALKON';fightTuneMeta.round=1;fightTuneMeta.clock=ROUND_LEN;return fightSnapshot();}
};
function tick(dt, skipRender = false) {
  simClockTotal += dt;
  const simDt = S.slowmo > 0 ? dt*0.24 : dt;   // slow-mo on knockdowns / the final blow
  S.slowmo = Math.max(0, S.slowmo - dt);
  stateStep(simDt);
  for (const f of fighters) moveFighter(f, simDt);
  refStep(simDt);
  if (skipRender) {
    if (flashTimer > 0) { flashTimer -= dt; if (flashTimer <= 0) elFlash.classList.remove('show'); }
    return; // hidden-tab catch-up: only the last step touches visuals/DOM
  }
  updateRigs(simDt);
  updateFX(dt);
  cameraStep(dt);
  tickerStep(dt);
  hudStep();
  composer.render();
}
// ============ TICK DRIVER (hidden-tab resilience, same pattern as index.html) ============
// rAF stops entirely in hidden tabs, so a rAF-only loop would freeze the league.
// When hidden we drive tick() from setInterval instead: browsers throttle hidden
// timers to ~1Hz, so each fire replays the elapsed real time as fixed 0.05s sim
// steps (capped at 1s of catch-up per fire), rendering only the last one.
// Exactly ONE driver runs at a time.
let rafId = 0, hiddenTimer = 0, prevT = performance.now();
function rafLoop(now) {
  rafId = requestAnimationFrame(rafLoop);
  const dt = Math.min(0.05, (now - prevT)/1000);
  prevT = now;
  if (dt <= 0) return;
  tick(dt);
}
function startDriver() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
  if (hiddenTimer) { clearInterval(hiddenTimer); hiddenTimer = 0; }
  if (document.hidden) {
    let lastFire = performance.now();
    hiddenTimer = setInterval(() => {
      const now = performance.now();
      const steps = Math.min(Math.floor((now - lastFire)/50), 20);
      if (steps <= 0) return;
      lastFire = now;
      prevT = now; // so a foreground return does not inherit a huge delta
      for (let i = 0; i < steps; i++) tick(0.05, i < steps - 1);
    }, 50);
  } else { prevT = performance.now(); rafLoop(prevT); }
}
document.addEventListener('visibilitychange', startDriver);
startDriver();

function resizeScene() {
  camera.fov = innerWidth < 700 ? 64 : 42;
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
}
addEventListener('resize',resizeScene);
resizeScene();
