#playPanel.hidden{opacity:0;pointer-events:none;transform:translate(-50%,14px)}#playHead{display:flex;justify-content:space-between;align-items:center;margin:0 3px 9px}#playHead strong{font:900 9px Orbitron;letter-spacing:2px;color:var(--mint)}#playHead span{font:800 10px Orbitron;color:#9bb2ac;letter-spacing:1px}

#snap{width:100%;margin-top:8px;border:0;border-radius:8px;padding:9px;background:var(--mint);color:#02110d;font:900 10px Orbitron;letter-spacing:2px;cursor:pointer}#snap:hover{filter:brightness(1.12)}

 #playPanel{bottom:calc(10px + env(safe-area-inset-bottom));width:calc(100vw - 16px);padding:8px}#playHead{margin-bottom:6px}#playHead span{font-size:8px}#plays{gap:5px}.play{padding:8px;min-height:70px}.play b{font-size:9px}.play span{font-size:9px}.play em{font-size:7px}.play kbd{font-size:7px}#snap{margin-top:6px;padding:8px}
 #broadcast{bottom:calc(12px + env(safe-area-inset-bottom));left:10px;width:calc(100vw - 20px);padding:9px 11px}#broadcast strong{font-size:14px}#broadcast span{font-size:10px}
 body #cgh-toggle{top:78px;right:8px}
}

<script>
(function(){
'use strict';
var canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),dpr=1,W=0,H=0;
var $=function(id){return document.getElementById(id);};
var clamp=function(v,a,b){return Math.max(a,Math.min(b,v));};
var lerp=function(a,b,t){return a+(b-a)*t;};
var ordinal=function(n){return n===1?'1ST':n===2?'2ND':n===3?'3RD':n+'TH';};
var fixture=Number(new URLSearchParams(location.search).get('fixture')||localStorage.getItem('cl_football_fx')||0)%4;
var sport=window.CYBERLIGA_CONTENT.getSport('american-football');
var home=sport.teams[(fixture*2)%8],away=sport.teams[(fixture*2+1)%8],teams=[home,away];
localStorage.setItem('cl_football_fx',String((fixture+1)%4));
var seed=2166136261>>>0;String(home.id+'|'+away.id+'|gridiron-v2').split('').forEach(function(c){seed^=c.charCodeAt(0);seed=Math.imul(seed,16777619);});
function random(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
function color(team,key){return team.colors[key];}
document.documentElement.style.setProperty('--home',color(home,'primary'));
document.querySelector('.home').style.setProperty('--team',color(home,'primary'));document.querySelector('.away').style.setProperty('--team',color(away,'primary'));
$('homeCity').textContent=home.city.toUpperCase();$('homeName').textContent=home.name.replace(home.city.toUpperCase()+' ','');$('awayCity').textContent=away.city.toUpperCase();$('awayName').textContent=away.name.replace(away.city.toUpperCase()+' ','');

var OFF_ROLES=['QB','RB','X','TE','Z','SLOT','LT','LG','C','RG','RT'];
var DEF_ROLES=['WILL','FS','LDE','DT','NT','RDE','MIKE','SAM','LCB','RCB','SS'];
var offIdx=[0,1,2,3,6,7,8,9,10,11,12],defIdx=[4,5,13,14,15,16,17,18,19,20,21];
var PLAYS={
 'INSIDE ZONE':{kind:'run',formation:'11 PERSONNEL · GUN',desc:'Double teams inside. Back presses A-gap, then cuts.',risk:'SAFE · CLOCK CONTROL',carrier:'RB',base:4,spread:8},
 'OUTSIDE ZONE':{kind:'run',formation:'11 PERSONNEL · SINGLEBACK',desc:'Stretch the edge. Read the first defender outside.',risk:'EDGE · CUTBACK',carrier:'RB',base:5,spread:11},
 'POWER':{kind:'run',formation:'12 PERSONNEL · I',desc:'Down blocks with the guard pulling through the hole.',risk:'PHYSICAL · SHORT YARDAGE',carrier:'RB',base:4,spread:7},
 'QB SNEAK':{kind:'run',formation:'HEAVY · UNDER CENTER',desc:'Center and guards surge for one necessary yard.',risk:'VERY SAFE · 1–2 YARDS',carrier:'QB',base:1.3,spread:1.8},
 'QUICK SLANTS':{kind:'pass',formation:'11 PERSONNEL · GUN',desc:'Three-step drop. Hit the first receiver inside leverage.',risk:'FAST · MAN BEATER',target:'X',base:7,spread:8,release:1.05},
 'MESH':{kind:'pass',formation:'11 PERSONNEL · GUN',desc:'Crossers rub man coverage. Back settles underneath.',risk:'CHAIN MOVER',target:'SLOT',base:8,spread:10,release:1.45},
 'PLAY ACTION SHOT':{kind:'pass',formation:'12 PERSONNEL · SINGLEBACK',desc:'Sell the run, protect deep, attack over the safeties.',risk:'EXPLOSIVE · HIGH RISK',target:'Z',base:18,spread:20,release:2.2},
 'RB SCREEN':{kind:'pass',formation:'11 PERSONNEL · GUN',desc:'Invite pressure, release linemen, throw behind the rush.',risk:'BLITZ ANSWER',target:'RB',base:9,spread:13,release:1.65},
 'FIELD GOAL':{kind:'fieldGoal',formation:'FIELD GOAL UNIT',desc:'Three points if the kick has enough distance.',risk:'SPECIAL TEAMS'},
 'PUNT':{kind:'punt',formation:'PUNT UNIT',desc:'Flip the field and make the opponent drive.',risk:'SPECIAL TEAMS'}
};
var ROUTES={
 'QUICK SLANTS':{X:[12,-4],Z:[10,4],SLOT:[7,-1],TE:[6,2],RB:[2,7]},
 'MESH':{X:[10,3],Z:[12,-3],SLOT:[9,4],TE:[9,-4],RB:[4,0]},
 'PLAY ACTION SHOT':{X:[19,-6],Z:[28,5],SLOT:[14,0],TE:[11,-2],RB:[-1,0]},
 'RB SCREEN':{X:[13,-7],Z:[15,7],SLOT:[10,2],TE:[7,-1],RB:[7,-5]}
};
var AUTO_CADENCE=2.15,AUTO_NEXT_MATCH=6;
var state={phase:'preplay',quarter:1,clock:90,score:[0,0],possession:0,down:1,toGo:10,ball:25,play:'',options:[],selected:0,t:0,playData:null,drivePlays:0,driveYards:0,headline:'Opening drive',detail:'The offense is reading the defense and calling its own play.',lastEvent:'OPENING KICKOFF',gameOver:false,events:[]};
var players=[],audioOn=false;
function athlete(team,index){return team.athletes[index]||team.athletes[0];}
function setupPlayers(){
 players=[];
 OFF_ROLES.forEach(function(role,i){var a=athlete(teams[state.possession],offIdx[i]);players.push({side:'off',role:role,name:a.name,number:a.number,x:0,z:0,sx:0,sz:0,tx:0,tz:0});});
 DEF_ROLES.forEach(function(role,i){var a=athlete(teams[1-state.possession],defIdx[i]);players.push({side:'def',role:role,name:a.name,number:a.number,x:0,z:0,sx:0,sz:0,tx:0,tz:0});});
 placeFormation();
}
function byRole(role){return players.find(function(p){return p.side==='off'&&p.role===role;});}
function placeFormation(){
 var b=state.ball,off={
 QB:[-4,0],RB:[-8,1.5],X:[0,-20],Z:[0,20],SLOT:[-1,-12],TE:[-1,9],LT:[0,-5],LG:[0,-2.5],C:[0,0],RG:[0,2.5],RT:[0,5]
 },def={LDE:[1,-6],DT:[1,-2],NT:[1,1.5],RDE:[1,6],WILL:[5,-7],MIKE:[5,0],SAM:[5,7],LCB:[4,-19],RCB:[4,19],SS:[8,7],FS:[13,-4]};
 players.forEach(function(p){var pos=(p.side==='off'?off:def)[p.role];p.x=b+pos[0];p.z=pos[1];p.sx=p.x;p.sz=p.z;p.tx=p.x;p.tz=p.z;});
}
function distanceGoal(){return 100-state.ball;}
function fieldLabel(){return state.ball===50?'50':state.ball<50?'OWN '+Math.round(state.ball):'OPP '+Math.round(100-state.ball);}
function chooseOptions(){
 if(state.down===4){
   if(distanceGoal()<=38)return ['FIELD GOAL','POWER','QUICK SLANTS'];
   if(state.toGo<=2)return ['POWER','QB SNEAK','PUNT'];
   return ['PUNT','MESH','PLAY ACTION SHOT'];
 }
 if(state.toGo<=2)return ['POWER','QUICK SLANTS','PLAY ACTION SHOT'];
 if(state.toGo>=12)return ['MESH','RB SCREEN','PLAY ACTION SHOT'];
 if(state.ball>=78)return ['INSIDE ZONE','QUICK SLANTS','PLAY ACTION SHOT'];
 return state.down===1?['INSIDE ZONE','QUICK SLANTS','PLAY ACTION SHOT']:['OUTSIDE ZONE','MESH','RB SCREEN'];
}
function chooseAutonomousPlay(){
 var trailing=state.score[state.possession]<state.score[1-state.possession],late=state.quarter>=4&&state.clock<35;
 var passPreferred=trailing&&late,roll=random(),index=roll<.58?0:roll<.88?1:2;
 if(passPreferred){var passIndex=state.options.findIndex(function(name){return PLAYS[name].kind==='pass'&&name!=='RB SCREEN';});if(passIndex>=0)index=passIndex;}
 if(state.down===4)index=0;
 return clamp(index,0,state.options.length-1);
}
function beginPreplay(){
 state.phase='preplay';state.t=0;state.playData=null;state.options=chooseOptions();state.selected=chooseAutonomousPlay();state.play=state.options[state.selected];setupPlayers();renderPlayCards();state.headline=ordinal(state.down)+' & '+Math.ceil(state.toGo)+' at '+fieldLabel();state.detail=teams[state.possession].code+' calls '+state.play+'. The snap is coming automatically.';updateHud();
}
function renderPlayCards(){
 var host=$('plays');host.replaceChildren();state.options.forEach(function(name,i){var p=PLAYS[name],btn=document.createElement('button');btn.type='button';btn.className='play'+(i===state.selected?' selected':'');btn.setAttribute('aria-pressed',String(i===state.selected));btn.innerHTML='<kbd>'+(i+1)+'</kbd><b>'+name+'</b><span>'+p.desc+'</span><em>'+p.risk+'</em>';btn.onclick=function(){selectPlay(i);};host.appendChild(btn);});
 $('playPanel').classList.toggle('hidden',state.phase!=='preplay');
}
function selectPlay(index){if(state.phase!=='preplay')return;state.selected=clamp(index,0,state.options.length-1);state.play=state.options[state.selected];state.t=Math.min(state.t,AUTO_CADENCE-.65);state.detail='Override accepted: '+state.play+'. The offense keeps the cadence.';renderPlayCards();draw();}
function defenseCall(){
 var p=PLAYS[state.play];if(p.kind==='run')return random()<.48?'BEAR FRONT':random()<.5?'COVER 3':'QUARTERS';
 if(p.kind==='pass')return random()<.28?'NICKEL BLITZ':random()<.5?'COVER 2 MAN':'COVER 3';
 return 'RETURN SAFE';
}
function snap(){
 if(state.phase!=='preplay'||state.gameOver)return;
 var spec=PLAYS[state.play],defense=defenseCall(),pd={name:state.play,spec:spec,defense:defense,duration:3.2,outcome:'',gain:0,target:null,release:spec.release||0,catchAt:0};
 if(spec.kind==='run'){
   var front=defense==='BEAR FRONT'?-2:0,raw=spec.base+(random()-.42)*spec.spread+front;pd.gain=Math.round(clamp(raw,-4,28));pd.outcome=random()<.018?'FUMBLE':'RUN';pd.duration=2.7+clamp(pd.gain,0,15)*.035;pd.target=byRole(spec.carrier);
 }else if(spec.kind==='pass'){
   var pressure=defense==='NICKEL BLITZ'?.23:defense==='COVER 2 MAN'?.1:.05,deep=state.play==='PLAY ACTION SHOT',pickChance=deep?.09:.035;
   pd.target=byRole(spec.target);pd.catchAt=pd.release+.65;pd.duration=pd.catchAt+1.25;
   var r=random();
   if(r<pressure){pd.outcome='SACK';pd.gain=-Math.round(3+random()*7);pd.duration=1.8;}
   else if(r<pressure+pickChance){pd.outcome='INTERCEPTION';pd.gain=Math.round(spec.base*.7);pd.duration=pd.catchAt+.5;}
   else if(r<pressure+pickChance+(deep?.38:.24)){pd.outcome='INCOMPLETE';pd.gain=0;pd.duration=pd.catchAt+.45;}
   else{pd.outcome='COMPLETE';pd.gain=Math.round(clamp(spec.base+(random()-.35)*spec.spread,-2,45));}
 }else if(spec.kind==='fieldGoal'){pd.outcome='FIELD GOAL';pd.duration=2.3;pd.good=random()<clamp(.97-(distanceGoal()+17-35)*.018,.28,.97);}
 else{pd.outcome='PUNT';pd.duration=2.4;pd.gain=Math.round(38+random()*14);}
 state.playData=pd;state.phase='live';state.t=0;state.drivePlays++;state.headline=state.play+' vs '+defense;state.detail=spec.formation;state.events.unshift('SNAP // '+state.play+' // '+defense);$('playPanel').classList.add('hidden');updateAssignments();updateHud();
}
function updateAssignments(){
 var pd=state.playData,spec=pd.spec,direction=ROUTES[pd.name]||{};
 players.forEach(function(p){
   p.sx=p.x;p.sz=p.z;
   if(p.side==='off'){
     if(['LT','LG','C','RG','RT'].includes(p.role)){p.tx=p.x+2.4;p.tz=p.z*.9;}
     else if(spec.kind==='run'&&p===pd.target){p.tx=p.x+Math.max(5,pd.gain);p.tz=pd.name==='OUTSIDE ZONE'?16:pd.name==='POWER'?-3:2;}
     else if(spec.kind==='run'){p.tx=p.x+6+(p.role==='X'||p.role==='Z'?5:0);p.tz=p.z;}
     else if(spec.kind==='pass'){
       var route=direction[p.role];if(route){p.tx=state.ball+route[0];p.tz=route[1];}else if(p.role==='QB'){p.tx=p.x-2;p.tz=0;}
   }else{p.tx=p.x+1;p.tz=p.z;}
   }else{
     if(['LDE','DT','NT','RDE'].includes(p.role)){p.tx=state.ball-3;p.tz=p.z*.75;}
     else if(pd.defense==='NICKEL BLITZ'&&(p.role==='WILL'||p.role==='SAM')){p.tx=state.ball-4;p.tz=0;}
     else{p.tx=state.ball+clamp(pd.gain,2,15);p.tz=p.z*.72;}
   }
   p.tx=clamp(p.tx,1,99);
 });
}
function movePlayers(){
 var pd=state.playData;if(!pd)return;var k=clamp(state.t/pd.duration,0,1);
 players.forEach(function(p){
   var local=k;
   if(p.side==='def')local=clamp((k-.08)/.82,0,1);
   p.x=lerp(p.sx,p.tx,local);p.z=lerp(p.sz,p.tz,local);
   if(pd.spec.kind==='pass'&&p===pd.target&&pd.outcome==='COMPLETE'&&state.t>pd.catchAt){var run=clamp((state.t-pd.catchAt)/(pd.duration-pd.catchAt),0,1);p.x=lerp(p.tx,state.ball+pd.gain,run);}
 });
}
function resolvePlay(){
 var pd=state.playData;if(!pd)return;
 if(pd.outcome==='FIELD GOAL'){
   if(pd.good){state.score[state.possession]+=3;event('FIELD GOAL GOOD','Three points from '+(distanceGoal()+17)+' yards.');changePossession('KICKOFF',25);}
   else{event('FIELD GOAL MISSED','The kick drifts wide.');changePossession('MISSED KICK',clamp(100-state.ball,20,80));}
   return;
 }
 if(pd.outcome==='PUNT'){var landing=clamp(state.ball+pd.gain,5,95);event('PUNT '+pd.gain+' YARDS','Field position flips.');changePossession('PUNT',clamp(100-landing,5,95));return;}
 if(pd.outcome==='INTERCEPTION'||pd.outcome==='FUMBLE'){var spot=clamp(state.ball+pd.gain,1,99);event(pd.outcome,'Turnover at the '+Math.round(spot)+'.');changePossession(pd.outcome,clamp(100-spot,1,99));return;}
 var newBall=state.ball+pd.gain;
 if(newBall>=100){state.score[state.possession]+=7;event('TOUCHDOWN '+teams[state.possession].code,pd.name+' goes for '+Math.max(1,Math.round(100-state.ball))+' yards. Extra point good.');state.ball=100;state.phase='dead';state.t=0;state.playData=null;state.pending=function(){changePossession('KICKOFF',25);};return;}
 state.ball=clamp(newBall,1,99);state.driveYards+=pd.gain;
 var label=pd.outcome==='INCOMPLETE'?'INCOMPLETE':pd.outcome==='SACK'?'SACK FOR '+Math.abs(pd.gain):pd.outcome==='COMPLETE'?'COMPLETE FOR '+pd.gain:pd.gain+' YARD RUN';
 if(pd.gain>=state.toGo){state.down=1;state.toGo=Math.min(10,distanceGoal());event('FIRST DOWN',label+'. Move the chains.');}
 else{state.down++;state.toGo=Math.max(1,state.toGo-pd.gain);event(label,pd.gain>=0?'Now '+ordinal(state.down)+' & '+Math.ceil(state.toGo)+'.':'Off schedule. '+ordinal(state.down)+' & '+Math.ceil(state.toGo)+'.');}
 if(state.down>4){event('TURNOVER ON DOWNS','The defense holds.');changePossession('DOWNS',clamp(100-state.ball,1,99));return;}
 state.phase='dead';state.t=0;state.playData=null;state.pending=beginPreplay;
}
function event(head,detail){state.headline=head;state.detail=detail;state.lastEvent=head;state.events.unshift(head+' // '+detail);state.events=state.events.slice(0,8);}
function changePossession(reason,newBall){state.possession=1-state.possession;state.ball=newBall;state.down=1;state.toGo=Math.min(10,distanceGoal());state.drivePlays=0;state.driveYards=0;state.phase='dead';state.t=0;state.playData=null;state.pending=beginPreplay;state.detail=reason+' // '+teams[state.possession].code+' takes over at '+fieldLabel();}
function nextQuarter(){
 if(state.quarter>=4){finishGame();return;}
 state.quarter++;state.clock=90;if(state.quarter===3){state.possession=1;state.ball=25;state.down=1;state.toGo=10;state.drivePlays=0;state.driveYards=0;}event(state.quarter===3?'SECOND HALF':'END OF QUARTER',ordinal(state.quarter)+' quarter begins.');beginPreplay();
}
function finishGame(){state.gameOver=true;state.phase='final';state.t=0;var win=state.score[0]===state.score[1]?'TIE GAME':teams[state.score[0]>state.score[1]?0:1].name+' WIN';$('winner').textContent=win;$('finalScore').textContent=state.score[0]+' – '+state.score[1];$('finalMeta').textContent=home.code+' vs '+away.code+' · next autonomous matchup in '+AUTO_NEXT_MATCH+' seconds';$('final').classList.add('show');updateHud();}
function step(dt){
 if(state.gameOver){state.t+=dt;if(state.t>=AUTO_NEXT_MATCH)location.replace('football.html?fixture='+((fixture+1)%4));return;}
 if(state.phase==='preplay'){
   state.t+=dt;if(state.t>=AUTO_CADENCE)snap();
 }else
 if(state.phase==='live'){
   state.t+=dt;state.clock=Math.max(0,state.clock-dt);movePlayers();if(state.t>=state.playData.duration)resolvePlay();
 }else if(state.phase==='dead'){
   state.t+=dt;if(state.t>=1.45){var pending=state.pending;state.pending=null;if(state.clock<=0)nextQuarter();else if(pending)pending();}
 }
}
function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);draw();}
function fieldRect(){var top=H<650?135:145,bottom=state.phase==='preplay'?(H<650?195:175):72;return{x:0,y:top,w:W,h:Math.max(190,H-top-bottom)};}
function view(){var span=W<720?48:62,min=clamp(state.ball-span*.4,0,100-span);return{min:min,max:min+span};}
function project(x,z){var r=fieldRect(),v=view();return{x:r.x+(x-v.min)/(v.max-v.min)*r.w,y:r.y+(z+26.65)/53.3*r.h};}
function drawField(){
 var r=fieldRect(),v=view(),grad=ctx.createLinearGradient(0,r.y,0,r.y+r.h);grad.addColorStop(0,'#1c5b3c');grad.addColorStop(.5,'#174f35');grad.addColorStop(1,'#103b29');ctx.fillStyle=grad;ctx.fillRect(r.x,r.y,r.w,r.h);
 for(var y=0;y<=100;y+=5){if(y<v.min||y>v.max)continue;var p=project(y,0).x;ctx.strokeStyle=y%10===0?'rgba(255,255,255,.42)':'rgba(255,255,255,.18)';ctx.lineWidth=y%10===0?1.5:1;ctx.beginPath();ctx.moveTo(p,r.y);ctx.lineTo(p,r.y+r.h);ctx.stroke();if(y>0&&y<100&&y%10===0){ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='700 15px Orbitron';ctx.textAlign='center';ctx.fillText(String(y<=50?y:100-y),p,r.y+22);ctx.fillText(String(y<=50?y:100-y),p,r.y+r.h-10);}}
 if(v.min<=0){var ez=project(0,0).x;ctx.fillStyle=color(teams[state.possession],'secondary');ctx.fillRect(0,r.y,ez,r.h);}
 if(v.max>=100){var ez2=project(100,0).x;ctx.fillStyle=color(teams[state.possession],'primary');ctx.fillRect(ez2,r.y,W-ez2,r.h);}
 for(var h=0;h<2;h++){for(var y2=-20;y2<=20;y2+=2){var hp=project(state.ball,y2);ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillRect(hp.x-1,hp.y-1,2,2);}}
 var los=project(state.ball,0).x,first=project(clamp(state.ball+state.toGo,0,100),0).x;ctx.fillStyle='rgba(82,176,255,.8)';ctx.fillRect(los-2,r.y,4,r.h);ctx.fillStyle='rgba(255,214,77,.82)';ctx.fillRect(first-2,r.y,4,r.h);
 ctx.fillStyle='rgba(0,0,0,.24)';ctx.fillRect(r.x,r.y,r.w,26);ctx.fillStyle='#dffaf1';ctx.font='800 10px Orbitron';ctx.textAlign='left';ctx.fillText('LINE OF SCRIMMAGE',Math.max(8,los+7),r.y+17);ctx.fillStyle='#ffe078';ctx.fillText('LINE TO GAIN',Math.max(8,first+7),r.y+17);
}
function drawRoutes(){
 if(state.phase!=='preplay')return;var routes=ROUTES[state.play]||{},spec=PLAYS[state.play];ctx.setLineDash([6,5]);ctx.lineWidth=2;
 players.filter(function(p){return p.side==='off';}).forEach(function(p){var end=routes[p.role];if(!end&&spec.kind==='run'&&p.role===spec.carrier)end=[Math.max(7,state.toGo+2),state.play==='OUTSIDE ZONE'?16:state.play==='POWER'?-3:2];if(!end)return;var a=project(p.x,p.z),b=project(state.ball+end[0],end[1]);ctx.strokeStyle=p.role===spec.target||p.role===spec.carrier?'rgba(255,213,104,.95)':'rgba(255,255,255,.4)';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo(lerp(a.x,b.x,.55),a.y,b.x,b.y);ctx.stroke();ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.arc(b.x,b.y,3,0,Math.PI*2);ctx.fill();});ctx.setLineDash([]);
}
function drawPlayers(){
 var pd=state.playData;
 players.forEach(function(p){var pos=project(p.x,p.z),team=p.side==='off'?teams[state.possession]:teams[1-state.possession],radius=W<620?7:9,lineRole=['LT','LG','C','RG','RT','LDE','DT','NT','RDE'].includes(p.role);ctx.save();ctx.translate(pos.x,pos.y);ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(2,5,radius+2,radius*.65,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=color(team,'primary');ctx.strokeStyle=p.side==='off'?'#f5fff9':color(team,'accent');ctx.lineWidth=p===pd?.target?4:2;ctx.beginPath();ctx.arc(0,0,radius,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.font='900 '+(W<620?6:7)+'px Orbitron';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(p.number),0,0);if(!lineRole){ctx.fillStyle='rgba(2,7,8,.84)';ctx.fillRect(-15,radius+3,30,11);ctx.fillStyle='#e9fff8';ctx.font='800 7px Orbitron';ctx.fillText(p.role,0,radius+8.5);}ctx.restore();});
}
function drawBall(){
 var pd=state.playData;if(!pd||state.phase!=='live')return;var x=state.ball,z=0,yArc=0;
 if(pd.spec.kind==='run'){var c=pd.target;x=c.x;z=c.z;}
 else if(pd.spec.kind==='pass'){
   var qb=byRole('QB');
   if(state.t<pd.release){x=qb.x;z=qb.z;}
   else{var k=clamp((state.t-pd.release)/Math.max(.1,pd.catchAt-pd.release),0,1);x=lerp(qb.x,pd.target.x,k);z=lerp(qb.z,pd.target.z,k);yArc=Math.sin(k*Math.PI)*18;}
 }else{x=state.ball+clamp(state.t/pd.duration,0,1)*(pd.spec.kind==='punt'?pd.gain:distanceGoal());z=0;yArc=Math.sin(clamp(state.t/pd.duration,0,1)*Math.PI)*35;}
 var p=project(x,z);ctx.save();ctx.translate(p.x,p.y-yArc);ctx.rotate(.35+state.t*8);ctx.fillStyle='#8d4b27';ctx.beginPath();ctx.ellipse(0,0,7,4,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-2,-2);ctx.lineTo(2,2);ctx.stroke();ctx.restore();
}
function draw(){
 if(!W)return;ctx.clearRect(0,0,W,H);ctx.fillStyle='#06100d';ctx.fillRect(0,0,W,H);var r=fieldRect();ctx.fillStyle='#0b1715';ctx.fillRect(0,r.y-18,W,r.h+36);drawField();drawRoutes();drawPlayers();drawBall();
}
function updateHud(){
 $('homeScore').textContent=state.score[0];$('awayScore').textContent=state.score[1];var sec=Math.ceil(state.clock);$('clock').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');$('quarter').textContent=ordinal(state.quarter)+' QUARTER';$('down').textContent=ordinal(state.down)+' & '+Math.ceil(state.toGo);$('fieldPos').textContent=fieldLabel();$('possession').textContent=teams[state.possession].code+' BALL';$('phase').textContent=state.phase==='preplay'?'PRE-SNAP':state.phase==='live'?'PLAY LIVE':state.phase==='dead'?'WHISTLE':'FINAL';$('headline').textContent=state.headline;$('detail').textContent=state.detail;
}
function tick(dt,skipRender){step(dt);if(!skipRender){draw();updateHud();}}
window.render_game_to_text=function(){return JSON.stringify({note:'Offense always moves left-to-right. Field x is yards from its own goal line (0) to opponent goal line (100); z is lateral yards from -26.65 to 26.65.',phase:state.phase,quarter:state.quarter,clock:+state.clock.toFixed(1),score:{home:state.score[0],away:state.score[1]},teams:teams.map(function(t){return t.name;}),possession:teams[state.possession].code,down:state.down,toGo:+state.toGo.toFixed(1),ball:+state.ball.toFixed(1),fieldPosition:fieldLabel(),selectedPlay:state.play,playOptions:state.options.slice(),play:state.playData?{call:state.playData.name,defense:state.playData.defense,outcome:state.playData.outcome,elapsed:+state.t.toFixed(2),duration:state.playData.duration,target:state.playData.target?state.playData.target.role:null}:null,drive:{plays:state.drivePlays,yards:state.driveYards},players:players.map(function(p){return{side:p.side,role:p.role,number:p.number,x:+p.x.toFixed(1),z:+p.z.toFixed(1)};}),lastEvent:state.lastEvent,recentEvents:state.events.slice(0,4),gameOver:state.gameOver});};
window.advanceTime=function(ms){var count=Math.max(1,Math.round(ms/(1000/60)));for(var i=0;i<count;i++)step(1/60);draw();updateHud();return window.render_game_to_text();};
window._footballTest={reset:function(){location.reload();},select:function(index){selectPlay(Number(index));return state.play;},snap:function(){snap();return JSON.parse(window.render_game_to_text());},forceSituation:function(o){o=o||{};state.down=clamp(o.down||1,1,4);state.toGo=clamp(o.toGo||10,1,30);state.ball=clamp(o.ball||25,1,99);state.quarter=clamp(o.quarter||1,1,4);state.clock=clamp(o.clock||90,0,90);beginPreplay();return JSON.parse(window.render_game_to_text());},forceOutcome:function(outcome,gain,good){if(state.phase!=='live')return false;state.playData.outcome=String(outcome||state.playData.outcome).toUpperCase();if(Number.isFinite(Number(gain)))state.playData.gain=Number(gain);if(typeof good==='boolean')state.playData.good=good;return true;},finishPlay:function(){if(state.phase==='live')window.advanceTime((state.playData.duration+0.1)*1000);return JSON.parse(window.render_game_to_text());},advanceCadence:function(){window.advanceTime((AUTO_CADENCE+.1)*1000);return JSON.parse(window.render_game_to_text());},forceFinal:function(a,b){state.score=[Number(a)||0,Number(b)||0];finishGame();return true;}};
$('plays').addEventListener('keydown',function(e){if(e.key==='ArrowRight')selectPlay((state.selected+1)%3);if(e.key==='ArrowLeft')selectPlay((state.selected+2)%3);});
$('snap').onclick=snap;$('restart').onclick=function(){location.href='football.html?fixture='+((fixture+1)%4);};$('sound').onclick=function(){audioOn=!audioOn;$('sound').textContent=audioOn?'SOUND ON':'SOUND OFF';};
addEventListener('keydown',function(e){if(state.phase==='preplay'&&['1','2','3'].includes(e.key)){selectPlay(Number(e.key)-1);e.preventDefault();}if(e.code==='Space'){snap();e.preventDefault();}if((e.key==='f'||e.key==='F')){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();}});
var rafId=0,hiddenTimer=0,lastTick=performance.now();
function rafLoop(now){rafId=requestAnimationFrame(rafLoop);var dt=Math.min(.05,(now-lastTick)/1000);lastTick=now;if(dt>0)tick(dt,false);}
function startDriver(){
 if(rafId){cancelAnimationFrame(rafId);rafId=0;}if(hiddenTimer){clearInterval(hiddenTimer);hiddenTimer=0;}
 if(document.hidden){var lastFire=performance.now();hiddenTimer=setInterval(function(){var now=performance.now(),steps=Math.min(Math.floor((now-lastFire)/50),20);if(steps<=0)return;lastFire=now;lastTick=now;for(var i=0;i<steps;i++)tick(.05,i<steps-1);},50);}
 else{lastTick=performance.now();rafLoop(lastTick);}
}
document.addEventListener('visibilitychange',startDriver);
addEventListener('resize',resize);beginPreplay();resize();startDriver();
})();
</script>
