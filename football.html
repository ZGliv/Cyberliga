window._footballTest={
  forcePlay(play){const allowed=['POWER RUSH','CROSSING PASS','DEEP SHOT','FADE PASS','FIELD GOAL','PUNT'];if(!allowed.includes(play))return false;S.gameOver=false;el('final').classList.remove('show');S.mode='PREPLAY';S.t=0;S.play=play;S.playStart=S.los;S.gain=0;S.runLane=5;S.coverage='TWO HIGH';S.phase='SET';placePreplay();paintPlayRead();el('playcall').textContent=`TEST LOOK // ${play}`;el('playcall').classList.add('show');return true;},
  forceTouchdown(){S.gameOver=false;S.mode='LIVE';S.play='POWER RUSH';S.t=1;S.playStart=S.los;placePreplay();S.carrier=offense()[1];S.carrier.x=dir()*44.8;S.carrier.z=3;return true;},
  forceTackle(outcome='DOWN'){S.gameOver=false;S.mode='LIVE';S.play='POWER RUSH';S.t=1;S.playStart=S.los;placePreplay();const carrier=offense()[1],defender=defense()[0];S.carrier=carrier;carrier.x=S.los+dir()*6;carrier.z=1;defender.x=carrier.x-dir()*.72;defender.z=carrier.z+.35;beginTackle(defender,.8);S.tackle.outcome=String(outcome).toUpperCase()==='BROKEN'?'BROKEN':'DOWN';return true;},
  forceTurnover(kind='INTERCEPTION'){S.gameOver=false;S.mode='LIVE';S.t=1;S.carrier=defense()[0];S.carrier.x=S.los+dir()*8;S.carrier.z=2;turnoverAt(S.carrier.x,String(kind).toUpperCase());return true;},
  forceFieldGoal(good=true){S.gameOver=false;S.play='FIELD GOAL';S.mode='KICK';S.t=2.04;S.kickFired=true;S.testKickResult=!!good;return true;},
  forceFinal(home=21,away=17){S.score=[Number(home)||0,Number(away)||0];finishGame();return true;}
};

function keySet(e,on){
  if(['ArrowLeft','ArrowRight','ArrowUp',' ','j','J','a','A','p','P','b','B','f','F','m','M'].includes(e.key))e.preventDefault();
  if(on)ensureAudio();
  if(e.key==='ArrowLeft')input.left=on; if(e.key==='ArrowRight')input.right=on; if(e.key==='ArrowUp'||e.key===' ')input.boost=on;
  if(on&&(e.key==='j'||e.key==='J'||e.key==='a'||e.key==='A')){input.juke=true;attemptJuke();}
  if(on&&(e.key==='p'||e.key==='P'||e.key==='b'||e.key==='B')){input.pass=true;throwPass(true);}
  if(on&&(e.key==='f'||e.key==='F')){ if(!document.fullscreenElement)document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
  if(on&&(e.key==='m'||e.key==='M'))toggleSound();
  if(on&&e.key==='Escape'&&!document.fullscreenElement)location.href='world.html';
}
addEventListener('keydown',e=>keySet(e,true)); addEventListener('keyup',e=>keySet(e,false));
document.querySelectorAll('[data-hold]').forEach(btn=>{
  const k=btn.dataset.hold; const set=on=>{input[k]=on;btn.classList.toggle('down',on);};
  btn.addEventListener('pointerdown',e=>{e.preventDefault();ensureAudio();set(true);btn.setPointerCapture(e.pointerId);}); btn.addEventListener('pointerup',()=>set(false)); btn.addEventListener('pointercancel',()=>set(false));
});
el('actionBtn').addEventListener('pointerdown',e=>{ e.preventDefault();ensureAudio(); if(S.mode==='LIVE'&&(S.play.includes('PASS')||S.play==='DEEP SHOT')&&S.carrier?.role==='QB')throwPass(true); else {input.juke=true;attemptJuke();} });
function toggleSound(){audio.enabled=!audio.enabled;if(audio.enabled){ensureAudio();if(audio.master)audio.master.gain.setTargetAtTime(.28,audio.ctx.currentTime,.04);}else if(audio.master)audio.master.gain.setTargetAtTime(.0001,audio.ctx.currentTime,.04);el('soundBtn').classList.toggle('on',audio.enabled&&!!audio.ctx);el('soundBtn').textContent=audio.enabled&&audio.ctx?'SOUND ON':'SOUND OFF';}
el('soundBtn').addEventListener('click',e=>{e.preventDefault();if(!audio.ctx){audio.enabled=true;ensureAudio();}else toggleSound();});
el('restart').addEventListener('click',()=>location.reload());
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);tickerX=Math.min(tickerX,innerWidth);setFixtureUI();});

beginPreplay(); pushEvent(`${clubs[0].city} ${clubs[0].name} VS ${clubs[1].city} ${clubs[1].name} // LIVE NOW`);
let prev=performance.now(),raf=0;
function loop(now){raf=requestAnimationFrame(loop);const dt=Math.min(.05,(now-prev)/1000);prev=now;if(now<manualSteppingUntil)return;if(dt>0)update(dt);}
raf=requestAnimationFrame(loop);
</script>
</body>
</html>
