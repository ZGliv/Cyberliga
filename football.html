body #cgh-toggle{right:14px;top:94px;bottom:auto}

<script>
(function(){
'use strict';
var canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),dpr=1,W=0,H=0;
var $=function(id){return document.getElementById(id);};
var clamp=function(v,a,b){return Math.max(a,Math.min(b,v));};
var lerp=function(a,b,t){return a+(b-a)*t;};
var ordinal=function(n){return n===1?'1ST':n===2?'2ND':n===3?'3RD':n+'TH';};
var fixture=Number(new URLSearchParams(location.search).get('fixture')||localStorage.getItem('cl_football_fx')||0)%4;
var sport=window.CYBERLIGA_CONTENT.getSport('american-football');
var home=sport.teams[(fixture*2)%8],away=sport.teams[(fixture*2+1)%8],teams=[home,away];
localStorage.setItem('cl_football_fx',String((fixture+1)%4));
var seed=2166136261>>>0;String(home.id+'|'+away.id+'|gridiron-v2').split('').forEach(function(c){seed^=c.charCodeAt(0);seed=Math.imul(seed,16777619);});
function random(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
function color(team,key){return team.colors[key];}
document.documentElement.style.setProperty('--home',color(home,'primary'));
document.querySelector('.home').style.setProperty('--team',color(home,'primary'));document.querySelector('.away').style.setProperty('--team',color(away,'primary'));
$('homeCity').textContent=home.city.toUpperCase();$('homeName').textContent=home.name.replace(home.city.toUpperCase()+' ','');$('awayCity').textContent=away.city.toUpperCase();$('awayName').textContent=away.name.replace(away.city.toUpperCase()+' ','');

var OFF_ROLES=['QB','RB','X','TE','Z','SLOT','LT','LG','C','RG','RT'];
var DEF_ROLES=['WILL','FS','LDE','DT','NT','RDE','MIKE','SAM','LCB','RCB','SS'];
var offIdx=[0,1,2,3,6,7,8,9,10,11,12],defIdx=[4,5,13,14,15,16,17,18,19,20,21];
var PLAYS={
 'INSIDE ZONE':{kind:'run',formation:'11 PERSONNEL · GUN',desc:'Double teams inside. Back presses A-gap, then cuts.',risk:'SAFE · CLOCK CONTROL',carrier:'RB',base:4,spread:8},
 'OUTSIDE ZONE':{kind:'run',formation:'11 PERSONNEL · SINGLEBACK',desc:'Stretch the edge. Read the first defender outside.',risk:'EDGE · CUTBACK',carrier:'RB',base:5,spread:11},
 'POWER':{kind:'run',formation:'12 PERSONNEL · I',desc:'Down blocks with the guard pulling through the hole.',risk:'PHYSICAL · SHORT YARDAGE',carrier:'RB',base:4,spread:7},
 'QB SNEAK':{kind:'run',formation:'HEAVY · UNDER CENTER',desc:'Center and guards surge for one necessary yard.',risk:'VERY SAFE · 1–2 YARDS',carrier:'QB',base:1.3,spread:1.8},
 'QUICK SLANTS':{kind:'pass',formation:'11 PERSONNEL · GUN',desc:'Three-step drop. Hit the first receiver inside leverage.',risk:'FAST · MAN BEATER',target:'X',base:7,spread:8,release:1.05},
 'MESH':{kind:'pass',formation:'11 PERSONNEL · GUN',desc:'Crossers rub man coverage. Back settles underneath.',risk:'CHAIN MOVER',target:'SLOT',base:8,spread:10,release:1.45},
 'PLAY ACTION SHOT':{kind:'pass',formation:'12 PERSONNEL · SINGLEBACK',desc:'Sell the run, protect deep, attack over the safeties.',risk:'EXPLOSIVE · HIGH RISK',target:'Z',base:18,spread:20,release:2.2},
 'RB SCREEN':{kind:'pass',formation:'11 PERSONNEL · GUN',desc:'Invite pressure, release linemen, throw behind the rush.',risk:'BLITZ ANSWER',target:'RB',base:9,spread:13,release:1.65},
 'FIELD GOAL':{kind:'fieldGoal',formation:'FIELD GOAL UNIT',desc:'Three points if the kick has enough distance.',risk:'SPECIAL TEAMS'},
 'PUNT':{kind:'punt',formation:'PUNT UNIT',desc:'Flip the field and make the opponent drive.',risk:'SPECIAL TEAMS'}
};
var ROUTES={
 'QUICK SLANTS':{X:[12,-4],Z:[10,4],SLOT:[7,-1],TE:[6,2],RB:[2,7]},
 'MESH':{X:[10,3],Z:[12,-3],SLOT:[9,4],TE:[9,-4],RB:[4,0]},
 'PLAY ACTION SHOT':{X:[19,-6],Z:[28,5],SLOT:[14,0],TE:[11,-2],RB:[-1,0]},
 'RB SCREEN':{X:[13,-7],Z:[15,7],SLOT:[10,2],TE:[7,-1],RB:[7,-5]}
};
var AUTO_CADENCE=2.15,AUTO_NEXT_MATCH=6;
var state={phase:'preplay',quarter:1,clock:90,score:[0,0],possession:0,down:1,toGo:10,ball:25,play:'',options:[],selected:0,t:0,playData:null,drivePlays:0,driveYards:0,headline:'Opening drive',detail:'The offense is reading the defense and calling its own play.',lastEvent:'OPENING KICKOFF',gameOver:false,events:[]};
var players=[],audioOn=false;
function athlete(team,index){return team.athletes[index]||team.athletes[0];}
function setupPlayers(){
 players=[];
 OFF_ROLES.forEach(function(role,i){var a=athlete(teams[state.possession],offIdx[i]);players.push({side:'off',role:role,name:a.name,number:a.number,x:0,z:0,sx:0,sz:0,tx:0,tz:0});});
 DEF_ROLES.forEach(function(role,i){var a=athlete(teams[1-state.possession],defIdx[i]);players.push({side:'def',role:role,name:a.name,number:a.number,x:0,z:0,sx:0,sz:0,tx:0,tz:0});});
 placeFormation();
}
function byRole(role){return players.find(function(p){return p.side==='off'&&p.role===role;});}
function placeFormation(){
 var b=state.ball,off={
 QB:[-4.5,0],RB:[-8.5,1.7],X:[0,-20],Z:[0,20],SLOT:[-1.2,-12],TE:[-1.2,10],LT:[0,-6],LG:[0,-3],C:[0,0],RG:[0,3],RT:[0,6]
 },def={LDE:[1.8,-6.5],DT:[1.8,-2.2],NT:[1.8,2.2],RDE:[1.8,6.5],WILL:[5.7,-8],MIKE:[5.7,0],SAM:[5.7,8],LCB:[4.8,-19],RCB:[4.8,19],SS:[9,8],FS:[13.5,-4]};
 players.forEach(function(p){var pos=(p.side==='off'?off:def)[p.role];p.x=b+pos[0];p.z=pos[1];p.sx=p.x;p.sz=p.z;p.tx=p.x;p.tz=p.z;});
}
function distanceGoal(){return 100-state.ball;}
function fieldLabel(){return state.ball===50?'50':state.ball<50?'OWN '+Math.round(state.ball):'OPP '+Math.round(100-state.ball);}
function chooseOptions(){
 if(state.down===4){
   if(distanceGoal()<=38)return ['FIELD GOAL','POWER','QUICK SLANTS'];
   if(state.toGo<=2)return ['POWER','QB SNEAK','PUNT'];
   return ['PUNT','MESH','PLAY ACTION SHOT'];
 }
 if(state.toGo<=2)return ['POWER','QUICK SLANTS','PLAY ACTION SHOT'];
 if(state.toGo>=12)return ['MESH','RB SCREEN','PLAY ACTION SHOT'];
 if(state.ball>=78)return ['INSIDE ZONE','QUICK SLANTS','PLAY ACTION SHOT'];
 return state.down===1?['INSIDE ZONE','QUICK SLANTS','PLAY ACTION SHOT']:['OUTSIDE ZONE','MESH','RB SCREEN'];
}
function chooseAutonomousPlay(){
 var trailing=state.score[state.possession]<state.score[1-state.possession],late=state.quarter>=4&&state.clock<35;
 var passPreferred=trailing&&late,roll=random(),index=roll<.58?0:roll<.88?1:2;
 if(passPreferred){var passIndex=state.options.findIndex(function(name){return PLAYS[name].kind==='pass'&&name!=='RB SCREEN';});if(passIndex>=0)index=passIndex;}
 if(state.down===4)index=0;
 return clamp(index,0,state.options.length-1);
}
function beginPreplay(){
 state.phase='preplay';state.t=0;state.playData=null;state.options=chooseOptions();state.selected=chooseAutonomousPlay();state.play=state.options[state.selected];setupPlayers();renderPlayCards();state.headline=ordinal(state.down)+' & '+Math.ceil(state.toGo)+' at '+fieldLabel();state.detail=teams[state.possession].code+' calls '+state.play+'. The snap is coming automatically.';updateHud();
}
function renderPlayCards(){
 var host=$('plays');host.replaceChildren();state.options.forEach(function(name,i){var p=PLAYS[name],btn=document.createElement('button');btn.type='button';btn.className='play'+(i===state.selected?' selected':'');btn.setAttribute('aria-pressed',String(i===state.selected));btn.innerHTML='<kbd>'+(i+1)+'</kbd><b>'+name+'</b><span>'+p.desc+'</span><em>'+p.risk+'</em>';btn.onclick=function(){selectPlay(i);};host.appendChild(btn);});
 $('playPanel').classList.toggle('hidden',state.phase!=='preplay');
}
function selectPlay(index){if(state.phase!=='preplay')return;state.selected=clamp(index,0,state.options.length-1);state.play=state.options[state.selected];state.t=Math.min(state.t,AUTO_CADENCE-.65);state.detail='Override accepted: '+state.play+'. The offense keeps the cadence.';renderPlayCards();draw();}
function defenseCall(){
 var p=PLAYS[state.play];if(p.kind==='run')return random()<.48?'BEAR FRONT':random()<.5?'COVER 3':'QUARTERS';
 if(p.kind==='pass')return random()<.28?'NICKEL BLITZ':random()<.5?'COVER 2 MAN':'COVER 3';
 return 'RETURN SAFE';
}
function snap(){
 if(state.phase!=='preplay'||state.gameOver)return;
 var spec=PLAYS[state.play],defense=defenseCall(),pd={name:state.play,spec:spec,defense:defense,duration:3.2,outcome:'',gain:0,target:null,release:spec.release||0,catchAt:0};
 if(spec.kind==='run'){
   var front=defense==='BEAR FRONT'?-2:0,raw=spec.base+(random()-.42)*spec.spread+front;pd.gain=Math.round(clamp(raw,-4,28));pd.outcome=random()<.018?'FUMBLE':'RUN';pd.duration=2.7+clamp(pd.gain,0,15)*.035;pd.target=byRole(spec.carrier);
 }else if(spec.kind==='pass'){
   var pressure=defense==='NICKEL BLITZ'?.23:defense==='COVER 2 MAN'?.1:.05,deep=state.play==='PLAY ACTION SHOT',pickChance=deep?.09:.035;
   pd.target=byRole(spec.target);pd.catchAt=pd.release+.65;pd.duration=pd.catchAt+1.25;
   var r=random();
   if(r<pressure){pd.outcome='SACK';pd.gain=-Math.round(3+random()*7);pd.duration=1.8;}
   else if(r<pressure+pickChance){pd.outcome='INTERCEPTION';pd.gain=Math.round(spec.base*.7);pd.duration=pd.catchAt+.5;}
   else if(r<pressure+pickChance+(deep?.38:.24)){pd.outcome='INCOMPLETE';pd.gain=0;pd.duration=pd.catchAt+.45;}
   else{pd.outcome='COMPLETE';pd.gain=Math.round(clamp(spec.base+(random()-.35)*spec.spread,-2,45));}
 }else if(spec.kind==='fieldGoal'){pd.outcome='FIELD GOAL';pd.duration=2.3;pd.good=random()<clamp(.97-(distanceGoal()+17-35)*.018,.28,.97);}
 else{pd.outcome='PUNT';pd.duration=2.4;pd.gain=Math.round(38+random()*14);}
 state.playData=pd;state.phase='live';state.t=0;state.drivePlays++;state.headline=state.play+' vs '+defense;state.detail=spec.formation;state.events.unshift('SNAP // '+state.play+' // '+defense);$('playPanel').classList.add('hidden');updateAssignments();updateHud();
}
function updateAssignments(){
 var pd=state.playData,spec=pd.spec,direction=ROUTES[pd.name]||{};
 players.forEach(function(p){
   p.sx=p.x;p.sz=p.z;
   if(p.side==='off'){
     if(['LT','LG','C','RG','RT'].includes(p.role)){p.tx=p.x+2.4;p.tz=p.z*.9;}
     else if(spec.kind==='run'&&p===pd.target){p.tx=p.x+Math.max(5,pd.gain);p.tz=pd.name==='OUTSIDE ZONE'?16:pd.name==='POWER'?-3:2;}
     else if(spec.kind==='run'){p.tx=p.x+6+(p.role==='X'||p.role==='Z'?5:0);p.tz=p.z;}
     else if(spec.kind==='pass'){
       var route=direction[p.role];if(route){p.tx=state.ball+route[0];p.tz=route[1];}else if(p.role==='QB'){p.tx=p.x-2;p.tz=0;}
   }else{p.tx=p.x+1;p.tz=p.z;}
   }else{
     if(['LDE','DT','NT','RDE'].includes(p.role)){p.tx=state.ball-3;p.tz=p.z*.75;}
     else if(pd.defense==='NICKEL BLITZ'&&(p.role==='WILL'||p.role==='SAM')){p.tx=state.ball-4;p.tz=0;}
     else{p.tx=state.ball+clamp(pd.gain,2,15);p.tz=p.z*.72;}
   }

  for(let x=-47.5;x<50;x+=1)for(const z of[-9.2,9.2]){const h=new THREE.Mesh(new THREE.PlaneGeometry(.12,.72),lineMat);h.rotation.x=-Math.PI/2;h.position.set(x,.028,z);field.add(h);}

  function goalpost(side){const group=new THREE.Group(),mat=new THREE.MeshStandardMaterial({color:0xffd65b,emissive:0xffad22,emissiveIntensity:.5,metalness:.35,roughness:.3});group.position.x=side*59;const stem=new THREE.Mesh(new THREE.CylinderGeometry(.1,.13,3.4,9),mat);stem.position.y=1.7;const cross=new THREE.Mesh(new THREE.CylinderGeometry(.085,.085,6.2,9),mat);cross.rotation.x=Math.PI/2;cross.position.y=3.35;const a=new THREE.Mesh(new THREE.CylinderGeometry(.075,.075,5.3,9),mat),b=a.clone();a.position.set(0,5.95,-3.1);b.position.set(0,5.95,3.1);group.add(stem,cross,a,b);field.add(group);}
  goalpost(-1);goalpost(1);

  const standMat=new THREE.MeshStandardMaterial({color:0x142733,roughness:.8,metalness:.12});
  for(const side of[-1,1])for(let row=0;row<7;row++){const stand=new THREE.Mesh(new THREE.BoxGeometry(120,.72,1.15),standMat);stand.position.set(0,.4+row*.72,side*(28.9+row*1.12));field.add(stand);}
  const crowdPos=[],crowdBase=[],crowdColor=[],crowdPhase=[];
  for(const side of[-1,1])for(let row=0;row<8;row++)for(let col=0;col<84;col++){
    const x=-58+col*1.4+(row%2)*.6,z=side*(29.2+row*1.12),y=.92+row*.72;

    const team=first.teams[(col+row+(side>0?1:0))%2],c=new THREE.Color((col%7===0)?team.accent:(col%3===0?team.primary:0xb8d3d5));crowdColor.push(c.r,c.g,c.b);
  }
  const crowdGeo=new THREE.BufferGeometry();crowdGeo.setAttribute('position',new THREE.Float32BufferAttribute(crowdPos,3));crowdGeo.setAttribute('color',new THREE.Float32BufferAttribute(crowdColor,3));
  const crowd=new THREE.Points(crowdGeo,new THREE.PointsMaterial({size:.58,vertexColors:true,transparent:true,opacity:1,sizeAttenuation:true}));field.add(crowd);
  for(const side of[-1,1]){const ribbon=new THREE.Mesh(new THREE.PlaneGeometry(110,2.1),new THREE.MeshBasicMaterial({color:first.teams[side<0?0:1].primary,transparent:true,opacity:.45,side:THREE.DoubleSide}));ribbon.position.set(0,5.4,side*37);ribbon.rotation.y=side<0?0:Math.PI;field.add(ribbon);}

  const losLine=fieldLine(first.los-50,.22);losLine.material=new THREE.MeshBasicMaterial({color:0x43bfff,transparent:true,opacity:.88,depthWrite:false});
  const gainLine=fieldLine(first.first-50,.19);gainLine.material=new THREE.MeshBasicMaterial({color:0xffd55d,transparent:true,opacity:.9,depthWrite:false});
  const routeGroup=new THREE.Group();scene.add(routeGroup);let routeKey='';
  function clearRoutes(){while(routeGroup.children.length){const o=routeGroup.children.pop();o.geometry?.dispose();o.material?.dispose();}}
  function paintRoutes(s){const key=s.phase+'|'+s.play+'|'+s.los+'|'+s.routes.map(r=>r.role).join(',');if(key===routeKey)return;routeKey=key;clearRoutes();if(s.phase!=='preplay')return;s.routes.forEach(r=>{const a=new THREE.Vector3(r.from.x-50,.09,r.from.z),b=new THREE.Vector3(r.to.x-50,.09,r.to.z),mid=a.clone().lerp(b,.52);mid.z=a.z+(b.z-a.z)*.18;const curve=new THREE.QuadraticBezierCurve3(a,mid,b),mat=new THREE.LineDashedMaterial({color:r.primary?0xffdc75:0xdffdf4,transparent:true,opacity:r.primary?.95:.43,dashSize:.72,gapSize:.42});const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(26)),mat);line.computeLineDistances();routeGroup.add(line);const arrow=new THREE.Mesh(new THREE.ConeGeometry(.25,.72,8),new THREE.MeshBasicMaterial({color:r.primary?0xffdc75:0xdffdf4,transparent:true,opacity:r.primary?1:.65}));arrow.position.copy(b);arrow.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),b.clone().sub(mid).normalize());routeGroup.add(arrow);});}

  function badge(text,color){const c=document.createElement('canvas');c.width=256;c.height=92;const x=c.getContext('2d');x.fillStyle='rgba(2,8,13,.88)';x.beginPath();x.roundRect(3,3,250,86,18);x.fill();x.strokeStyle=color;x.lineWidth=5;x.stroke();x.fillStyle='#f4fffc';x.font='900 37px Orbitron, sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(text,128,48);const texture=new THREE.CanvasTexture(c);texture.colorSpace=THREE.SRGBColorSpace;const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:texture,transparent:true,depthTest:false}));sprite.scale.set(2.7,.97,1);sprite.renderOrder=9;return sprite;}
  let views=[],viewKey='';
  function rebuildPlayers(s){views.forEach(v=>{scene.remove(v.rig.group,v.badge);v.rig.dispose();v.badge.material.map.dispose();v.badge.material.dispose();});views=[];s.players.forEach((p,i)=>{const team=s.teams[p.team],rig=buildBlobRig({kitColor:team.primary,glowColor:team.accent,captain:p.role==='QB'||p.role==='MIKE'});rig.group.scale.setScalar(.88);const pads=new THREE.Mesh(new THREE.CapsuleGeometry(.54,.16,4,10),new THREE.MeshStandardMaterial({color:team.primary,emissive:team.accent,emissiveIntensity:.18,roughness:.45}));pads.rotation.z=Math.PI/2;pads.position.y=1.42;rig.group.add(pads);const stripe=new THREE.Mesh(new THREE.BoxGeometry(.11,.48,.48),new THREE.MeshBasicMaterial({color:0xf4ffff}));stripe.position.set(0,1.28,-.28);rig.group.add(stripe);const tag=badge(p.role+'  '+p.number,team.accent);if(['LT','LG','C','RG','RT','LDE','DT','NT','RDE'].includes(p.role))tag.scale.set(1.72,.62,1);scene.add(rig.group,tag);views.push({rig,badge:tag,lastX:p.x,lastZ:p.z,team:p.team,index:i});});viewKey=s.players.map(p=>p.team+':'+p.role+':'+p.number).join('|');}

  const football=new THREE.Mesh(new THREE.SphereGeometry(.24,16,10),new THREE.MeshStandardMaterial({color:0xa95b2f,emissive:0x5b1f0b,emissiveIntensity:.42,roughness:.48}));football.scale.set(2.15,1,1);football.castShadow=true;scene.add(football);
  const lace=new THREE.Mesh(new THREE.BoxGeometry(.13,.025,.27),new THREE.MeshBasicMaterial({color:0xffffff}));lace.position.set(0,.22,0);football.add(lace);
  const ballShadow=new THREE.Mesh(new THREE.CircleGeometry(.38,20),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.35,depthWrite:false}));ballShadow.rotation.x=-Math.PI/2;ballShadow.position.y=.035;scene.add(ballShadow);
  const glowCanvas=document.createElement('canvas');glowCanvas.width=64;glowCanvas.height=64;const glowCtx=glowCanvas.getContext('2d'),glowGrad=glowCtx.createRadialGradient(32,32,1,32,32,31);glowGrad.addColorStop(0,'rgba(255,245,195,.95)');glowGrad.addColorStop(.25,'rgba(255,191,76,.55)');glowGrad.addColorStop(1,'rgba(255,150,45,0)');glowCtx.fillStyle=glowGrad;glowCtx.fillRect(0,0,64,64);const ballGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(glowCanvas),transparent:true,depthWrite:false,depthTest:false}));ballGlow.scale.set(1.45,1.45,1);ballGlow.renderOrder=8;scene.add(ballGlow);
  const ballTrail=[];for(let i=0;i<8;i++){const dot=new THREE.Mesh(new THREE.SphereGeometry(.16-i*.012,8,6),new THREE.MeshBasicMaterial({color:0xffe6b4,transparent:true,opacity:.58-i*.06,depthWrite:false}));scene.add(dot);ballTrail.push(dot);}
  const focusRing=new THREE.Mesh(new THREE.RingGeometry(.72,.9,28),new THREE.MeshBasicMaterial({color:0xffd86a,transparent:true,opacity:.78,side:THREE.DoubleSide,depthWrite:false}));focusRing.rotation.x=-Math.PI/2;focusRing.position.y=.055;scene.add(focusRing);
  const ballStem=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]),new THREE.LineBasicMaterial({color:0xffd86a,transparent:true,opacity:.48,depthWrite:false}));ballStem.renderOrder=7;scene.add(ballStem);
  const impactRing=new THREE.Mesh(new THREE.RingGeometry(.88,1.18,32),new THREE.MeshBasicMaterial({color:0xff6e73,transparent:true,opacity:.75,side:THREE.DoubleSide,depthWrite:false}));impactRing.rotation.x=-Math.PI/2;impactRing.position.y=.065;impactRing.renderOrder=6;scene.add(impactRing);

  let simT=0,lastFrame=performance.now(),cameraFocus=first.los-50,cameraReady=false;
  function render3D(dt=1/60){const s=state();if(!s)return;simT+=dt;const nextKey=s.players.map(p=>p.team+':'+p.role+':'+p.number).join('|');if(nextKey!==viewKey)rebuildPlayers(s);
    losLine.position.x=s.los-50;gainLine.position.x=s.first-50;losLine.material.opacity=.72+(s.phase==='preplay'?Math.sin(simT*8)*.17:0);gainLine.material.opacity=.76+Math.sin(simT*3)*.1;paintRoutes(s);
    const b=s.ball;football.visible=b.visible;ballShadow.visible=b.visible;football.position.set(b.x-50,b.y,b.z);football.rotation.z+=dt*(b.status==='airborne'||b.status==='kicked'?18:4);football.rotation.x+=dt*7;ballGlow.visible=b.status==='airborne'||b.status==='kicked';ballGlow.position.copy(football.position);ballShadow.position.set(b.x-50,.035,b.z);ballShadow.scale.setScalar(THREE.MathUtils.clamp(1.15-b.y*.045,.42,1));
    const airborne=b.status==='airborne'||b.status==='kicked';ballTrail.forEach((dot,i)=>{dot.visible=airborne;if(i===0)dot.position.copy(football.position);else dot.position.lerp(ballTrail[i-1].position,.48);});ballStem.visible=airborne;if(airborne){const stem=ballStem.geometry.attributes.position.array;stem[0]=b.x-50;stem[1]=.08;stem[2]=b.z;stem[3]=b.x-50;stem[4]=Math.max(.12,b.y-.32);stem[5]=b.z;ballStem.geometry.attributes.position.needsUpdate=true;}
    let carrier=-1,best=99;s.players.forEach((p,i)=>{const d=Math.hypot(p.x-b.x,p.z-b.z);if(d<best){best=d;carrier=i;}});
    s.players.forEach((p,i)=>{const v=views[i],dx=p.x-v.lastX,dz=p.z-v.lastZ,speed=Math.hypot(dx,dz)/Math.max(dt,.001);v.rig.group.position.set(p.x-50,0,p.z);if(speed>.05)v.rig.group.rotation.y=Math.atan2(dz,dx)-Math.PI/2;else v.rig.group.rotation.y=p.side==='off'?-Math.PI/2:Math.PI/2;
      const engaged=s.phase==='live'&&s.players.some((q,j)=>j!==i&&q.side!==p.side&&Math.hypot(q.x-p.x,q.z-p.z)<1.25);if(s.phase==='preplay'){if(['LT','LG','C','RG','RT','LDE','DT','NT','RDE'].includes(p.role))v.rig.poseShield(.55,p.z<0?-1:1);else v.rig.poseJockey(simT,p.z<0?-1:1);}else if(p.target&&s.playProgress>.72){if(s.outcome==='INCOMPLETE')v.rig.poseDive(p.z<0?-1:1,THREE.MathUtils.clamp((s.playProgress-.72)/.28,0,1));else v.rig.poseFall(THREE.MathUtils.clamp((s.playProgress-.78)/.22,0,1));}else if(engaged)v.rig.poseShield(.62,p.z<0?-1:1);v.rig.update(dt,THREE.MathUtils.clamp(speed/12,0,1));v.badge.position.set(p.x-50,2.7,p.z);v.badge.visible=s.phase==='preplay'||p.target||i===carrier;v.lastX=p.x;v.lastZ=p.z;});
    if(carrier>=0){focusRing.visible=s.phase==='live';if(b.status==='airborne'||b.status==='kicked'){focusRing.position.x=b.x-50;focusRing.position.z=b.z;focusRing.material.opacity=.48;}else{focusRing.position.x=s.players[carrier].x-50;focusRing.position.z=s.players[carrier].z;focusRing.material.opacity=.78;}focusRing.scale.setScalar(1+Math.sin(simT*7)*.08);}else focusRing.visible=false;
    const contactPlayer=s.players.find(p=>p.target);impactRing.visible=s.phase==='live'&&s.playProgress>.78&&!!contactPlayer;if(impactRing.visible){impactRing.position.x=contactPlayer.x-50;impactRing.position.z=contactPlayer.z;impactRing.material.color.set(s.outcome==='COMPLETE'?0x66ffd4:s.outcome==='INCOMPLETE'?0xffd86a:0xff6e73);const contactK=THREE.MathUtils.clamp((s.playProgress-.78)/.22,0,1);impactRing.scale.setScalar(.65+contactK*.9);impactRing.material.opacity=.82*(1-contactK*.45);}
    const heat=s.phase==='dead'?.75:s.phase==='live'?.32:.12,pos=crowdGeo.attributes.position;for(let i=0;i<crowdBase.length;i++)pos.array[i*3+1]=crowdBase[i]+heat*Math.max(0,Math.sin(simT*(5+heat*2)+crowdPhase[i]))*.38;pos.needsUpdate=true;
    const ballFocus=b.visible?b.x-50:s.los-50,wanted=THREE.MathUtils.clamp(s.phase==='preplay'?s.los-46:(ballFocus+(s.los-50))*.5,-40,40);cameraFocus+= (wanted-cameraFocus)*(1-Math.exp(-2.1*dt));const mobile=isPortrait(),desired=new THREE.Vector3(cameraFocus-(mobile?7:8),mobile?34:30,mobile?49:43);if(cameraReady)camera.position.lerp(desired,1-Math.exp(-3.2*dt));else{camera.position.copy(desired);cameraReady=true;}camera.lookAt(cameraFocus+(mobile?3:5),.65,0);renderer.render(scene,camera);
  }
  window._footballRender3D=render3D;window._football3DDebug=()=>({camera:{x:+camera.position.x.toFixed(2),y:+camera.position.y.toFixed(2),z:+camera.position.z.toFixed(2)},focus:+cameraFocus.toFixed(2),renderCalls:renderer.info.render.calls,triangles:renderer.info.render.triangles,sceneChildren:scene.children.length});rebuildPlayers(first);render3D();document.documentElement.classList.add('webgl-ready');
  function loop(now){const dt=Math.min(.05,Math.max(0,(now-lastFrame)/1000));lastFrame=now;if(dt>0)render3D(dt);requestAnimationFrame(loop);}requestAnimationFrame(loop);
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.fov=isPortrait()?56:44;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));renderer.setSize(innerWidth,innerHeight);render3D();});
}
