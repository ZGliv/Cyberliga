<script>
(function(){

var home=sport.teams[(fixture*2)%8],away=sport.teams[(fixture*2+1)%8],teams=[home,away];
localStorage.setItem('cl_football_fx',String((fixture+1)%4));
var seed=2166136261>>>0;String(home.id+'|'+away.id+'|gridiron-v2').split('').forEach(function(c){seed^=c.charCodeAt(0);seed=Math.imul(seed,16777619);});
function random(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}

document.querySelector('.home').style.setProperty('--team',color(home,'primary'));document.querySelector('.away').style.setProperty('--team',color(away,'primary'));
$('homeCity').textContent=home.city.toUpperCase();$('homeName').textContent=home.name.replace(home.city.toUpperCase()+' ','');$('awayCity').textContent=away.city.toUpperCase();$('awayName').textContent=away.name.replace(away.city.toUpperCase()+' ','');

var offIdx=[0,1,2,3,6,7,8,9,10,11,12],defIdx=[4,5,13,14,15,16,17,18,19,20,21];
var PLAYS={
 'INSIDE ZONE':{kind:'run',formation:'11 PERSONNEL · GUN',desc:'Double the nose, climb to MIKE. Back reads A to cutback.',risk:'SAFE · READ THE A-GAP',carrier:'RB',gap:'A RIGHT',base:3.8},
 'OUTSIDE ZONE':{kind:'run',formation:'11 PERSONNEL · SINGLEBACK',desc:'Stretch the edge. Press C-gap, plant under over-pursuit.',risk:'EDGE · ONE CUT',carrier:'RB',gap:'C RIGHT',base:4.5},
 'POWER':{kind:'run',formation:'12 PERSONNEL · PISTOL',desc:'Down blocks, left guard pulls through the B-gap.',risk:'PHYSICAL · PULLER',carrier:'RB',gap:'B LEFT',base:3.5},
 'QB SNEAK':{kind:'run',formation:'HEAVY · UNDER CENTER',desc:'Center and guards wedge one necessary yard.',risk:'VERY SAFE · 1–2 YARDS',carrier:'QB',gap:'A MID',base:1.1},
 'QUICK SLANTS':{kind:'pass',formation:'11 PERSONNEL · GUN',desc:'Read leverage: X slant, slot sit, then back.',risk:'FAST · MAN BEATER',reads:['X','SLOT','RB'],base:6,release:1.0},
 'MESH':{kind:'pass',formation:'11 PERSONNEL · GUN',desc:'Two crossers create traffic; read SLOT, TE, then back.',risk:'CHAIN MOVER · ZONE FINDER',reads:['SLOT','TE','RB'],base:7,release:1.35},
 'PLAY ACTION SHOT':{kind:'pass',formation:'12 PERSONNEL · SINGLEBACK',desc:'Hold the linebackers; read Z post to X comeback.',risk:'EXPLOSIVE · SLOW READ',reads:['Z','X','TE'],base:19,release:2.1,playAction:true},
 'RB SCREEN':{kind:'pass',formation:'11 PERSONNEL · GUN',desc:'Invite the rush; guards release in front of the back.',risk:'PRESSURE PUNISHER',reads:['RB'],base:8,release:1.55,screen:true},
 'FIELD GOAL':{kind:'fieldGoal',formation:'FIELD GOAL UNIT',desc:'Three points if the kick has enough distance.',risk:'SPECIAL TEAMS'},
 'PUNT':{kind:'punt',formation:'PUNT UNIT',desc:'Flip the field and make the opponent drive.',risk:'SPECIAL TEAMS'}
};
var ROUTES={
 'QUICK SLANTS':{X:[12,-4],Z:[10,4],SLOT:[7,-1],TE:[6,2],RB:[2,7]},
 'MESH':{X:[10,3],Z:[12,-3],SLOT:[9,4],TE:[9,-4],RB:[4,0]},
 'PLAY ACTION SHOT':{X:[19,-6],Z:[28,5],SLOT:[14,0],TE:[11,-2],RB:[-1,0]},
 'RB SCREEN':{X:[13,-7],Z:[15,7],SLOT:[10,2],TE:[7,-1],RB:[7,-5]}
};
var AUTO_CADENCE=2.75,AUTO_NEXT_MATCH=6;
var state={phase:'preplay',quarter:1,clock:90,score:[0,0],possession:0,down:1,toGo:10,ball:25,play:'',options:[],selected:0,t:0,playData:null,look:null,drivePlays:0,driveYards:0,driveStart:25,headline:'Opening drive',detail:'The offense is reading the shell and setting protection.',lastEvent:'OPENING KICKOFF',gameOver:false,events:[],momentum:0,crowd:0};
var players=[],audioOn=false;
function nameHash(value){var h=2166136261>>>0;String(value).split('').forEach(function(c){h^=c.charCodeAt(0);h=Math.imul(h,16777619);});return h>>>0;}
function rating(name,trait){return 62+(nameHash(name+'|'+trait)%3100)/100;}
function athlete(team,index){return team.athletes[index]||team.athletes[0];}
function setupPlayers(){
 players=[];
 OFF_ROLES.forEach(function(role,i){var a=athlete(teams[state.possession],offIdx[i]);players.push({side:'off',role:role,name:a.name,number:a.number,skill:rating(a.name,role),x:0,z:0,sx:0,sz:0,tx:0,tz:0,engaged:null});});
 DEF_ROLES.forEach(function(role,i){var a=athlete(teams[1-state.possession],defIdx[i]);players.push({side:'def',role:role,name:a.name,number:a.number,skill:rating(a.name,role),x:0,z:0,sx:0,sz:0,tx:0,tz:0,engaged:null});});
 placeFormation();
}
function byRole(role){return players.find(function(p){return p.side==='off'&&p.role===role;});}
function defender(role){return players.find(function(p){return p.side==='def'&&p.role===role;});}
function placeFormation(){
 var b=state.ball,off={
 QB:[-4,0],RB:[-8,1.5],X:[0,-20],Z:[0,20],SLOT:[-1,-12],TE:[-1,9],LT:[0,-5],LG:[0,-2.5],C:[0,0],RG:[0,2.5],RT:[0,5]
 },def={LDE:[1,-6],DT:[1,-2],NT:[1,1.5],RDE:[1,6],WILL:[5,-7],MIKE:[5,0],SAM:[5,7],LCB:[4,-19],RCB:[4,19],SS:[8,7],FS:[13,-4]};
 if(state.look){if(state.look.shell.indexOf('TWO')>=0){def.FS=[13,-9];def.SS=[13,9];}else if(state.look.shell==='ZERO'){def.FS=[5,-10];def.SS=[4,9];}else{def.FS=[14,0];def.SS=[6,8];}if(state.look.blitz){def.WILL=[2,-7];def.SAM=[2,7];}if(state.look.box>=8){def.MIKE=[3.5,0];def.WILL[0]=4;def.SAM[0]=4;}}
 players.forEach(function(p){var pos=(p.side==='off'?off:def)[p.role];p.x=b+pos[0];p.z=pos[1];p.sx=p.x;p.sz=p.z;p.tx=p.x;p.tz=p.z;});
}
function distanceGoal(){return 100-state.ball;}
function fieldLabel(){return state.ball===50?'50':state.ball<50?'OWN '+Math.round(state.ball):'OPP '+Math.round(100-state.ball);}
function chooseOptions(){
 if(state.down===4){
   if(distanceGoal()<=38)return ['FIELD GOAL','POWER','QUICK SLANTS'];
   if(state.toGo<=2)return ['POWER','QB SNEAK','PUNT'];
   return ['PUNT','MESH','PLAY ACTION SHOT'];
 }
 if(state.toGo<=2)return ['POWER','QUICK SLANTS','PLAY ACTION SHOT'];
 if(state.toGo>=12)return ['MESH','RB SCREEN','PLAY ACTION SHOT'];
 if(state.ball>=78)return ['INSIDE ZONE','QUICK SLANTS','PLAY ACTION SHOT'];
 return state.down===1?['INSIDE ZONE','QUICK SLANTS','PLAY ACTION SHOT']:['OUTSIDE ZONE','MESH','RB SCREEN'];
}
function chooseAutonomousPlay(){
 var trailing=state.score[state.possession]<state.score[1-state.possession],late=state.quarter>=4&&state.clock<35;
 var passPreferred=trailing&&late,roll=random(),index=roll<.58?0:roll<.88?1:2;
 if(passPreferred){var passIndex=state.options.findIndex(function(name){return PLAYS[name].kind==='pass'&&name!=='RB SCREEN';});if(passIndex>=0)index=passIndex;}
 if(state.down===4)index=0;
 return clamp(index,0,state.options.length-1);
}
function chooseDefensiveLook(){
 var passDown=state.toGo>=7||state.down===3,goalLine=state.ball>=90,roll=random();
 if(goalLine||state.toGo<=2)return roll<.62?{name:'BEAR COVER 1',shell:'ONE-HIGH',front:'bear',blitz:0,box:8}:{name:'GOAL-LINE ZERO',shell:'ZERO',front:'heavy',blitz:2,box:9};
 if(passDown){if(roll<.27)return{name:'NICKEL FIRE',shell:'ONE-HIGH',front:'nickel',blitz:2,box:6};if(roll<.58)return{name:'COVER 2 MAN',shell:'TWO-HIGH',front:'even',blitz:0,box:6};return{name:'QUARTERS',shell:'TWO-HIGH',front:'light',blitz:0,box:6};}
 if(roll<.36)return{name:'COVER 3 BUZZ',shell:'ONE-HIGH',front:'over',blitz:0,box:7};if(roll<.66)return{name:'BEAR COVER 1',shell:'ONE-HIGH',front:'bear',blitz:0,box:8};return{name:'NICKEL FIRE',shell:'TWO-HIGH DISGUISE',front:'nickel',blitz:2,box:6};
}
function beginPreplay(){
 state.phase='preplay';state.t=0;state.playData=null;state.options=chooseOptions();state.selected=chooseAutonomousPlay();state.play=state.options[state.selected];state.look=chooseDefensiveLook();setupPlayers();renderPlayCards();state.headline=ordinal(state.down)+' & '+Math.ceil(state.toGo)+' at '+fieldLabel();state.detail=teams[state.possession].code+' sees '+state.look.shell+'. '+state.play+' is the call; watch the leverage.';updateHud();
}
function renderPlayCards(){
 var host=$('plays');host.replaceChildren();state.options.forEach(function(name,i){var p=PLAYS[name],btn=document.createElement('button');btn.type='button';btn.className='play'+(i===state.selected?' selected':'');btn.setAttribute('aria-pressed',String(i===state.selected));btn.innerHTML='<kbd>'+(i+1)+'</kbd><b>'+name+'</b><span>'+p.desc+'</span><em>'+p.risk+'</em>';btn.onclick=function(){selectPlay(i);};host.appendChild(btn);});
 $('playPanel').classList.toggle('hidden',state.phase!=='preplay');document.body.classList.toggle('calling',state.phase==='preplay');
}
function selectPlay(index){if(state.phase!=='preplay')return;state.selected=clamp(index,0,state.options.length-1);state.play=state.options[state.selected];state.t=Math.min(state.t,AUTO_CADENCE-.65);state.detail='Override accepted: '+state.play+'. The offense keeps the cadence.';renderPlayCards();updateHud();draw();}
function defenderForReceiver(role){return defender(role==='X'?'LCB':role==='Z'?'RCB':role==='SLOT'?'SS':role==='TE'?'SAM':role==='RB'?'MIKE':'FS');}
function schemeVsShell(play,shell){
 if(play==='QUICK SLANTS')return shell.indexOf('ONE')>=0||shell==='ZERO'?7:-2;
 if(play==='MESH')return shell.indexOf('TWO')>=0?5:2;
 if(play==='PLAY ACTION SHOT')return shell.indexOf('ONE')>=0?5:-5;
 if(play==='RB SCREEN')return state.look.blitz?13:-5;
 return 0;
}
function buildBlocks(pd){
 var pairs=[['LT','RDE'],['LG','DT'],['C','NT'],['RG','DT'],['RT','LDE']],sum=0;
 pd.blocks=pairs.map(function(pair,i){var blocker=byRole(pair[0]),rush=defender(pair[1]),doubleHelp=(pd.name==='INSIDE ZONE'&&(pair[0]==='C'||pair[0]==='RG'))?6:0,pull=(pd.name==='POWER'&&pair[0]==='LG')?8:0,grade=blocker.skill-rush.skill+doubleHelp+pull+(random()-.5)*12;sum+=grade;blocker.engaged=rush.role;rush.engaged=blocker.role;return{blocker:blocker.role,defender:rush.role,grade:+grade.toFixed(1),won:grade>=0};});
 return sum/pd.blocks.length;
}

 if(pd&&state.phase==='live'&&(pd.stage==='FINISH'||pd.stage==='CONTEST')&&pd.target){var hit=project(pd.target.x,pd.target.z);ctx.strokeStyle='rgba(255,255,255,'+(1-clamp((state.t-pd.duration*.7)/(pd.duration*.3),0,1))+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(hit.x,hit.y,10+Math.sin(state.t*24)*5,0,Math.PI*2);ctx.stroke();}
}
function drawBall(){
 var pd=state.playData;if(!pd||state.phase!=='live')return;var x=state.ball,z=0,yArc=0;
 if(pd.spec.kind==='run'){var c=pd.target;x=c.x;z=c.z;}
 else if(pd.spec.kind==='pass'){
   var qb=byRole('QB');
   if(state.t<pd.release){x=qb.x;z=qb.z;}
   else{var k=clamp((state.t-pd.release)/Math.max(.1,pd.catchAt-pd.release),0,1);x=lerp(qb.x,pd.target.x,k);z=lerp(qb.z,pd.target.z,k);yArc=Math.sin(k*Math.PI)*18;}
 }else{x=state.ball+clamp(state.t/pd.duration,0,1)*(pd.spec.kind==='punt'?pd.gain:distanceGoal());z=0;yArc=Math.sin(clamp(state.t/pd.duration,0,1)*Math.PI)*35;}
 var p=project(x,z);ctx.save();ctx.translate(p.x,p.y-yArc);ctx.rotate(.35+state.t*8);ctx.fillStyle='#8d4b27';ctx.beginPath();ctx.ellipse(0,0,7,4,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-2,-2);ctx.lineTo(2,2);ctx.stroke();ctx.restore();
}
function draw(){
 if(!W)return;ctx.clearRect(0,0,W,H);ctx.fillStyle='#06100d';ctx.fillRect(0,0,W,H);var r=fieldRect();drawStadium(r);drawField();drawRoutes();drawPlayers();drawBall();
}
function updateHud(){
 $('homeScore').textContent=state.score[0];$('awayScore').textContent=state.score[1];var sec=Math.ceil(state.clock);$('clock').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');$('quarter').textContent=state.quarter===5?'OVERTIME':ordinal(state.quarter)+' QUARTER';$('down').textContent=ordinal(state.down)+' & '+Math.ceil(state.toGo);$('fieldPos').textContent=fieldLabel();$('possession').textContent=teams[state.possession].code+' BALL';$('phase').textContent=state.phase==='preplay'?'PRE-SNAP':state.phase==='live'?'PLAY LIVE':state.phase==='dead'?'WHISTLE':'FINAL';$('headline').textContent=state.headline;$('detail').textContent=state.detail;
 var shown=state.playData?state.playData.shell:(state.look?state.look.shell:'SPECIAL TEAMS'),edge=state.playData?(state.playData.spec.kind==='run'?'LANE '+(state.playData.lane>=0?'+':'')+state.playData.lane:state.playData.pressured?'PRESSURE WON':'POCKET HOLDS'):schemeVsShell(state.play,shown)>=3?'CALL HAS LEVERAGE':schemeVsShell(state.play,shown)<=-3?'DEFENSE HAS LEVERAGE':'EVEN MATCHUP';$('shell').innerHTML='DEFENSE <b>'+shown+'</b>';$('leverage').innerHTML='EDGE <b>'+edge+'</b>';$('drive').innerHTML='DRIVE <b>'+state.drivePlays+' PLAYS · '+state.driveYards+' YDS</b>';
}
function tick(dt,skipRender){step(dt);if(!skipRender){draw();updateHud();}}
window.render_game_to_text=function(){return JSON.stringify({note:'Offense always moves left-to-right. Field x is yards from its own goal line (0) to opponent goal line (100); z is lateral yards from -26.65 to 26.65.',phase:state.phase,quarter:state.quarter,clock:+state.clock.toFixed(1),score:{home:state.score[0],away:state.score[1]},teams:teams.map(function(t){return t.name;}),possession:teams[state.possession].code,down:state.down,toGo:+state.toGo.toFixed(1),ball:+state.ball.toFixed(1),fieldPosition:fieldLabel(),defensiveLook:state.look?{call:state.look.name,shell:state.look.shell,box:state.look.box,blitzers:state.look.blitz}:null,selectedPlay:state.play,playOptions:state.options.slice(),play:state.playData?{call:state.playData.name,defense:state.playData.defense,shell:state.playData.shell,stage:state.playData.stage,outcome:state.playData.outcome,elapsed:+state.t.toFixed(2),duration:+state.playData.duration.toFixed(2),target:state.playData.target?state.playData.target.role:null,decision:state.playData.decision||null,cause:state.playData.cause,gain:state.playData.gain,pressureAt:state.playData.pressureAt||null,lane:state.playData.lane==null?null:state.playData.lane,blocks:state.playData.blocks,reads:state.playData.reads}:null,drive:{plays:state.drivePlays,yards:state.driveYards,start:state.driveStart},players:players.map(function(p){return{side:p.side,role:p.role,number:p.number,x:+p.x.toFixed(1),z:+p.z.toFixed(1),engaged:p.engaged};}),lastEvent:state.lastEvent,recentEvents:state.events.slice(0,4),gameOver:state.gameOver});};
window.advanceTime=function(ms){var count=Math.max(1,Math.round(ms/(1000/60)));for(var i=0;i<count;i++)step(1/60);draw();updateHud();return window.render_game_to_text();};
window._footballTest={reset:function(){location.reload();},select:function(index){selectPlay(Number(index));return state.play;},snap:function(){snap();return JSON.parse(window.render_game_to_text());},forceSituation:function(o){o=o||{};state.down=clamp(o.down==null?1:o.down,1,4);state.toGo=clamp(o.toGo==null?10:o.toGo,1,30);state.ball=clamp(o.ball==null?25:o.ball,1,99);state.quarter=clamp(o.quarter==null?1:o.quarter,1,4);state.clock=clamp(o.clock==null?90:o.clock,0,90);beginPreplay();return JSON.parse(window.render_game_to_text());},forceDefense:function(name){var looks=[{name:'BEAR COVER 1',shell:'ONE-HIGH',front:'bear',blitz:0,box:8},{name:'NICKEL FIRE',shell:'ONE-HIGH',front:'nickel',blitz:2,box:6},{name:'COVER 2 MAN',shell:'TWO-HIGH',front:'even',blitz:0,box:6},{name:'QUARTERS',shell:'TWO-HIGH',front:'light',blitz:0,box:6}];state.look=looks.find(function(l){return l.name===name;})||looks[0];setupPlayers();updateHud();draw();return state.look;},forceOutcome:function(outcome,gain,good){if(state.phase!=='live')return false;state.playData.outcome=String(outcome||state.playData.outcome).toUpperCase();if(Number.isFinite(Number(gain)))state.playData.gain=Number(gain);if(typeof good==='boolean')state.playData.good=good;return true;},finishPlay:function(){if(state.phase==='live')window.advanceTime((state.playData.duration+0.1)*1000);return JSON.parse(window.render_game_to_text());},advanceCadence:function(){window.advanceTime((AUTO_CADENCE+.1)*1000);return JSON.parse(window.render_game_to_text());},forceFinal:function(a,b){state.score=[Number(a)||0,Number(b)||0];finishGame();return true;}};
$('plays').addEventListener('keydown',function(e){if(e.key==='ArrowRight')selectPlay((state.selected+1)%3);if(e.key==='ArrowLeft')selectPlay((state.selected+2)%3);});
$('snap').onclick=snap;$('restart').onclick=function(){location.href='football.html?fixture='+((fixture+1)%4);};$('sound').onclick=function(){audioOn=!audioOn;$('sound').textContent=audioOn?'SOUND ON':'SOUND OFF';};
addEventListener('keydown',function(e){if(state.phase==='preplay'&&['1','2','3'].includes(e.key)){selectPlay(Number(e.key)-1);e.preventDefault();}if(e.code==='Space'){snap();e.preventDefault();}if((e.key==='f'||e.key==='F')){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();}});
var rafId=0,hiddenTimer=0,lastTick=performance.now();
function rafLoop(now){rafId=requestAnimationFrame(rafLoop);var dt=Math.min(.05,(now-lastTick)/1000);lastTick=now;if(dt>0)tick(dt,false);}
function startDriver(){
 if(rafId){cancelAnimationFrame(rafId);rafId=0;}if(hiddenTimer){clearInterval(hiddenTimer);hiddenTimer=0;}
 if(document.hidden){var lastFire=performance.now();hiddenTimer=setInterval(function(){var now=performance.now(),steps=Math.min(Math.floor((now-lastFire)/50),20);if(steps<=0)return;lastFire=now;lastTick=now;for(var i=0;i<steps;i++)tick(.05,i<steps-1);},50);}
 else{lastTick=performance.now();rafLoop(lastTick);}
}
document.addEventListener('visibilitychange',startDriver);
addEventListener('resize',resize);beginPreplay();resize();startDriver();
})();
