<!DOCTYPE html>
<html lang="en">
<head>

<title>CYBERLIGA GRIDIRON — LIVE AUTONOMOUS FOOTBALL</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Rajdhani:wght@500;600;700&display=swap');
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:100%; height:100%; overflow:hidden; background:#02050a; touch-action:none; }
  canvas { display:block; }
  #hud { position:fixed; inset:0; pointer-events:none; color:#f6fbff; font-family:'Rajdhani',sans-serif; isolation:isolate; }
  #hud::before { content:""; position:absolute; inset:0; z-index:1; background:radial-gradient(ellipse at center,transparent 53%,rgba(0,3,8,.66) 100%); }
  #hud::after { content:""; position:absolute; inset:0; z-index:2; opacity:.42; mix-blend-mode:overlay; background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 4px); }
  #nav { position:absolute; top:20px; left:20px; z-index:20; display:flex; align-items:center; gap:11px; }
  #back { pointer-events:auto; text-decoration:none; color:#b9ffef; border:1px solid rgba(80,255,203,.42); background:rgba(3,10,17,.78); border-radius:99px; padding:7px 13px; font-weight:700; font-size:12px; letter-spacing:2px; box-shadow:0 0 18px rgba(29,255,195,.12); }
  #brand { font-family:'Orbitron'; color:#fff; font-size:14px; font-weight:900; letter-spacing:3px; text-shadow:0 0 15px rgba(44,255,207,.65); }
  #brand em { color:#63ffd7; font-style:normal; }
  #livebug { display:flex; align-items:center; gap:6px; font-family:'Orbitron'; color:#ff6989; font-size:9px; font-weight:900; letter-spacing:2px; }
  #livebug i { display:block; width:6px; height:6px; border-radius:50%; background:#ff315f; box-shadow:0 0 10px #ff315f; animation:pulse 1.1s infinite; }
  @keyframes pulse { 50% { opacity:.3; } }

  #scorebug { position:absolute; z-index:20; top:18px; left:50%; transform:translateX(-50%); min-width:550px; display:grid; grid-template-columns:1fr auto 1fr; background:linear-gradient(180deg,rgba(9,17,27,.97),rgba(2,7,13,.96)); border:1px solid rgba(106,255,219,.27); border-radius:10px; overflow:hidden; box-shadow:0 10px 32px rgba(0,0,0,.4),0 0 26px rgba(47,255,208,.11); }
  .club { height:50px; display:flex; align-items:center; gap:10px; padding:0 15px; min-width:0; }
  .club.away { justify-content:flex-end; text-align:right; }
  .swatch { width:10px; height:30px; border-radius:3px; box-shadow:0 0 12px currentColor; flex:0 0 auto; }
  .clubcopy { min-width:0; }
  .city { color:rgba(224,244,248,.65); font-size:9px; font-weight:700; line-height:1; letter-spacing:2px; }
  .name { margin-top:3px; font-family:'Orbitron'; font-size:13px; font-weight:900; line-height:1; letter-spacing:1.6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .points { display:flex; align-items:center; gap:12px; height:50px; padding:0 15px; font-family:'Orbitron'; font-weight:900; background:rgba(69,255,211,.07); border-left:1px solid rgba(105,255,219,.16); border-right:1px solid rgba(105,255,219,.16); }
  .points b { min-width:28px; font-size:24px; text-align:center; text-shadow:0 0 13px currentColor; }
  .points span { color:rgba(255,255,255,.35); }
  #situation { grid-column:1/-1; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; min-height:26px; border-top:1px solid rgba(255,255,255,.07); background:rgba(1,4,9,.7); font-family:'Orbitron'; font-size:10px; font-weight:700; letter-spacing:1.7px; }
  #down { padding-left:15px; color:#83ffe1; }
  #clock { color:#fff; font-size:12px; }
  #quarter { padding-right:15px; color:#ffdb81; text-align:right; }

  #playcall { position:absolute; z-index:12; top:104px; left:50%; transform:translateX(-50%) translateY(-7px); opacity:0; transition:opacity .2s,transform .25s; min-width:270px; padding:7px 18px; text-align:center; border-radius:99px; border:1px solid rgba(255,222,124,.38); background:rgba(3,9,15,.83); color:#ffe18d; font-family:'Orbitron'; font-size:11px; font-weight:900; letter-spacing:3px; box-shadow:0 0 24px rgba(255,207,80,.1); }
  #playcall.show { opacity:1; transform:translateX(-50%) translateY(0); }

  #moment { position:absolute; z-index:14; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; opacity:0; transform:scale(1.16); transition:transform .25s cubic-bezier(.2,1.5,.3,1); }
  #moment.show { opacity:1; transform:scale(1); }
  #moment h1 { font-family:'Orbitron'; font-size:clamp(52px,10vw,124px); font-weight:900; line-height:.9; letter-spacing:8px; color:#fff; text-align:center; text-shadow:0 0 26px var(--moment,#45ffd0),0 0 90px var(--moment,#45ffd0); }
  #moment p { margin-top:12px; font-size:18px; font-weight:700; color:#effffc; letter-spacing:6px; text-align:center; text-shadow:0 2px 10px #000; }
  #controls { position:absolute; z-index:25; bottom:47px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:8px; color:rgba(230,255,249,.78); font-size:11px; font-weight:700; letter-spacing:1.6px; white-space:nowrap; }
  #controls .key { font-family:'Orbitron'; color:#fff; border:1px solid rgba(104,255,219,.28); background:rgba(2,8,14,.78); border-radius:5px; padding:4px 7px; box-shadow:inset 0 1px rgba(255,255,255,.05); }
  #touch { display:none; position:absolute; left:12px; right:12px; bottom:calc(48px + env(safe-area-inset-bottom,0px)); z-index:30; justify-content:space-between; align-items:flex-end; }
  .touchgroup { display:flex; gap:8px; }
  .touchbtn { pointer-events:auto; user-select:none; -webkit-user-select:none; min-width:52px; height:44px; display:grid; place-items:center; padding:0 12px; border:1px solid rgba(106,255,219,.32); border-radius:12px; background:rgba(3,10,17,.78); color:#eafff9; font-family:'Orbitron'; font-size:10px; font-weight:900; letter-spacing:1px; box-shadow:0 8px 24px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.07); backdrop-filter:blur(6px); }
  .touchbtn.hot { border-color:rgba(255,217,112,.48); color:#ffe596; }
  .touchbtn:active,.touchbtn.down { transform:scale(.95); background:rgba(30,92,75,.8); }
  #ticker { position:absolute; z-index:24; bottom:0; left:0; right:0; height:34px; display:flex; align-items:center; overflow:hidden; background:linear-gradient(180deg,rgba(3,10,16,.9),rgba(1,4,8,.98)); border-top:1px solid rgba(90,255,215,.22); }
  #ticker strong { height:100%; padding:0 14px; display:flex; align-items:center; flex:0 0 auto; background:rgba(61,255,208,.11); border-right:1px solid rgba(80,255,210,.25); color:#78ffe1; font-family:'Orbitron'; font-size:9px; letter-spacing:2.5px; }
  #ticker span { padding-left:18px; white-space:nowrap; color:rgba(225,251,247,.8); font-size:14px; font-weight:600; letter-spacing:1px; transform:translateX(100vw); will-change:transform; }
  #final { position:absolute; z-index:40; inset:0; display:none; place-items:center; background:rgba(0,4,9,.62); backdrop-filter:blur(7px); pointer-events:auto; padding:16px; }
  #final.show { display:grid; }
  #finalcard { width:min(470px,100%); padding:30px; border:1px solid rgba(86,255,214,.35); border-radius:16px; background:linear-gradient(180deg,rgba(9,20,29,.98),rgba(2,7,13,.98)); text-align:center; box-shadow:0 0 70px rgba(50,255,208,.16); }
  #finalcard small { font-family:'Orbitron'; font-weight:900; color:#65ffda; letter-spacing:4px; }
  #finalcard h2 { margin:13px 0 8px; font-family:'Orbitron'; font-size:29px; line-height:1.15; letter-spacing:2px; }
  #finalscore { font-family:'Orbitron'; font-size:44px; font-weight:900; color:#fff; letter-spacing:5px; }
  #restart { margin-top:20px; pointer-events:auto; border:1px solid rgba(104,255,219,.45); border-radius:99px; padding:10px 19px; background:rgba(56,255,206,.12); color:#cffff4; font-family:'Orbitron'; font-size:10px; font-weight:900; letter-spacing:2px; cursor:pointer; }

  @media(max-width:1300px) and (min-width:801px){ #brand { display:none; } }

  @media(max-width:800px){
    #nav { top:calc(env(safe-area-inset-top,0px) + 10px); left:10px; right:10px; justify-content:space-between; }
    #back { padding:6px 10px; font-size:10px; letter-spacing:1.3px; }
    #brand { font-size:11px; letter-spacing:1.7px; }
    #livebug { display:none; }
    #scorebug { top:calc(env(safe-area-inset-top,0px) + 49px); width:calc(100vw - 16px); min-width:0; }
    .club { height:45px; padding:0 9px; gap:6px; }
    .city { display:none; }
    .name { margin:0; font-size:10px; letter-spacing:.8px; }
    .swatch { width:7px; height:23px; }
    .points { height:45px; padding:0 9px; gap:7px; }
    .points b { min-width:21px; font-size:19px; }
    #situation { min-height:24px; font-size:8.5px; letter-spacing:1px; }
    #down { padding-left:9px; }
    #clock { font-size:10px; }
    #quarter { padding-right:9px; }
    #playcall { top:calc(env(safe-area-inset-top,0px) + 126px); min-width:210px; max-width:calc(100vw - 18px); padding:6px 13px; font-size:9px; letter-spacing:2px; }
    #moment { padding:0 14px; }
    #moment h1 { font-size:clamp(42px,14vw,70px); letter-spacing:4px; overflow-wrap:anywhere; }
    #moment p { max-width:90vw; font-size:13px; line-height:1.2; letter-spacing:3px; }
    #controls { display:none; }
    #touch { display:flex; }
    #ticker { height:calc(34px + env(safe-area-inset-bottom,0px)); padding-bottom:env(safe-area-inset-bottom,0px); }
    #ticker strong { padding:0 10px; font-size:8px; letter-spacing:1.5px; }
    #ticker span { font-size:12px; }
  }
  @media(max-width:380px){
    .touchbtn { min-width:45px; height:40px; padding:0 9px; font-size:9px; }
    #brand { font-size:10px; }
    #finalcard { padding:24px 16px; }
  }
</style>

<div id="hud">
  <div id="nav"><a id="back" href="world.html">&#x2B21; WORLD MAP</a><span id="brand">CYBERLIGA <em>GRIDIRON</em></span><span id="livebug"><i></i> LIVE</span></div>
  <div id="scorebug">
    <div class="club"><i class="swatch" id="swatchA"></i><div class="clubcopy"><div class="city" id="cityA"></div><div class="name" id="nameA"></div></div></div>
    <div class="points"><b id="scoreA">0</b><span>&ndash;</span><b id="scoreB">0</b></div>
    <div class="club away"><div class="clubcopy"><div class="city" id="cityB"></div><div class="name" id="nameB"></div></div><i class="swatch" id="swatchB"></i></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { buildBlobRig } from './blobrig.js';

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const damp=(k,dt)=>1-Math.exp(-k*dt);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const el=id=>document.getElementById(id);
const FIELD_X=45, FIELD_Z=26.65, QUARTER_LEN=75;
const FOOTBALL_CONTENT=window.CYBERLIGA_CONTENT.getTeams('american-football');
const TEAMS=FOOTBALL_CONTENT.map(team=>{
  const hex=Number.parseInt(team.colors.primary.slice(1),16);
  const cityPrefix=team.city.toUpperCase()+' ';
  return {city:team.city.toUpperCase(),name:team.name.startsWith(cityPrefix)?team.name.slice(cityPrefix.length):team.name,
    css:team.colors.primary,kit:hex,glow:hex,abbr:team.code,roster:team.athletes.map(a=>a.name)};
});
const seed=Math.floor(Date.now()/3600000), fixture=(seed%4)*2;
let clubs=[TEAMS[fixture],TEAMS[fixture+1]];
const crowdLines=[
  'THE SUNDAY ANIMAL NEVER SLEEPS.',
  'SIX-A-SIDE FOOTBALL. NO DEAD AIR. EVERY SNAP MATTERS.',
  'THE CROWD HAS BEEN ON ITS FEET SINCE THE OPENING KICK.',
  'WIN PROBABILITY IS MOVING WITH EVERY YARD.',
  'NEXT SCORE OWNS THE NIGHT.'
];

// ----- scene / field -----
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75)); renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.12;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x02060b); scene.fog=new THREE.FogExp2(0x031017,.0085);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,400);
const composer=new EffectComposer(renderer); composer.addPass(new RenderPass(scene,camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.52,.58,.84));
scene.add(new THREE.HemisphereLight(0xa4d9ff,0x07110d,1.05));
const sun=new THREE.DirectionalLight(0xecffff,1.5); sun.position.set(-12,40,18); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.left=-65; sun.shadow.camera.right=65; sun.shadow.camera.top=45; sun.shadow.camera.bottom=-45; scene.add(sun);

const field=new THREE.Group(); scene.add(field);
const turf=new THREE.Mesh(new THREE.PlaneGeometry(100,53.3),new THREE.MeshStandardMaterial({color:0x123b2f,roughness:.86,metalness:.02})); turf.rotation.x=-Math.PI/2; turf.receiveShadow=true; field.add(turf);
for(let x=-50;x<50;x+=10){
  const band=new THREE.Mesh(new THREE.PlaneGeometry(10,53.1),new THREE.MeshBasicMaterial({color:(Math.round((x+50)/10)%2)?0x164738:0x103b2f,transparent:true,opacity:.58})); band.rotation.x=-Math.PI/2; band.position.set(x+.02,.006,0); field.add(band);
}
const lineMat=new THREE.MeshBasicMaterial({color:0xdffcf5,transparent:true,opacity:.64});
function stripe(x,w=.09,z=0,len=52){ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,len),lineMat); m.rotation.x=-Math.PI/2; m.position.set(x,.018,z); field.add(m); return m; }
for(let x=-45;x<=45;x+=5) stripe(x,x%10===0?.13:.06);
for(const z of[-FIELD_Z,FIELD_Z]){ const m=new THREE.Mesh(new THREE.PlaneGeometry(100,.14),lineMat); m.rotation.x=-Math.PI/2; m.position.set(0,.02,z); field.add(m); }
for(let x=-40;x<=40;x+=5) for(const z of[-8.5,8.5]){ const h=new THREE.Mesh(new THREE.PlaneGeometry(.13,1.1),lineMat); h.rotation.x=-Math.PI/2; h.position.set(x,.022,z); field.add(h); }
for(const side of[-1,1]){
  const ez=new THREE.Mesh(new THREE.PlaneGeometry(10,53),new THREE.MeshBasicMaterial({color:side<0?clubs[0].kit:clubs[1].kit,transparent:true,opacity:.18})); ez.rotation.x=-Math.PI/2; ez.position.set(side*50,.024,0); field.add(ez);
  const postMat=new THREE.MeshStandardMaterial({color:0xffdf58,emissive:0xffb400,emissiveIntensity:.6,roughness:.3});
  const upr=new THREE.Group(); upr.position.set(side*46.5,0,0);
  const bar=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,6.5,8),postMat); bar.position.y=3.25;
  const cross=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,6.2,8),postMat); cross.rotation.x=Math.PI/2; cross.position.y=3.2;
  const p1=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,5.5,8),postMat); p1.position.set(0,5.9,3.1);
  const p2=p1.clone(); p2.position.z=-3.1; upr.add(bar,cross,p1,p2); field.add(upr);
}

// stadium bowl and pulsing crowd
const crowdMats=[];
for(const zSide of[-1,1]){
  for(let row=0;row<7;row++){
    const mat=new THREE.MeshBasicMaterial({color:row%2?0x4d7080:0x314f5c,transparent:true,opacity:.5}); crowdMats.push(mat);
    const stand=new THREE.Mesh(new THREE.BoxGeometry(112,1.3,2.0),mat); stand.position.set(0,1.2+row*.8,zSide*(31+row*1.15)); stand.rotation.x=zSide*-.12; field.add(stand);
    for(let i=0;i<65;i++){
      const dot=new THREE.Mesh(new THREE.SphereGeometry(.12,5,4),new THREE.MeshBasicMaterial({color:(i+row)%7===0?clubs[(i+row)%2].kit:0x9cb4bd}));
      dot.position.set(-54+i*1.69,2+row*.8+Math.sin(i*2.1)*.12,zSide*(29.9+row*1.15)); field.add(dot);
    }
  }
}
for(const xSide of[-1,1]){
  const stand=new THREE.Mesh(new THREE.BoxGeometry(4,5,59),new THREE.MeshBasicMaterial({color:0x1a313a})); stand.position.set(xSide*55,2.1,0); field.add(stand);
}
for(const x of[-42,-14,14,42]) for(const z of[-36,36]){
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(.1,.16,18,8),new THREE.MeshStandardMaterial({color:0x3f5660,metalness:.7})); pole.position.set(x,8,z); field.add(pole);
  const lamp=new THREE.PointLight(0xd8ffff,16,70,2); lamp.position.set(x,17,z); field.add(lamp);
}

const scrimmage=stripe(0,.22); scrimmage.material=new THREE.MeshBasicMaterial({color:0x38bfff,transparent:true,opacity:.85});
const firstLine=stripe(10,.2); firstLine.material=new THREE.MeshBasicMaterial({color:0xffd54a,transparent:true,opacity:.9});
const shadowMat=new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.27,depthWrite:false});

// ----- players -----
const players=[];
const ROLE_A=['QB','RB','WR','WR','C','G'];
for(let team=0;team<2;team++) for(let i=0;i<6;i++){
  const rig=buildBlobRig({kitColor:clubs[team].kit,glowColor:clubs[team].glow,captain:i===0});
  const pads=new THREE.Mesh(new THREE.CapsuleGeometry(.56,.18,4,10),new THREE.MeshStandardMaterial({color:clubs[team].kit,emissive:clubs[team].glow,emissiveIntensity:.18,roughness:.5})); pads.rotation.z=Math.PI/2; pads.position.y=1.48; rig.group.add(pads);
  const stripeMesh=new THREE.Mesh(new THREE.BoxGeometry(.13,.63,.46),new THREE.MeshBasicMaterial({color:0xf7ffff})); stripeMesh.position.set(0,1.17,-.26); rig.group.add(stripeMesh);
  const shadow=new THREE.Mesh(new THREE.CircleGeometry(.62,20),shadowMat); shadow.rotation.x=-Math.PI/2; shadow.position.y=.01; rig.group.add(shadow);
  rig.group.scale.setScalar(.9); scene.add(rig.group);
  players.push({team,i,name:clubs[team].roster[i],role:'',rig,x:0,z:0,vx:0,vz:0,targetX:0,targetZ:0,speed:7.1,down:false,route:0,blocked:0});
}
const football=new THREE.Mesh(new THREE.SphereGeometry(.24,12,8),new THREE.MeshStandardMaterial({color:0x743b1f,roughness:.7})); football.scale.set(1.65,.72,.72); football.castShadow=true; scene.add(football);
const ballTrail=[];
for(let i=0;i<12;i++){ const b=new THREE.Mesh(new THREE.SphereGeometry(.1*(1-i/15),7,5),new THREE.MeshBasicMaterial({color:0xfff4c0,transparent:true,opacity:.45*(1-i/12)})); scene.add(b); ballTrail.push(b); }

const S={mode:'PREPLAY',quarter:1,clock:QUARTER_LEN,score:[0,0],possession:0,down:1,toGo:10,los:-20,first:-10,play:'',t:0,carrier:null,pass:null,playStart:-20,gain:0,last:'OPENING DRIVE',momentT:0,quarterPending:false,overtime:false,gameOver:false,userJukes:0,userBursts:0,playCount:0};
const input={left:false,right:false,boost:false,juke:false,pass:false};
const events=[];
function pushEvent(text){ S.last=text; events.unshift(text); if(events.length>6)events.length=6; el('tickerText').textContent=`${text}   //   ${pick(crowdLines)}`; tickerX=innerWidth; }
function offense(){ return players.filter(p=>p.team===S.possession); }
function defense(){ return players.filter(p=>p.team!==S.possession); }
function dir(){ return S.possession===0?1:-1; }
function ordinal(n){ return n===1?'1ST':n===2?'2ND':n===3?'3RD':'4TH'; }
function distanceGoal(){ return Math.max(0,45-dir()*S.los); }

function setFixtureUI(){
  for(let t=0;t<2;t++){
    el('city'+(t?'B':'A')).textContent=clubs[t].city; el('name'+(t?'B':'A')).textContent=clubs[t].name;
    const sw=el('swatch'+(t?'B':'A')); sw.style.color=clubs[t].css; sw.style.background=clubs[t].css;
  }
}
setFixtureUI();

function placePreplay(){
  const d=dir(), off=offense(), def=defense();
  const spots=[[-3,0],[-5,4],[-1,-20],[-1,20],[-.7,-4],[-.7,4]];
  off.forEach((p,i)=>{p.role=ROLE_A[i]; p.x=S.los+spots[i][0]*d; p.z=spots[i][1]; p.vx=p.vz=0; p.down=false; p.rig.clearOverlay();});
  const dspots=[[3,0],[5,-8],[5,8],[4,-19],[4,19],[8,0]];
  def.forEach((p,i)=>{p.role=['MLB','EDGE','EDGE','CB','CB','S'][i]; p.x=S.los+dspots[i][0]*d; p.z=dspots[i][1]; p.vx=p.vz=0; p.down=false; p.rig.clearOverlay();});
  S.carrier=off[0]; S.pass=null; football.position.set(S.los-d*.35,1,.15);
  scrimmage.position.x=S.los; firstLine.position.x=S.first;
}

function choosePlay(){
  const fourth=S.down===4, close=distanceGoal()<34;
  if(fourth && S.toGo>3 && close) return 'FIELD GOAL';
  if(fourth && S.toGo>4 && !close) return 'PUNT';
  const nearGoal=distanceGoal()<8;
  if(nearGoal) return Math.random()<.58?'POWER RUSH':'FADE PASS';
  return Math.random()<.51?'POWER RUSH':(Math.random()<.5?'CROSSING PASS':'DEEP SHOT');
}
function beginPreplay(){
  S.mode='PREPLAY'; S.t=0; S.play=choosePlay(); S.playStart=S.los; S.gain=0; S.runLane=(Math.random()<.5?-1:1)*(3+Math.random()*4); placePreplay();
  el('playcall').textContent=(S.play.includes('PASS')||S.play==='DEEP SHOT'?'PASS // ':'RUSH // ')+S.play;
  if(S.play==='FIELD GOAL'||S.play==='PUNT') el('playcall').textContent=`SPECIAL TEAMS // ${S.play}`;
  el('playcall').classList.add('show');
}
function snap(){
  S.mode=(S.play==='FIELD GOAL'||S.play==='PUNT')?'KICK':'LIVE'; S.t=0; S.playCount++;
  el('playcall').classList.remove('show');
  if(S.mode==='LIVE') pushEvent(`${clubs[S.possession].abbr} SNAP // ${S.play}`);
}
function flashMoment(title,sub,color){ const box=el('moment'); box.style.setProperty('--moment',color); box.querySelector('h1').textContent=title; box.querySelector('p').textContent=sub; box.classList.add('show'); S.momentT=1.55; }
function scoreTouchdown(){
  S.score[S.possession]+=7; S.mode='CELEBRATE'; S.t=0; S.gain=(S.carrier.x-S.playStart)*dir();
  pushEvent(`TOUCHDOWN ${S.carrier?.name || clubs[S.possession].name} // ${clubs[S.possession].abbr} +7`);
  flashMoment('TOUCHDOWN',`${S.carrier?.name || clubs[S.possession].name} // 7 POINTS`,clubs[S.possession].css);
  crowdHeat=1; shake=1.4;
}
function endPlay(reason){
  if(S.mode!=='LIVE')return; S.mode='WHISTLE'; S.t=0;
  const d=dir(); S.gain=Math.round((S.carrier.x-S.playStart)*d);
  S.los=clamp(S.carrier.x,-44,44);
  if(reason==='INCOMPLETE'){ S.los=S.playStart; S.gain=0; }
  if(S.gain>=S.toGo){ S.down=1; S.toGo=Math.min(10,Math.ceil(distanceGoal())); S.first=S.los+d*S.toGo; pushEvent(`FIRST DOWN ${clubs[S.possession].abbr} // ${Math.max(0,S.gain)} YARD GAIN`); flashMoment('FIRST DOWN',`${clubs[S.possession].name} MOVE THE CHAINS`,'#ffd45d'); crowdHeat=.45; }
  else { S.down++; S.toGo=Math.max(1,S.toGo-S.gain); S.first=S.los+d*S.toGo; pushEvent(`${reason} // ${S.gain>=0?'+':''}${S.gain} YARDS // ${ordinal(Math.min(S.down,4))} DOWN`); }
  if(S.down>4){
    const prev=S.possession; S.possession=1-S.possession; S.down=1; S.toGo=Math.min(10,Math.ceil(45-(S.possession===0?1:-1)*S.los)); S.first=S.los+dir()*S.toGo;
    pushEvent(`TURNOVER ON DOWNS // ${clubs[1-prev].abbr} BALL`); flashMoment('TURNOVER',`${clubs[S.possession].name} TAKE POSSESSION`,'#ff5f86'); crowdHeat=.6;
  }
}
function changePossession(kind='KICKOFF'){
  S.possession=1-S.possession; S.down=1; S.toGo=10; S.los=S.possession===0?-20:20; S.first=S.los+dir()*10; pushEvent(`${kind} // ${clubs[S.possession].abbr} START AT THE 25`); beginPreplay();
}
function doFieldGoal(){
  const yards=Math.round(distanceGoal()+17), chance=clamp(.94-(yards-25)*.012,.48,.96), good=Math.random()<chance;
  if(good){ S.score[S.possession]+=3; pushEvent(`FIELD GOAL GOOD FROM ${yards} // ${clubs[S.possession].abbr} +3`); flashMoment('GOOD',`${yards} YARD FIELD GOAL`,'#ffd45e'); crowdHeat=.65; }
  else { pushEvent(`FIELD GOAL NO GOOD FROM ${yards}`); flashMoment('NO GOOD',`${clubs[1-S.possession].name} TAKE OVER`,'#ff5b78'); }
  S.mode='CELEBRATE'; S.t=0; S.kickResult=good?'FG':'MISS';
}
function doPunt(){ S.los=clamp(S.los+dir()*(32+Math.random()*15),-38,38); pushEvent(`PUNT DOWNED // ${Math.round(Math.abs(S.los))} YARD LINE`); S.mode='CELEBRATE'; S.t=0; S.kickResult='PUNT'; }

function targetReceiver(){
  const rec=offense().filter(p=>p.role==='WR');
  return rec.sort((a,b)=>{ const sep=p=>Math.min(...defense().map(d=>Math.hypot(d.x-p.x,d.z-p.z))); return sep(b)-sep(a); })[0];
}
function throwPass(manual=false){
  if(S.pass||!S.carrier||S.carrier.role!=='QB')return;
  const target=targetReceiver(); if(!target)return;
  const lead=dir()*(manual?3.6:2.5); S.pass={from:{x:S.carrier.x,z:S.carrier.z},to:{x:target.x+lead,z:target.z},target,t:0,dur:clamp(Math.hypot(target.x-S.carrier.x,target.z-S.carrier.z)/25,.38,1.05)};
  S.carrier=null; input.pass=false; pushEvent(`${manual?'USER ':'AI '}PASS RELEASED // TARGET ${target.name}`); shake=.2;
}
function attemptJuke(){
  if(!S.carrier||S.mode!=='LIVE'||S.carrier.team!==S.possession||S.jukeCd>0)return;
  S.jukeCd=1.35; S.jukeImmune=.48; S.userJukes++; const side=input.left?-1:input.right?1:(Math.random()<.5?-1:1); S.carrier.vz+=side*9; S.carrier.rig.poseSkill('juke',.7); input.juke=false; pushEvent(`JUKE MOVE // ${clubs[S.possession].abbr} BALL CARRIER`);
}
function turnoverAt(x,kind){
  S.los=clamp(x,-44,44); S.possession=1-S.possession; S.down=1; S.toGo=Math.min(10,Math.ceil(45-dir()*S.los)); S.first=S.los+dir()*S.toGo; S.mode='WHISTLE'; S.t=0; pushEvent(`${kind} // ${clubs[S.possession].abbr} TAKE IT`); flashMoment('TURNOVER',`${clubs[S.possession].name} BALL`,'#ff5e83'); crowdHeat=.7;
}

function steerCarrier(p,dt,base){
  let side=(input.right?1:0)-(input.left?1:0); const boosting=input.boost&&S.burstFuel>0;
  if(boosting){ S.burstFuel=Math.max(0,S.burstFuel-dt); S.userBursts++; } else S.burstFuel=Math.min(1,S.burstFuel+dt*.18);
  const speed=base+(boosting?2.4:0); p.targetX=p.x+dir()*speed; p.targetZ=clamp(p.z+side*speed*.75,-25.6,25.6);
  if(side===0&&p.role==='RB') p.targetZ=lerp(p.z,S.runLane,.22);
}
function moveToward(p,tx,tz,speed,dt){
  const dx=tx-p.x,dz=tz-p.z,len=Math.hypot(dx,dz)||1; const wantX=dx/len*speed,wantZ=dz/len*speed;
  p.vx+= (wantX-p.vx)*damp(8,dt); p.vz+=(wantZ-p.vz)*damp(8,dt);
  p.x+=p.vx*dt; p.z+=p.vz*dt; p.z=clamp(p.z,-26,26); p.x=clamp(p.x,-49,49);
}

function updateLive(dt){
  S.clock=Math.max(0,S.clock-dt); S.jukeCd=Math.max(0,(S.jukeCd||0)-dt); S.jukeImmune=Math.max(0,(S.jukeImmune||0)-dt); S.burstFuel=S.burstFuel??1;
  const d=dir(), off=offense(), def=defense();
  if(S.t<.18){ football.position.x=lerp(S.los,S.los-3*d,S.t/.18); return; }
  const passPlay=S.play.includes('PASS')||S.play==='DEEP SHOT';
  if(!passPlay && S.carrier.role==='QB' && S.t>.36){ S.carrier=off[1]; pushEvent(`HANDOFF // ${clubs[S.possession].abbr} POWER RUN`); }
  off.forEach((p,i)=>{
    if(p===S.carrier){ steerCarrier(p,dt,passPlay&&p.role==='QB'?4.1:7.5); moveToward(p,p.targetX,p.targetZ,passPlay&&p.role==='QB'?4.2:7.8,dt); return; }
    if(p.role==='WR'){
      const lane=p.i===2?-1:1, routeX=S.play==='CROSSING PASS'?(S.playStart+d*(9+S.t*3)):p.x+d*7;
      const routeZ=S.play==='CROSSING PASS'?(lane*(18-S.t*7)):p.z+Math.sin(S.t*1.7+p.i)*1.2;
      moveToward(p,routeX,clamp(routeZ,-23,23),7.3,dt); return;
    }
    if(p.role==='RB'&&passPlay){ moveToward(p,S.playStart-d*1,clamp(p.z+d*0+Math.sin(S.t)*4,-18,18),5.5,dt); return; }
    const target=def[(i+1)%def.length]; moveToward(p,target.x-d*.6,target.z,4.2,dt);
  });
  def.forEach((p,i)=>{
    let tx,tz,speed=7;
    const blockers=off.filter(o=>o.role==='C'||o.role==='G'); const blocker=blockers.find(b=>Math.hypot(b.x-p.x,b.z-p.z)<1.55);
    if(S.pass){ tx=S.pass.to.x; tz=S.pass.to.z; speed=8.1; }
    else if(S.carrier){
      if(passPlay&&S.carrier.role==='QB'&&(p.role==='CB'||p.role==='S')){ const wr=off.filter(o=>o.role==='WR')[i%2]; tx=wr.x+d*.65; tz=wr.z+(i%2?.6:-.6); speed=6.7; }
      else {
        tx=S.carrier.x+d*.25; tz=S.carrier.z;
        const openField=Math.abs(S.carrier.x-S.playStart)>9;
        speed=openField?8.65:7.15;
      }
    } else { tx=S.los; tz=0; }
    p.blocked=blocker&&p.role!=='CB'?.22:Math.max(0,(p.blocked||0)-dt);
    if(p.blocked>0){ speed*=.18; p.rig.poseShield(.5,i%2?1:-1); }
    moveToward(p,tx,tz,speed,dt);
  });
  if(passPlay&&S.carrier?.role==='QB'&&((input.pass&&S.t>.45)||S.t>1.72)) throwPass(!!input.pass);
  if(input.juke) attemptJuke();
  if(S.pass){
    S.pass.t+=dt; const k=clamp(S.pass.t/S.pass.dur,0,1), x=lerp(S.pass.from.x,S.pass.to.x,k),z=lerp(S.pass.from.z,S.pass.to.z,k),y=1.5+Math.sin(k*Math.PI)*(3+S.pass.dur*2);
    football.position.set(x,y,z); football.rotation.z+=dt*20; football.rotation.x+=dt*11;
    if(k>=1){
      const nearDef=defense().find(p=>Math.hypot(p.x-x,p.z-z)<1.45); const target=S.pass.target;
      if(nearDef&&Math.random()<.23){ turnoverAt(x,'INTERCEPTION'); S.pass=null; S.carrier=nearDef; return; }
      if(Math.hypot(target.x-x,target.z-z)<3.5 && Math.random()<.88){ S.carrier=target; S.carrier.x=x; S.carrier.z=z; pushEvent(`COMPLETE // ${clubs[S.possession].abbr} RECEIVER IN STRIDE`); }
      else { S.carrier=target; S.carrier.x=S.playStart; S.carrier.z=0; S.pass=null; endPlay('INCOMPLETE'); return; }
      S.pass=null;
    }
  } else if(S.carrier){ football.position.set(S.carrier.x-d*.18,1.22,S.carrier.z+.36); football.rotation.z+=dt*4; }
  if(S.carrier&&S.carrier.team===S.possession){
    for(const p of def){
      const dist=Math.hypot(p.x-S.carrier.x,p.z-S.carrier.z);
      const pocketGrace=passPlay&&S.carrier.role==='QB'&&S.t<1.9;
      if(!pocketGrace&&(p.blocked||0)<=0&&dist<1.0&&S.t>.78&&S.jukeImmune<=0){
        const hit=Math.random()<clamp(.48+(1-dist)*.46,0,1);
        if(hit){ S.carrier.rig.poseFall(.9); p.rig.poseSlideTackle(.75); shake=.75; crowdHeat=.3; endPlay('TACKLED'); break; }
        p.rig.poseFall(.7); S.jukeImmune=.28; shake=.18;
      }
    }
    if(S.mode==='LIVE'&&d*S.carrier.x>=45){ scoreTouchdown(); return; }
    if(S.mode==='LIVE'&&Math.abs(S.carrier.z)>=25.9) endPlay('OUT OF BOUNDS');
  }
  if(S.clock<=0) S.quarterPending=true;
}

function updateKick(dt){
  const d=dir(), kicker=offense()[0];
  moveToward(kicker,S.los+d*1,0,6,dt); kicker.rig.poseKick(clamp((S.t-.4)*1.8,0,1));
  const k=clamp((S.t-.7)/1.25,0,1); football.position.set(lerp(S.los,46*d,k),1.1+Math.sin(k*Math.PI)*13,Math.sin(k*5)*.3); football.rotation.z+=dt*18;
  if(S.t>2.05){ if(S.play==='FIELD GOAL')doFieldGoal(); else doPunt(); }
}
function nextQuarter(){
  S.quarterPending=false;
  if(S.quarter>=4){
    if(S.quarter===4&&S.score[0]===S.score[1]&&!S.overtime){ S.overtime=true; S.quarter=5; S.clock=45; flashMoment('OVERTIME','NEXT SCORE CAN END IT','#ffdb74'); pushEvent('OVERTIME // SUDDEN DEATH RULES'); beginPreplay(); }
    else finishGame();
    return;
  }
  S.quarter++; S.clock=QUARTER_LEN; flashMoment('NEW QUARTER',`${ordinal(S.quarter)} QUARTER // ${clubs[S.possession].abbr} BALL`,'#69ffe0'); beginPreplay();
}
function finishGame(){ S.gameOver=true; S.mode='FINAL'; el('winnerText').textContent=S.score[0]===S.score[1]?'DRAW':`${clubs[S.score[0]>S.score[1]?0:1].city} ${clubs[S.score[0]>S.score[1]?0:1].name} WIN`; el('finalscore').textContent=`${S.score[0]} – ${S.score[1]}`; el('final').classList.add('show'); pushEvent(`FINAL // ${clubs[0].abbr} ${S.score[0]} — ${clubs[1].abbr} ${S.score[1]}`); }

let simTotal=0,shake=0,crowdHeat=0,tickerX=innerWidth;
function update(dt,skipRender=false){
  simTotal+=dt; S.t+=dt; S.momentT=Math.max(0,S.momentT-dt); if(S.momentT===0)el('moment').classList.remove('show');
  if(S.mode==='PREPLAY'&&S.t>1.65)snap();
  else if(S.mode==='LIVE')updateLive(dt);
  else if(S.mode==='KICK')updateKick(dt);
  else if(S.mode==='WHISTLE'&&S.t>1.45){ if(S.quarterPending)nextQuarter(); else beginPreplay(); }
  else if(S.mode==='CELEBRATE'){
    offense().forEach(p=>p.rig.poseCelebrate(S.t));
    if(S.t>2.35){ if(S.overtime&&(S.kickResult==='FG'||S.last.includes('TOUCHDOWN')))finishGame(); else if(S.quarterPending)nextQuarter(); else changePossession(S.kickResult==='PUNT'?'PUNT RETURN':'KICKOFF'); S.kickResult=''; }
  }
  crowdHeat=Math.max(0,crowdHeat-dt*.32); shake=Math.max(0,shake-dt*1.5);
  if(skipRender)return;
  renderScene(dt); updateHud(dt);
}
function renderScene(dt){
  for(const p of players){ const speed=Math.hypot(p.vx,p.vz); p.rig.group.position.set(p.x,0,p.z); p.rig.group.rotation.y=Math.atan2(p.vz,p.vx)-Math.PI/2; p.rig.update(dt,clamp(speed/8,0,1),{accel:speed/8}); }
  for(let i=ballTrail.length-1;i>0;i--) ballTrail[i].position.lerp(ballTrail[i-1].position,.56);
  ballTrail[0].position.copy(football.position); ballTrail.forEach((b,i)=>b.visible=!!S.pass&&i<10);
  const focus=S.carrier?S.carrier.x:football.position.x, mobile=innerWidth<700;
  const camTarget=new THREE.Vector3(clamp(focus, -31,31),0,0); const cp=mobile?new THREE.Vector3(clamp(focus-6*dir(),-28,28),38,33):new THREE.Vector3(clamp(focus-9*dir(),-25,25),27,35);
  camera.position.lerp(cp,damp(2.8,dt)); if(shake){camera.position.x+=(Math.random()-.5)*shake;camera.position.y+=(Math.random()-.5)*shake*.25;}
  camera.lookAt(camTarget.x,0,0); composer.render();
  crowdMats.forEach((m,i)=>m.opacity=.46+crowdHeat*.38+Math.sin(simTotal*2+i)*.03);
}
function updateHud(dt){
  el('scoreA').textContent=S.score[0]; el('scoreB').textContent=S.score[1];
  const sec=Math.max(0,Math.ceil(S.clock)); el('clock').textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
  el('quarter').textContent=S.overtime?'OVERTIME':`${ordinal(S.quarter)} QUARTER`;
  const possessionMark=S.possession===0?' ◀':' ▶'; el('down').textContent=`${ordinal(S.down)} & ${Math.ceil(S.toGo)}${possessionMark}`;
  el('actionBtn').textContent=S.mode==='LIVE'&&(S.play.includes('PASS')||S.play==='DEEP SHOT')&&S.carrier?.role==='QB'?'PASS':'JUKE';
  tickerX-=dt*82; const w=el('tickerText').offsetWidth||600; if(tickerX<-w-40)tickerX=innerWidth; el('tickerText').style.transform=`translateX(${tickerX}px)`;
}

function renderGameToText(){
  return JSON.stringify({
    note:'Field coordinates use x from -50 to +50 (left end zone to right end zone), z from -26.65 to +26.65 (top sideline to bottom sideline). Team 0 attacks +x; team 1 attacks -x.',
    mode:S.mode,quarter:S.overtime?'OT':S.quarter,clock:+S.clock.toFixed(1),score:{home:S.score[0],away:S.score[1]},
    teams:clubs.map(c=>`${c.city} ${c.name}`),possession:clubs[S.possession].abbr,down:S.down,toGo:+S.toGo.toFixed(1),lineOfScrimmage:+S.los.toFixed(1),firstDownLine:+S.first.toFixed(1),play:S.play,playTime:+S.t.toFixed(2),
    ball:S.pass?{status:'airborne',x:+football.position.x.toFixed(1),y:+football.position.y.toFixed(1),z:+football.position.z.toFixed(1)}:{status:S.carrier?'carried':'dead',carrier:S.carrier?`${clubs[S.carrier.team].abbr}-${S.carrier.role}`:null,x:+football.position.x.toFixed(1),z:+football.position.z.toFixed(1)},
    interactive:{steer:'left/right arrows',burst:'space or up',juke:'J',pass:'P during pass play',jukeCooldown:+(S.jukeCd||0).toFixed(2),burstFuel:+(S.burstFuel??1).toFixed(2)},
    visiblePlayers:players.map(p=>({name:p.name,team:clubs[p.team].abbr,role:p.role,x:+p.x.toFixed(1),z:+p.z.toFixed(1)})),lastEvent:S.last,gameOver:S.gameOver
  });
}
window.render_game_to_text=renderGameToText;
window.advanceTime=ms=>{ const n=Math.max(1,Math.round(ms/(1000/60))); for(let i=0;i<n;i++)update(1/60,i<n-1); renderScene(1/60); updateHud(0); return renderGameToText(); };
window._footballDebug=()=>({state:S,events:[...events]});

function keySet(e,on){
  if(['ArrowLeft','ArrowRight','ArrowUp',' ','j','J','a','A','p','P','b','B','f','F'].includes(e.key))e.preventDefault();
  if(e.key==='ArrowLeft')input.left=on; if(e.key==='ArrowRight')input.right=on; if(e.key==='ArrowUp'||e.key===' ')input.boost=on;
  if(on&&(e.key==='j'||e.key==='J'||e.key==='a'||e.key==='A')){input.juke=true;attemptJuke();}
  if(on&&(e.key==='p'||e.key==='P'||e.key==='b'||e.key==='B')){input.pass=true;throwPass(true);}
  if(on&&(e.key==='f'||e.key==='F')){ if(!document.fullscreenElement)document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
  if(on&&e.key==='Escape'&&!document.fullscreenElement)location.href='world.html';
}
addEventListener('keydown',e=>keySet(e,true)); addEventListener('keyup',e=>keySet(e,false));
document.querySelectorAll('[data-hold]').forEach(btn=>{
  const k=btn.dataset.hold; const set=on=>{input[k]=on;btn.classList.toggle('down',on);};
  btn.addEventListener('pointerdown',e=>{e.preventDefault();set(true);btn.setPointerCapture(e.pointerId);}); btn.addEventListener('pointerup',()=>set(false)); btn.addEventListener('pointercancel',()=>set(false));
});
el('actionBtn').addEventListener('pointerdown',e=>{ e.preventDefault(); if(S.mode==='LIVE'&&(S.play.includes('PASS')||S.play==='DEEP SHOT')&&S.carrier?.role==='QB')throwPass(true); else {input.juke=true;attemptJuke();} });
el('restart').addEventListener('click',()=>location.reload());
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);tickerX=Math.min(tickerX,innerWidth);});

beginPreplay(); pushEvent(`${clubs[0].city} ${clubs[0].name} VS ${clubs[1].city} ${clubs[1].name} // LIVE NOW`);
let prev=performance.now(),raf=0;
function loop(now){raf=requestAnimationFrame(loop);const dt=Math.min(.05,(now-prev)/1000);prev=now;if(dt>0)update(dt);}
raf=requestAnimationFrame(loop);
</script>
</body>
