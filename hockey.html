<style>

    #goalflash { z-index:45; }

    #bigcard { z-index:80; padding:12px; }

    .team .tc { --score-fit-max:11px; --score-fit-min:7.5px; --score-fit-floor:5.75px; --score-fit-tracking:1.2px; font-size:11px; letter-spacing:1.2px; }
    .team .dot { width:7px; height:7px; flex-basis:7px; }

</style>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { buildBlobRig, CLASSIC_PLAYER_COLORS, classicPlayerColor } from './blobrig.js';

const classicSideVisual = side => classicPlayerColor(Number(side) % CLASSIC_PLAYER_COLORS.length);

// ============ CONSTANTS ============
const RINK_W = 56, RINK_H = 26;          // x = length, z = width
const BX = RINK_W/2, BZ = RINK_H/2, BR = 7.5; // board half-extents + corner radius
const GLX = 24;                           // goal line |x|
const BLX = 8;                            // blue lines
const NW = 4.2;                           // goal mouth width
const PERIOD_LEN = 90, OT_LEN = 45, MAXS = 8.6;
const PY = 0.1;                           // puck rest height
const dampK = (k, dt) => 1 - Math.exp(-k * dt);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const HOCKEY_CONTENT=window.CYBERLIGA_CONTENT;
const HOCKEY_BRAND=window.CyberligaBrand;
const HOCKEY_TEAMS=HOCKEY_CONTENT.getTeams('hockey');
const LEAGUE_TEAMS=HOCKEY_TEAMS.map(team=>{const hex=Number.parseInt(team.colors.primary.slice(1),16);return {
  id:team.id,name:team.name,code:team.code,css:team.colors.primary,kit:hex,glow:hex,
  secondary:Number.parseInt(team.colors.secondary.slice(1),16),accent:Number.parseInt(team.colors.accent.slice(1),16),
  source:team,brand:HOCKEY_BRAND?.getTeam(team.id)||{venue:'HOME ICE',venueLine:team.city,ritual:'The home end carries the signal.',statement:team.motion,mark:'pulse',scene:'snowcity',kitPattern:'pulse'}
};});
const FIXTURES=HOCKEY_CONTENT.createSeason('hockey','arena').rounds.flatMap(round=>round.matches.map(match=>[HOCKEY_TEAMS.findIndex(t=>t.id===match.homeId),HOCKEY_TEAMS.findIndex(t=>t.id===match.awayId)]));
const ROSTERS=Object.fromEntries(HOCKEY_TEAMS.map(team=>[team.name,team.athletes.map(a=>a.name)])); // [goalie, C, W, W, D, D]
const fixtureQuery = new URLSearchParams(location.search);
const requestedFixture = parseInt(fixtureQuery.get('match') ?? fixtureQuery.get('fixture'), 10);
const freshEntryRequested=fixtureQuery.get('fresh')==='1'||fixtureQuery.get('test')==='1';
const requestedEntryBucket=parseInt(fixtureQuery.get('bucket'),10);
const requestedTuneInParam=fixtureQuery.get('at');
const requestedTuneInSeconds=requestedTuneInParam===null?NaN:Number(requestedTuneInParam);
const entryBucket=Number.isFinite(requestedEntryBucket)?requestedEntryBucket:Math.floor(Date.now()/45000);
function entryHash(value){let h=2166136261;for(const c of String(value)){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
let fixtureIdx = (Number.isFinite(requestedFixture) && requestedFixture >= 0
  ? requestedFixture
  : (parseInt(localStorage.getItem('cl_ice_fx'), 10) || 0)) % FIXTURES.length;
let TEAM_A, TEAM_B;
let simSeed=1;
function hashSeed(value){let h=2166136261>>>0;for(const c of String(value)){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function resetSimSeed(){simSeed=hashSeed(`ice-v4|${fixtureIdx}|${TEAM_A?.code||''}|${TEAM_B?.code||''}`)||1;}
function rnd(){simSeed|=0;simSeed=simSeed+0x6D2B79F5|0;let t=Math.imul(simSeed^simSeed>>>15,1|simSeed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
const ATT = [1, -1]; // team 0 attacks +x, team 1 attacks -x
const ROLES = ['G','C','LW','RW','LD','RD'];
const SYSTEMS = [
  { offense:'LOW-TO-HIGH CYCLE', entry:'WIDE DRIVE', forecheck:'2–1–2 HUNT', neutral:'1–2–2 RED', coverage:'BOX + ONE', pace:1.02 },
  { offense:'OVERLOAD + SEAM', entry:'DROP ENTRY', forecheck:'1–2–2 ANGLE', neutral:'1–3–1 TRAP', coverage:'COLLAPSE', pace:.94 },
  { offense:'BEHIND-NET ROTATION', entry:'CHIP + CHASE', forecheck:'2–3 LOCK', neutral:'2–1–2 PRESS', coverage:'MAN + SWITCH', pace:1.08 },
  { offense:'POINT SHOT + SCREEN', entry:'MIDDLE-LANE DRIVE', forecheck:'1–1–3 CONTAIN', neutral:'1–1–3 WALL', coverage:'LAYERED SLOT', pace:.98 }
];

// ============ RENDERER / SCENE ============
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02030a);
scene.fog = new THREE.FogExp2(0x040618, 0.007);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture; // cheap icy reflections

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 16, BZ + 21);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass=new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight),0.55,0.6,0.82);
composer.addPass(bloomPass);

// ============ LIGHTING (no shadows — frugal) ============
scene.add(new THREE.HemisphereLight(0x5a70b8, 0x0a0d1a, 1.0));
const key = new THREE.DirectionalLight(0xcfe2ff, 1.1);
key.position.set(18, 42, 26); scene.add(key);
const rim = new THREE.DirectionalLight(0x335a9a, 0.5);
rim.position.set(-22, 30, -30); scene.add(rim);

// ============ ICE ============
const iceCanvas = document.createElement('canvas');
iceCanvas.width = 2048; iceCanvas.height = 1088;
const PAD = 4, PW = RINK_W + PAD*2, PH = RINK_H + PAD*2;
function drawIceIdentity(g, pattern, color, cx, cy, size){
  g.save();g.translate(cx,cy);g.strokeStyle=color;g.fillStyle=color;g.lineWidth=Math.max(3,size*.018);g.globalAlpha=.14;
  if(pattern==='rings'||pattern==='crystal'){for(const r of [.24,.44,.64]){g.beginPath();g.arc(0,0,size*r,0,Math.PI*2);g.stroke();}}

function roundedRectShape(hw, hh, r) {

  s.lineTo(-hw, -hh + r); s.absarc(-hw + r, -hh + r, r, Math.PI, Math.PI*1.5, false);
  return s;
}

// rounded-rect board collision: resolves position + reflects velocity. returns impact speed
function boardResolve(o, r, rest, tang) {
  const qx = Math.abs(o.x) - (BX - BR), qz = Math.abs(o.z) - (BZ - BR);
  if (qx > 0 && qz > 0) { // corner arc
    const cx = Math.sign(o.x)*(BX - BR), cz = Math.sign(o.z)*(BZ - BR);
    const dx = o.x - cx, dz = o.z - cz, d = Math.hypot(dx, dz) || 1e-6;
    if (d > BR - r) {
      const nx = dx/d, nz = dz/d;
      o.x = cx + nx*(BR - r); o.z = cz + nz*(BR - r);
      const vn = o.vx*nx + o.vz*nz;
      if (vn > 0) { o.vx -= (1 + rest)*vn*nx; o.vz -= (1 + rest)*vn*nz; o.vx *= tang; o.vz *= tang; return vn; }
    }
  } else if (Math.abs(o.x) > BX - r) {
    const n = Math.sign(o.x); o.x = n*(BX - r);
    if (o.vx*n > 0) { const v = Math.abs(o.vx); o.vx = -o.vx*rest; o.vz *= tang; return v; }
  } else if (Math.abs(o.z) > BZ - r) {
    const n = Math.sign(o.z); o.z = n*(BZ - r);
    if (o.vz*n > 0) { const v = Math.abs(o.vz); o.vz = -o.vz*rest; o.vx *= tang; return v; }
  }
  return 0;
}

    shooter.x=14;shooter.z=0;shooter.vx=shooter.vz=0;const blocker=teamPlayers(1).find(p=>p.idx===4);blocker.x=18;blocker.z=0;puck.carrier=shooter;puck.lastTouch=shooter;puck.x=shooter.x;puck.z=shooter.z;beginShot(shooter);if(shooter.action)shooter.action.forceLane=.2;S.forceBlock=true;
  } else if(kind==='otplay') {
    S.period=4;S.clock=30;S.score=[2,2];elSA.textContent='2';elSB.textContent='2';configureOvertime();puck.carrier=shooter;puck.lastTouch=shooter;puck.x=0;puck.z=0;
  } else if(kind==='late') {
    S.period=3;S.clock=18;S.score=[1,2];elSA.textContent='1';elSB.textContent='2';adaptSystems();puck.carrier=shooter;puck.lastTouch=shooter;
  } else if (kind === 'period') {
    S.period=1; S.clock=.08;
  } else if(kind==='overtime') {
    S.period=3; S.score=[2,2]; elSA.textContent='2'; elSB.textContent='2'; S.clock=.08;
  } else if (kind === 'final') {
    S.period=3; S.score=[2,1]; elSA.textContent='2'; elSB.textContent='1'; S.clock=.08;
  } else return false;
  return true;
}
function simulateIceToFinal(maxSeconds=900){releaseEstablishingHold(true);const maxSteps=Math.max(1,Math.round(maxSeconds*60));for(let i=0;i<maxSteps&&S.state!=='FINAL';i++)tick(1/60,true);tick(1/60,false);return JSON.parse(window.render_game_to_text());}

window.advanceTime = (ms) => {
  const steps = Math.max(1, Math.round(ms / (1000 / 60)));
  for (let i = 0; i < steps; i++) tick(1/60, i < steps - 1);
