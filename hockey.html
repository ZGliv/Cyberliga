{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { buildBlobRig } from './blobrig.js';

// ============ CONSTANTS ============
const RINK_W = 56, RINK_H = 26;          // x = length, z = width
const BX = RINK_W/2, BZ = RINK_H/2, BR = 7.5; // board half-extents + corner radius
const GLX = 24;                           // goal line |x|
const BLX = 8;                            // blue lines
const NW = 4.2;                           // goal mouth width
const PERIOD_LEN = 90, OT_LEN = 45, MAXS = 8.6;
const PY = 0.1;                           // puck rest height
const dampK = (k, dt) => 1 - Math.exp(-k * dt);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const HOCKEY_CONTENT=window.CYBERLIGA_CONTENT;
const HOCKEY_TEAMS=HOCKEY_CONTENT.getTeams('hockey');
const LEAGUE_TEAMS=HOCKEY_TEAMS.map(team=>{const hex=Number.parseInt(team.colors.primary.slice(1),16);return {name:team.name,code:team.code,css:team.colors.primary,kit:hex,glow:hex};});
const FIXTURES=HOCKEY_CONTENT.createSeason('hockey','arena').rounds.flatMap(round=>round.matches.map(match=>[HOCKEY_TEAMS.findIndex(t=>t.id===match.homeId),HOCKEY_TEAMS.findIndex(t=>t.id===match.awayId)]));
const ROSTERS=Object.fromEntries(HOCKEY_TEAMS.map(team=>[team.name,team.athletes.map(a=>a.name)])); // [goalie, C, W, W, D, D]
let fixtureIdx = (parseInt(localStorage.getItem('cl_ice_fx')) || 0) % FIXTURES.length;
let TEAM_A, TEAM_B;
const ATT = [1, -1]; // team 0 attacks +x, team 1 attacks -x

// ============ RENDERER / SCENE ============
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02030a);
scene.fog = new THREE.FogExp2(0x040618, 0.007);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture; // cheap icy reflections

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 16, BZ + 21);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.6, 0.82));

// ============ LIGHTING (no shadows — frugal) ============
scene.add(new THREE.HemisphereLight(0x5a70b8, 0x0a0d1a, 1.0));
const key = new THREE.DirectionalLight(0xcfe2ff, 1.1);
key.position.set(18, 42, 26); scene.add(key);
const rim = new THREE.DirectionalLight(0x335a9a, 0.5);
rim.position.set(-22, 30, -30); scene.add(rim);

// ============ ICE ============
const iceCanvas = document.createElement('canvas');
iceCanvas.width = 2048; iceCanvas.height = 1088;
const PAD = 4, PW = RINK_W + PAD*2, PH = RINK_H + PAD*2;
function drawIce() {
  const g = iceCanvas.getContext('2d'), W = iceCanvas.width, H = iceCanvas.height;
  const px = x => (x + BX + PAD) / PW * W, pz = z => (z + BZ + PAD) / PH * H;
  const sx = W / PW;
  g.fillStyle = '#04060d'; g.fillRect(0, 0, W, H);
  const rinkPath = () => { g.beginPath(); g.roundRect(px(-BX), pz(-BZ), px(BX)-px(-BX), pz(BZ)-pz(-BZ), BR*sx); };
  const grad = g.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#dcedfb'); grad.addColorStop(.5, '#cadff2'); grad.addColorStop(1, '#d4e8f8');
  rinkPath(); g.fillStyle = grad; g.fill();
  g.save(); rinkPath(); g.clip();
  for (let i = 0; i < 9000; i++) { // skate-scuff noise
    g.fillStyle = `rgba(${150+Math.random()*60|0},${175+Math.random()*50|0},${205+Math.random()*40|0},0.06)`;
    g.fillRect(Math.random()*W, Math.random()*H, 2, 2);
  }
  const line = (x, w, col) => { g.fillStyle = col; g.shadowColor = col; g.shadowBlur = 14;
    g.fillRect(px(x) - w*sx/2, pz(-BZ), w*sx, pz(BZ)-pz(-BZ)); g.shadowBlur = 0; };
  const circle = (x, z, r, col, lw) => { g.strokeStyle = col; g.lineWidth = lw; g.shadowColor = col; g.shadowBlur = 10;
    g.beginPath(); g.arc(px(x), pz(z), r*sx, 0, Math.PI*2); g.stroke(); g.shadowBlur = 0; };
  const dot = (x, z, r, col) => { g.fillStyle = col; g.beginPath(); g.arc(px(x), pz(z), r*sx, 0, Math.PI*2); g.fill(); };

// rounded-rect board collision: resolves position + reflects velocity. returns impact speed
function boardResolve(o, r, rest, tang) {
  const qx = Math.abs(o.x) - (BX - BR), qz = Math.abs(o.z) - (BZ - BR);
  if (qx > 0 && qz > 0) { // corner arc
    const cx = Math.sign(o.x)*(BX - BR), cz = Math.sign(o.z)*(BZ - BR);
    const dx = o.x - cx, dz = o.z - cz, d = Math.hypot(dx, dz) || 1e-6;
    if (d > BR - r) {
      const nx = dx/d, nz = dz/d;
      o.x = cx + nx*(BR - r); o.z = cz + nz*(BR - r);
      const vn = o.vx*nx + o.vz*nz;
      if (vn > 0) { o.vx -= (1 + rest)*vn*nx; o.vz -= (1 + rest)*vn*nz; o.vx *= tang; o.vz *= tang; return vn; }
    }
  } else if (Math.abs(o.x) > BX - r) {
    const n = Math.sign(o.x); o.x = n*(BX - r);
    if (o.vx*n > 0) { const v = Math.abs(o.vx); o.vx = -o.vx*rest; o.vz *= tang; return v; }
  } else if (Math.abs(o.z) > BZ - r) {
    const n = Math.sign(o.z); o.z = n*(BZ - r);
    if (o.vz*n > 0) { const v = Math.abs(o.vz); o.vz = -o.vz*rest; o.vx *= tang; return v; }
  }
  return 0;
}

// ============ REF ============
function refStep(dt) {
  const dx = refP.tx - refP.x, dz = refP.tz - refP.z, d = Math.hypot(dx, dz);
  if (d > 0.3) { refP.vx += dx/d*9*dt; refP.vz += dz/d*9*dt; }
  refP.vx *= Math.exp(-1.4*dt); refP.vz *= Math.exp(-1.4*dt);
  const sp = Math.hypot(refP.vx, refP.vz);
  if (sp > 7) { refP.vx *= 7/sp; refP.vz *= 7/sp; }
  refP.x += refP.vx*dt; refP.z += refP.vz*dt;
  boardResolve(refP, 0.55, 0.1, 0.9);
  const want = sp > 1 ? Math.atan2(refP.vx, refP.vz) : Math.atan2(puck.x - refP.x, puck.z - refP.z);
  let dh = want - refP.heading;
  while (dh > Math.PI) dh -= Math.PI*2; while (dh < -Math.PI) dh += Math.PI*2;
  refP.heading += dh*dampK(8, dt);
  ref.group.position.set(refP.x, 0, refP.z);
  ref.group.rotation.y = refP.heading;
  if (S.state === 'FACEOFF' && !S.dropped) ref.poseThrowIn(0.3);
  ref.update(dt, sp/7);
}

// ============ CAMERA ============
const camPos = new THREE.Vector3(0, 16, BZ + 21), camLook = new THREE.Vector3(0, 1, 0);

function cameraStep(dt) {
  const rush = S.state === 'PLAY' ? players.find(p => p.breakaway && puck.carrier === p) : null;
  const mode = (S.state === 'GOAL_SEQ' && S.t < 3.1) ? 'over' : rush ? 'rush' : 'broadcast';
  if (mode === 'over') {
    const gx = S.scoredSide*GLX;

  } else if (mode === 'rush') {

    tmpP.set(clamp(puck.x*0.72, -19, 19), 15.5 - S.push*3.2, BZ + 20.5 - S.push*5);
    tmpL.set(clamp(puck.x*0.82, -22, 22), 0.8, puck.z*0.35);

}

// ============ VISUAL UPDATE ============
function updateRigs(dt) {
  for (const p of players) {
    const sp = Math.hypot(p.vx, p.vz);
    const want = sp > 1.1 ? Math.atan2(p.vx, p.vz) : Math.atan2(puck.x - p.x, puck.z - p.z);
    let dh = want - p.heading;
    while (dh > Math.PI) dh -= Math.PI*2; while (dh < -Math.PI) dh += Math.PI*2;
    const turn = clamp(dh*5.5 + p.edge*1.25, -2.4, 2.4);
    p.heading += dh*dampK(8, dt);
    p.rig.group.position.set(p.x, 0, p.z);
    p.rig.group.rotation.y = p.heading;
    if (p.fallT > 0) {
      if (p.fallT > 0.5) p.rig.poseFall(clamp((1.12 - p.fallT)/0.62, 0, 1));
      else p.rig.poseGetUp(1 - p.fallT*2);
    } else if (S.state === 'GOAL_SEQ' && S.scorer === p) {
      p.rig.poseCelebrate(S.t, p.idx);
    } else if (p.isGK) {
      if (p.saveT > 0) {
        const duration = p.saveKind === 'cover' ? 0.88 : 0.72;
        const k = clamp(1-p.saveT/duration,0,1);
        if (p.saveKind === 'cover') p.rig.poseGKScoop(k);
        else if (p.saveKind === 'reach') p.rig.poseDive(p.saveSide,k,0.7);
        else p.rig.poseGKPunch(k);
      }
      else if (p.butterT > 0.3) p.rig.poseDive(Math.sign(puck.z - p.z) || 1, clamp(1-p.butterT/0.9, 0, 1)); // butterfly drop
      else p.rig.poseGKSet(simClockTotal + p.idx);
    } else if (p.action) {
      p.rig.poseKick(clamp(p.action.t/p.action.duration,0,1), p.idx&1);
    } else if (p.hitT > 0) {
      p.rig.poseShield(clamp(1-p.hitT/0.72,0,1), p.edge || 1);
    } else if (p.checkReady > 0) {
      p.rig.poseShield(0.28+p.checkReady*0.34, p.edge || 1);
    } else if (p.recvT > 0 && puck.passTarget === p) {

}

// ============ STATE MACHINE ============
function endPeriod() {

    showFinalCard(); setState('FINAL'); return;
  }
  showPeriodCard();
  say(S.period === 3 ? 'TIED AFTER THREE — SUDDEN DEATH OVERTIME ON CYBER ICE' : `THAT'S THE END OF PERIOD ${S.period}`, true);
  setState('PERIOD_END');
}
function stateStep(dt) {

    case 'FACEOFF': {
      steerFaceoff();

      netCollide();
      if (!S.dropped) {
        const centers = players.filter(p => p.idx === 1);
        const ready = centers.every(c => Math.hypot(c.x - c.fox, c.z - c.foz) < 2.6)
          && Math.hypot(refP.x - S.faceX, refP.z - refP.tz) < 1.2;
        if ((S.t > 0.8 && ready) || S.t > 4.5) {
          S.dropped = true; puck.held = false; puck.vy = -2; // ref drops it
          refP.tx = clamp(S.faceX, -BX+3, BX-3); refP.tz = BZ - 2; // ref clears out
        }
      } else {
        integratePuck(dt);
        if (puck.y <= PY + 0.001) { // puck on ice — battle won
          const w = Math.random() < 0.5 ? 0 : 1;
          const c = teamPlayers(w).find(p => p.idx === 1);
          puck.vx = -ATT[w]*(3 + Math.random()*3); puck.vz = (Math.random()-0.5)*5;
          puck.lastTouch = c;
          say(fill(pick(COMM.drop), c.name));
          if (S.clock === PERIOD_LEN || S.clock === OT_LEN) say(`${PERIOD_NAMES[S.period-1]} UNDERWAY AT THE ICE DOME`, true);
          setState('PLAY');
        }
      }
      if (S.t > 8) { puck.held = false; puck.y = PY; setState('PLAY'); } // watchdog
      break;
    }
    case 'PLAY': {
      S.clock -= dt;
      stepPlayerActions(dt);
      steerPlay();
      integratePlayers(dt);
      integratePuck(dt);
      netCollide();
      goalChecks();
      if (S.state !== 'PLAY') break; // goal happened this frame
      if (S.clock <= 0) { S.clock = 0; endPeriod(); break; }
      // stuck-puck watchdog → quick whistle, nearest faceoff dot
      if (!puck.carrier && Math.hypot(puck.vx, puck.vz) < 0.6) S.noTouchT += dt; else S.noTouchT = 0;
      if (S.noTouchT > 6) {
        S.noTouchT = 0; whistle(); say('PLAY FROZEN AT THE BOARDS — QUICK FACEOFF', true);
        const sp = nearestSpot(puck.x, puck.z);
        setFaceoff(sp[0], sp[1]); setState('FACEOFF');
        lastCamMode = 'cut'; // puck snaps to the dot — hide it behind a camera cut
      }

    }
    case 'GOAL_SEQ': {
      steerFaceoff(); // drift toward next faceoff while celebrating
      integratePlayers(dt);
      integratePuck(dt);
      if (S.t > 4.6) {
        elFlash.classList.remove('show');
        if (S.period === 4) { showFinalCard(); setState('FINAL'); }
        else { setFaceoff(0, 0); setState('FACEOFF'); lastCamMode = 'cut'; } // cut hides puck snap to center
      }

    }

    }

  py: puck.y, px: puck.x, pz: puck.z, carrier: puck.carrier && puck.carrier.name,

function tick(dt, skipRender = false) {
  if (paused) {

    return;

  stateStep(dt);
  refStep(dt); // sim-relevant: faceoff drop waits on the ref's position
  if (skipRender) return; // hidden-tab catch-up: only the last step touches visuals/DOM
  updateRigs(dt);

  hudStep();

// ============ TICK DRIVER (hidden-tab resilience, same pattern as index.html) ============
// rAF stops entirely in hidden tabs, so a rAF-only loop would freeze the league.
// When hidden we drive tick() from setInterval instead: browsers throttle hidden
// timers to ~1Hz, so each fire replays the elapsed real time as fixed 0.05s sim
// steps (capped at 1s of catch-up per fire), rendering only the last one.
// Exactly ONE driver runs at a time.
let rafId = 0, hiddenTimer = 0, prevT = performance.now();
function rafLoop(now) {
  rafId = requestAnimationFrame(rafLoop);
  const dt = Math.min(0.05, (now - prevT)/1000);
  prevT = now;
  if (dt <= 0) return;
  tick(dt);
}
function startDriver() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
  if (hiddenTimer) { clearInterval(hiddenTimer); hiddenTimer = 0; }
  if (document.hidden) {
    let lastFire = performance.now();
    hiddenTimer = setInterval(() => {
      const now = performance.now();
      const steps = Math.min(Math.floor((now - lastFire)/50), 20);
      if (steps <= 0) return;
      lastFire = now;
      prevT = now; // so foreground resume doesn't inherit a huge delta
      for (let i = 0; i < steps; i++) tick(0.05, i < steps - 1);
    }, 50);
  } else { prevT = performance.now(); rafLoop(prevT); }
}

startDriver();

elRestart.addEventListener('click', restartMatch);
elFull.addEventListener('click', toggleFullscreen);
function forceIceMoment(kind) {
  if (kind === 'reset') { restartMatch(); return true; }
  if (kind === 'rotation') {
    restartMatch();
    S.period = 3; S.score = [2,1]; elSA.textContent = '2'; elSB.textContent = '1';
    showFinalCard(); setState('FINAL'); S.t = 7.92; return true;
  }
  restartMatch();
  paused = false; elPause.textContent = 'PAUSE'; elCard.classList.remove('show'); elFlash.classList.remove('show');
  setState('PLAY'); S.clock = Math.max(S.clock,20); puck.held = false; puck.carrier = null;
  puck.passTarget = null; puck.saveChecked = false; puck.y = PY; puck.vx = puck.vz = puck.vy = 0;
  for (const p of players) { p.action=null; p.fallT=0; p.hitT=0; p.touchCd=0; p.recvT=0; p.wasBreakaway=false; }
  const shooter = teamPlayers(0).find(p=>p.idx===2), passer = teamPlayers(0).find(p=>p.idx===1);
  const receiver = teamPlayers(0).find(p=>p.idx===3), hitter = teamPlayers(1).find(p=>p.idx===2);
  if (kind === 'goal') {
    shooter.x=GLX-1; shooter.z=1.65; shooter.vx=shooter.vz=0;
    puck.x=GLX-.22; puck.z=1.65; puck.vx=28; puck.lastTouch=shooter; puck.saveChecked=true;
  } else if (kind === 'save' || kind === 'cover') {
    const gk=gkOfSide(1); gk.x=GLX-.9; gk.z=0; gk.vx=gk.vz=0;
    shooter.x=GLX-6; shooter.z=kind==='cover' ? .2 : 1.45;
    puck.x=GLX-2.25; puck.z=kind==='cover' ? .2 : 1.45; puck.vx=28; puck.lastTouch=shooter;
    S.forceSave=kind==='cover' ? 'cover' : 'rebound';
  } else if (kind === 'check') {
    players.filter(p=>p!==shooter&&p!==hitter&& !p.isGK).forEach((p,i)=>{p.x=(i<4?-16:16);p.z=-9+(i%4)*6;p.vx=p.vz=0;});
    shooter.x=0; shooter.z=0; shooter.vx=2; shooter.vz=0;
    hitter.x=-.92; hitter.z=0; hitter.vx=8.5; hitter.vz=0;
    puck.carrier=shooter; puck.lastTouch=shooter; puck.x=shooter.x; puck.z=shooter.z; S.forceCheck=true;
  } else if (kind === 'breakaway') {
    shooter.x=4; shooter.z=0; shooter.vx=7; shooter.vz=.2;
    puck.carrier=shooter; puck.lastTouch=shooter;
    teamPlayers(1).filter(p=>!p.isGK).forEach((p,i)=>{p.x=-13-i*.35;p.z=-8+i*3.1;p.vx=p.vz=0;});
  } else if (kind === 'oneTimer') {
    passer.x=5.5; passer.z=-2; passer.vx=passer.vz=0;
    receiver.x=11; receiver.z=1.3; receiver.vx=receiver.vz=0;
    players.filter(p=>p!==passer&&p!==receiver&& !p.isGK).forEach((p,i)=>{p.x=-16+(i%4)*2;p.z=-9+(i%5)*4;p.vx=p.vz=0;});
    puck.carrier=passer; puck.lastTouch=passer; puck.x=passer.x; puck.z=passer.z;
    S.forceOneTimer=true; pass(passer,receiver);
  } else if (kind === 'period') {
    S.period=1; S.clock=.08;
  } else if (kind === 'final') {
    S.period=3; S.score=[2,1]; elSA.textContent='2'; elSB.textContent='1'; S.clock=.08;
  } else return false;
  return true;
}
window.__CYBERLIGA_HOCKEY_TEST__ = Object.freeze({ forceMoment:forceIceMoment, restart:restartMatch });
window.render_game_to_text = () => JSON.stringify({
  coordinateSystem: 'rink meters; origin center ice; +x right goal, +z far boards, +y up',
  mode: paused ? 'PAUSED' : S.state,
  completedGames,
  lastFinal,
  period: S.period,
  clock: +Math.max(0, S.clock).toFixed(2),
  teams: [
    { name: TEAM_A.name, code:TEAM_A.code, score: S.score[0], shots: S.shots[0], saves: S.saves[0], rebounds:S.rebounds[0], hits: S.hits[0], oneTimers: S.oneTimers[0] },
    { name: TEAM_B.name, code:TEAM_B.code, score: S.score[1], shots: S.shots[1], saves: S.saves[1], rebounds:S.rebounds[1], hits: S.hits[1], oneTimers: S.oneTimers[1] }
  ],
  broadcast:{ event:S.eventTTL>0?S.eventText:null, eventKind:S.eventTTL>0?S.eventKind:null, camera:S.cameraBeat>0?S.cameraKind:'broadcast' },
  puck: { x: +puck.x.toFixed(2), y: +puck.y.toFixed(2), z: +puck.z.toFixed(2), held: puck.held, carrier: puck.carrier?.name || null,
    passTarget:puck.passTarget?.name||null, speed: +Math.hypot(puck.vx, puck.vz).toFixed(2) },
  players: players.map(p => ({ name: p.name, team: p.team === 0 ? TEAM_A.name : TEAM_B.name, role: p.isGK ? 'GK' : p.idx === 1 ? 'C' : p.idx < 4 ? 'W' : 'D',
    x: +p.x.toFixed(2), z: +p.z.toFixed(2), speed:+Math.hypot(p.vx,p.vz).toFixed(2), fallen: p.fallT > 0, breakaway: p.breakaway,
    action:p.action?.type||null, bracing:p.checkReady>.1, save:p.saveT>0?p.saveKind:null }))
});
window.advanceTime = (ms) => {
  const wasPaused = paused; paused = false;
  const steps = Math.max(1, Math.round(ms / (1000 / 60)));
  for (let i = 0; i < steps; i++) tick(1/60, i < steps - 1);
  paused = wasPaused;
  if (paused) { elPause.textContent = 'RESUME'; hudStep(); }
};

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'f') { e.preventDefault(); toggleFullscreen(); }
  else if (e.key.toLowerCase() === 'p' || e.code === 'Space') { e.preventDefault(); togglePause(); }
  else if (e.key.toLowerCase() === 'r') { e.preventDefault(); restartMatch(); }
  else if (e.key === 'Escape' && !e.metaKey && !e.ctrlKey && !e.altKey && !e.shiftKey && !document.fullscreenElement) location.href = 'world.html';
});
</script>
</body>
</html>
