<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { buildBlobRig } from './blobrig.js';

// ---------- helpers ----------
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a+(b-a)*t;
const gauss = ()=>Math.random()+Math.random()+Math.random()-1.5; // std ~0.5
const pick = a=>a[Math.floor(Math.random()*a.length)];
const V3 = (x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const dxz = (ax,az,bx,bz)=>Math.hypot(ax-bx,az-bz);
function lerpAngle(a,b,t){ let d=b-a; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2; return a+d*t; }
function rgba(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }

// ---------- constants ----------
const HL=14, HW=7.5;                       // half court length / width (x / z)
const RIM_Y=3.05, RIM_R=0.45, BALL_R=0.17;
const BB_X=HL-1.05, RIM_X=BB_X-0.6;        // backboard plane x, rim center x

const Q_LEN=75, OT_LEN=30;

  { name:'NEON FC',     css:'#00e5ff', col:0x00e5ff, glow:0x00e5ff, roster:['BYTE','FLUX','PING','CTRL','GLITCH','SYNC'] },
  { name:'VOLT UTD',    css:'#ff2d78', col:0xff3da0, glow:0xff4dd2, roster:['SURGE','AMP','JOLT','TESLA','DYNAMO','ARC'] },
  { name:'GRID ROYALS', css:'#ffc24d', col:0xffc24d, glow:0xffc24d, roster:['PIXEL','RASTER','CHROME','CIPHER','MATRIX','VAULT'] },
  { name:'ASTRA NOVA',  css:'#8a5cff', col:0x8a5cff, glow:0x9a6cff, roster:['ORBIT','COMET','PULSAR','QUASAR','NEBULA','LUMEN'] },
];
const FIXTURES = [[0,1],[2,3],[0,2],[1,3],[0,3],[1,2]];
let matchNo = Math.floor(Math.random()*6); // rotate starting matchup per page load

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias:true });

for (const s of [-1,1]) { const pl = new THREE.PointLight(0xff8a3d, 40, 16, 2); pl.position.set(s*RIM_X, 5.5, 0); scene.add(pl); }

{ // stars

// ---------- court ----------
const FLOOR_L=36, FLOOR_W=22;
function makeCourtTex(cssA, cssB) {
  const c=document.createElement('canvas'); c.width=2048; c.height=1252;
  const g=c.getContext('2d');
  const px=x=>(x+FLOOR_L/2)/FLOOR_L*c.width, pz=z=>(z+FLOOR_W/2)/FLOOR_W*c.height, sc=m=>m/FLOOR_L*c.width;
  g.fillStyle='#04060f'; g.fillRect(0,0,c.width,c.height);
  g.fillStyle='#0a0f22'; g.fillRect(px(-HL), pz(-HW), sc(2*HL), pz(HW)-pz(-HW));
  for (let i=0;i<28;i++){ g.fillStyle=i%2?'rgba(255,255,255,0.018)':'rgba(0,0,0,0.05)'; g.fillRect(px(-HL)+i*sc(2*HL)/28, pz(-HW), sc(2*HL)/28, pz(HW)-pz(-HW)); }
  g.lineWidth=5; g.shadowBlur=14;
  const stroke=(col)=>{ g.strokeStyle=col; g.shadowColor=col; };
  // boundary + halfcourt + center circle
  stroke('rgba(220,240,255,0.85)');
  g.strokeRect(px(-HL),pz(-HW),px(HL)-px(-HL),pz(HW)-pz(-HW));
  g.beginPath(); g.moveTo(px(0),pz(-HW)); g.lineTo(px(0),pz(HW)); g.stroke();
  g.beginPath(); g.arc(px(0),pz(0),sc(1.8),0,Math.PI*2); g.stroke();
  g.save(); g.shadowBlur=0; g.globalAlpha=0.08; g.fillStyle='#ffffff';
  g.font='900 110px Orbitron, sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText('CYBERLIGA', px(0), pz(0)); g.restore();
  for (const s of [-1,1]) {
    const css = s<0?cssA:cssB;
    // painted key
    g.fillStyle=rgba(css,0.13);
    const kx0=px(s*HL), kx1=px(s*(HL-5.8));
    g.fillRect(Math.min(kx0,kx1), pz(-2.45), Math.abs(kx1-kx0), pz(2.45)-pz(-2.45));
    stroke(rgba(css,0.9));
    g.strokeRect(Math.min(kx0,kx1), pz(-2.45), Math.abs(kx1-kx0), pz(2.45)-pz(-2.45));
    g.beginPath(); g.arc(px(s*(HL-5.8)),pz(0),sc(1.8),0,Math.PI*2); g.stroke();
    // restricted arc
    g.beginPath();
    for (let i=0;i<=24;i++){ const th=-Math.PI/2+(Math.PI)*i/24; const x=s*RIM_X-s*1.25*Math.cos(th), z=1.25*Math.sin(th);
      i?g.lineTo(px(x),pz(z)):g.moveTo(px(x),pz(z)); }
    g.stroke();
    // 3pt arc + corner lines
    const a=Math.asin(6.6/THREE_R);
    g.beginPath();
    for (let i=0;i<=48;i++){ const th=-a+2*a*i/48; const x=s*RIM_X-s*THREE_R*Math.cos(th), z=THREE_R*Math.sin(th);
      i?g.lineTo(px(x),pz(z)):g.moveTo(px(x),pz(z)); }
    g.stroke();
    const cx=s*(RIM_X-THREE_R*Math.cos(a));
    for (const zz of [-6.6,6.6]) { g.beginPath(); g.moveTo(px(s*HL),pz(zz)); g.lineTo(px(cx),pz(zz)); g.stroke(); }
  }
  const tex=new THREE.CanvasTexture(c); tex.anisotropy=8; tex.colorSpace=THREE.SRGBColorSpace;
  return tex;
}
const floorMat = new THREE.MeshStandardMaterial({ map:makeCourtTex('#00e5ff','#ff2d78'), roughness:0.5, metalness:0.25 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(FLOOR_L,FLOOR_W), floorMat);
floor.rotation.x=-Math.PI/2; scene.add(floor);
const apron = new THREE.Mesh(new THREE.PlaneGeometry(110,80), new THREE.MeshStandardMaterial({ color:0x04060f, roughness:1 }));
apron.rotation.x=-Math.PI/2; apron.position.y=-0.02; scene.add(apron);

function neonRect(w,h,color,y=0.035){
  const p=[V3(-w/2,y,-h/2),V3(w/2,y,-h/2),V3(w/2,y,h/2),V3(-w/2,y,h/2),V3(-w/2,y,-h/2)];
  return new THREE.Line(new THREE.BufferGeometry().setFromPoints(p), new THREE.LineBasicMaterial({ color }));
}
const neonA = neonRect(2*HL+2.2, 2*HW+2.2, 0x00e5ff), neonB = neonRect(2*HL+2.9, 2*HW+2.9, 0xff8a3d);
scene.add(neonA, neonB);

// LED ad strips
function adTex(text, fg){
  const c=document.createElement('canvas'); c.width=1024; c.height=92;
  const g=c.getContext('2d'); g.fillStyle='#070b18'; g.fillRect(0,0,1024,92);
  g.font='900 52px Orbitron, sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.fillStyle=fg; g.shadowColor=fg; g.shadowBlur=16; g.fillText(text,512,48);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
const ADS=['CYBERLIGA HOOPS','SEASON 2077','AI ONLY','◆ ◆ ◆'];
ADS.forEach((txt,i)=>{
  const m=new THREE.Mesh(new THREE.BoxGeometry(13,1.0,0.16),
    new THREE.MeshBasicMaterial({ map:adTex(txt, i%2?'#ff9d5c':'#5eeaff') }));
  m.position.set((i%2?7.5:-7.5), 0.5, (i<2?1:-1)*(HW+2.2));
  if(i>=2) m.rotation.y=Math.PI;
  scene.add(m);
});

// stands + crowd silhouettes
const standMat = new THREE.MeshStandardMaterial({ color:0x0a1224, roughness:0.9 });
function stand(x,z,rotY,len){
  const grp=new THREE.Group();
  for (let t=0;t<5;t++){
    const step=new THREE.Mesh(new THREE.BoxGeometry(len,1.1,2.1), standMat);
    step.position.set(0, 0.55+t*1.0, t*1.9); grp.add(step);
  }
  grp.position.set(x,0,z); grp.rotation.y=rotY; scene.add(grp); return grp;
}
stand(0, HW+3.6, 0, 2*HL+16); stand(0, -(HW+3.6), Math.PI, 2*HL+16);
stand(HL+4.6, 0, Math.PI/2, 2*HW+10); stand(-(HL+4.6), 0, -Math.PI/2, 2*HW+10);

const crowdGroup = new THREE.Group(); scene.add(crowdGroup);
{
  const N=300, geo=new THREE.SphereGeometry(0.3,6,5);
  const im=new THREE.InstancedMesh(geo, new THREE.MeshBasicMaterial({ color:0xffffff }), N);
  const m=new THREE.Matrix4(), col=new THREE.Color();
  for (let i=0;i<N;i++){
    const side=i<N/2?1:-1, j=i%(N/2), row=j%5, k=Math.floor(j/5);
    const x=-15+k*1.05+Math.random()*0.5, z=side*(HW+3.6+row*1.9+(Math.random()-0.5)*0.4);
    const y=1.35+row*1.0+Math.random()*0.12;
    m.makeScale(1,1.35+Math.random()*0.3,1); m.setPosition(x,y,z); im.setMatrixAt(i,m);
    if (Math.random()<0.16) col.setHex(pick([0x0e4452,0x4a1530,0x4a3414,0x2a1d52]));
    else col.setHex(0x0b1126).offsetHSL(0,0,Math.random()*0.03);
    im.setColorAt(i,col);
  }
  im.instanceMatrix.needsUpdate=true; if (im.instanceColor) im.instanceColor.needsUpdate=true;
  crowdGroup.add(im);
}

// ---------- hoops ----------
const hoops=[];
function buildHoop(side){
  const grp=new THREE.Group();
  const dark=new THREE.MeshStandardMaterial({ color:0x131a30, roughness:0.8 });
  const pole=new THREE.Mesh(new THREE.BoxGeometry(0.3,3.9,0.3), dark);
  pole.position.set(side*(HL+1.3), 1.95, 0); grp.add(pole);
  const arm=new THREE.Mesh(new THREE.BoxGeometry(HL+1.3-BB_X+0.3,0.16,0.16), dark);
  arm.position.set(side*((HL+1.3+BB_X)/2), 3.85, 0); grp.add(arm);
  const board=new THREE.Mesh(new THREE.PlaneGeometry(1.8,1.05),
    new THREE.MeshStandardMaterial({ color:0x9fdcff, transparent:true, opacity:0.14, roughness:0.2, side:THREE.DoubleSide }));
  board.position.set(side*BB_X, 3.45, 0); board.rotation.y=side>0?-Math.PI/2:Math.PI/2; grp.add(board);
  const edgeMat=new THREE.LineBasicMaterial({ color:0x5eeaff });
  const edges=new THREE.LineSegments(new THREE.EdgesGeometry(board.geometry), edgeMat);
  edges.position.copy(board.position); edges.rotation.copy(board.rotation); grp.add(edges);
  const sq=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(
    [V3(-0.3,-0.2,0),V3(0.3,-0.2,0),V3(0.3,0.25,0),V3(-0.3,0.25,0)]), edgeMat);
  sq.position.set(side*(BB_X-0.012), 3.32, 0); sq.rotation.y=board.rotation.y; grp.add(sq);
  const rimMat=new THREE.MeshStandardMaterial({ color:0xff8a3d, emissive:0xff8a3d, emissiveIntensity:0.85, roughness:0.3 });
  const rim=new THREE.Mesh(new THREE.TorusGeometry(RIM_R,0.03,8,28), rimMat);
  rim.rotation.x=Math.PI/2; rim.position.set(side*RIM_X, RIM_Y, 0); grp.add(rim);
  const netMat=new THREE.MeshBasicMaterial({ color:0xbfe9ff, wireframe:true, transparent:true, opacity:0.32 });
  const net=new THREE.Mesh(new THREE.CylinderGeometry(RIM_R-0.02,0.26,0.5,9,4,true), netMat);
  net.position.set(side*RIM_X, RIM_Y-0.27, 0); grp.add(net);
  scene.add(grp);
  return { side, rimMat, netMat, edgeMat, glow:0 };
}
hoops.push(buildHoop(1), buildHoop(-1));
const hoopAt = side => hoops[side>0?0:1];

// ---------- ball ----------
const ballMesh=new THREE.Mesh(new THREE.SphereGeometry(BALL_R,16,12),
  new THREE.MeshStandardMaterial({ color:0xff7a26, emissive:0xff5a1a, emissiveIntensity:0.55, roughness:0.5 }));
const seams=new THREE.Mesh(new THREE.IcosahedronGeometry(BALL_R*1.01,1),

ballMesh.add(seams); scene.add(ballMesh);
const ball={ pos:V3(0,1,0), vel:V3(), state:'HELD', holder:null, passTo:null, pending:null, t:0, T:0, vy:0, shot:null, lastTeam:0 };

// ---------- HUD ----------

const elScore=$('score'), elSA=$('sA'), elSB=$('sB'), elClock=$('clock'), elQtr=$('qtr'), elSclock=$('sclock');
const elFlash=$('flash'), elFT=$('flashtext'), elFS=$('flashsub'), elTicker=$('tickertext'), elCard=$('bigcard'), elPanel=$('cardpanel');

const say=s=>{ if(tickerQ.length<10) tickerQ.push(s.toUpperCase()); };

  ()=>`THE HOOPDOME CROWD IS ${pick(['ELECTRIC','VIBRATING','OVERCLOCKED','FERAL'])} TONIGHT`,
  ()=>`${pick(teams).def.name} RUNNING THE ${pick(['NEON MOTION','GRID-AND-ROLL','QUANTUM SPACING','FIREWALL PRESS'])} SCHEME`,

];

  if (tickerX < -elTicker.getBoundingClientRect().width){
    elTicker.textContent = tickerQ.length ? tickerQ.splice(0,4).join('   ///   ') : pick(IDLE_CHATTER)();

function showCard(html){ elPanel.innerHTML=html; elCard.classList.add('show'); }
function hideCard(){ elCard.classList.remove('show'); }
function popScore(){ elScore.classList.add('pop'); setTimeout(()=>elScore.classList.remove('pop'),140); }

// ---------- teams / players ----------
let teams=[];           // [{def,dir,score,players[4]}]
const allPlayers=()=>teams[0].players.concat(teams[1].players);
function makeTeam(def, dir, side){
  const names=[...def.roster].sort(()=>Math.random()-0.5).slice(0,4);
  const players=[];
  for (let r=0;r<4;r++){
    const rig=buildBlobRig({ kitColor:def.col, glowColor:def.glow, captain:r===0 });
    scene.add(rig.group);
    players.push({ rig, side, role:r, name:names[r], td:def,
      pos:V3(-dir*(2.5+r*2.4), 0, (r-1.5)*3.4), vel:V3(), heading:dir>0?Math.PI/2:-Math.PI/2,
      jumpY:0, jumpV:0, air:false, squash:0, pts:0, contest:false, ph:Math.random()*6.28,
      target:V3(), sprint:5.2 });
  }
  return { def, dir, score:0, players };
}
function disposeTeams(){
  for (const t of teams) for (const p of t.players){ scene.remove(p.rig.group); p.rig.dispose(); }
  teams=[];
}

// ---------- match state ----------
let phase='PLAY', q=1, qClock=Q_LEN, shotClock=24, breakT=0, possArrow=1;
const play={ state:'BRINGUP', t:0, offense:0, passes:0, passGoal:3, wait:0.8, windKind:'jumper', windDur:0.3,
  released:false, decided:false, dunk:null, saidReb:false, scorer:null, driveLane:1 };
function setState(s){ play.state=s; play.t=0; }
const offT=()=>teams[play.offense], defT=()=>teams[1-play.offense];
const atkRim=t=>V3(t.dir*RIM_X, RIM_Y, 0);
const carrier=()=>ball.holder;
let quarterPending=false;

// camera
let camPos=V3(0,11.4,17.6), lookPt=V3(0,1,0), pendingCut=false, lowCam=false, shake=0, crowdHype=0, tGlobal=0;
const cut=()=>{ pendingCut=true; };

function updateHUDTeams(){
  $('nameA').textContent=teams[0].def.name; $('nameB').textContent=teams[1].def.name;
  const dA=document.querySelector('#teamA .dot'), dB=document.querySelector('#teamB .dot');
  $('teamA').style.color=teams[0].def.css; $('teamB').style.color=teams[1].def.css;
  dA.style.background=teams[0].def.css; dA.style.boxShadow=`0 0 10px ${teams[0].def.css}`;
  dB.style.background=teams[1].def.css; dB.style.boxShadow=`0 0 10px ${teams[1].def.css}`;
  elSA.textContent=teams[0].score; elSB.textContent=teams[1].score;
}

function newMatch(){
  disposeTeams();
  const fx=FIXTURES[matchNo%FIXTURES.length]; matchNo++;
  teams=[ makeTeam(TEAMS[fx[0]], 1, 0), makeTeam(TEAMS[fx[1]], -1, 1) ];
  floorMat.map?.dispose();
  floorMat.map=makeCourtTex(teams[0].def.css, teams[1].def.css); floorMat.needsUpdate=true;
  neonA.material.color.setHex(teams[0].def.glow); neonB.material.color.setHex(teams[1].def.glow);
  q=1; qClock=Q_LEN; shotClock=24; phase='PLAY'; possArrow=1; quarterPending=false;
  hideCard(); updateHUDTeams();
  say(`MATCHDAY — ${teams[0].def.name} VS ${teams[1].def.name} — TIP-OFF IN THE HOOPDOME`);
  flashMsg('TIP-OFF', `${teams[0].def.name} VS ${teams[1].def.name}`, '#ff8a3d');
  ball.pos.set(0,1.4,0); ball.vel.set(0,0,0); ball.shot=null;
  outlet(Math.random()<0.5?0:1);
  cut();
}

// ---------- flow primitives ----------
function startPass(rec, pending){
  const from=ball.pos, to=V3(rec.pos.x,1.25,rec.pos.z);
  const d=dxz(from.x,from.z,to.x,to.z);
  const T=clamp(0.18+d*0.045, 0.26, 0.85);
  ball.vel.set((to.x-from.x)/T, (to.y-from.y)/T+0.5*G*T, (to.z-from.z)/T);
  ball.state='PASS'; ball.holder=null; ball.passTo=rec; ball.pending=pending; ball.t=0; ball.T=T;
  setState('PASSING');
}
function gainPossession(p, next){
  ball.holder=p; ball.state='HELD'; ball.vel.set(0,0,0); ball.vy=0; ball.shot=null; ball.lastTeam=p.side;
  if (p.side!==play.offense){ play.offense=p.side; shotClock=24; play.passes=0;
    for (const o of allPlayers()) o.contest=false; } // possession flip voids pending contests
  play.wait=0.5+Math.random()*0.6; play.decided=false;
  setState(next);
}
function outlet(toIdx){
  play.offense=toIdx; shotClock=24; play.passes=0; play.passGoal=2+Math.floor(Math.random()*3);
  ball.shot=null;
  for (const p of allPlayers()) p.contest=false; // stale contest flags would chase the new carrier forever
  let best=null, bd=1e9;
  for (const p of teams[toIdx].players){ const d=dxz(p.pos.x,p.pos.z,ball.pos.x,ball.pos.z); if(d<bd){bd=d;best=p;} }
  ball.pos.y=Math.max(ball.pos.y,1.0);
  startPass(best,'BRINGUP');
  ball.lastTeam=toIdx;
}
function releaseShot(sh, kind){
  const tm=teams[sh.side], rim=atkRim(tm);
  const from=ball.pos.clone();
  const dist=dxz(from.x,from.z,rim.x,rim.z);
  const three = kind==='jumper' && dist>THREE_R+0.05;
  let contest=0;
  for (const d of teams[1-sh.side].players){ const dd=dxz(d.pos.x,d.pos.z,sh.pos.x,sh.pos.z);
    if (dd<2.0) contest=Math.max(contest,(2.0-dd)/2.0*(d.air?1.25:0.7)); }
  // tuned vs RIM_R-0.06 entry window (gauss sd≈0.5): open layup ~95%, contested ~70%,
  // mid-range ~50%, open three ~35-40% — lands teams in the 15-35 pts band per game
  let err = kind==='layup' ? 0.3+contest*0.32 : (0.28+dist*0.075)*(1+contest*1.2);
  const bank = kind==='layup' ? Math.random()<0.45 : (dist<5.5 && Math.random()<0.16);
  const aim = bank
    ? V3(tm.dir*(BB_X-0.04), RIM_Y+0.35+Math.random()*0.2, (from.z>=0?0.2:-0.2))
    : V3(rim.x, RIM_Y+0.02, rim.z);
  aim.x+=gauss()*err; aim.z+=gauss()*err;
  const T=clamp(0.72+dist*0.085, 0.8, 1.65);
  ball.vel.set((aim.x-from.x)/T, (aim.y-from.y)/T+0.5*G*T, (aim.z-from.z)/T);
  ball.state='SHOT'; ball.holder=null;
  ball.shot={ pts:three?3:2, shooter:sh, team:tm, bank, banked:false };
  setState('SHOT'); play.saidReb=false;
  if (three) say(pick([`${sh.name} LAUNCHES FROM DEEP SPACE`,`${sh.name} FROM WAY DOWNTOWN`,`${sh.name} PULLS FROM THE LOGO SECTOR`]));
  else if (kind==='jumper') say(pick([`${sh.name} RISES FOR THE MID-RANGE`,`${sh.name} WITH THE PULL-UP`]));
}
function scoreBasket(sideSign, pts, scorer, kind){
  const tm = teams[0].dir===sideSign ? teams[0] : teams[1];
  tm.score+=pts; if (scorer) scorer.pts+=pts;
  elSA.textContent=teams[0].score; elSB.textContent=teams[1].score; popScore();
  const who = scorer ? `${scorer.name} • ${tm.def.name}` : tm.def.name;
  if (kind==='dunk'){ flashMsg('SLAM!', who, tm.def.css); shake=1; say(pick([`${scorer.name} DETONATES AT THE RIM`,`${scorer.name} WITH A SEISMIC JAM`,`${scorer.name} POSTERIZES THE FIREWALL`])); }
  else { flashMsg(pts===3?'+3':'BUCKET', who, tm.def.css); shake=0.25;
    say(scorer?pick([`${scorer.name} KNOCKS IT DOWN — ${pts===3?'TRIPLE':'TWO'}`,`${scorer.name} BURIES IT FOR ${pts}`,`COUNT IT — ${scorer.name} FOR ${pts}`]):'IT DROPS'); }
  const h=hoopAt(sideSign); h.glow=1;
  crowdHype=1;
  ball.shot=null; ball.state='DROP'; ball.vel.x*=0.25; ball.vel.z*=0.25;
  play.scorer=scorer||null;
  setState('MADE');
}
function violation(){
  say(pick(['SHOT CLOCK VIOLATION — THE BUZZER FEASTS','24 EXPIRES — TURNOVER','THE CLOCK CLAIMS ANOTHER VICTIM']));
  flashMsg('24', 'SHOT CLOCK VIOLATION', '#ffe14d');
  outlet(1-play.offense);
}
function beginDunk(p){
  const tm=teams[p.side], rim=atkRim(tm);
  play.dunk={ p, t:0, dur:0.78, from:p.pos.clone(),
    to:V3(rim.x-tm.dir*0.35, 0, rim.z+(p.pos.z>=0?0.25:-0.25)), slammed:false };
  setState('DUNK'); lowCam=true; cut();
}

// ---------- targeting ----------
function offSpots(dir){
  return [ V3(dir*(RIM_X-7.6), 0, 0), V3(dir*(RIM_X-5.2), 0, -5.4),
           V3(dir*(RIM_X-5.2), 0, 5.4), V3(dir*(RIM_X-0.9), 0, -6.3) ];
}
function setTargets(dt){
  if (phase!=='PLAY') return; // breakFlow owns targets during cards
  const off=offT(), def=defT(), rim=atkRim(off);
  const spots=offSpots(off.dir);
  const car=carrier();
  // offense
  for (const p of off.players){
    p.sprint=5.2;
    if (p===car){
      if (play.state==='BRINGUP'){ p.target.set(rim.x-off.dir*8.5, 0, clamp(p.pos.z*0.4,-3,3)); p.sprint=5.8; }
      else if (play.state==='DRIVE'){ p.target.set(rim.x-off.dir*0.6, 0, rim.z+play.driveLane*0.5); p.sprint=6.5; }
      else p.target.copy(p.pos); // SET / WINDUP: hold ground
    } else {
      const s=spots[p.role];
      p.target.set(s.x, 0, s.z+Math.sin(tGlobal*0.7+p.ph)*0.6);
    }
  }
  // defense: man-marking drift, goal-side toward the rim they protect
  for (const d of def.players){
    const mark=off.players[d.role];
    const tight = mark===car ? 0.85 : 1.6;
    const vx=rim.x-mark.pos.x, vz=rim.z-mark.pos.z, vl=Math.hypot(vx,vz)||1;
    d.target.set(mark.pos.x+vx/vl*tight, 0, mark.pos.z+vz/vl*tight);
    d.sprint=5.7;
    if (mark===car && dxz(d.pos.x,d.pos.z,mark.pos.x,mark.pos.z)<2.4 && !d.air)
      d.rig.poseJockey(tGlobal, mark.pos.z>d.pos.z?1:-1);
    if (d.contest){ d.target.set(car?car.pos.x:ball.pos.x,0,car?car.pos.z:ball.pos.z); d.sprint=6.4;
      if (dxz(d.pos.x,d.pos.z,d.target.x,d.target.z)<1.6 && !d.air){ d.air=true; d.jumpV=6.2; d.contest=false; } }
  }
  // rebound scramble overrides
  if (play.state==='REBOUND'){
    for (const t of teams){
      const sorted=[...t.players].sort((a,b)=>dxz(a.pos.x,a.pos.z,ball.pos.x,ball.pos.z)-dxz(b.pos.x,b.pos.z,ball.pos.x,ball.pos.z));
      sorted.forEach((p,i)=>{
        if (i<2){ p.target.set(clamp(ball.pos.x,-HL+0.4,HL-0.4),0,clamp(ball.pos.z,-HW+0.4,HW-0.4)); p.sprint=6.3;
          if (!p.air && ball.pos.y>1.9 && ball.vel.y<0 && dxz(p.pos.x,p.pos.z,ball.pos.x,ball.pos.z)<1.5){ p.air=true; p.jumpV=6.0; } }
        else { p.target.set(t.dir*-4, 0, (p.role-1.5)*3); }
        if (p.air) p.rig.poseHeader(clamp(p.jumpY,0,1));
      });
    }
  }
  // made basket: celebrate + pre-position outlet
  if (play.state==='MADE'){
    for (const p of off.players){ p.target.copy(p.pos); if (p===play.scorer) p.rig.poseCelebrate(play.t); }
    const inb=[...def.players].sort((a,b)=>dxz(a.pos.x,a.pos.z,ball.pos.x,ball.pos.z)-dxz(b.pos.x,b.pos.z,ball.pos.x,ball.pos.z))[0];
    for (const p of def.players){
      if (p===inb) p.target.set(clamp(ball.pos.x,-HL+1,HL-1), 0, 1.4);
      else p.target.set(p.pos.x*0.6, 0, p.pos.z*0.8);
      p.rig.poseTrudge(tGlobal);
    }
  }
  // windup pose
  if ((play.state==='WINDUP'||play.state==='SHOT') && play.shooter && !play.released)
    play.shooter.rig.poseThrowIn(clamp(play.t/play.windDur,0,1));
}

// ---------- player physics ----------
function updatePlayers(dt){
  const PL=allPlayers();
  for (const p of PL){
    if (play.dunk && play.dunk.p===p) { updateDunkBody(p,dt); continue; }
    const dx=p.target.x-p.pos.x, dz=p.target.z-p.pos.z, dist=Math.hypot(dx,dz);
    let dvx=0,dvz=0;
    if (dist>0.06){ const sp=p.sprint*clamp(dist/1.4,0,1); dvx=dx/dist*sp; dvz=dz/dist*sp; }
    const k=1-Math.exp(-9*dt);
    p.vel.x+=(dvx-p.vel.x)*k; p.vel.z+=(dvz-p.vel.z)*k;
    for (const o of PL){ if (o===p) continue;
      const sx=p.pos.x-o.pos.x, sz=p.pos.z-o.pos.z, sd=Math.hypot(sx,sz);
      if (sd<0.9 && sd>0.001){ const f=(0.9-sd)*20; p.vel.x+=sx/sd*f*dt; p.vel.z+=sz/sd*f*dt; } }
    p.pos.x=clamp(p.pos.x+p.vel.x*dt, -HL+0.25, HL-0.25);
    p.pos.z=clamp(p.pos.z+p.vel.z*dt, -HW+0.25, HW-0.25);
    if (p.air){ p.jumpV-=PG*dt; p.jumpY+=p.jumpV*dt;
      if (p.jumpY<=0){ p.jumpY=0; p.air=false; p.squash=0.2; } }
    p.squash*=Math.exp(-6*dt);
    const sp=Math.hypot(p.vel.x,p.vel.z);
    const face = sp>0.6 ? Math.atan2(p.vel.x,p.vel.z) : Math.atan2(ball.pos.x-p.pos.x, ball.pos.z-p.pos.z);
    p.heading=lerpAngle(p.heading, face, 1-Math.exp(-8*dt));
    p.rig.group.position.set(p.pos.x, p.jumpY, p.pos.z);
    p.rig.group.rotation.y=p.heading;
    p.rig.group.scale.set(1+p.squash*0.5, 1-p.squash, 1+p.squash*0.5);
    p.rig.update(dt, clamp(sp/6,0,1));
  }
}
function updateDunkBody(p,dt){
  const dk=play.dunk, kk=clamp(dk.t/dk.dur,0,1);
  const e=kk*kk*(3-2*kk);
  p.pos.x=lerp(dk.from.x,dk.to.x,e); p.pos.z=lerp(dk.from.z,dk.to.z,e);
  p.jumpY=Math.sin(Math.min(kk*1.1,1)*Math.PI)*2.1;
  p.heading=lerpAngle(p.heading, Math.atan2(atkRim(teams[p.side]).x-p.pos.x, -p.pos.z||0.01), 1-Math.exp(-10*dt));
  p.rig.group.position.set(p.pos.x,p.jumpY,p.pos.z);
  p.rig.group.rotation.y=p.heading;
  p.rig.poseHeader(kk);
  p.rig.update(dt, 1);
}

// ---------- ball physics ----------
function updateBall(dt){
  const prevY=ball.pos.y;
  if (ball.state==='HELD' && ball.holder){
    const h=ball.holder;
    const fx=Math.sin(h.heading), fz=Math.cos(h.heading), rx=fz, rz=-fx;
    const bx=h.pos.x+fx*0.3+rx*0.5, bz=h.pos.z+fz*0.3+rz*0.5;
    const kf=1-Math.exp(-18*dt);
    ball.pos.x+=(bx-ball.pos.x)*kf; ball.pos.z+=(bz-ball.pos.z)*kf;
    const carrying = h.air || play.state==='WINDUP' || play.state==='DUNK' || play.state==='MADE' || phase!=='PLAY';
    if (carrying){
      const ty = 1.25 + h.jumpY + (play.state==='WINDUP' ? clamp(play.t/play.windDur,0,1)*1.0 : 0);
      ball.pos.y+=(ty-ball.pos.y)*(1-Math.exp(-20*dt)); ball.vy=0;
    } else { // dribble: ballistic loop with downward impulse synced to movement
      ball.vy-=GD*dt; ball.pos.y+=ball.vy*dt;
      const hand=1.05, mv=Math.hypot(h.vel.x,h.vel.z);
      if (ball.pos.y<=BALL_R){ ball.pos.y=BALL_R; ball.vy=Math.sqrt(2*GD*hand); }
      else if (ball.pos.y>=hand && ball.vy>0){ ball.pos.y=hand; ball.vy=-Math.sqrt(2*GD*hand)*(0.85+mv/14); }
    }
  } else if (ball.state!=='HELD'){
    ball.vel.y-=G*dt;
    ball.pos.addScaledVector(ball.vel,dt);
    // pass homing + catch
    if (ball.state==='PASS' && ball.passTo){
      ball.t+=dt;
      const rec=ball.passTo, d=dxz(ball.pos.x,ball.pos.z,rec.pos.x,rec.pos.z);
      const hw=Math.hypot(ball.vel.x,ball.vel.z);
      const wx=rec.pos.x-ball.pos.x, wz=rec.pos.z-ball.pos.z, wl=Math.hypot(wx,wz)||1;
      const kh=1-Math.exp(-6*dt);
      ball.vel.x+=(wx/wl*hw-ball.vel.x)*kh; ball.vel.z+=(wz/wl*hw-ball.vel.z)*kh;
      if (d<0.6 || ball.t>ball.T+0.45){
        const pend=ball.pending; ball.passTo=null;
        gainPossession(rec, pend==='BRINGUP'?'BRINGUP':'SET');
      }
    }
    // floor
    if (ball.pos.y<BALL_R){
      ball.pos.y=BALL_R;
      if (Math.abs(ball.vel.y)>1.0) ball.vel.y=-ball.vel.y*REST;
      else ball.vel.y=0;
      ball.vel.x*=0.86; ball.vel.z*=0.86;
      if (ball.state==='SHOT' && ball.shot) shotMissedToRebound();
    }
    if (ball.vel.y===0 && ball.pos.y<=BALL_R+0.001){ ball.vel.x*=Math.exp(-2.5*dt); ball.vel.z*=Math.exp(-2.5*dt); }
    if (ball.state==='SHOT' || ball.state==='LOOSE'){
      // score detection: descending through the rim cylinder
      if (ball.vel.y<0 && prevY>RIM_Y && ball.pos.y<=RIM_Y){
        for (const s of [-1,1]){
          if (dxz(ball.pos.x,ball.pos.z,s*RIM_X,0) < RIM_R-0.06){
            const pts = ball.shot && ball.shot.team===((teams[0].dir===s)?teams[0]:teams[1]) ? ball.shot.pts : 2;
            scoreBasket(s, pts, ball.shot?ball.shot.shooter:null, play.state==='DUNK'?'dunk':'shot');
            break;
          }
        }
      }
      if (ball.state==='SHOT' || ball.state==='LOOSE') collideRimAndBoard();
    } else if (ball.state==='DROP'){
      // net funnel
      if (ball.pos.y>RIM_Y-0.6 && ball.pos.y<RIM_Y+0.1){
        for (const s of [-1,1]) if (Math.abs(ball.pos.x-s*RIM_X)<1){
          ball.pos.x+=(s*RIM_X-ball.pos.x)*(1-Math.exp(-10*dt));
          ball.pos.z+=(0-ball.pos.z)*(1-Math.exp(-10*dt));
          ball.vel.x*=Math.exp(-6*dt); ball.vel.z*=Math.exp(-6*dt);
        }
      }
    }
  }
  // sanity watchdog
  if (!isFinite(ball.pos.x) || !isFinite(ball.pos.y) || ball.pos.y>40){
    ball.pos.set(0,1.2,0); ball.vel.set(0,0,0); ball.shot=null; outlet(1-play.offense);
  }
  ballMesh.position.copy(ball.pos);
  ballMesh.rotation.x-=Math.hypot(ball.vel.x,ball.vel.z)*dt*3 + (ball.state==='HELD'?6*dt:0);
}
function collideRimAndBoard(){
  let touched=false;
  for (const s of [-1,1]){
    const cx=s*RIM_X, dy=ball.pos.y-RIM_Y;
    if (Math.abs(dy)<BALL_R+0.08){
      const dx=ball.pos.x-cx, dz=ball.pos.z, dr=Math.hypot(dx,dz);
      if (dr>0.01){
        const ringX=cx+dx/dr*RIM_R, ringZ=dz/dr*RIM_R;
        const nx=ball.pos.x-ringX, ny=ball.pos.y-RIM_Y, nz=ball.pos.z-ringZ;
        const nl=Math.hypot(nx,ny,nz);
        if (nl<BALL_R+0.035 && nl>0.0001){
          const ux=nx/nl, uy=ny/nl, uz=nz/nl;
          const vn=ball.vel.x*ux+ball.vel.y*uy+ball.vel.z*uz;
          if (vn<0){ ball.vel.x-=ux*vn*1.6; ball.vel.y-=uy*vn*1.6; ball.vel.z-=uz*vn*1.6; }
          const push=BALL_R+0.04-nl;
          ball.pos.x+=ux*push; ball.pos.y+=uy*push; ball.pos.z+=uz*push;
          ball.vel.multiplyScalar(0.94);
          hoopAt(s).glow=Math.max(hoopAt(s).glow,0.45);
          touched=true;
        }
      }
    }
    // backboard
    const bx=s*BB_X;
    if (Math.abs(ball.pos.x-bx)<BALL_R && Math.abs(ball.pos.z)<0.95 && ball.pos.y>2.85 && ball.pos.y<4.05 && ball.vel.x*s>0){
      ball.pos.x=bx-s*BALL_R; ball.vel.x*=-0.62; ball.vel.y*=0.92; ball.vel.z*=0.92;
      hoopAt(s).glow=Math.max(hoopAt(s).glow,0.4);
      touched=true;
      if (ball.shot && ball.shot.bank && !ball.shot.banked){
        ball.shot.banked=true;
        const wx=s*RIM_X-ball.pos.x, wz=0-ball.pos.z, wl=Math.hypot(wx,wz)||1;
        const hs=Math.hypot(ball.vel.x,ball.vel.z);
        ball.vel.x=wx/wl*hs; ball.vel.z=wz/wl*hs;
      }
    }
  }
  if (touched && ball.state==='SHOT' && ball.pos.y<RIM_Y-0.3) shotMissedToRebound();
}
function shotMissedToRebound(){
  if (play.state==='SHOT'){
    ball.state='LOOSE'; setState('REBOUND');
    if (!play.saidReb){ play.saidReb=true;
      say(pick(['IT RATTLES OUT — SCRAMBLE ON THE GLASS','NO GOOD — BODIES FLY FOR THE BOARD','OFF THE IRON — REBOUND WAR'])); }
  } else if (ball.state==='SHOT') ball.state='LOOSE';
}

// ---------- flow state machine ----------
function flow(dt){
  play.t+=dt;
  const off=offT(), car=carrier(), rim=atkRim(off);
  // clocks
  qClock-=dt;
  if (['BRINGUP','SET','PASSING','DRIVE','WINDUP'].includes(play.state)){
    shotClock-=dt;
    if (shotClock<=0){ violation(); return; }
  }
  if (qClock<=0) quarterPending=true;
  if (quarterPending && ['BRINGUP','SET'].includes(play.state)){ enterBreak(); return; }

  switch(play.state){
    case 'BRINGUP':
      if (!car) { if (play.t>2.5) outlet(play.offense); break; }
      if (dxz(car.pos.x,car.pos.z,rim.x-off.dir*8.5,clamp(car.pos.z*0.4,-3,3))<1.5){
        play.wait=0.5+Math.random()*0.6; setState('SET');
        if (Math.random()<0.3) say(`${car.name} WALKS IT UP FOR ${off.def.name}`);
      }
      break;
    case 'SET':
      if (!car) break;
      if (play.t>play.wait){
        if (play.passes<play.passGoal){
          const mates=off.players.filter(p=>p!==car);
          startPass(pick(mates),'SET'); play.passes++;
        } else {
          const dToRim=dxz(car.pos.x,car.pos.z,rim.x,rim.z);
          if (dToRim<8.4 && Math.random()<0.5){
            play.driveLane=car.pos.z>=0?1:-1; play.decided=false; setState('DRIVE');
            if (Math.random()<0.4) say(`${car.name} PUTS THE AFTERBURNERS ON`);
          } else startWindup(car,'jumper');
        }
      }
      break;
    case 'PASSING':
      if (play.t>2.6 && ball.passTo){ gainPossession(ball.passTo, ball.pending==='BRINGUP'?'BRINGUP':'SET'); }
      break;
    case 'DRIVE': {
      if (!car) break;
      const d=dxz(car.pos.x,car.pos.z,rim.x,rim.z);
      if (d<1.9 && !play.decided){
        play.decided=true;
        const spd=Math.hypot(car.vel.x,car.vel.z);
        if (spd>3.8 && Math.random()<0.62) beginDunk(car);
        else startWindup(car,'layup');
      } else if (play.t>4) startWindup(car,'layup');
      break; }
    case 'WINDUP':
      if (!play.released && play.t>=play.windDur){
        play.released=true;
        releaseShot(play.shooter, play.windKind);
      }
      break;
    case 'SHOT':
      if (play.t>3.2 && ball.state==='SHOT'){ shotMissedToRebound(); } // watchdog (airball into nowhere)
      break;
    case 'DUNK': {
      const dk=play.dunk; if (!dk){ setState('REBOUND'); break; }
      dk.t+=dt;
      const kk=dk.t/dk.dur;
      if (kk>=0.55 && !dk.slammed){
        dk.slammed=true;
        ball.pos.set(rim.x, RIM_Y-0.02, rim.z); ball.vel.set(-off.dir*0.4,-7,0); ball.holder=null;
        scoreBasket(off.dir, 2, dk.p, 'dunk');
        dk.p.air=true; dk.p.jumpV=0.6; dk.p.vel.set(-off.dir*1.2,0,0);
        play.dunk=null;
      }
      break; }
    case 'REBOUND': {
      const radius=0.95+Math.max(0,play.t-3)*0.8;
      if (ball.pos.y<1.75){
        for (const p of allPlayers()){
          if (dxz(p.pos.x,p.pos.z,ball.pos.x,ball.pos.z)<radius){
            const offReb = p.side===play.offense;
            say(offReb?pick([`${p.name} RIPS THE OFFENSIVE BOARD`,`${p.name} KEEPS IT ALIVE`]):pick([`${p.name} CLEANS THE GLASS`,`${p.name} SECURES THE REBOUND`]));
            if (offReb && dxz(p.pos.x,p.pos.z,rim.x,rim.z)<3.5 && Math.random()<0.6){
              gainPossession(p,'SET'); startWindup(p,'layup');
            } else gainPossession(p, offReb?'SET':'BRINGUP');
            if (offReb) shotClock=Math.max(shotClock,14); // offensive board resets to 14, not a near-dead clock
            break;
          }
        }
      }
      // out of bounds
      if (Math.abs(ball.pos.x)>HL+1.8 || Math.abs(ball.pos.z)>HW+1.6){
        say('BALL SAILS INTO THE CROWD — FRESH POSSESSION');
        outlet(1-ball.lastTeam);
      }
      if (play.t>7) outlet(1-play.offense); // hard watchdog
      break; }
    case 'MADE':
      if (lowCam && play.t>0.75){ lowCam=false; cut(); }
      if (play.t>1.35){
        if (quarterPending){ enterBreak(); break; }
        outlet(1-play.offense);
      }
      break;
  }
  // global stuck watchdog
  if (play.t>14){ ball.shot=null; outlet(1-play.offense); }
}
function startWindup(sh, kind){
  play.shooter=sh; play.windKind=kind; play.windDur=kind==='layup'?0.2:0.3; play.released=false;
  sh.air=true; sh.jumpV=kind==='layup'?6.8:6.0;
  // contest: nearest defender challenges
  let best=null,bd=1e9;
  for (const d of teams[1-sh.side].players){ const dd=dxz(d.pos.x,d.pos.z,sh.pos.x,sh.pos.z); if(dd<bd){bd=dd;best=d;} }
  if (best && bd<3.4) best.contest=true;
  setState('WINDUP');
}

// ---------- quarter / match flow ----------
function enterBreak(){
  quarterPending=false;
  const isOT=q>4, last = (q>=4 && teams[0].score!==teams[1].score);
  phase = last ? 'FINAL' : 'BREAK'; breakT=0; cut();
  const line=`${teams[0].def.name} ${teams[0].score} — ${teams[1].score} ${teams[1].def.name}`;
  if (phase==='FINAL'){
    const all=[...allPlayers()].sort((a,b)=>b.pts-a.pts).slice(0,3);
    showCard(`<h1>FULL TIME</h1><h2>${line}</h2>
      <table><tr><th>TOP SCORERS</th><th>PTS</th></tr>
      ${all.map(p=>`<tr><td class="n" style="color:${p.td.css}">${p.name} — ${p.td.name}</td><td>${p.pts}</td></tr>`).join('')}</table>
      <div class="sub" id="countd" style="margin-top:14px">NEXT TIP-OFF IN 7</div>`);
    say(`FULL TIME IN THE HOOPDOME — ${line}`);
    flashMsg('FINAL','', '#ff8a3d');
  } else {
    const label = isOT?'END OF OT':(q===2?'HALFTIME':`END OF Q${q}`);
    showCard(`<h1>${label}</h1><h2>${line}</h2>${q===2?'<div class="sub">TEAMS SWAP ENDS</div>':''}`);
    say(`${label} — ${line}`);
  }
}
function breakFlow(dt){
  breakT+=dt;
  for (const t of teams) for (const p of t.players){
    p.target.copy(p.pos); p.sprint=0;
    if (phase==='FINAL'){
      const win=teams[0].score>teams[1].score?teams[0]:teams[1];
      if (t===win) p.rig.poseCelebrate(tGlobal); else p.rig.poseExhausted(tGlobal);
    }
  }
  if (phase==='BREAK' && breakT>3.0){
    q++; qClock = q>4 ? OT_LEN : Q_LEN;
    if (q===3){ teams[0].dir*=-1; teams[1].dir*=-1; say('ENDS SWAPPED — SECOND HALF UNDERWAY'); }
    if (q>4){ if (teams[0].score===teams[1].score){ say('OVERTIME — SUDDEN CHAOS PERIOD'); flashMsg('OT','SUDDEN CHAOS','#ffe14d'); } else { enterBreak(); return; } }
    phase='PLAY'; hideCard(); possArrow=1-possArrow;
    outlet(possArrow); cut();
  }
  if (phase==='FINAL'){
    const cd=document.getElementById('countd');
    if (cd) cd.textContent=`NEXT TIP-OFF IN ${Math.max(1,Math.ceil(6.5-breakT))}`;
    if (breakT>6.5) newMatch();
  }
}

// ---------- camera ----------
function updateCamera(dt){
  let dp, dl;
  if (phase!=='PLAY'){
    dp=V3(Math.sin(tGlobal*0.12)*17, 11.5, Math.cos(tGlobal*0.12)*17); dl=V3(0,1,0);
  } else if (lowCam){
    const dir=offT().dir, zs=ball.pos.z>=0?1:-1;
    dp=V3(dir*(HL-0.6), 1.4, zs*6.2); dl=V3(dir*RIM_X, 2.7, 0);
  } else if (play.state==='DRIVE' || play.state==='WINDUP'){
    const rim=atkRim(offT());
    dp=V3(clamp(rim.x*0.55,-9,9), 8.6, 13.8); dl=V3(lerp(ball.pos.x,rim.x,0.3), 1.6, ball.pos.z*0.4);
  } else if (play.state==='SHOT' || play.state==='MADE' || play.state==='DUNK'){
    const rim=atkRim(offT());
    dp=V3(clamp(rim.x*0.5,-8,8), 9.6, 15.6); dl=V3(lerp(ball.pos.x,rim.x,0.55), 2.2, ball.pos.z*0.35);
  } else {
    dp=V3(clamp(ball.pos.x*0.55,-8.5,8.5), 11.4, 17.6); dl=V3(clamp(ball.pos.x*0.8,-10,10), 1.1, ball.pos.z*0.45);
  }
  if (pendingCut){ camPos.copy(dp); lookPt.copy(dl); pendingCut=false; }
  const k=1-Math.exp(-2.8*dt);
  camPos.lerp(dp,k); lookPt.lerp(dl,k);
  camera.position.set(camPos.x+(Math.random()-0.5)*shake*0.4, camPos.y+(Math.random()-0.5)*shake*0.3, camPos.z);
  camera.lookAt(lookPt);
}

// ---------- fx + hud per frame ----------
function fxStep(dt){
  shake*=Math.exp(-3.2*dt);
  crowdHype*=Math.exp(-0.9*dt);
  crowdGroup.position.y = Math.abs(Math.sin(tGlobal*9))*0.16*crowdHype + Math.sin(tGlobal*1.6)*0.02;
  for (const h of hoops){
    h.glow*=Math.exp(-4*dt);
    h.rimMat.emissiveIntensity=0.85+h.glow*4;
    h.netMat.opacity=0.32+h.glow*0.55;
  }
  if (flashTimer>0){ flashTimer-=dt; if (flashTimer<=0) elFlash.classList.remove('show'); }
  const tq=Math.max(0,qClock), mm=String(Math.floor(tq/60)).padStart(2,'0'), ss=String(Math.floor(tq%60)).padStart(2,'0');
  elClock.textContent=`${mm}:${ss}`;
  elQtr.textContent=q>4?'OT':`Q${q}`;
  const sc=Math.max(0,Math.ceil(shotClock));
  elSclock.textContent=sc;
  elSclock.classList.toggle('warn', sc<=5 && phase==='PLAY');
}

// ---------- main loop ----------
newMatch();
function tick(dt, skipRender=false){
  tGlobal+=dt;
  if (phase==='PLAY') flow(dt); else breakFlow(dt);
  setTargets(dt);
  updatePlayers(dt);
  updateBall(dt);
  if (skipRender) return; // hidden-tab catch-up: only the last step touches visuals/DOM
  updateCamera(dt);
  fxStep(dt);
  tickerStep(dt);
  composer.render();
}
// ---------- tick driver (hidden-tab resilience, same pattern as index.html) ----------
// rAF freezes in hidden tabs, so when hidden a setInterval replays elapsed real
// time as fixed 0.05s sim steps (capped at 1s of catch-up per fire), rendering
// only the last step. Exactly ONE driver runs at a time.
let rafId=0, hiddenTimer=0, last=performance.now();
function rafLoop(now){
  rafId=requestAnimationFrame(rafLoop);
  const dt=Math.min((now-last)/1000, 0.05); last=now;
  if (dt<=0) return;
  tick(dt);
}
function startDriver(){
  if (rafId){ cancelAnimationFrame(rafId); rafId=0; }
  if (hiddenTimer){ clearInterval(hiddenTimer); hiddenTimer=0; }
  if (document.hidden){
    let lastFire=performance.now();
    hiddenTimer=setInterval(()=>{
      const now=performance.now();
      const steps=Math.min(Math.floor((now-lastFire)/50), 20);
      if (steps<=0) return;
      lastFire=now;
      last=now; // so foreground resume doesn't inherit a huge delta
      for (let i=0;i<steps;i++) tick(0.05, i<steps-1);
    },50);
  } else { last=performance.now(); rafLoop(last); }
}
document.addEventListener('visibilitychange', startDriver);
startDriver();
addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
});

// Escape backs out to the league hub
addEventListener('keydown', e=>{
  if (e.key==='Escape' && !e.metaKey && !e.ctrlKey && !e.altKey && !e.shiftKey) location.href='league.html';
});
</script>
