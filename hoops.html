<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';

const classicSideVisual = side => classicPlayerColor(Number(side) % CLASSIC_PLAYER_COLORS.length);

// ---------- helpers ----------
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a+(b-a)*t;
const pick = a=>a[Math.floor(Math.random()*a.length)];
const V3 = (x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const dxz = (ax,az,bx,bz)=>Math.hypot(ax-bx,az-bz);
function lerpAngle(a,b,t){ let d=b-a; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2; return a+d*t; }
function rgba(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }
function hash32(text){ let h=2166136261>>>0; for(let i=0;i<text.length;i++){ h^=text.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
let simSeed=0x8f1bbcdc;
function seedSim(value){ simSeed=(value>>>0)||0x8f1bbcdc; }
function rand(){ simSeed^=simSeed<<13; simSeed^=simSeed>>>17; simSeed^=simSeed<<5; return (simSeed>>>0)/4294967296; }
const chance=p=>rand()<p;
const gauss=()=>rand()+rand()+rand()-1.5;

// ---------- constants ----------
const HL=14, HW=7.5;                       // half court length / width (x / z)
const RIM_Y=3.05, RIM_R=0.45, BALL_R=0.17;
const BB_X=HL-1.05, RIM_X=BB_X-0.6;        // backboard plane x, rim center x
const THREE_R=6.75, G=13.5, REST=0.78, PG=30, GD=22;
const Q_LEN=75, OT_LEN=30;
const ROLE_NAMES=['POINT','WING','SHOOTER','FORWARD','CENTER'];

const HOOPS_CONTENT=window.CYBERLIGA_CONTENT;
const HOOPS_BRAND=window.CyberligaBrand;
const HOOPS_TEAMS=HOOPS_CONTENT.getTeams('basketball');
const TEAMS=HOOPS_TEAMS.map(team=>{const hex=Number.parseInt(team.colors.primary.slice(1),16);return {
  id:team.id,name:team.name,code:team.code,css:team.colors.primary,col:hex,glow:hex,
  secondary:team.colors.secondary,secondaryCol:Number.parseInt(team.colors.secondary.slice(1),16),
  accent:team.colors.accent,accentCol:Number.parseInt(team.colors.accent.slice(1),16),

function drawIdentityPattern(g, pattern, color, cx, cy, size){
  g.save();g.translate(cx,cy);g.strokeStyle=color;g.fillStyle=color;g.lineWidth=Math.max(3,size*.018);g.globalAlpha=.16;g.shadowBlur=0;
  if(pattern==='rings'||pattern==='crystal'){for(const r of [.22,.42,.62]){g.beginPath();g.arc(0,0,size*r,0,Math.PI*2);g.stroke();}}
  else if(pattern==='hex'){for(const ox of [-.34,.34]){g.beginPath();for(let i=0;i<=6;i++){const a=Math.PI/3*i,x=ox*size+Math.cos(a)*size*.3,y=Math.sin(a)*size*.3;i?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();}}
  else if(pattern==='wave'||pattern==='drift'){for(const y of [-.25,.1,.45]){g.beginPath();for(let i=0;i<=24;i++){const x=-size*.72+i/24*size*1.44,yy=y*size+Math.sin(i/24*Math.PI*3)*size*.12;i?g.lineTo(x,yy):g.moveTo(x,yy);}g.stroke();}}
  else if(pattern==='spiral'){g.beginPath();for(let i=0;i<70;i++){const a=i*.23,r=i/70*size*.66,x=Math.cos(a)*r,y=Math.sin(a)*r;i?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();}
  else if(pattern==='branch'||pattern==='growth'){g.beginPath();g.moveTo(0,size*.68);g.lineTo(0,-size*.55);g.moveTo(0,-size*.12);g.lineTo(-size*.45,-size*.48);g.moveTo(0,size*.05);g.lineTo(size*.48,-size*.38);g.stroke();}
  else if(pattern==='cross'){g.beginPath();g.moveTo(-size*.7,-size*.42);g.lineTo(size*.7,size*.42);g.moveTo(size*.7,-size*.42);g.lineTo(-size*.7,size*.42);g.stroke();}
  else {for(let i=-3;i<=3;i++){g.beginPath();g.moveTo(-size*.68,i*size*.16);g.lineTo(size*.68,i*size*.16);g.stroke();}}
  g.restore();
}

  for (let i=0;i<28;i++){ g.fillStyle=i%2?'rgba(255,255,255,0.018)':'rgba(0,0,0,0.05)'; g.fillRect(px(-HL)+i*sc(2*HL)/28, pz(-HW), sc(2*HL)/28, pz(HW)-pz(-HW)); }
  g.lineWidth=5; g.shadowBlur=14;

  for (const s of [-1,1]) {

    g.stroke();

    for (let i=0;i<=48;i++){ const th=-a+2*a*i/48; const x=s*RIM_X-s*THREE_R*Math.cos(th), z=THREE_R*Math.sin(th);

function identityScale(athlete,shape){

  let coverage=COVERAGES[(play.possessionNo-1)%COVERAGES.length];
  const defending=teams[1-play.offense], attacking=teams[play.offense];
  const margin=attacking.score-defending.score;
  const liveBall=reason==='STEAL'||reason==='DEFENSIVE REBOUND'||reason==='BLOCK';
  if(liveBall) scheme=PLAYBOOK_BY_ID.EARLY_DRAG;
  else if(q>=4&&qClock<24) scheme=margin<-3?PLAYBOOK_BY_ID.GHOST:margin>3?PLAYBOOK_BY_ID.POST_SPLIT:PLAYBOOK_BY_ID.HIGH_PNR;
  else if(defending.blocks>=2&&play.possessionNo%3===0) scheme=PLAYBOOK_BY_ID.FIVE_OUT;
  else if(defending.steals>=2&&play.possessionNo%4===0) scheme=PLAYBOOK_BY_ID.POST_SPLIT;
  if((scheme.id==='FLOPPY'||scheme.id==='GHOST'||scheme.id==='CHICAGO')&&play.possessionNo%2===0) coverage=COVERAGE_BY_ID.SWITCH;
  else if((scheme.id==='HIGH_PNR'||scheme.id==='SPAIN')&&play.possessionNo%3===0) coverage=COVERAGE_BY_ID.DROP;

  play.schemeId=scheme.id; play.coverageId=coverage.id; play.step=0; play.passes=0; play.wait=.34+rand()*.22;
  play.actionLabel=reason==='STEAL'?'NUMBERS ADVANTAGE · FIND THE OPEN LANE':scheme.actions[0][2];
  play.shotQuality=0; play.shotContext=''; play.lastPasser=null; play.lastPassAt=-99; play.possessionReason=reason;
  play.transition=liveBall;
  play.transitionT=liveBall?3.8:0;
  play.createdAdvantage=liveBall?.12:0;play.paintTouches=0;
  play.decision=liveBall?'RIM RUN · BOTH WINGS WIDE':q>=4&&qClock<24?(margin<0?'CREATE A QUICK ADVANTAGE':'VALUE THE CLOCK'):'ORGANIZE';
  play.helpPlayer=null;play.helpTarget=null;play.kickTarget=null;play.catchAndShoot=null;play.catchKind='jumper';
  play.screenContact=false;play.driveStart=null;play.readMade=false;play.shootingFoulPending=false;play.foulDefender=null;
  play.lastOutcome='LIVE';play.outcomeRecorded=false;
  play.seenSchemes.add(scheme.id); play.seenCoverages.add(coverage.id);

function startPass(rec, pending){
  const from=ball.pos, to=V3(rec.pos.x,1.25,rec.pos.z);
  const d=dxz(from.x,from.z,to.x,to.z);
  const T=clamp(0.18+d*0.045, 0.26, 0.85);
  ball.vel.set((to.x-from.x)/T, (to.y-from.y)/T+0.5*G*T, (to.z-from.z)/T);
  ball.passer=ball.holder; ball.passStealChecked=false;
  if(ball.passer?.tendency)play.createdAdvantage=clamp(
    play.createdAdvantage+(ball.passer.tendency.pass||0)*.035,0,.5
  );
  play.lastPasser=ball.holder; play.lastPassAt=tGlobal;
  ball.state='PASS'; ball.holder=null; ball.passTo=rec; ball.pending=pending; ball.t=0; ball.T=T;
  setState('PASSING');
}
function gainPossession(p, next, transitionReason='CHANGE'){
  ball.holder=p; ball.state='HELD'; ball.vel.set(0,0,0); ball.vy=0; ball.shot=null; ball.lastTeam=p.side;
  if (p.side!==play.offense){ play.offense=p.side; shotClock=24; callPossession(transitionReason);
    for (const o of allPlayers()) o.contest=false; } // possession flip voids pending contests
  play.wait=.30+rand()*.24; play.decided=false; play.stealChecked=false;
  setState(next);
  if(play.catchAndShoot===p){
    const kind=play.catchKind||'jumper';play.catchAndShoot=null;play.catchKind='jumper'; play.decision=kind==='layup'?'ADVANTAGE PASS · FINISH':'ONE-MORE PASS · FEET SET';
    startWindup(p,kind);

}
function outlet(toIdx,reason='INBOUND'){
  play.offense=toIdx; shotClock=24; callPossession(reason);
  ball.shot=null;
  for (const p of allPlayers()) p.contest=false; // stale contest flags would chase the new carrier forever
  // A guard receives normal inbounds; bigs no longer randomly walk the ball up.
  let best=teams[toIdx].players[0];

    dxz(a.pos.x,a.pos.z,pickup.x,pickup.z)-dxz(b.pos.x,b.pos.z,pickup.x,pickup.z))[0]||receiving.players[4];

function resolveLooseBall(){
  const loose=play.looseBall;if(!loose)return;
  const candidates=allPlayers().filter(p=>!p.air).map(p=>{
    const dist=dxz(p.pos.x,p.pos.z,ball.pos.x,ball.pos.z);
    const guardEdge=p.role<=1?.22:0,bigEdge=p.role>=3?.12:0;
    return {p,weight:(1+guardEdge+bigEdge+(p.tendency.handle||0)+(p.tendency.rebound||0)*.45)/Math.max(.42,dist)};
  });
  let roll=rand()*candidates.reduce((sum,c)=>sum+c.weight,0),winner=candidates[0]?.p;
  for(const candidate of candidates){roll-=candidate.weight;if(roll<=0){winner=candidate.p;break;}}
  if(!winner){outlet(1-loose.originalOffense,'LOOSE BALL RESET');play.looseBall=null;return;}
  teams[winner.side].looseBalls++;
  ball.pos.set(winner.pos.x,1.05,winner.pos.z);ball.vel.set(0,0,0);ball.state='HELD';ball.holder=winner;
  const changed=winner.side!==loose.originalOffense;
  if(changed){
    recordPossession('TURNOVER',0);teams[loose.originalOffense].turnovers++;teams[winner.side].steals++;
    play.offense=winner.side;shotClock=24;callPossession('STEAL');play.actionLabel=`LOOSE-BALL WIN · ${winner.name} IGNITES THE BREAK`;
    cueHoopsCamera('loose-ball-win',winner,winner.pos.x,winner.pos.z,.7);
    rememberHoopsOutcome('LOOSE-BALL TAKEAWAY',winner,`created by ${loose.defender.name}`);
    if(winner===loose.defender)recordHoopsNamedMoment('steal',winner);
    gainPossession(winner,'BRINGUP');
  }else{
    play.actionLabel=`OFFENSE RECOVERS · ${winner.name} SAVES THE TRIP`;play.decision='RESET THE SHAPE · SHOT CLOCK CONTINUES';
    gainPossession(winner,'SET','LOOSE BALL RECOVERY');
    rememberHoopsOutcome('OFFENSIVE RECOVERY',winner,`after ${loose.defender.name} deflection`);
  }
  play.looseBall=null;updateGamePlan();
}

function recordPossession(outcome,points=0){

function nearestDefenderTo(p){
  let best=null,dist=99;
  for(const d of teams[1-p.side].players){const dd=dxz(d.pos.x,d.pos.z,p.pos.x,p.pos.z);if(dd<dist){dist=dd;best=d;}}
  return {player:best,dist};
}
function opennessOf(p){
  const near=nearestDefenderTo(p).dist;
  const rim=atkRim(teams[p.side]);const rimDist=dxz(p.pos.x,p.pos.z,rim.x,0);
  return near+(rimDist>THREE_R?.18:0)+(p.role===2?.14:0)+(p.tendency.shot||0)*1.6+(p.tendency.finish||0)*(rimDist<4?.9:0);
}
function bestKickTarget(driver){
  return teams[driver.side].players.filter(p=>p!==driver).map(p=>({p,open:opennessOf(p),rim:dxz(p.pos.x,p.pos.z,atkRim(teams[p.side]).x,0)}))
    .sort((a,b)=>(b.open+(b.rim>THREE_R?.3:0))-(a.open+(a.rim>THREE_R?.3:0)))[0];

function coverageMatchupBonus(kind){
  const s=play.schemeId,c=play.coverageId;
  let v=0;
  if(s==='HIGH_PNR'&&c==='DROP')v+=kind==='jumper'?.075:-.03;
  if(s==='SPAIN'&&c==='DROP')v+=kind==='layup'?.07:.025;
  if(s==='GHOST'&&c==='SWITCH')v+=.065;
  if(s==='POST_SPLIT'&&c==='SWITCH')v+=kind==='layup'?.06:.015;
  if(s==='FLOPPY'&&c==='ZONE')v-=.045;
  if(s==='EARLY_DRAG'&&play.transition)v+=.055;
  return v;
}
function calculateShotQuality(sh,kind,dist,contest){
  let quality=kind==='layup'?.58:kind==='floater'?.40:dist>THREE_R?.31:dist<4.2?.46:.39;
  if(sh.role===2&&dist>THREE_R) quality+=.045;
  if(sh.role===4&&kind==='layup') quality+=.045;
  if(sh.role===0&&dist>3.5&&dist<6.2) quality+=.02;
  quality+=(PLAYBOOK_BY_ID[play.schemeId]?.bonus||0)*.52;
  quality+=coverageMatchupBonus(kind)*.72+play.createdAdvantage*.28+(sh.tendency.shot||0)+(kind==='layup'?(sh.tendency.finish||0):0);
  quality-=(COVERAGE_BY_ID[play.coverageId]?.rim||0)*(kind==='layup'?.72:kind==='floater'?.42:.12);

  quality+=clamp((space-1.45)*.042,-.04,.065);

    const margin=teams[sh.side].score-teams[1-sh.side].score;
    if(margin<0&&Math.abs(margin)<=3&&dist>THREE_R)quality+=.025;
    if(margin>0&&shotClock>8)quality-=.035;

function releaseShot(sh, kind){

  for (const d of teams[1-sh.side].players){ const dd=dxz(d.pos.x,d.pos.z,sh.pos.x,sh.pos.z);

function schemeSpots(off){

    case 'HORNS': return [spot(off,8.2,0),spot(off,3.0,-6.0),spot(off,3.0,6.0),spot(off,4.4,-2.0),spot(off,4.4,2.0)];
    case 'FLOPPY': return [spot(off,8.0,0),spot(off,5.7,-5.5),spot(off,stage<2?1.8:5.4,stage<2?-flip*5.6:flip*5.4),spot(off,2.0,-flip*2.2),spot(off,2.0,flip*2.2)];
    case 'SPAIN': return [spot(off,7.8,0),spot(off,4.8,-5.8),spot(off,stage<2?5.5:6.2,stage<2?0:5.2),spot(off,3.8,5.8),spot(off,stage<2?6.8:1.8,0)];
    case 'GHOST': return [spot(off,7.8,0),spot(off,4.7,-5.8),spot(off,stage<2?7.0:5.2,stage<2?.8:5.2),spot(off,2.2,-3.5),spot(off,2.0,3.1)];
    case 'POST_SPLIT': return [spot(off,5.6,stage<2?-1.2:3.7),spot(off,3.4,-6.1),spot(off,5.0,stage<2?4.8:-.9),spot(off,6.6,-4.2),spot(off,1.6,2.0)];
    case 'CHICAGO': return [spot(off,7.5,-flip*.8),spot(off,3.5,-flip*5.8),spot(off,stage<2?2.1:5.2,stage<2?flip*4.8:-flip*4.4),spot(off,stage<1?4.3:2.3,flip*2.0),spot(off,1.7,-flip*1.2)];
    case 'FIVE_OUT': return [spot(off,7.6,0),spot(off,4.9,-5.8),spot(off,4.9,5.8),spot(off,6.6,-3.15),spot(off,stage<1?7.0:5.6,stage<2?0:3.0*flip)];
    case 'HIGH_PNR': return [spot(off,7.8,0),spot(off,4.7,-5.8),spot(off,4.7,5.8),spot(off,1.8,-3.4),spot(off,stage<1?6.7:2.1,.7)];

function currentAction(){ return PLAYBOOK_BY_ID[play.schemeId]?.actions[Math.min(play.step,(PLAYBOOK_BY_ID[play.schemeId]?.actions.length||1)-1)]||['hold',4,'FLOW']; }

// ---------- player physics ----------
function updatePlayers(dt){
  const PL=allPlayers();
  for (const p of PL){
    if (play.dunk && play.dunk.p===p) { updateDunkBody(p,dt); continue; }
    const dx=p.target.x-p.pos.x, dz=p.target.z-p.pos.z, dist=Math.hypot(dx,dz);
    let dvx=0,dvz=0;
    p.screened=Math.max(0,p.screened-dt);
    if (dist>0.06){ const sp=p.sprint*(1-p.screened*.58)*clamp(dist/1.4,0,1); dvx=dx/dist*sp; dvz=dz/dist*sp; }
    const priorSpeed=Math.hypot(p.vel.x,p.vel.z),priorHeading=p.heading;
    const k=1-Math.exp(-9*dt);
    p.vel.x+=(dvx-p.vel.x)*k; p.vel.z+=(dvz-p.vel.z)*k;
    for (const o of PL){ if (o===p) continue;
      const sx=p.pos.x-o.pos.x, sz=p.pos.z-o.pos.z, sd=Math.hypot(sx,sz);
      const personal=p.bodyRadius+o.bodyRadius+(p.side===o.side?.20:.06);
      if (sd<personal && sd>0.001){
        const overlap=personal-sd, f=overlap*(p.side===o.side?38:24), correction=overlap*(p.side===o.side?.22:.12);
        p.vel.x+=sx/sd*f*dt; p.vel.z+=sz/sd*f*dt;
        p.pos.x+=sx/sd*correction; p.pos.z+=sz/sd*correction;
      } }
    const legalInbounder=play.inbound&&p===play.inbound.inbounder&&
      ['INBOUND_BASELINE','INBOUND_READY','INBOUND_PASS'].includes(play.state);
    const xLimit=legalInbounder?HL+.82:HL-.25;
    p.pos.x=clamp(p.pos.x+p.vel.x*dt, -xLimit, xLimit);
    p.pos.z=clamp(p.pos.z+p.vel.z*dt, -HW+0.25, HW-0.25);
    if (p.air){ p.jumpV-=PG*dt; p.jumpY+=p.jumpV*dt;
      if (p.jumpY<=0){ p.jumpY=0; p.air=false; p.squash=0.2; } }
    p.squash*=Math.exp(-6*dt);
    const sp=Math.hypot(p.vel.x,p.vel.z);
    let face = sp>0.6 ? Math.atan2(p.vel.x,p.vel.z) : Math.atan2(ball.pos.x-p.pos.x, ball.pos.z-p.pos.z);
    if(legalInbounder&&play.inbound?.receiver){
      const rec=play.inbound.receiver;face=Math.atan2(rec.pos.x-p.pos.x,rec.pos.z-p.pos.z);
    }
    p.heading=lerpAngle(p.heading, face, 1-Math.exp(-8*dt));
    p.rig.group.position.set(p.pos.x, p.jumpY, p.pos.z);
    p.rig.group.rotation.y=p.heading;
    p.rig.group.scale.set(p.renderScale[0]*(1+p.squash*.5),p.renderScale[1]*(1-p.squash),p.renderScale[2]*(1+p.squash*.5));
    let turn=p.heading-priorHeading; while(turn>Math.PI)turn-=Math.PI*2; while(turn<-Math.PI)turn+=Math.PI*2;
    const stride=Math.sin(p.rig.gaitPhase||tGlobal*(4+sp));
    p.signature.limbs.arms[0].rotation.x=stride*clamp(sp/6,0,1)*.52;
    p.signature.limbs.arms[1].rotation.x=-stride*clamp(sp/6,0,1)*.52;
    p.signature.limbs.legs[0].rotation.x=-stride*clamp(sp/6,0,1)*.38;
    p.signature.limbs.legs[1].rotation.x=stride*clamp(sp/6,0,1)*.38;
    p.rig.update(dt,clamp(sp/6,0,1),{accel:clamp((sp-priorSpeed)/6,-1,1),turn:clamp(turn/(Math.PI*.4),-1,1)});
  }
}
function updateDunkBody(p,dt){
  const dk=play.dunk, kk=clamp(dk.t/dk.dur,0,1);
  const e=kk*kk*(3-2*kk);
  p.pos.x=lerp(dk.from.x,dk.to.x,e); p.pos.z=lerp(dk.from.z,dk.to.z,e);
  p.jumpY=Math.sin(Math.min(kk*1.1,1)*Math.PI)*2.1;
  p.heading=lerpAngle(p.heading, Math.atan2(atkRim(teams[p.side]).x-p.pos.x, -p.pos.z||0.01), 1-Math.exp(-10*dt));
  p.rig.group.position.set(p.pos.x,p.jumpY,p.pos.z);
  p.rig.group.rotation.y=p.heading;
  p.rig.group.scale.set(p.renderScale[0],p.renderScale[1],p.renderScale[2]);
  p.rig.poseHeader(kk);

// ---------- ball physics ----------
function updateBall(dt){
  const prevY=ball.pos.y;
  if (ball.state==='HELD' && ball.holder){
    const h=ball.holder;
    const fx=Math.sin(h.heading), fz=Math.cos(h.heading), rx=fz, rz=-fx;
    const bx=h.pos.x+fx*0.3+rx*0.5, bz=h.pos.z+fz*0.3+rz*0.5;
    const kf=1-Math.exp(-18*dt);
    ball.pos.x+=(bx-ball.pos.x)*kf; ball.pos.z+=(bz-ball.pos.z)*kf;
    const inboundCarry=play.state==='INBOUND_BASELINE'||play.state==='INBOUND_READY';
    const carrying = h.air || play.state==='WINDUP' || play.state==='DUNK' || play.state==='MADE' || inboundCarry || phase!=='PLAY';
    if (carrying){
      const ty = 1.25 + h.jumpY + (play.state==='WINDUP' ? clamp(play.t/play.windDur,0,1)*1.0 : 0) +
        (play.state==='INBOUND_READY'?.72:0);
      ball.pos.y+=(ty-ball.pos.y)*(1-Math.exp(-20*dt)); ball.vy=0;
    } else { // dribble: ballistic loop with downward impulse synced to movement
      ball.vy-=GD*dt; ball.pos.y+=ball.vy*dt;
      const hand=1.05, mv=Math.hypot(h.vel.x,h.vel.z);
      if (ball.pos.y<=BALL_R){ ball.pos.y=BALL_R; ball.vy=Math.sqrt(2*GD*hand); }
      else if (ball.pos.y>=hand && ball.vy>0){ ball.pos.y=hand; ball.vy=-Math.sqrt(2*GD*hand)*(0.85+mv/14); }
    }
  } else if (ball.state!=='HELD'){
    ball.vel.y-=G*dt;
    ball.pos.addScaledVector(ball.vel,dt);
    // pass homing + catch
    if (ball.state==='PASS' && ball.passTo){
      ball.t+=dt;
      const rec=ball.passTo, d=dxz(ball.pos.x,ball.pos.z,rec.pos.x,rec.pos.z);
      const hw=Math.hypot(ball.vel.x,ball.vel.z);
      const wx=rec.pos.x-ball.pos.x, wz=rec.pos.z-ball.pos.z, wl=Math.hypot(wx,wz)||1;
      const kh=1-Math.exp(-6*dt);
      ball.vel.x+=(wx/wl*hw-ball.vel.x)*kh; ball.vel.z+=(wz/wl*hw-ball.vel.z)*kh;
      if(!ball.inbound&&!ball.passStealChecked&&ball.t>ball.T*.38){
        ball.passStealChecked=true;
        let thief=null,td=99;
        for(const defender of teams[1-play.offense].players){ const dd=dxz(defender.pos.x,defender.pos.z,ball.pos.x,ball.pos.z); if(dd<td){td=dd;thief=defender;} }
        const victim=ball.passer||rec;
        const pressure=(COVERAGE_BY_ID[play.coverageId]?.steal||.03)+(play.createdAdvantage>.12?-.018:0)+
          (thief?.tendency.steal||0)-(victim?.tendency.handle||0)*.35;
        if(thief&&td<1.08&&chance(pressure+((thief.role===0||thief.role===1)?.025:0))){
          const cleanTake=clamp(.34+(thief.tendency.steal||0)*2-(victim?.tendency.handle||0)*.7,.2,.62);
          if(chance(cleanTake)){ball.passTo=null;forceTurnover(thief,victim);}else deflectPass(thief,victim);
          return;
        }
      }
      if (d<0.6 || ball.t>ball.T+0.45){
        const pend=ball.pending,wasInbound=ball.inbound,activeInbound=play.inbound; ball.passTo=null;ball.inbound=false;
        gainPossession(rec, pend==='BRINGUP'?'BRINGUP':'SET');
        if(wasInbound&&activeInbound){
          activeInbound.stage='COMPLETE';play.inboundsCompleted++;
          play.lastInbound={inbounder:activeInbound.inbounder.name,receiver:activeInbound.receiver.name,
            team:teams[activeInbound.receivingSide].def.name,duration:+(tGlobal-activeInbound.startedAt).toFixed(2)};
          play.actionLabel=`INBOUND COMPLETE · ${rec.name} HAS IT`;
          play.decision='FIVE PLAYERS FLOW INTO THE BRING-UP';updateGamePlan();
          say(`${rec.name} SECURES THE INBOUND — NOW THE POSSESSION CAN BEGIN`);
        }

    }
    // floor
    if (ball.pos.y<BALL_R){
      ball.pos.y=BALL_R;
      if (Math.abs(ball.vel.y)>1.0) ball.vel.y=-ball.vel.y*REST;
      else ball.vel.y=0;
      ball.vel.x*=0.86; ball.vel.z*=0.86;
      if (ball.state==='SHOT' && ball.shot) shotMissedToRebound();
    }
    if (ball.vel.y===0 && ball.pos.y<=BALL_R+0.001){ ball.vel.x*=Math.exp(-2.5*dt); ball.vel.z*=Math.exp(-2.5*dt); }
    if (ball.state==='SHOT' || ball.state==='LOOSE'){
      // score detection: descending through the rim cylinder
      if (ball.vel.y<0 && prevY>RIM_Y && ball.pos.y<=RIM_Y){
        for (const s of [-1,1]){
          if (dxz(ball.pos.x,ball.pos.z,s*RIM_X,0) < RIM_R-0.06){
            const pts = ball.shot && ball.shot.team===((teams[0].dir===s)?teams[0]:teams[1]) ? ball.shot.pts : 2;
            scoreBasket(s, pts, ball.shot?ball.shot.shooter:null, play.state==='DUNK'?'dunk':'shot');

    } else if (ball.state==='DROP'){

          ball.pos.x+=(s*RIM_X-ball.pos.x)*(1-Math.exp(-10*dt));

        }

  }

}
function collideRimAndBoard(){
  let touched=false;
  for (const s of [-1,1]){
    const cx=s*RIM_X, dy=ball.pos.y-RIM_Y;

      const dx=ball.pos.x-cx, dz=ball.pos.z, dr=Math.hypot(dx,dz);

        const nl=Math.hypot(nx,ny,nz);
        if (nl<BALL_R+0.035 && nl>0.0001){
          const ux=nx/nl, uy=ny/nl, uz=nz/nl;
          const vn=ball.vel.x*ux+ball.vel.y*uy+ball.vel.z*uz;
          if (vn<0){ ball.vel.x-=ux*vn*1.6; ball.vel.y-=uy*vn*1.6; ball.vel.z-=uz*vn*1.6; }
          const push=BALL_R+0.04-nl;
          ball.pos.x+=ux*push; ball.pos.y+=uy*push; ball.pos.z+=uz*push;
          ball.vel.multiplyScalar(0.94);
          hoopAt(s).glow=Math.max(hoopAt(s).glow,0.45);
          touched=true;
        }
      }
    }
    // backboard
    const bx=s*BB_X;
    if (Math.abs(ball.pos.x-bx)<BALL_R && Math.abs(ball.pos.z)<0.95 && ball.pos.y>2.85 && ball.pos.y<4.05 && ball.vel.x*s>0){
      ball.pos.x=bx-s*BALL_R; ball.vel.x*=-0.62; ball.vel.y*=0.92; ball.vel.z*=0.92;
      hoopAt(s).glow=Math.max(hoopAt(s).glow,0.4);
      touched=true;
      if (ball.shot && ball.shot.bank && !ball.shot.banked){
        ball.shot.banked=true;
        const wx=s*RIM_X-ball.pos.x, wz=0-ball.pos.z, wl=Math.hypot(wx,wz)||1;
        const hs=Math.hypot(ball.vel.x,ball.vel.z);
        ball.vel.x=wx/wl*hs; ball.vel.z=wz/wl*hs;
      }
    }
  }
  if (touched && ball.state==='SHOT' && ball.pos.y<RIM_Y-0.3) shotMissedToRebound();
}
function shotMissedToRebound(){
  if (play.state==='SHOT'){
    ball.state='LOOSE'; play.reboundClaimed=false; setState('REBOUND');

  } else if (ball.state==='SHOT') ball.state='LOOSE';
}

}
function executeSetAction(car){
  const scheme=PLAYBOOK_BY_ID[play.schemeId], action=scheme.actions[play.step];
  if(!action){ startWindup(car,'jumper'); return; }
  const [type,role,label]=action, target=offT().players[role]; play.actionLabel=label; updateGamePlan();
  if(type==='hold'||type==='screen'||type==='cut'){
    if(play.t>(type==='screen'?.72:.58)){

        const reads={SWITCH:'SLIP BEFORE THE SWITCH',DROP:'TURN THE CORNER · READ THE DROP',ZONE:'SHORT ROLL INTO THE GAP',PRESS:'SCREEN THE TRAP · HIT THE RELEASE'};
        play.decision=reads[play.coverageId]||'USE THE ANGLE · KEEP TWO DEFENDERS BUSY';
      } else if(type==='cut') play.decision=play.coverageId==='ZONE'?'CUT BEHIND THE BALL-WATCHER':'BACK-CUT THE TOP FOOT';

    }
  } else if(type==='pass'){
    if(car===target) advanceAction();

  } else if(type==='drive'){
    if(car!==target){ play.passes++; startPass(target,'SET'); }
    else { play.driveLane=(play.possessionNo%2?1:-1); play.driveKind=role===4?'post':'rim'; play.decided=false; play.readMade=false; play.foulChecked=false; play.driveStart=car.pos.clone(); play.step++; setState('DRIVE'); }
  } else if(type==='shoot'){

}

function resolveRebound(){
  const rim=atkRim(offT()),crashCount=PLAYBOOK_BY_ID[play.schemeId]?.crash||2,coverage=COVERAGE_BY_ID[play.coverageId];
  const candidates=allPlayers().map(p=>{
    const dist=dxz(p.pos.x,p.pos.z,ball.pos.x,ball.pos.z), defense=p.side!==play.offense;
    const roleBoost=(p.role===4?1.75:p.role===3?1.35:1)*(1+(p.tendency.rebound||0));
    const crashEligible=defense||p.role>=5-crashCount;
    const matchup=teams[1-p.side].players[p.role];
    const rimDist=dxz(p.pos.x,p.pos.z,rim.x,0),oppRimDist=matchup?dxz(matchup.pos.x,matchup.pos.z,rim.x,0):99;
    const boxPosition=defense&&rimDist<oppRimDist?.52:0;
    const coverageEdge=defense?(coverage?.rebound||0):0;
    const momentum=clamp((Math.hypot(p.vel.x,p.vel.z)-2)/8,0,.22);
    return {p,w:crashEligible?Math.max(.05,(.35+roleBoost+boxPosition+coverageEdge+momentum)/Math.max(.62,dist)):.035};
  });
  let roll=rand()*candidates.reduce((n,c)=>n+c.w,0), winner=candidates[0].p;
  for(const c of candidates){roll-=c.w;if(roll<=0){winner=c.p;break;}}
  play.reboundClaimed=true; winner.reb++; teams[winner.side].rebounds++;
  ball.pos.set(winner.pos.x,1.15,winner.pos.z); ball.vel.set(0,0,0);
  const offensive=winner.side===play.offense;
  if(!offensive)winner.boxOuts++;
  say(offensive?`${winner.name} MUSCLES OUT AN EXTRA POSSESSION`:`${winner.name} BOXES OUT AND OWNS THE GLASS`);
  if(offensive&&dxz(winner.pos.x,winner.pos.z,atkRim(teams[winner.side]).x,0)<3.7&&chance(.52)){
    gainPossession(winner,'SET','OFFENSIVE REBOUND');shotClock=14;startWindup(winner,'layup');
  }else{ gainPossession(winner,offensive?'SET':'BRINGUP',offensive?'OFFENSIVE REBOUND':'DEFENSIVE REBOUND');if(offensive)shotClock=14; }
}

function resolveDriveRead(car,rim){

  const rimDist=dxz(car.pos.x,car.pos.z,rim.x,0);
  if(rimDist>4.45)return false;
  play.readMade=true;play.paintTouches++;

  const kick=bestKickTarget(car);

    play.createdAdvantage+=.14;play.kickTarget=roller;play.catchAndShoot=roller;play.catchKind='layup';
    play.actionLabel=play.schemeId==='SPAIN'?'BACK-SCREEN OPENS THE LOB':'POCKET PASS · ROLLER FREE';play.decision=play.actionLabel;updateGamePlan();
    startPass(roller,'SET');return true;
  }

    play.createdAdvantage+=clamp((kick.open-1.5)*.09,.08,.2);play.kickTarget=kick.p;play.catchAndShoot=kick.p;play.catchKind='jumper';
    play.actionLabel=`HELP COMMITS · KICK TO ${kick.p.roleName}`;play.decision=`${helper.name} TAGS · ${kick.p.name} LIFTS`;updateGamePlan();

  }

    play.createdAdvantage+=.035;play.actionLabel='DROP CONCEDES THE FLOATER';play.decision='TWO FEET IN THE PAINT · SOFT TOUCH';updateGamePlan();
    startWindup(car,'floater');return true;

// ---------- flow state machine ----------
function flow(dt){
  play.t+=dt;
  play.transitionT=Math.max(0,play.transitionT-dt);
  play.cameraBeat=Math.max(0,play.cameraBeat-dt);
  const off=offT(), def=defT(), car=carrier(), rim=atkRim(off);
  // clocks
  const deadBall=['FREE_THROW','MADE','INBOUND_RETRIEVE','INBOUND_BASELINE','INBOUND_READY','INBOUND_PASS'].includes(play.state);
  if(!deadBall) qClock-=dt;
  if (['BRINGUP','SET','PASSING','DRIVE','WINDUP','LOOSE_BALL'].includes(play.state)){
    shotClock-=dt;
    if (shotClock<=0){ violation(); return; }
  }
  if (qClock<=0) quarterPending=true;
  if (quarterPending && ['BRINGUP','SET'].includes(play.state)){ enterBreak(); return; }

  switch(play.state){
    case 'BRINGUP':
      if (!car) { if (play.t>2.5) outlet(play.offense); break; }
      if (dxz(car.pos.x,car.pos.z,rim.x-off.dir*8.5,clamp(car.pos.z*0.4,-3,3))<1.5){
        play.transitionT=0;
        play.wait=.28+rand()*.22; setState('SET');
        if (chance(.3)) say(`${car.name} WALKS IT UP AND SIGNALS ${PLAYBOOK_BY_ID[play.schemeId].label}`);
      }
      break;
    case 'SET':
      if (!car) break;
      if (!play.stealChecked && play.t>0.32){
        play.stealChecked=true;
        let thief=null, td=99;
        for (const d of def.players){ const dd=dxz(d.pos.x,d.pos.z,car.pos.x,car.pos.z); if(dd<td){td=dd;thief=d;} }
        const rate=((COVERAGE_BY_ID[play.coverageId]?.steal||.03)+(thief?.tendency.steal||0)-
          (car.tendency.handle||0)*.38)*(play.screenContact?.62:1);
        if (thief && td<1.18 && chance(rate)){ forceTurnover(thief,car); break; }
      }
      if(q>=4&&qClock<17&&def.score<off.score&&off.score-def.score<=10&&!play.foulChecked&&play.t>.7){
        play.foulChecked=true;let fouler=def.players[0];for(const d of def.players)if(dxz(d.pos.x,d.pos.z,car.pos.x,car.pos.z)<dxz(fouler.pos.x,fouler.pos.z,car.pos.x,car.pos.z))fouler=d;
        if(dxz(fouler.pos.x,fouler.pos.z,car.pos.x,car.pos.z)<1.35){beginFreeThrows(car,2,fouler,'TAKE FOUL');break;}
      }
      const protectLead=q>=4&&qClock<22&&off.score>def.score&&shotClock>9;
      if(protectLead){play.actionLabel=`BURN CLOCK · ATTACK AT ${Math.max(8,Math.ceil(shotClock-1))}`;play.decision='EMPTY THE POSSESSION · DENY A RETURN TRIP';updateGamePlan();}
      if (play.t>play.wait&&!protectLead){
        executeSetAction(car);
      }
      break;
    case 'PASSING':
      if (play.t>2.6 && ball.passTo){ gainPossession(ball.passTo, ball.pending==='BRINGUP'?'BRINGUP':'SET'); }
      break;
    case 'DRIVE': {
      if (!car) break;
      if (!play.stealChecked && play.t>0.22){
        play.stealChecked=true;
        let thief=null, td=99;
        for (const d of def.players){ const dd=dxz(d.pos.x,d.pos.z,car.pos.x,car.pos.z); if(dd<td){td=dd;thief=d;} }
        const rate=((COVERAGE_BY_ID[play.coverageId]?.steal||.03)+(thief?.tendency.steal||0)-
          (car.tendency.handle||0)*.42)*.72;
        if (thief && td<1.0 && chance(rate)){ forceTurnover(thief,car); break; }
      }
      const d=dxz(car.pos.x,car.pos.z,rim.x,rim.z);
      if(resolveDriveRead(car,rim))break;
      if (d<1.9 && !play.decided){
        play.decided=true;
        let fouler=null,fd=99;for(const dfn of def.players){const dd=dxz(dfn.pos.x,dfn.pos.z,car.pos.x,car.pos.z);if(dd<fd){fd=dd;fouler=dfn;}}
        const chargeChance=fouler&&fouler.role>=3?clamp(.018+(fouler.tendency.charge||0)*.72-(car.tendency.handle||0)*.16,.01,.11):0;
        if(fouler&&fd<1.04&&chance(chargeChance)){commitCharge(fouler,car);break;}
        if(fouler&&fd<.92&&chance(.07+(play.coverageId==='PRESS'?.04:0))){beginFreeThrows(car,2,fouler,'SHOOTING FOUL');break;}
        const spd=Math.hypot(car.vel.x,car.vel.z);
        if (spd>3.8 && car.role>=3 && chance(clamp(.42+(car.tendency.finish||0)*1.35,.4,.68))) beginDunk(car);
        else startWindup(car,'layup');
      } else if (play.t>4) startWindup(car,'layup');
      break; }
    case 'WINDUP':
      if (!play.released && play.t>=play.windDur){
        play.released=true;
        if(play.shootingFoulPending&&play.foulDefender){
          const dist=dxz(play.shooter.pos.x,play.shooter.pos.z,atkRim(teams[play.shooter.side]).x,0);
          beginFreeThrows(play.shooter,play.windKind==='jumper'&&dist>THREE_R?3:2,play.foulDefender,'SHOOTING FOUL');
        }else releaseShot(play.shooter, play.windKind);
      }
      break;
    case 'SHOT':
      if (play.t>3.2 && ball.state==='SHOT'){ shotMissedToRebound(); } // watchdog (airball into nowhere)
      break;
    case 'DUNK': {
      const dk=play.dunk; if (!dk){ setState('REBOUND'); break; }
      dk.t+=dt;
      const kk=dk.t/dk.dur;
      if (kk>=0.55 && !dk.slammed){
        dk.slammed=true;
        ball.pos.set(rim.x, RIM_Y-0.02, rim.z); ball.vel.set(-off.dir*0.4,-7,0); ball.holder=null;
        scoreBasket(off.dir, 2, dk.p, 'dunk');
        dk.p.air=true; dk.p.jumpV=0.6; dk.p.vel.set(-off.dir*1.2,0,0);
        play.dunk=null;
      }
      break; }
    case 'REBOUND': {
      if(!play.reboundClaimed&&play.t>.5&&ball.pos.y<2.15){resolveRebound();break;}
      // out of bounds
      if (Math.abs(ball.pos.x)>HL+1.8 || Math.abs(ball.pos.z)>HW+1.6){
        say('BALL SAILS INTO THE CROWD — FRESH POSSESSION');
        outlet(1-ball.lastTeam);
      }
      if (play.t>4&&!play.reboundClaimed) resolveRebound();
      break; }
    case 'LOOSE_BALL': {
      if(play.t>.42&&ball.pos.y<1.35){resolveLooseBall();break;}
      if(Math.abs(ball.pos.x)>HL+1.5||Math.abs(ball.pos.z)>HW+1.25){
        const loose=play.looseBall;play.looseBall=null;outlet(loose?.originalOffense??play.offense,'DEFLECTION OUT');
      }else if(play.t>2.2)resolveLooseBall();
      break; }
    case 'FREE_THROW': freeThrowStep(); break;
    case 'MADE':
      if (lowCam && play.t>0.75){ lowCam=false; cut(); }
      // Let the scorer finish and the bucket graphic clear before the scored-on
      // club starts the dead-ball retrieval. The inbound should read as its own play.
      if (play.t>1.25){
        if (quarterPending){ enterBreak(); break; }
        beginBaselineInbound(play.offense);
      }
      break;
    case 'INBOUND_RETRIEVE': {
      const ib=play.inbound;if(!ib){outlet(play.offense,'DEAD BALL');break;}
      const near=dxz(ib.inbounder.pos.x,ib.inbounder.pos.z,ball.pos.x,ball.pos.z);
      if((near<.72&&ball.pos.y<1.05&&play.t>.14)||(near<1.25&&play.t>1.45))collectInboundBall();
      else if(play.t>2.45){ib.inbounder.pos.set(clamp(ball.pos.x,-HL+.45,HL-.45),0,clamp(ball.pos.z,-2.2,2.2));collectInboundBall();}
      break; }
    case 'INBOUND_BASELINE': {
      const ib=play.inbound;if(!ib){outlet(play.offense,'DEAD BALL');break;}
      if(Math.abs(ib.inbounder.pos.x)>=HL+.34&&play.t>.24){
        ib.stage='READY';play.actionLabel='OUT OF BOUNDS · FIND THE POINT';
        play.decision=`${ib.receiver.name} BREAKS OPEN`;setState('INBOUND_READY');updateGamePlan();
        say(`${ib.inbounder.name} IS SET BEHIND THE BASELINE — WAITING FOR A CLEAN WINDOW`);
      }
      break; }
    case 'INBOUND_READY':
      if(play.t>.46)releaseBaselineInbound();
      break;
    case 'INBOUND_PASS':
      if(play.t>1.45&&ball.passTo){
        const rec=ball.passTo;ball.passTo=null;ball.inbound=false;gainPossession(rec,'BRINGUP');
      }
      break;
  }
  // global stuck watchdog
  if (play.t>14){ ball.shot=null; outlet(play.state.startsWith('INBOUND_')?play.offense:1-play.offense,'DEAD BALL RESET'); }
}
function startWindup(sh, kind){
  play.shooter=sh; play.windKind=kind; play.windDur=kind==='layup'?.2:kind==='floater'?.24:.3; play.released=false;
  sh.air=true; sh.jumpV=kind==='layup'?6.8:kind==='floater'?5.4:6.0;
  // contest: nearest defender challenges
  let best=null,bd=1e9;
  for (const d of teams[1-sh.side].players){ const dd=dxz(d.pos.x,d.pos.z,sh.pos.x,sh.pos.z); if(dd<bd){bd=dd;best=d;} }
  if (best && bd<3.4) best.contest=true;
  const whistle=(kind==='layup'?.085:kind==='floater'?.055:.035)+(play.coverageId==='PRESS'?.025:0)+(play.teamFouls[1-sh.side]>=4?.018:0);
  play.shootingFoulPending=!!best&&bd<1.0&&chance(whistle);play.foulDefender=play.shootingFoulPending?best:null;
  setState('WINDUP');
}

// ---------- quarter / match flow ----------
function enterBreak(){
  quarterPending=false;
  const isOT=q>4, last = (q>=4 && teams[0].score!==teams[1].score);
  phase = last ? 'FINAL' : 'BREAK'; breakT=0; cut();
  const line=`${teams[0].def.name} ${teams[0].score} — ${teams[1].score} ${teams[1].def.name}`;
  if (phase==='FINAL'){
    completedGames++;
    lastFinal={home:teams[0].def.name,away:teams[1].def.name,homeScore:teams[0].score,awayScore:teams[1].score};
    if(!suppressHoopsSpinePresentation)hoopsBroadcastSpine?.finale(hoopsMomentDirector?.top()||[]);
    const all=[...allPlayers()].sort((a,b)=>(b.pts+b.reb+b.ast)-(a.pts+a.reb+a.ast)).slice(0,4);
    showCard(`<h1>FINAL</h1><h2>${line}</h2>
      <table><tr><th>IMPACT FIVE</th><th>PTS</th><th>REB</th><th>AST</th></tr>
      ${all.map(p=>`<tr><td class="n" style="color:${p.td.css}">${p.name}</td><td>${p.pts}</td><td>${p.reb}</td><td>${p.ast}</td></tr>`).join('')}</table>
      <table><tr><th>CLUB</th><th>FG</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th></tr>
      ${teams.map(t=>`<tr><td class="n" style="color:${t.def.css}">${t.def.name}</td><td>${t.fgm}/${t.fga}</td><td>${t.rebounds}</td><td>${t.assists}</td><td>${t.steals}</td><td>${t.blocks}</td></tr>`).join('')}</table>
      <div class="sub" id="countd" style="margin-top:14px">NEXT TIP-OFF IN ${MATCH_MEMORY_FINAL_HOLD}</div>`);
    say(`FINAL BUZZER IN THE HOOPDOME — ${line}`);
    flashMsg('FINAL','', '#ff8a3d');
  } else {
    const label = isOT?'END OF OT':(q===2?'HALFTIME':`END OF Q${q}`);
    showCard(`<h1>${label}</h1><h2>${line}</h2>${q===2?'<div class="sub">TEAMS SWAP ENDS</div>':''}`);
    say(`${label} — ${line}`);
  }
}
function breakFlow(dt){
  breakT+=dt;
  for (const t of teams) for (const p of t.players){
    p.target.copy(p.pos); p.sprint=0;
    if (phase==='FINAL'){
      const win=teams[0].score>teams[1].score?teams[0]:teams[1];
      if (t===win) p.rig.poseCelebrate(tGlobal); else p.rig.poseExhausted(tGlobal);
    }
  }
  if (phase==='BREAK' && breakT>3.0){
    q++; qClock = q>4 ? OT_LEN : Q_LEN;
    play.teamFouls=[0,0];
    if (q===3){ teams[0].dir*=-1; teams[1].dir*=-1; say('ENDS SWAPPED — SECOND HALF UNDERWAY'); }
    if (q>4){ if (teams[0].score===teams[1].score){ say('OVERTIME — SUDDEN CHAOS PERIOD'); flashMsg('OT','SUDDEN CHAOS','#ffe14d'); } else { enterBreak(); return; } }
    phase='PLAY'; hideCard(); possArrow=1-possArrow;
    outlet(possArrow); cut();
  }
  if (phase==='FINAL'){
    const cd=document.getElementById('countd');
    if (cd) cd.textContent=`NEXT TIP-OFF IN ${Math.max(0,Math.ceil(MATCH_MEMORY_FINAL_HOLD-breakT))}`;
    if (breakT>MATCH_MEMORY_FINAL_HOLD) newMatch();
  }
}

// ---------- camera ----------
function updateCamera(dt){
  let dp, dl;
  if(innerWidth<700&&phase==='PLAY'){
    const dir=offT().dir;
    const transition=play.transitionT>0||play.state==='BRINGUP'||play.state.startsWith('INBOUND_')||
      (play.state==='PASSING'&&play.possessionReason!=='INBOUND');
    if(transition){
      // A fixed end-line tactical camera keeps the complete floor and both filled
      // transition lanes in view.  Tracking the ball from only nine metres behind
      // it stranded the trailing players at the phone edge and left half the screen
      // as empty hardwood once the break crossed mid-court.
      dp=V3(-dir*19.4,17.2,0);
      dl=V3(0,1.05,0);
    }else{
      // Settled possessions use a stable active-half view.  All ten assignments,
      // the rim and the weak-side spacing remain readable without the camera
      // breathing in and out on every pass, drive or shot.
      dp=V3(-dir*3.6,14.4,0);
      dl=V3(dir*7.1,1.35,ball.pos.z*.16);
    }
  } else if (phase!=='PLAY'){
    dp=V3(Math.sin(tGlobal*0.12)*17, 11.5, Math.cos(tGlobal*0.12)*17); dl=V3(0,1,0);
  } else if(play.state.startsWith('INBOUND_')&&play.inbound){
    const sign=play.inbound.rimSign;
    dp=V3(sign*(HL+2.6),8.8,13.8);dl=V3(sign*(HL-1.7),1.25,0);
  } else if (lowCam){
    const dir=offT().dir, zs=ball.pos.z>=0?1:-1;
    dp=V3(dir*(HL-0.6), 1.4, zs*6.2); dl=V3(dir*RIM_X, 2.7, 0);
  } else if (play.state==='DRIVE' || play.state==='WINDUP'){
    const rim=atkRim(offT());
    dp=V3(clamp(rim.x*0.55,-9,9), 8.6, 13.8); dl=V3(lerp(ball.pos.x,rim.x,0.3), 1.6, ball.pos.z*0.4);
  } else if (play.state==='SHOT' || play.state==='MADE' || play.state==='DUNK'){
    const rim=atkRim(offT());
    dp=V3(clamp(rim.x*0.5,-8,8), 9.6, 15.6); dl=V3(lerp(ball.pos.x,rim.x,0.55), 2.2, ball.pos.z*0.35);
  } else if (play.state==='LOOSE_BALL'){
    dp=V3(clamp(ball.pos.x*.52,-8.6,8.6),9.2,14.6);
    dl=V3(ball.pos.x,Math.max(.8,ball.pos.y),ball.pos.z);
  } else {
    dp=V3(clamp(ball.pos.x*0.55,-8.5,8.5), 11.4, 17.6); dl=V3(clamp(ball.pos.x*0.8,-10,10), 1.1, ball.pos.z*0.45);
  }
  if(innerWidth>=700&&phase==='PLAY'&&play.cameraBeat>0){
    const weight=clamp(play.cameraBeat/.82,0,1);
    dp.lerp(V3(clamp(play.cameraX*.62,-9.4,9.4),8.7,14.25),weight*.58);
    dl.lerp(V3(play.cameraX,Math.max(1.15,ball.pos.y),play.cameraZ),weight*.76);
  }
  if (pendingCut){ camPos.copy(dp); lookPt.copy(dl); pendingCut=false; }
  const k=1-Math.exp(-2.8*dt);
  camPos.lerp(dp,k); lookPt.lerp(dl,k);
  const shakeX=Math.sin(tGlobal*73.1)*shake*.18,shakeY=Math.cos(tGlobal*61.7)*shake*.10;
  camera.position.set(camPos.x+shakeX,camPos.y+shakeY,camPos.z);
  camera.lookAt(lookPt);
  const desiredFov=innerWidth<700?88:(play.cameraBeat>0?40:44);
  camera.fov+=(desiredFov-camera.fov)*(1-Math.exp(-5*dt));
  camera.updateProjectionMatrix();
}

// ---------- fx + hud per frame ----------
function fxStep(dt){
  shake*=Math.exp(-3.2*dt);
  const tension=phase==='PLAY'?(shotClock<5?.35:q>=4&&Math.abs(teams[0].score-teams[1].score)<=5?.22:0):0;
  crowdHype=Math.max(tension,crowdHype*Math.exp(-.9*dt));
  crowdGroup.position.y=Math.abs(Math.sin(tGlobal*(7+crowdHype*4)))*.07*crowdHype+Math.sin(tGlobal*1.6)*.012;
  const ritual=venueIdentity?.kitPattern||'pulse';
  crowdFlags.forEach((flag,i)=>{
    const section=i/crowdFlags.length,phase=ritual==='wave'||ritual==='drift'?section*Math.PI*4:ritual==='spiral'?section*Math.PI*8:i;
    const hit=ritual==='hex'?Math.sin(tGlobal*5+Math.floor(i/3)*Math.PI*.66):Math.sin(tGlobal*(2.3+(i%3)*.25)+phase);
    flag.rotation.z=hit*(.08+crowdHype*.22);flag.scale.y=1+Math.max(0,hit)*crowdHype*.14;
  });
  heroFans.forEach((fan,i)=>{const energy=.15+crowdHype*.85,wave=Math.sin(tGlobal*(3.2+(i%4)*.25)+fan.userData.phase);fan.position.y=1.3+Math.max(0,wave)*.16*energy;fan.children.slice(2).forEach((arm,j)=>{arm.rotation.z=(j?1:-1)*(.65+Math.max(0,wave)*.9*energy);});});
  centerCube.rotation.y=Math.sin(tGlobal*.08)*.035;
  truss.material.emissiveIntensity=.38+crowdHype*.85;
  venueScreen.material.opacity=.86+crowdHype*.14;
  venueLights.forEach((light,i)=>{light.intensity=38+crowdHype*(24+(i%3)*7);});
  for (const h of hoops){
    h.glow*=Math.exp(-4*dt);
    h.rimMat.emissiveIntensity=0.85+h.glow*4;
    h.netMat.opacity=0.32+h.glow*0.55;
  }
  if (flashTimer>0){ flashTimer-=dt; if (flashTimer<=0) elFlash.classList.remove('show'); }
  const tq=Math.max(0,qClock), mm=String(Math.floor(tq/60)).padStart(2,'0'), ss=String(Math.floor(tq%60)).padStart(2,'0');
  elClock.textContent=`${mm}:${ss}`;
  elQtr.textContent=q>4?'OT':`Q${q}`;
  const sc=Math.max(0,Math.ceil(shotClock));
  elSclock.textContent=sc;
  elSclock.classList.toggle('warn', sc<=5 && phase==='PLAY');
  const car=carrier();
  carrierRing.visible=!!car && phase==='PLAY';
  if (car){
    carrierRing.position.set(car.pos.x,0.04,car.pos.z);
    carrierRing.material.color.setHex(classicSideVisual(car.side));
    carrierRing.rotation.z+=dt*0.9;
  }
  ballShadow.position.x=ball.pos.x; ballShadow.position.z=ball.pos.z;
  const shadowScale=clamp(1-ball.pos.y/12,0.25,1);
  ballShadow.scale.setScalar(shadowScale); ballShadow.material.opacity=0.12+shadowScale*0.24;
  const status = phase==='FINAL' ? 'FINAL' : phase==='BREAK' ? 'INTERMISSION' :
    play.state==='FREE_THROW' ? 'AT THE LINE' :
    play.state==='INBOUND_RETRIEVE' ? 'RETRIEVING THE MAKE' :
    play.state==='INBOUND_BASELINE' ? 'STEPPING OUT OF BOUNDS' :
    play.state==='INBOUND_READY' ? 'BASELINE INBOUND' :
    play.state==='INBOUND_PASS' ? 'INBOUND PASS' :
    play.state==='LOOSE_BALL' ? '50/50 BALL' :
    play.state==='REBOUND' ? 'LOOSE BALL' : play.state==='DUNK' ? 'AT THE RIM' :
    play.state==='SHOT' ? 'SHOT IN FLIGHT' : play.transition?'TRANSITION':car ? `${car.name} • ${car.td.name}` : play.state.replace('_',' ');
  elStatus.textContent=status;
  fxStep.frame=(fxStep.frame||0)+1;if(fxStep.frame%24===0)updateCenterCube();
}

// ---------- main loop ----------
newMatch();
function tuneIntoHoopsBroadcast(){

  else queueHoopsWhoToWatch();

  tuneInMeta.clock=+Math.max(0,qClock).toFixed(1);
  flashTimer=0;elFlash.classList.remove('show');cut();updateGamePlan();updateCenterCube();
  say(`JOINING LIVE — Q${q} ${fmtGameClock(Math.max(0,qClock))} — ${PLAYBOOK_BY_ID[play.schemeId]?.label||'LIVE POSSESSION'}`,true);
}

  }),
  projectile:{
    x:ball.pos.x,y:ball.pos.y,z:ball.pos.z,vx:ball.vel.x,
    vy:ball.state==='HELD'?ball.vy:ball.vel.y,vz:ball.vel.z,
    ownerId:ball.holder?.athlete.id||null,mode:ball.state
  },
  event:flashTimer>0?{title:elFT.textContent,detail:elFS.textContent,type:play.lastOutcome}:null,
  presentation:{
    attackSign:teams[play.offense].dir,possessionTeam:play.offense,shotClock:Math.max(0,shotClock),playCall:PLAYBOOK_BY_ID[play.schemeId]?.label||null,
    equipment:{rimX:RIM_X,rimY:RIM_Y,rimRadius:RIM_R,boardX:BB_X,boardY:3.45,boardHalfWidth:.9,boardHeight:1.05,netDepth:.5,poleX:HL+1.3,poleHeight:3.9}
  }
})});
releaseEstablishingHold(true);
function tick(dt, skipRender=false, bypassEstablishing=false){
  if(!(skipRender&&bypassEstablishing))hoopsBroadcastSpine?.tick(dt*1000);
  if(establishingHold&&!bypassEstablishing){
    if(!skipRender){setTargets(0);updatePlayers(0);updateBall(0);updateCamera(0);fxStep(0);tickerStep(0);composer.render();}
    return;
  }
  tGlobal+=dt;
  if (phase==='PLAY') flow(dt); else breakFlow(dt);
  setTargets(dt);
  updatePlayers(dt);
  updateBall(dt);
  if (skipRender){
    if(flashTimer>0){flashTimer-=dt;if(flashTimer<=0)elFlash.classList.remove('show');}
    return;
  } // hidden-tab catch-up: only the last step touches expensive visuals
  updateCamera(dt);
  fxStep(dt);
  tickerStep(dt);
  composer.render();
}
// ---------- tick driver (hidden-tab resilience, same pattern as index.html) ----------
// rAF freezes in hidden tabs, so when hidden a setInterval replays elapsed real
// time as fixed 0.05s sim steps (capped at 1s of catch-up per fire), rendering
// only the last step. Exactly ONE driver runs at a time.
let rafId=0, hiddenTimer=0, last=performance.now();
function rafLoop(now){
  rafId=requestAnimationFrame(rafLoop);
  const dt=Math.min((now-last)/1000, 0.05); last=now;
  if (dt<=0) return;
  tick(dt);
}
function startDriver(){
  if (rafId){ cancelAnimationFrame(rafId); rafId=0; }
  if (hiddenTimer){ clearInterval(hiddenTimer); hiddenTimer=0; }
  if (document.hidden){
    let lastFire=performance.now();
    hiddenTimer=setInterval(()=>{
      const now=performance.now();
      const steps=Math.min(Math.floor((now-lastFire)/50), 20);
      if (steps<=0) return;
      lastFire=now;
      last=now; // so foreground resume doesn't inherit a huge delta
      for (let i=0;i<steps;i++) tick(0.05, i<steps-1);
    },50);
  } else { last=performance.now(); rafLoop(last); }
}
document.addEventListener('visibilitychange', startDriver);
startDriver();

window.render_game_to_text=()=>JSON.stringify({
  coordinateSystem:'court meters; origin center court; +x right basket, +z far sideline, +y up',
  autonomous:true,
  interaction:'view-only',
  deterministicSeed:simSeed>>>0,
  mode:phase,
  completedGames,
  lastFinal,
  quarter:q,
  gameClock:+Math.max(0,qClock).toFixed(2),
  shotClock:+Math.max(0,shotClock).toFixed(2),
  play:play.state,
  playCall:PLAYBOOK_BY_ID[play.schemeId]?.label||null,
  coverage:COVERAGE_BY_ID[play.coverageId]?.label||null,
  action:play.actionLabel,
  decision:play.decision,
  transition:{active:play.transitionT>0,seconds:+play.transitionT.toFixed(2),reason:play.possessionReason},
  inbound:play.inbound?{
    active:play.state.startsWith('INBOUND_'),stage:play.inbound.stage,
    inbounder:play.inbound.inbounder.name,receiver:play.inbound.receiver.name,
    rimSign:play.inbound.rimSign,
    inbounderPosition:{x:+play.inbound.inbounder.pos.x.toFixed(2),z:+play.inbound.inbounder.pos.z.toFixed(2)},
    behindBaseline:Math.abs(play.inbound.inbounder.pos.x)>HL,
    completed:play.inboundsCompleted,last:play.lastInbound
  }:{active:false,stage:null,completed:play.inboundsCompleted,last:play.lastInbound},
  tuneIn:{...tuneInMeta},
  matchMemory:hoopsMomentDirector?.state()||null,
  broadcastSpine:hoopsBroadcastSpine?.state()||null,
  shotQuality:play.shotQuality?{value:+play.shotQuality.toFixed(3),label:qualityLabel(play.shotQuality),context:play.shotContext}:null,
  possession:play.possessionNo,
  schemesSeen:[...play.seenSchemes],
  coveragesSeen:[...play.seenCoverages],
  offense:teams[play.offense]?.def.name||null,
  inTransition:play.transition,
  advantage:+play.createdAdvantage.toFixed(3),
  paintTouches:play.paintTouches,
  helpDefender:play.helpPlayer?.name||null,
  teamFouls:play.teamFouls.slice(),
  lastOutcome:play.lastOutcome,
  broadcast:{
    cameraBeat:play.cameraBeat>0?play.cameraKind||'live':null,
    contact:play.contactKind,
    featuredAthlete:play.contactActor||null,
    recentOutcomes:play.outcomeHistory.slice(-6)
  },
  schemeResults:play.schemeResults,
  coverageResults:play.coverageResults,
  teams:teams.map(t=>({name:t.def.name,code:t.def.code,score:t.score,fg:`${t.fgm}/${t.fga}`,rebounds:t.rebounds,assists:t.assists,
    steals:t.steals,blocks:t.blocks,deflections:t.deflections,looseBalls:t.looseBalls,chargesDrawn:t.chargesDrawn,
    turnovers:t.turnovers,fouls:t.fouls})),
  arena:{name:teams[0]?.def.brand.venue||'HOME COURT',description:teams[0]?.def.brand.venueLine||'',ritual:teams[0]?.def.brand.ritual||'',statement:teams[0]?.def.brand.statement||'',scene:teams[0]?.def.brand.scene||'',kitPattern:teams[0]?.def.brand.kitPattern||'',spectators:(crowdBodies?.count||0)+heroFans.length,centerHungScoreboard:true,upperLightTruss:true},
  ball:{state:ball.state,x:+ball.pos.x.toFixed(2),y:+ball.pos.y.toFixed(2),z:+ball.pos.z.toFixed(2),holder:ball.holder?.name||null},
  foundingCues:allPlayers().map((p,entityIndex)=>p.rig.group.userData.foundingCue?{
    ...p.rig.group.userData.foundingCue,side:p.side,entityIndex,teamPlayerIndex:p.teamPlayerIndex,arenaRole:p.roleName
  }:null).filter(Boolean).sort((a,b)=>a.entityIndex-b.entityIndex),
  players:allPlayers().map(p=>({name:p.name,team:p.td.name,role:p.roleName,signature:p.tendency.label,
    x:+p.pos.x.toFixed(2),z:+p.pos.z.toFixed(2),bodyScale:{x:+p.renderScale[0].toFixed(2),y:+p.renderScale[1].toFixed(2),z:+p.renderScale[2].toFixed(2)},
    points:p.pts,rebounds:p.reb,assists:p.ast,fouls:p.fouls,fg:`${p.fgm}/${p.fga}`,hasBall:ball.holder===p}))
});
window.advanceTime=(ms)=>{
  const steps=Math.max(1,Math.round(ms/(1000/60)));
  for(let i=0;i<steps;i++) tick(1/60,i<steps-1);
};
window.__CYBERLIGA_HOOPS_TEST__={
  restart(){matchNo=Math.max(0,matchNo-1);newMatch();return JSON.parse(window.render_game_to_text());},
  fixture(index=0){matchNo=((Number(index)||0)%FIXTURES.length+FIXTURES.length)%FIXTURES.length;newMatch();return JSON.parse(window.render_game_to_text());},
  simulateToFinal(maxSeconds=700){releaseEstablishingHold(true);const maxSteps=Math.max(1,Math.round(maxSeconds*60));for(let i=0;i<maxSteps&&phase!=='FINAL';i++)tick(1/60,true);tick(1/60,false);return JSON.parse(window.render_game_to_text());},
  forceScheme(id){ if(!PLAYBOOK_BY_ID[id])throw new Error(`Unknown play ${id}`);play.schemeId=id;play.step=0;play.actionLabel=PLAYBOOK_BY_ID[id].actions[0][2];play.seenSchemes.add(id);setState('SET');updateGamePlan(); },
  forceCoverage(id){ if(!COVERAGE_BY_ID[id])throw new Error(`Unknown coverage ${id}`);play.coverageId=id;play.seenCoverages.add(id);updateGamePlan(); },
  forceDeflection(side=1-play.offense){
    releaseEstablishingHold(true);phase='PLAY';hideCard();
    const defender=teams[clamp(side|0,0,1)].players[1],victim=teams[1-defender.side].players[0];
    play.offense=victim.side;ball.holder=null;ball.passer=victim;ball.passTo=victim.td===defender.td?null:teams[victim.side].players[2];
    ball.pending='SET';ball.state='PASS';ball.pos.set((victim.pos.x+defender.pos.x)*.5,1.1,(victim.pos.z+defender.pos.z)*.5);
    ball.vel.set(6,1.4,1);deflectPass(defender,victim);return JSON.parse(window.render_game_to_text());
  },
  forceCharge(side=1-play.offense){
    releaseEstablishingHold(true);phase='PLAY';hideCard();
    const defender=teams[clamp(side|0,0,1)].players[3],driver=teams[1-defender.side].players[1];
    play.offense=driver.side;ball.holder=driver;ball.state='HELD';driver.pos.set(defender.pos.x-teams[driver.side].dir*.55,0,defender.pos.z);
    commitCharge(defender,driver);return JSON.parse(window.render_game_to_text());
  },
  forceTransition(side=play.offense){
    releaseEstablishingHold(true);
    const idx=clamp(side|0,0,1),attack=teams[idx],defense=teams[1-idx],runner=attack.players[0],lanes=[0,-6.1,6.1,-3.35,3.35];
    attack.players.forEach((p,i)=>{p.pos.set(-attack.dir*(8-i*.55),0,lanes[i]);p.vel.set(0,0,0);p.target.copy(p.pos);});
    defense.players.forEach((p,i)=>{p.pos.set(-attack.dir*(4.6-i*.32),0,lanes[i]+(i%2?.52:-.52));p.vel.set(0,0,0);p.target.copy(p.pos);});
    play.offense=idx;ball.holder=runner;ball.state='HELD';ball.vel.set(0,0,0);ball.pos.set(runner.pos.x,1,runner.pos.z);
    elFlash.classList.remove('show');flashTimer=0;
    callPossession('STEAL');setState('BRINGUP');play.transitionT=3.8;cut();return JSON.parse(window.render_game_to_text());
  },
  forceMadeBasket(side=play.offense,pts=2){
    releaseEstablishingHold(true);
    const idx=clamp(side|0,0,1),tm=teams[idx],opp=teams[1-idx],scorer=tm.players[2],rim=atkRim(tm);
    phase='PLAY';hideCard();play.inbound=null;play.freeThrow=null;play.offense=idx;play.scorer=null;play.transitionT=0;lowCam=false;
    tm.players.forEach((p,i)=>{p.pos.set(rim.x-tm.dir*(1.3+i*.72),0,(i-2)*1.45);p.vel.set(0,0,0);p.target.copy(p.pos);});
    opp.players.forEach((p,i)=>{p.pos.set(rim.x-tm.dir*(2.0+i*.58),0,(i-2)*1.3+.32);p.vel.set(0,0,0);p.target.copy(p.pos);});
    scorer.fga++;tm.fga++;play.lastPasser=null;play.lastPassAt=-99;
    ball.holder=null;ball.passTo=null;ball.pending=null;ball.inbound=false;ball.state='SHOT';ball.lastTeam=idx;
    ball.pos.set(rim.x,RIM_Y+.18,0);ball.vel.set(0,-6.2,0);ball.vy=0;
    ball.shot={pts:pts===3?3:2,shooter:scorer,team:tm,bank:false,banked:false,quality:1,intendedMake:true,contest:0};
    play.actionLabel='CLEAN MAKE · VERIFY BASELINE INBOUND';play.decision='BALL MUST CLEAR THE NET BEFORE THE RESTART';
    setState('SHOT');updateGamePlan();cut();return JSON.parse(window.render_game_to_text());
  },
  forceNamedMoment(kind='steal',side=0,athleteId=''){
    releaseEstablishingHold(true);phase='PLAY';hideCard();suppressHoopsSpinePresentation=false;
    const idx=clamp(side|0,0,1),tm=teams[idx],opp=teams[1-idx];
    const player=tm.players.find(p=>p.athlete?.id===athleteId)||tm.players.find(p=>window.CyberligaCharacters?.get(p.athlete?.id))||tm.players[0];
    play.outcomeRecorded=false;play.lastPasser=null;play.lastPassAt=-99;play.inbound=null;play.freeThrow=null;
    if(kind==='steal'){
      const victim=opp.players[0];play.offense=victim.side;ball.holder=victim;ball.state='HELD';ball.shot=null;
      ball.pos.set(victim.pos.x,1.05,victim.pos.z);forceTurnover(player,victim);
    }else if(kind==='block'){
      const shooter=opp.players[2]||opp.players[0];play.offense=shooter.side;ball.pos.set(shooter.pos.x,1.4,shooter.pos.z);
      commitCleanBlock(player,shooter,opp);
    }else if(kind==='dunk'||kind==='three_pointer'){
      play.offense=idx;player.fga++;tm.fga++;
      scoreBasket(tm.dir,kind==='three_pointer'?3:2,player,kind==='dunk'?'dunk':'shot');
    }else throw new Error(`Unknown named moment ${kind}`);
    return JSON.parse(window.render_game_to_text());
  },
  fresh(){matchNo=Math.max(0,matchNo-1);newMatch();tuneInMeta.mode='forced-fresh';tuneInMeta.offsetSeconds=0;tuneInMeta.entryState='TIP-OFF';return JSON.parse(window.render_game_to_text());},
  state(){return JSON.parse(window.render_game_to_text());}
};

  camera.fov=innerWidth<700?88:44;
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
}
addEventListener('resize',resizeView);
resizeView();
