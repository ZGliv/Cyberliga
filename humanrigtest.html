<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>HUMANRIG TEST</title>
<style>body{margin:0;background:#02030a;overflow:hidden}#info{position:fixed;top:10px;left:10px;color:#7ef0ff;font:14px monospace;white-space:pre;text-shadow:0 0 6px #000}</style>
</head>
<body>
<div id="info">loading…</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { preloadHumanModel, buildPlayerRig } from './humanrig.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02030a);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 2.6, 9); camera.lookAt(0, 1.1, 0);
scene.add(new THREE.HemisphereLight(0x4a5da0, 0x0a0d1a, 1.2));
const sun = new THREE.DirectionalLight(0xeaf4ff, 2.2); sun.position.set(4, 8, 5); sun.castShadow = true; scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x0e4d2c }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
// forward-axis check: blue arrow = +Z (rigs should face it)
scene.add(new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0.05, 2.6), 1.2, 0x4488ff));

const info = document.getElementById('info');

preloadHumanModel().then(() => {
  const COLORS = [
    { kit: 0x00e5ff, glow: 0x00e5ff },
    { kit: 0xff2d78, glow: 0xff2d78 },
    { kit: 0xffc24d, glow: 0xffc24d },
    { kit: 0x8d5cff, glow: 0x8d5cff },
  ];
  const rigs = COLORS.map((c, i) => {
    const rig = buildPlayerRig({
      kitColor: c.kit, glowColor: c.glow, skinTone: 0xe0ac69, hairColor: 0x14100c,
      isGK: i === 2, headband: i === 1,
      captain: i === 0, pattern: i === 3 ? 'accent' : 'solid',
    });
    rig.group.position.x = (i - 1.5) * 2.2;
    scene.add(rig.group);
    return rig;
  });
  window.TEST_OK = true;
  window.RIGS = rigs; // debug hook: console can yaw rigs for profile checks

  // demo program: every rig runs the same phase so each pose is easy to eyeball
  // in four team colors at once. Locomotion sweep runs between pose phases.
  const PHASES = [
    { name: 'locomotion sweep 0→1', dur: 6 },
    { name: 'poseKick loop', dur: 4 },
    { name: 'poseThrowIn loop', dur: 4 },
    { name: 'poseDive (GK rig dives ±)', dur: 4 },
    { name: 'poseFall → poseGetUp', dur: 4 },
    { name: 'poseCelebrate 0/1/2 + argue', dur: 6 },
    { name: 'poseSkill: stepover/feint/dragback/roulette', dur: 6 },
    { name: 'poseShield', dur: 3 },
    { name: 'additives: accel/turn sweep at run', dur: 8 },
    { name: 'idle micro-behaviors (watch desync)', dur: 10 },
    { name: 'poseSlideTackle ±', dur: 4 },
    { name: 'poseHeader loop', dur: 4 },
    { name: 'poseJockey / poseGKSet', dur: 4 },
    { name: 'poseGKCatch / poseGKPunch', dur: 4 },
    { name: 'poseLimp / poseTrudge / poseExhausted', dur: 6 },
    { name: 'poseKneeSlide + celebrate variants 3/4', dur: 5 },
    { name: 'posePointToSpot / poseWhistle', dur: 4 },
    { name: 'blend test: pose pulses over locomotion', dur: 6 },
  ];
  let phase = 0, phaseT = 0;
  const clock = new THREE.Clock();

  (function tick() {
    requestAnimationFrame(tick);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;
    phaseT += dt;
    if (window.FORCE_PHASE != null && phase !== window.FORCE_PHASE) { phase = window.FORCE_PHASE; phaseT = 0; }
    if (phaseT > PHASES[phase].dur) { phaseT = 0; phase = window.FORCE_PHASE ?? (phase + 1) % PHASES.length; }
    const k = phaseT / PHASES[phase].dur;

    rigs.forEach((rig, i) => {
      let speed = 0, accel = 0, turn = 0;
      switch (phase) {
        case 0: speed = (Math.sin(t * 0.9 + i * 0.4) + 1) / 2; break; // idle↔walk↔run sweep
        case 1: rig.poseKick((phaseT * 0.8) % 1, i % 2, 1); break;
        case 2: rig.poseThrowIn((phaseT * 0.6) % 1); break;
        case 3: rig.poseDive(i % 2 ? 1 : -1, Math.min(1, (phaseT % 2) / 0.8)); break;
        case 4: phaseT < 2 ? rig.poseFall(phaseT / 1.2) : rig.poseGetUp((phaseT - 2) / 1.5); break;
        case 5: i < 3 ? rig.poseCelebrate(t, i) : rig.poseArgue(t); break;
        case 6: rig.poseSkill(['stepover', 'bodyfeint', 'dragback', 'roulette'][i], (phaseT * 0.7) % 1, i % 2 ? 1 : -1); break;
        case 7: rig.poseShield(Math.min(1, phaseT * 2), i % 2 ? 1 : -1); break;
        case 8: // additive sweep: full run, accel and turn swept -1..1 (slider-style)
          speed = 0.55 + 0.45 * Math.sin(t * 0.5 + i);
          accel = Math.sin(phaseT * 1.2);          // speed-up / brake-lean sweep
          turn = Math.sin(phaseT * 0.8 + Math.PI / 2); // bank sweep
          break;
        case 9: speed = 0; break;                  // idle: micro-behaviors, personality desync
        case 10: rig.poseSlideTackle(Math.min(1, (phaseT % 2) / 1.2), i % 2 ? 1 : -1); break;
        case 11: rig.poseHeader((phaseT * 0.55) % 1); break;
        case 12: i < 2 ? rig.poseJockey(t, i % 2 ? 1 : -1) : rig.poseGKSet(t); break;
        case 13: i % 2 ? rig.poseGKCatch((phaseT * 0.6) % 1) : rig.poseGKPunch((phaseT * 0.6) % 1); break;
        case 14:
          if (i === 0) { rig.poseLimp(t); speed = 0.12; }
          else if (i === 1) { rig.poseTrudge(t); speed = 0.1; }
          else if (i === 2) rig.poseExhausted(t);
          else { rig.poseLimp(t, -1); speed = 0.12; }
          break;
        case 15: i < 2 ? rig.poseKneeSlide(Math.min(1, (phaseT % 2.5) / 1.6)) : rig.poseCelebrate(t, i + 1 === 3 ? 3 : 4); break;
        case 16: i % 2 ? rig.posePointToSpot(phaseT % 2) : rig.poseWhistle(phaseT % 2); break;
        case 17: // SMOOTHNESS check: pose called only on pulses — watch the
          // ease-in/ease-out blend instead of the old snap
          speed = 0.3;
          if (Math.sin(t * 1.5 + i) > 0.3) rig.poseShield(1, i % 2 ? 1 : -1);
          break;
      }
      // head tracking demo: look toward a wandering point
      rig.headPivot.rotation.y = Math.sin(t * 0.7 + i) * 0.8;
      rig.update(dt, speed, { accel, turn });
    });

    info.textContent = 'humanrig test — TEST_OK\nphase: ' + PHASES[phase].name +
      ' (' + (k * 100).toFixed(0) + '%)\nblue arrow = +Z = rig forward';
    renderer.render(scene, camera);
  })();
}).catch((err) => {
  info.textContent = 'LOAD FAILED: ' + err;
  window.TEST_OK = false;
});
</script>
</body>
</html>
