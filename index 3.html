<style>

  #teamA { color:#7ef0ff; } #teamA .dot { background:#00e5ff; box-shadow:0 0 10px #00e5ff; }

    display:flex; align-items:center; padding:0 18px; font-family:'Orbitron'; font-weight:900; font-size:22px; color:#fff;

  #half { font-size:12px; font-weight:600; color:#6fe3ff; letter-spacing:2px; }

  #goalsub { font-family:'Rajdhani'; font-weight:700; font-size:20px; letter-spacing:6px; color:rgba(255,255,255,.85); margin-top:6px; }

  /* Ticker */
  #ticker {
    position:absolute; bottom:0; left:0; right:0; height:34px; display:flex; align-items:center; overflow:hidden;
    background: linear-gradient(180deg, rgba(4,6,16,.85), rgba(2,3,10,.95));

  }
  #tickerlabel { flex:0 0 auto; padding:0 14px; height:100%; display:flex; align-items:center; background:rgba(0,229,255,.12); font-family:'Orbitron'; font-weight:700; font-size:11px; color:#7ef0ff; letter-spacing:3px; border-right:1px solid rgba(0,229,255,.25); }
  #tickertext { white-space:nowrap; font-size:15px; font-weight:600; color:rgba(220,245,255,.85); letter-spacing:1px; animation: scroll 38s linear infinite; padding-left:100%; }
  @keyframes scroll { to { transform: translateX(-100%); } }

  /* Vignette + scanlines */
  #vignette { position:absolute; inset:0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,10,.55) 100%); }
  #scanlines { position:absolute; inset:0; background: repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0 1px, transparent 1px 3px); mix-blend-mode: overlay; }

  #watermark { position:absolute; bottom:46px; right:18px; font-family:'Orbitron'; font-weight:900; font-size:13px; letter-spacing:4px; color:rgba(126,240,255,.4); }

  /* Replay tag */
  #replaytag { position:absolute; top:24px; left:26px; font-family:'Orbitron'; font-weight:900; font-size:20px; letter-spacing:6px; color:#ffe14d; opacity:0; transition:opacity .2s; text-shadow:0 0 16px rgba(255,225,77,.8); }
  #replaytag.show { opacity:1; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:.35; } }

  /* HT/FT broadcast cards */
  #bigcard { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(2,3,10,.45); backdrop-filter: blur(3px); }
  #bigcard.show { display:flex; }
  #bigcard .panel { background: linear-gradient(180deg, rgba(8,12,28,.97), rgba(3,5,14,.97)); border:1px solid rgba(0,229,255,.3); border-radius:14px; padding:30px 46px; text-align:center; box-shadow:0 0 60px rgba(0,229,255,.18); min-width:440px; }
  #bigcard h1 { font-family:'Orbitron'; font-size:32px; letter-spacing:8px; color:#7ef0ff; margin-bottom:8px; text-shadow:0 0 18px rgba(0,229,255,.5); }
  #bigcard h2 { font-family:'Orbitron'; font-size:24px; color:#fff; margin-bottom:16px; letter-spacing:2px; }
  #bigcard table { width:100%; border-collapse:collapse; font-size:15px; color:#cfeaff; }
  #bigcard th, #bigcard td { padding:5px 10px; text-align:center; border-bottom:1px solid rgba(255,255,255,.08); }
  #bigcard th { color:#6fe3ff; font-size:11px; letter-spacing:2px; }
  #bigcard td.tname { text-align:left; font-weight:700; }

  /* Sound pill */
  #soundpill { position:absolute; bottom:46px; left:18px; font-family:'Rajdhani'; font-weight:700; font-size:13px; letter-spacing:2px; color:#7ef0ff; border:1px solid rgba(0,229,255,.35); padding:4px 12px; border-radius:99px; background:rgba(4,8,20,.7); }

<script type="module">

import { createBallControl } from './ballcontrol.js';
import { createGoalkeeper } from './goalkeeper.js';

// ============ CONSTANTS ============
const FIELD_W = 64, FIELD_H = 40;          // pitch dims (x = length, z = width)
const HALF_W = FIELD_W/2, HALF_H = FIELD_H/2;
const GOAL_WIDTH = 9, GOAL_HEIGHT = 3.2, GOAL_DEPTH = 2.4;
// ============ LEAGUE ============
const LEAGUE_TEAMS = [
  { color: 0x00e5ff, glow: 0x00e5ff, name: 'NEON FC' },
  { color: 0xff2d78, glow: 0xff2d78, name: 'VOLT UTD' },
  { color: 0xffc24d, glow: 0xffc24d, name: 'GRID ROYALS' },
  { color: 0x8a5cff, glow: 0x8a5cff, name: 'ASTRA NOVA' },
];
const FIXTURES = [[0,1],[2,3],[0,2],[1,3],[0,3],[1,2]];
let TEAM_A = LEAGUE_TEAMS[0];
let TEAM_B = LEAGUE_TEAMS[1];
let league = JSON.parse(localStorage.getItem('cyberliga') || 'null');
if (!league || !league.table) league = {
  fixture: 0,
  table: Object.fromEntries(LEAGUE_TEAMS.map(t => [t.name, {p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}])),
};

// ============ RENDERER / SCENE ============
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02030a);
scene.fog = new THREE.FogExp2(0x040618, 0.0065);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 600);
camera.position.set(0, 34, 52);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.6, 0.82);
composer.addPass(bloom);

// ============ LIGHTING ============
scene.add(new THREE.HemisphereLight(0x4a5da0, 0x0a0d1a, 0.9));
const fill = new THREE.DirectionalLight(0xbfd6ff, 0.7);
fill.position.set(20, 50, 30);
scene.add(fill);
function floodlight(x, z) {
  const l = new THREE.SpotLight(0xeaf4ff, 900, 160, Math.PI/4.6, 0.45, 1.6);
  l.position.set(x, 42, z);
  l.target.position.set(x*0.25, 0, z*0.25);
  l.castShadow = true;
  l.shadow.mapSize.set(1024, 1024);
  l.shadow.bias = -0.0008;
  scene.add(l, l.target);
}
floodlight(-HALF_W-12, -HALF_H-12); floodlight(HALF_W+12, -HALF_H-12);
floodlight(-HALF_W-12, HALF_H+12);  floodlight(HALF_W+12, HALF_H+12);

// ============ PITCH ============
function makePitchTexture() {
  const c = document.createElement('canvas'); c.width = 2048; c.height = 1280;
  const g = c.getContext('2d');
  // striped grass
  const stripes = 16;
  for (let i = 0; i < stripes; i++) {
    g.fillStyle = i % 2 ? '#0b3d23' : '#0e4d2c';
    g.fillRect(i * c.width/stripes, 0, c.width/stripes, c.height);
  }
  // subtle noise
  for (let i = 0; i < 14000; i++) {
    g.fillStyle = `rgba(${Math.random()*30},${60+Math.random()*40},${Math.random()*35},0.05)`;
    g.fillRect(Math.random()*c.width, Math.random()*c.height, 2, 2);
  }
  // line helper
  g.strokeStyle = 'rgba(235,255,250,0.9)'; g.lineWidth = 6;
  const px = x => (x + HALF_W) / FIELD_W * c.width;
  const pz = z => (z + HALF_H) / FIELD_H * c.height;
  // outline + halfway
  g.strokeRect(px(-HALF_W)+3, pz(-HALF_H)+3, c.width-6, c.height-6);
  g.beginPath(); g.moveTo(px(0), pz(-HALF_H)); g.lineTo(px(0), pz(HALF_H)); g.stroke();
  // center circle
  g.beginPath(); g.arc(px(0), pz(0), (7/FIELD_W)*c.width, 0, Math.PI*2); g.stroke();
  g.fillStyle = 'rgba(235,255,250,0.9)';
  g.beginPath(); g.arc(px(0), pz(0), 8, 0, Math.PI*2); g.fill();
  // penalty boxes
  for (const s of [-1, 1]) {
    const gx = s * HALF_W;
    g.strokeRect(Math.min(px(gx), px(gx - s*12)), pz(-9), Math.abs(px(gx)-px(gx - s*12)), pz(9)-pz(-9));
    g.strokeRect(Math.min(px(gx), px(gx - s*4.5)), pz(-4.5), Math.abs(px(gx)-px(gx - s*4.5)), pz(4.5)-pz(-4.5));
    g.beginPath(); g.arc(px(gx - s*8), pz(0), 7, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc(px(gx - s*12), pz(0), (5.5/FIELD_W)*c.width, s>0 ? Math.PI*0.65 : -Math.PI*0.35, s>0 ? Math.PI*1.35 : Math.PI*0.35); g.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 8; tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const pitch = new THREE.Mesh(
  new THREE.PlaneGeometry(FIELD_W, FIELD_H),
  new THREE.MeshStandardMaterial({ map: makePitchTexture(), roughness: 0.92, metalness: 0 })
);
pitch.rotation.x = -Math.PI/2;
pitch.receiveShadow = true;
scene.add(pitch);

// surrounding apron
const apron = new THREE.Mesh(
  new THREE.PlaneGeometry(FIELD_W+26, FIELD_H+26),
  new THREE.MeshStandardMaterial({ color: 0x07101c, roughness: 1 })
);
apron.rotation.x = -Math.PI/2; apron.position.y = -0.02; apron.receiveShadow = true;
scene.add(apron);

// neon perimeter line
function neonRect(w, h, color, y=0.04) {
  const pts = [new THREE.Vector3(-w/2,y,-h/2), new THREE.Vector3(w/2,y,-h/2), new THREE.Vector3(w/2,y,h/2), new THREE.Vector3(-w/2,y,h/2), new THREE.Vector3(-w/2,y,-h/2)];
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  return new THREE.Line(geo, new THREE.LineBasicMaterial({ color }));
}
scene.add(neonRect(FIELD_W+6, FIELD_H+6, 0x00e5ff));
scene.add(neonRect(FIELD_W+6.6, FIELD_H+6.6, 0xff2d78));

// ============ AD BOARDS (LED hoardings) ============
const ads = ['CYBERLIGA', 'NEON FC', 'VOLT UTD', 'SEASON 2077', '◆ ◆ ◆', 'AI ONLY'];
function makeAdTexture(text, fg, bg) {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 96;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0,0,c.width,0);
  grad.addColorStop(0, bg); grad.addColorStop(.5, '#060a18'); grad.addColorStop(1, bg);
  g.fillStyle = grad; g.fillRect(0,0,c.width,c.height);
  g.font = '900 56px Orbitron, sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.fillStyle = fg; g.shadowColor = fg; g.shadowBlur = 18;
  g.fillText(text, c.width/2, c.height/2 + 2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const adBoards = [];
function adBoard(x, z, rotY, w) {
  const text = ads[adBoards.length % ads.length];
  const col = adBoards.length % 2 ? '#ff5e9b' : '#5eeaff';
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w, 1.1, 0.18),
    [new THREE.MeshStandardMaterial({color:0x0a0f20}), new THREE.MeshStandardMaterial({color:0x0a0f20}),
     new THREE.MeshStandardMaterial({color:0x0a0f20}), new THREE.MeshStandardMaterial({color:0x0a0f20}),
     new THREE.MeshBasicMaterial({ map: makeAdTexture(text, col, '#0a1228') }),
     new THREE.MeshStandardMaterial({color:0x0a0f20})]
  );
  m.position.set(x, 0.55, z); m.rotation.y = rotY;
  scene.add(m); adBoards.push(m);
}
for (let i = -2; i <= 2; i++) { adBoard(i*13, HALF_H+2.5, 0, 12.4); adBoard(i*13, -(HALF_H+2.5), Math.PI, 12.4); }
for (let i = -1; i <= 1; i++) { adBoard(HALF_W+2.5, i*13, -Math.PI/2, 12.4); adBoard(-(HALF_W+2.5), i*13, Math.PI/2, 12.4); }

// ============ STADIUM BOWL + CROWD ============
const standMat = new THREE.MeshStandardMaterial({ color: 0x0a1224, roughness: 0.9 });
function stand(x, z, rotY, len) {
  const grp = new THREE.Group();
  for (let t = 0; t < 9; t++) {
    const step = new THREE.Mesh(new THREE.BoxGeometry(len, 1.2, 2.4), standMat);
    step.position.set(0, 0.6 + t*1.15, t*2.2);
    grp.add(step);
  }
  grp.position.set(x, 0, z); grp.rotation.y = rotY;
  scene.add(grp);
  return grp;
}
stand(0, HALF_H+8, 0, FIELD_W+34);
stand(0, -(HALF_H+8), Math.PI, FIELD_W+34);
stand(HALF_W+8, 0, Math.PI/2, FIELD_H+30);
stand(-(HALF_W+8), 0, -Math.PI/2, FIELD_H+30);

// reactive crowd (crowd.js module — sections, mexican wave, goal eruptions)
const crowd = createCrowd(scene, { teamA: TEAM_A, teamB: TEAM_B });

// referee (referee.js module — positioning AI, foul judgment, cards)
const ref = createReferee(scene);
// dribbling brain (dribbling.js — touches, shields, knock-ons, skill moves)
const drib = createDribbling();
// broadcast lower-thirds + commentary line banks (presentation.js)
const present = createPresentation();
// aerodynamic ball model (ballflight.js — Magnus, drag, knuckle, spin-coupled bounces)
const flight = createBallFlight({ gravity: 22, groundY: 0.32 });
// team strategy brain (tactics.js — phases, pass evaluation, off-ball runs, pressing shape)
const tactics = createTactics();
// carrier↔ball physical interaction (ballcontrol.js — footfall touches, settles, strike alignment)
const control = createBallControl();
// goalkeeper AI (goalkeeper.js — angle positioning, reaction dives, catches/parries)
const keeperAI = createGoalkeeper();

// floodlight towers (visual)
function tower(x, z) {
  const g = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.7, 40, 8), new THREE.MeshStandardMaterial({ color: 0x131a30, roughness:.8 }));
  pole.position.y = 20; g.add(pole);
  const head = new THREE.Mesh(new THREE.BoxGeometry(7, 3, 1), new THREE.MeshStandardMaterial({ color: 0x0c1226 }));
  head.position.y = 41; head.lookAt(0, 0, 0); g.add(head);
  for (let i = 0; i < 8; i++) {
    const lamp = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 1.0), new THREE.MeshBasicMaterial({ color: 0xeaf6ff }));
    lamp.position.set(-2.6 + (i%4)*1.75, 40.4 + Math.floor(i/4)*1.3, 0);
    lamp.lookAt(0, 2, 0);
    g.add(lamp);
  }
  g.position.set(x, 0, z);
  scene.add(g);
}
tower(-HALF_W-14, -HALF_H-14); tower(HALF_W+14, -HALF_H-14);
tower(-HALF_W-14, HALF_H+14);  tower(HALF_W+14, HALF_H+14);

// stars
{
  const n = 900, pos = new Float32Array(n*3);
  for (let i = 0; i < n; i++) {
    const r = 250 + Math.random()*120, th = Math.random()*Math.PI*2, ph = Math.random()*Math.PI*0.45;
    pos[i*3] = r*Math.cos(th)*Math.sin(ph); pos[i*3+1] = r*Math.cos(ph)*0.6+20; pos[i*3+2] = r*Math.sin(th)*Math.sin(ph);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0x9fc4ff, size: 0.8, sizeAttenuation: true, transparent: true, opacity: 0.8 })));
}

// ============ GOALS ============
function buildGoal(side) { // side: -1 left, +1 right
  const g = new THREE.Group();
  const postMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.35, emissive: side<0 ? TEAM_A.glow : TEAM_B.glow, emissiveIntensity: 0.35 });
  const r = 0.12;
  const post = () => new THREE.Mesh(new THREE.CylinderGeometry(r, r, GOAL_HEIGHT, 10), postMat);
  const p1 = post(); p1.position.set(0, GOAL_HEIGHT/2, -GOAL_WIDTH/2);
  const p2 = post(); p2.position.set(0, GOAL_HEIGHT/2, GOAL_WIDTH/2);
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(r, r, GOAL_WIDTH, 10), postMat);
  bar.rotation.x = Math.PI/2; bar.position.y = GOAL_HEIGHT;
  g.add(p1, p2, bar);
  // net
  const netMat = new THREE.MeshBasicMaterial({ color: 0x9fdcff, wireframe: true, transparent: true, opacity: 0.22 });
  const back = new THREE.Mesh(new THREE.PlaneGeometry(GOAL_WIDTH, GOAL_HEIGHT, 12, 6), netMat);
  back.position.set(side * GOAL_DEPTH, GOAL_HEIGHT/2, 0); back.rotation.y = Math.PI/2;
  const top = new THREE.Mesh(new THREE.PlaneGeometry(GOAL_DEPTH, GOAL_WIDTH, 4, 12), netMat);
  top.position.set(side * GOAL_DEPTH/2, GOAL_HEIGHT, 0); top.rotation.z = Math.PI/2; top.rotation.y = Math.PI/2;
  const s1 = new THREE.Mesh(new THREE.PlaneGeometry(GOAL_DEPTH, GOAL_HEIGHT, 4, 6), netMat);
  s1.position.set(side * GOAL_DEPTH/2, GOAL_HEIGHT/2, -GOAL_WIDTH/2);
  const s2 = s1.clone(); s2.position.z = GOAL_WIDTH/2;
  g.add(back, top, s1, s2);
  g.position.x = side * HALF_W;
  scene.add(g);
}
buildGoal(-1); buildGoal(1);

// ============ PLAYERS ============
const ROSTERS = {
  'NEON FC':     [ {n:'OKAFOR-9',num:1},{n:'VEKTOR',num:4},{n:'HALCYON',num:5},{n:'SYNTH',num:8},{n:'AXIOM',num:6},{n:'RAZOR',num:9},{n:'PRISM',num:11} ],
  'VOLT UTD':    [ {n:'TESLA JR',num:1},{n:'CIPHER',num:2},{n:'ONYX',num:5},{n:'GLITCH',num:7},{n:'BLITZ',num:8},{n:'NOVA',num:10},{n:'PULSE',num:14} ],
  'GRID ROYALS': [ {n:'KILOWATT',num:1},{n:'MAINFRAME',num:3},{n:'TURBINE',num:4},{n:'DYNAMO',num:7},{n:'CIRCUIT',num:10},{n:'VANTA',num:9},{n:'HELIX',num:11} ],
  'ASTRA NOVA':  [ {n:'ORBIT',num:1},{n:'QUASAR',num:2},{n:'ZENITH',num:6},{n:'NEBULA',num:8},{n:'COMET',num:10},{n:'STARFALL',num:9},{n:'LUMEN',num:7} ],
};
function makeNameTagTexture(name, number, colorCss) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 112;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(4,8,20,0.72)';
  g.beginPath(); g.roundRect(40, 14, c.width-80, 84, 14); g.fill();
  g.strokeStyle = colorCss; g.lineWidth = 3;
  g.beginPath(); g.roundRect(40, 14, c.width-80, 84, 14); g.stroke();
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '700 52px Orbitron, sans-serif';
  g.fillStyle = colorCss; g.shadowColor = colorCss; g.shadowBlur = 14;
  g.fillText(`${number}  ${name}`, c.width/2, 60);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function makeNumberTexture(number) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const g = c.getContext('2d');
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '900 170px Orbitron, sans-serif';
  g.fillStyle = '#ffffff'; g.shadowColor = '#ffffff'; g.shadowBlur = 10;
  g.fillText(String(number), 128, 138);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const SKIN_TONES = [0xf1c27d, 0xe0ac69, 0xc68642, 0x8d5524, 0x6b4226, 0xffdbac];
const HAIR_COLORS = [0x14100c, 0x14100c, 0x2a1b10, 0x3d2817, 0x5a3a1a, 0xd8c08a, 0x101418];
function buildPlayer(team, isGK, name, number) {
  const g = new THREE.Group();
  const base = new THREE.Color(team.color);
  const kit = isGK ? new THREE.Color(0xc8ff4d).lerp(base, 0.15) : base;
  const kitMat = new THREE.MeshStandardMaterial({ color: kit, roughness: 0.6, emissive: kit, emissiveIntensity: 0.18 });
  const skinMat = new THREE.MeshStandardMaterial({
    color: SKIN_TONES[Math.floor(Math.random()*SKIN_TONES.length)], roughness: 0.65 });
  const shortMat = new THREE.MeshStandardMaterial({ color: 0x0d1322, roughness: 0.7 });

  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.36, 0.55, 6, 10), kitMat);
  torso.position.y = 1.18; torso.castShadow = true;
  // head pivot so the head can track the ball independently of the body
  const headPivot = new THREE.Group(); headPivot.position.y = 1.92;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 12, 10), skinMat);
  head.castShadow = true;
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.245, 10, 8, 0, Math.PI*2, 0, Math.PI*0.55),
    new THREE.MeshStandardMaterial({ color: HAIR_COLORS[Math.floor(Math.random()*HAIR_COLORS.length)], roughness: 0.9 }));
  hair.position.set(0, 0.04, -0.03);
  headPivot.add(head, hair);
  // some players wear a thin neon team headband — cyber flavor without the robot face
  if (Math.random() < 0.35) {
    const band = new THREE.Mesh(new THREE.TorusGeometry(0.245, 0.022, 6, 16),
      new THREE.MeshBasicMaterial({ color: team.glow }));
    band.rotation.x = Math.PI/2 - 0.25; band.position.y = 0.07;
    headPivot.add(band);
  }
  const hips = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.34, 0.3, 10), shortMat);
  hips.position.y = 0.78;
  g.add(torso, headPivot, hips);
  g.userData.headPivot = headPivot;

  // limbs offset along local X (side-by-side); player forward is local +Z
  const legMat = skinMat;
  const legs = [];
  for (const s of [-1, 1]) {
    const pivot = new THREE.Group(); pivot.position.set(s*0.16, 0.72, 0);
    const leg = new THREE.Mesh(new THREE.CapsuleGeometry(0.11, 0.5, 4, 8), legMat);
    leg.position.y = -0.36; leg.castShadow = true;
    pivot.add(leg); g.add(pivot); legs.push(pivot);
  }
  const arms = [];
  for (const s of [-1, 1]) {
    const pivot = new THREE.Group(); pivot.position.set(s*0.46, 1.55, 0);
    const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.09, 0.42, 4, 8), kitMat);
    arm.position.y = -0.3; arm.castShadow = true;
    pivot.add(arm); g.add(pivot); arms.push(pivot);
  }
  // glow ring at feet
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.42, 0.5, 24),
    new THREE.MeshBasicMaterial({ color: team.glow, transparent: true, opacity: 0.22, side: THREE.DoubleSide }));
  ring.rotation.x = -Math.PI/2; ring.position.y = 0.03;
  g.add(ring);

  // jersey back number (player forward is +z, so back faces -z)
  const numTex = makeNumberTexture(number);
  const backNum = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.5),
    new THREE.MeshBasicMaterial({ map: numTex, transparent: true, depthWrite: false }));
  backNum.position.set(0, 1.28, -0.385); backNum.rotation.y = Math.PI;
  const chestNum = new THREE.Mesh(new THREE.PlaneGeometry(0.26, 0.26),
    new THREE.MeshBasicMaterial({ map: numTex, transparent: true, depthWrite: false }));
  chestNum.position.set(0, 1.32, 0.385);
  // shoulder trim stripes — makes it read as a kit, not a blob
  const trimMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  for (const s of [-1, 1]) {
    const trim = new THREE.Mesh(new THREE.TorusGeometry(0.13, 0.025, 6, 14), trimMat);
    trim.position.set(s*0.46, 1.55, 0); trim.rotation.x = Math.PI/2;
    g.add(trim);
  }
  g.add(backNum, chestNum);

  // floating nameplate (billboard sprite)
  const colorCss = '#' + new THREE.Color(team.glow).getHexString();
  const tag = new THREE.Sprite(new THREE.SpriteMaterial({
    map: makeNameTagTexture(name, number, colorCss), transparent: true, depthWrite: false, opacity: 0.95 }));
  tag.scale.set(2.7, 0.6, 1); tag.position.y = 2.55;
  g.add(tag);

  g.userData.legs = legs; g.userData.arms = arms;
  return g;
}

// Formation: GK + 2 DEF + 2 MID + 2 FWD per team (7v7, readable)
const FORMATION = [
  { role:'GK',  x: 0.94, z: 0    },
  { role:'DEF', x: 0.62, z: -0.45 }, { role:'DEF', x: 0.62, z: 0.45 },
  { role:'MID', x: 0.25, z: -0.55 }, { role:'MID', x: 0.25, z: 0.55 },
  { role:'FWD', x: -0.12, z: -0.3 }, { role:'FWD', x: -0.12, z: 0.3 },
];

const players = [];
function makeTeam(team, dir) { // dir: -1 defends left goal, +1 defends right goal
  FORMATION.forEach((slot, i) => {
    const r = ROSTERS[team.name][i];
    const mesh = buildPlayer(team, slot.role === 'GK', r.n, r.num);
    const sc = 0.94 + Math.random()*0.12; // height variation
    mesh.scale.setScalar(sc);
    scene.add(mesh);
    players.push({
      team, dir, role: slot.role, mesh, name: r.n, number: r.num,
      home: new THREE.Vector3(dir * slot.x * HALF_W, 0, slot.z * HALF_H * 1.6),
      pos: new THREE.Vector3(), vel: new THREE.Vector3(),
      speed: slot.role === 'GK' ? 6.0 : (slot.role === 'FWD' ? 7.8 : 7.1) * (0.95 + Math.random()*0.12),
      kickCooldown: 0, phase: Math.random()*10, kickAnim: null, yaw: dir > 0 ? -Math.PI/2 : Math.PI/2,
      mass: sc*sc*sc,        // big players win shoulder duels
      stridePhase: Math.random()*6.28,
      stagger: 0, fallT: 0, fallDir: 1, stamina: 1,
      // flair drives skill-move frequency/success (dribbling module)
      flair: (slot.role === 'FWD' ? 0.75 : slot.role === 'MID' ? 0.55 : slot.role === 'DEF' ? 0.3 : 0.1) + (Math.random()-0.5)*0.15,
      skillAnim: null,
    });
  });
}
// teams are built per fixture by startMatch() at the bottom of the file

// ============ BALL ============
const ball = {
  pos: new THREE.Vector3(0, 0.32, 0),
  vel: new THREE.Vector3(),
  curl: 0,
  spin: new THREE.Vector3(),   // 3D spin for the ballflight module (Magnus)
  knuckle: 0,                  // knuckleball wander intensity
  mesh: null, trail: [],
};
{
  const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3, emissive: 0x88f4ff, emissiveIntensity: 0.5 });
  ball.mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(0.32, 1), mat);
  ball.mesh.castShadow = true;
  scene.add(ball.mesh);
  const light = new THREE.PointLight(0x66e8ff, 6, 7);
  ball.mesh.add(light);
}
// ball trail
const TRAIL_N = 26;
const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(TRAIL_N*3), 3));
const trailLine = new THREE.Line(trailGeo, new THREE.LineBasicMaterial({ color: 0x7ef0ff, transparent: true, opacity: 0.55 }));
scene.add(trailLine);
const trailPts = Array.from({length: TRAIL_N}, () => ball.pos.clone());

// ============ MATCH STATE ============
const state = {
  scoreA: 0, scoreB: 0, clock: 0, half: 1,
  mode: 'kickoff', modeT: 0,   // kickoff | play | goal
  lastTouchTeam: null, lastTouchPlayer: null,
  goalTeam: null, scorer: null,
};
const HALF_LEN = 120; // seconds of sim per half

function resetPositions(kickoffFor) {
  for (const p of players) {
    p.pos.copy(p.home);
    // kicking-off team's forwards step to center
    if (p.team === kickoffFor && p.role === 'FWD') {
      p.pos.x = p.dir * 1.5; p.pos.z *= 0.25;
    }
    p.vel.set(0,0,0);
    p.mesh.position.set(p.pos.x, 0, p.pos.z);
  }
  ball.pos.set(0, 0.32, 0); ball.vel.set(0,0,0);
}
// ============ AI ============
const tmpV = new THREE.Vector3();
function closestToBall(team) {
  let best = null, bd = 1e9;
  for (const p of players) {
    if (p.team !== team || p.role === 'GK') continue;
    const d = p.pos.distanceTo(ball.pos);
    if (d < bd) { bd = d; best = p; }
  }
  return best;
}

function applyDribbleAction(p, act) {
  state.lastTouchTeam = p.team; state.lastTouchPlayer = p;
  if (act.type === 'touch') {
    ball.vel.set(act.dir.x, 0, act.dir.z).multiplyScalar(3 + act.power*4).addScaledVector(p.vel, 0.3);
    ball.vel.y = 0;
  } else if (act.type === 'knockon') {
    ball.vel.set(act.dir.x, 0, act.dir.z).multiplyScalar(7 + act.power*5);
    ball.vel.y = 0.2;
    p.vel.addScaledVector(act.dir, 2.5); // burst after it
    thump(6);
  } else if (act.type === 'shield') {
    p.vel.multiplyScalar(0.5);
    ball.vel.multiplyScalar(0.6);
    ball.pos.lerp(new THREE.Vector3(p.pos.x + act.dir.x*0.55, 0.32, p.pos.z + act.dir.z*0.55), 0.3);
  } else if (act.type === 'skill') {
    // the move plays out over its duration (skillAnim renders it), ball glued, then released
    p.pendingSkillExit = { dir: act.exitDir.clone().setY(0).normalize(), beat: act.beat, t: act.duration };
    ball.vel.multiplyScalar(0.25);
    if (act.beat && act.victim && act.victim.fallT > 0) {
      const line = present.lines.juked(act.victim.name, p.name);
      commentate(line, true);
      present.showEvent({ kind: 'skill', title: line, subtitle: p.team.name, color: hex6(p.team.glow) });
      crowdExcitement = Math.max(crowdExcitement, 0.55);
      crowd.onBigKick();
    } else if (act.beat && Math.random() < 0.35) {
      const line = present.lines.skill(p.name, act.move);
      commentate(line);
      present.showEvent({ kind: 'skill', title: line, subtitle: p.team.name, color: hex6(p.team.glow) });
    }
  }
}

// execute a tactical kick decision: aim scatter + leg choice + flight scheduling
function scheduleKick(p, plan, dirV) {
  if (p.kickAnim || p.kickCooldown > 0) return;
  const toBallN = new THREE.Vector3(ball.pos.x - p.pos.x, 0, ball.pos.z - p.pos.z).normalize();
  const facingN = new THREE.Vector3(Math.sin(p.yaw), 0, Math.cos(p.yaw));
  const sideY = toBallN.clone().cross(facingN).y;
  const ang = Math.atan2(dirV.x, dirV.z) + (Math.random()-0.5) * (plan.type === 'shoot' ? 0.12 : 0.07);
  const dir = new THREE.Vector3(Math.sin(ang), 0, Math.cos(ang));
  const technique = plan.type === 'clear' ? 'clearance' : (plan.technique || 'pass');
  p.kickAnim = {
    t: 0, struck: false, type: technique,
    flight: { dir, power: plan.power ?? 0.6, technique, curve: plan.curve || 0 },
    leg: sideY > 0 ? 0 : 1, windup: 0.16, follow: 0.3,
  };
  p.kickCooldown = 0.9;
  if (plan.type === 'shoot') {
    if (p.team === TEAM_A) stats.shotsA++; else stats.shotsB++;
    if (technique === 'screamer') {
      crowdExcitement = Math.max(crowdExcitement, 0.6);
      crowd.onBigKick();
      commentate(`${p.name} ABSOLUTELY LEATHERS IT`);
    } else if (technique === 'chip') {
      commentate(`${p.name} TRIES THE AUDACIOUS CHIP`);
    }
  }
}

function aiStep(dt) {
  const chaserA = closestToBall(TEAM_A);
  const chaserB = closestToBall(TEAM_B);

  // ===== TACTICS + BALL CONTROL =====
  // tactics decides WHAT (pass/shoot/carry + everyone's off-ball movement);
  // ballcontrol decides HOW the carrier's body does it (touches, settles, strike alignment)
  let carrier = null, plan = null, intents = null;
  if (state.mode === 'play') {
    if (Math.hypot(ball.vel.x, ball.vel.z) < 4) {
      let cd = 1.3;
      for (const p of players) {
        if (p.role === 'GK' || p.fallT > 0 || p.kickAnim || p.pendingSkillExit) continue;
        const d = p.pos.distanceTo(ball.pos);
        if (d < cd) { cd = d; carrier = p; }
      }
    }
    const out = tactics.update(dt, { players, ball, possessionTeam: state.lastTouchTeam, carrier, mode: state.mode });
    intents = out.intents; plan = out.plan;

    if (carrier && !carrier.kickAnim) {
      let nd = null, ndd = 1e9;
      for (const q of players) {
        if (q.team === carrier.team || q.role === 'GK') continue;
        const d = q.pos.distanceTo(carrier.pos);
        if (d < ndd) { ndd = d; nd = q; }
      }
      let controlPlan = null, aimDirV = null;
      if (plan) {
        if (plan.type === 'carry') {
          controlPlan = { type: 'carry', carryDir: plan.carryDir || new THREE.Vector3(-carrier.dir, 0, 0) };
        } else {
          aimDirV = plan.aimPoint.clone().sub(ball.pos).setY(0).normalize();
          controlPlan = { type: 'kick', aimDir: aimDirV };
        }
      }
      const act = control.update(dt, carrier, ball, controlPlan, nd);
      if (act) {
        if (act.type === 'touch') {
          state.lastTouchTeam = carrier.team; state.lastTouchPlayer = carrier;
          const cs = carrier.vel.length();
          ball.vel.set(act.dir.x, 0, act.dir.z).multiplyScalar(cs + 2 + act.power * 6);
          ball.vel.y = 0;
        } else if (act.type === 'settle') {
          state.lastTouchTeam = carrier.team; state.lastTouchPlayer = carrier;
          ball.vel.multiplyScalar(0.2);
          ball.vel.addScaledVector(act.dir, 1.5 + act.power * 2);
          ball.vel.y = Math.min(ball.vel.y, 0.5);
        } else if (act.type === 'align') {
          carrier.vel.add(act.step);
        } else if (act.type === 'ready' && plan && plan.type !== 'carry') {
          scheduleKick(carrier, plan, aimDirV);
        } else if (act.type === 'lost') {
          carrier.kickCooldown = 0.6;
          commentate(`HEAVY TOUCH FROM ${carrier.name} — IT'S LOOSE`);
        }
      }
      // skill moves still come from the dribbling brain, but ONLY in a genuine pressured carry
      if (plan && plan.type === 'carry' && nd && ndd < 2.2 && !carrier.pendingSkillExit) {
        const defenders = players.filter(q => q.team !== carrier.team && q.role !== 'GK')
          .sort((a, b) => a.pos.distanceTo(carrier.pos) - b.pos.distanceTo(carrier.pos));
        const dact = drib.update(carrier, defenders, ball, dt);
        if (dact && dact.type !== 'touch') applyDribbleAction(carrier, dact);
      }
    }
  }

  for (const p of players) {
    p.kickCooldown = Math.max(0, p.kickCooldown - dt);
    p.stagger = Math.max(0, p.stagger - dt);
    if (p.fallT > 0) {
      // on the ground: slide to a stop, can't run, can't kick
      p.fallT = Math.max(0, p.fallT - dt);
      p.vel.multiplyScalar(Math.pow(0.03, dt));
      p.pos.addScaledVector(p.vel, dt);
      continue;
    }
    // mid-skill-move: ball stays glued at the feet, released along exitDir at the end
    if (p.pendingSkillExit) {
      const s = p.pendingSkillExit;
      s.t -= dt;
      ball.pos.set(p.pos.x + Math.sin(p.yaw)*0.6, 0.32, p.pos.z + Math.cos(p.yaw)*0.6);
      ball.vel.set(0, 0, 0);
      if (s.t <= 0) {
        ball.vel.set(s.dir.x, 0, s.dir.z).multiplyScalar(s.beat ? 6.5 : 7.5);
        p.vel.addScaledVector(s.dir, s.beat ? 2.2 : 0.5);
        p.pendingSkillExit = null;
        p.kickCooldown = 0.3;
      }
      continue;
    }
    const target = tmpV.set(0,0,0);
    const attackDir = -p.dir; // attacks opposite of the goal it defends
    const goalX = attackDir * HALF_W;

    if (state.mode === 'goal') {
      // celebration: scorers mob the scorer, the conceding team trudges home
      if (p.team === state.goalTeam && state.scorer && p !== state.scorer) {
        target.copy(state.scorer.pos).add(new THREE.Vector3(Math.sin(p.phase)*2.2, 0, Math.cos(p.phase)*2.2));
      } else if (p === state.scorer) {
        target.copy(p.pos).add(new THREE.Vector3(Math.sin(state.modeT*2)*3, 0, Math.cos(state.modeT*2)*3)); // wheeling away
      } else {
        target.copy(p.home);
      }
    } else if (p.role === 'GK') {
      // goalkeeper brain: angle positioning, sweeping, reaction dives, catches/parries
      p._urg = 1;
      let gkAct = null;
      if (state.mode === 'play') gkAct = keeperAI.update(dt, p, ball, players);
      if (gkAct && gkAct.type === 'dive') {
        if (gkAct.save) {
          const inSpeed = ball.vel.length();
          state.lastTouchTeam = p.team; state.lastTouchPlayer = p;
          if (gkAct.save.mode === 'catch') {
            ball.vel.set(0, 0, 0); ball.spin.set(0, 0, 0);
            ball.pos.set(p.pos.x, 0.9, p.pos.z);
            commentate(`${p.name} CLAIMS IT! WHAT HANDS`);
          } else {
            ball.vel.copy(gkAct.save.deflect).multiplyScalar(0.45 * inSpeed + 6);
            ball.spin.multiplyScalar(0.2);
            crowd.onNearMiss();
            crowdExcitement = Math.max(crowdExcitement, 0.7);
            commentate(`${p.name} FINGERTIPS IT AWAY! WHAT A SAVE`);
          }
          thump(8);
        }
        target.copy(p.pos);
      } else if (gkAct && gkAct.type === 'hold') {
        // caught it — hold before distributing
        ball.pos.set(p.pos.x + Math.sin(p.yaw)*0.4, 0.9, p.pos.z + Math.cos(p.yaw)*0.4);
        ball.vel.set(0, 0, 0);
        target.copy(p.pos);
      } else if (gkAct && gkAct.type === 'position') {
        target.copy(gkAct.target);
      } else {
        target.set(p.dir * (HALF_W - 1.2), 0,
          THREE.MathUtils.clamp(ball.pos.z * 0.55, -GOAL_WIDTH/2 + 0.6, GOAL_WIDTH/2 - 0.6));
      }
      if (keeperAI.isDiving(p)) { p.vel.set(0, 0, 0); target.copy(p.pos); }
    } else {
      // tactics intents drive every outfielder: press, cover, shape, runs, support
      const it = intents ? intents.get(p) : null;
      if (it) {
        target.copy(it.target);
        p._urg = it.urgency;
      } else if (p === chaserA || p === chaserB) {
        target.copy(ball.pos); p._urg = 1;
      } else {
        // fallback shape (non-play modes)
        target.copy(p.home);
        target.x += (ball.pos.x - p.home.x) * 0.35;
        target.z += (ball.pos.z - p.home.z) * 0.4;
        p._urg = 0.55;
      }
    }
    target.x = THREE.MathUtils.clamp(target.x, -HALF_W+0.5, HALF_W-0.5);
    target.z = THREE.MathUtils.clamp(target.z, -HALF_H+0.5, HALF_H-0.5);

    // steer — capped acceleration so direction changes cost time, like real legs
    const desired = target.clone().sub(p.pos);
    const dist = desired.length();
    // stamina: sprinting drains it, easy jogging recovers it; tired legs are slower
    const effSpeed = p.speed * (0.72 + 0.28 * p.stamina);
    const spNow = p.vel.length();
    if (spNow > 0.7 * p.speed) p.stamina = Math.max(0.25, p.stamina - dt * 0.02);
    else if (spNow < 3) p.stamina = Math.min(1, p.stamina + dt * 0.03);
    if (dist > 0.05) {
      // urgency from tactics: shape-holders jog, pressers and runners sprint
      const urg = 0.55 + 0.45 * (p._urg ?? 0.7);
      desired.normalize().multiplyScalar(Math.min(effSpeed, dist * 2.5) * (p.stagger > 0 ? 0.45 : 1) * urg);
      // players can't sprint at full speed while turned away from where they're heading
      const fwd = new THREE.Vector3(Math.sin(p.yaw), 0, Math.cos(p.yaw));
      const align = (fwd.dot(desired.clone().normalize()) + 1) / 2; // 0 backpedal .. 1 aligned
      desired.multiplyScalar(0.45 + 0.55 * align);
      p.vel.lerp(desired, 1 - Math.exp(-3.2 * dt));
    } else p.vel.multiplyScalar(Math.pow(0.05, dt));
    if (p.kickAnim) p.vel.multiplyScalar(Math.pow(0.02, dt)); // plant while striking

    // gentle spacing pressure so teammates don't bunch (hard collision handled below)
    for (const q of players) {
      if (q === p || q.team !== p.team) continue;
      const d = p.pos.distanceTo(q.pos);
      if (d < 2.0 && d > 0.001) {
        const push = p.pos.clone().sub(q.pos).normalize().multiplyScalar((2.0 - d) * 2.5 * dt);
        p.vel.add(push);
      }
    }

    p.pos.addScaledVector(p.vel, dt);
    p.pos.x = THREE.MathUtils.clamp(p.pos.x, -HALF_W-1, HALF_W+1);
    p.pos.z = THREE.MathUtils.clamp(p.pos.z, -HALF_H-1, HALF_H+1);

    // attempt a kick: tactics owns carrier decisions (scheduleKick above); this block
    // keeps only GK distribution and emergency loose-ball play (interceptions/clearances)
    const bd = p.pos.distanceTo(ball.pos);
    const toBallN = new THREE.Vector3(ball.pos.x - p.pos.x, 0, ball.pos.z - p.pos.z).normalize();
    const facingN = new THREE.Vector3(Math.sin(p.yaw), 0, Math.cos(p.yaw));
    if (bd < 1.15 && p.kickCooldown <= 0 && !p.kickAnim && state.mode === 'play'
        && facingN.dot(toBallN) > 0.25 && ball.pos.y < 1.1
        && !(p.role === 'GK' && keeperAI.isDiving(p))) {
      const ballSpeed = Math.hypot(ball.vel.x, ball.vel.z);
      if (p.role === 'GK') {
        state.lastTouchTeam = p.team; state.lastTouchPlayer = p;
        let aim, technique, power;
        if (Math.random() < 0.5) {
          // short distribution to the nearest defender
          let def = null, dd = 1e9;
          for (const q of players) {
            if (q.team !== p.team || q.role !== 'DEF') continue;
            const d2 = q.pos.distanceTo(p.pos);
            if (d2 < dd) { dd = d2; def = q; }
          }
          aim = def ? def.pos.clone() : new THREE.Vector3(p.pos.x + attackDir*10, 0, p.pos.z);
          technique = 'pass'; power = THREE.MathUtils.clamp(aim.distanceTo(ball.pos)/18, 0.35, 0.8);
        } else {
          aim = new THREE.Vector3(attackDir*14, 0, (Math.random()-0.5)*20);
          technique = 'clearance'; power = 0.7 + Math.random()*0.3;
          commentate(`${p.name} LAUNCHES IT CLEAR FOR ${p.team.name}`);
        }
        const dir = aim.sub(ball.pos).setY(0).normalize();
        const sideY = toBallN.clone().cross(facingN).y;
        p.kickAnim = { t: 0, struck: false, type: technique,
          flight: { dir, power, technique, curve: 0 },
          leg: sideY > 0 ? 0 : 1, windup: 0.16, follow: 0.3 };
        p.kickCooldown = 0.9;
      } else if (ballSpeed > 6) {
        // loose fast ball reaches a player: clear it first-time when deep, else kill the pace
        state.lastTouchTeam = p.team; state.lastTouchPlayer = p;
        const nearOwnGoal = Math.sign(p.pos.x || p.dir) === Math.sign(p.dir) && Math.abs(p.pos.x) > 14;
        if (nearOwnGoal && Math.abs(ball.pos.z) < 14) {
          const dir = new THREE.Vector3(attackDir, 0, Math.sign(p.pos.z || 1) * 0.6).normalize();
          p.kickAnim = { t: 0, struck: false, type: 'clearance',
            flight: { dir, power: 0.7 + Math.random()*0.3, technique: 'clearance', curve: 0 },
            leg: 0, windup: 0.14, follow: 0.26 };
          p.kickCooldown = 0.9;
        } else {
          // controlled interception — kill the pace, become the carrier next frame
          ball.vel.multiplyScalar(0.25);
          ball.vel.y = Math.min(ball.vel.y, 1);
          p.kickCooldown = 0.35;
        }
      }
    }
  }

  // ===== CONTACT PHYSICS =====
  // mass-weighted rigid collisions + active shoulder duels. Heavy players move
  // less in contact, win more duels, and can bounce lighter ones to the turf.
  const MIN_D = 0.62, REST = 0.35;
  for (let i = 0; i < players.length; i++) {
    for (let j = i+1; j < players.length; j++) {
      const a = players[i], b = players[j];
      const dx = b.pos.x - a.pos.x, dz = b.pos.z - a.pos.z;
      const d = Math.hypot(dx, dz);
      if (d >= MIN_D || d < 0.0001) continue;
      const nx = dx/d, nz = dz/d;
      const invA = 1/a.mass, invB = 1/b.mass;
      const wa = invA / (invA + invB), wb = 1 - wa;
      // positional resolution split by inverse mass
      const overlap = MIN_D - d;
      a.pos.x -= nx*overlap*wa; a.pos.z -= nz*overlap*wa;
      b.pos.x += nx*overlap*wb; b.pos.z += nz*overlap*wb;
      // impulse with restitution — shoulder hits have a bit of bounce
      const rvx = b.vel.x - a.vel.x, rvz = b.vel.z - a.vel.z;
      const vn = rvx*nx + rvz*nz;
      if (vn < 0) {
        const jImp = -(1 + REST) * vn / (invA + invB);
        a.vel.x -= jImp*nx*invA; a.vel.z -= jImp*nz*invA;
        b.vel.x += jImp*nx*invB; b.vel.z += jImp*nz*invB;
        // a genuinely violent closing speed floors the lighter player
        if (-vn > 7 && state.mode === 'play') {
          const victim = a.mass < b.mass ? a : b;
          const offender = victim === a ? b : a;
          if (victim.fallT <= 0) {
            victim.fallT = 1.15; victim.fallDir = 1;
            camShake = Math.max(camShake, 0.45);
            crowd.onBigKick();
            commentate(`HUGE COLLISION! ${victim.name} GOES DOWN`);
            if (offender.team !== victim.team) {
              const ruling = ref.judgeChallenge({
                offender, victim, force: -vn,
                ballDist: victim.pos.distanceTo(ball.pos),
                fromBehind: Math.cos(offender.yaw - victim.yaw) > 0.5,
              });
              if (ruling) { beginFoul(ruling, offender, victim); return; }
            }
          }
        }
      }
      // shoulder duels: opponents in contact near the ball lean on each other and shove
      if (a.team !== b.team && state.mode === 'play'
          && Math.min(a.pos.distanceTo(ball.pos), b.pos.distanceTo(ball.pos)) < 2.5
          && Math.random() < dt * 1.6) {
        const shover = Math.random() < wa ? b : a;   // the heavier body wins the duel more often
        const victim = shover === a ? b : a;
        const dir = shover === a ? 1 : -1;
        const force = (2.5 + Math.random()*3.5) / victim.mass;
        if (shover.team === TEAM_A) stats.duelsA++; else stats.duelsB++;
        victim.vel.x += nx*dir*force; victim.vel.z += nz*dir*force;
        shover.vel.x -= nx*dir*force*0.3; shover.vel.z -= nz*dir*force*0.3; // equal & opposite-ish
        if (force > 4.4 && Math.random() < 0.35 && victim.fallT <= 0) {
          victim.fallT = 1.15; victim.fallDir = 1;
          victim.stagger = 0;
          crowd.onBigKick(); camShake = Math.max(camShake, 0.35);
          commentate(`${shover.name} BODIES ${victim.name} OFF THE BALL`);
        } else if (force > 3.2) {
          victim.stagger = Math.max(victim.stagger, 0.55);
        }
        // every shove goes past the referee
        const ruling = ref.judgeChallenge({
          offender: shover, victim, force,
          ballDist: victim.pos.distanceTo(ball.pos),
          fromBehind: Math.cos(shover.yaw - victim.yaw) > 0.5,
        });
        if (ruling) { beginFoul(ruling, shover, victim); return; }
      }
    }
  }
}

// progress scheduled kicks: impulse lands at foot-contact, with body momentum added
function updateKicks(dt) {
  for (const p of players) {
    const k = p.kickAnim;
    if (!k) continue;
    k.t += dt;
    if (!k.struck && k.t >= k.windup) {
      k.struck = true;
      // ball must still be in reach at contact time — whiff otherwise
      if (state.mode === 'play' && p.pos.distanceTo(ball.pos) < 1.45) {
        const res = flight.kick(ball, k.flight);            // real aerodynamics: spin, loft, knuckle
        ball.vel.addScaledVector(p.vel, 0.35);              // momentum transfer from the run-up
        const pow = res.speed;
        if (pow > 16) camShake = Math.max(camShake, (pow - 16) / 8);
        thump(pow);
        kickFlash(ball.pos, p.team.glow);
      }
    }
    if (k.t >= k.windup + k.follow) p.kickAnim = null;
  }
}

// ============ KICK FLASH PARTICLES ============
const flashes = [];
function kickFlash(pos, color) {
  const m = new THREE.Mesh(new THREE.RingGeometry(0.1, 0.18, 20),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9, side: THREE.DoubleSide }));
  m.rotation.x = -Math.PI/2;
  m.position.set(pos.x, 0.05, pos.z);
  scene.add(m);
  flashes.push({ m, t: 0 });
}
function updateFlashes(dt) {
  for (let i = flashes.length-1; i >= 0; i--) {
    const f = flashes[i]; f.t += dt;
    f.m.scale.setScalar(1 + f.t * 10);
    f.m.material.opacity = 0.9 * (1 - f.t / 0.45);
    if (f.t > 0.45) { scene.remove(f.m); f.m.geometry.dispose(); f.m.material.dispose(); flashes.splice(i,1); }
  }
}

// ============ CONFETTI ============
const CONFETTI_N = 320;
const confetti = new THREE.InstancedMesh(
  new THREE.PlaneGeometry(0.22, 0.32),
  new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide, transparent: true }),
  CONFETTI_N
);
confetti.visible = false;
scene.add(confetti);
const confettiParts = Array.from({length: CONFETTI_N}, () => ({ pos: new THREE.Vector3(), vel: new THREE.Vector3(), rot: new THREE.Euler(), spin: new THREE.Vector3() }));
let confettiT = -1;
function burstConfetti(x, z, glowHex) {
  const dummy = new THREE.Object3D(); const col = new THREE.Color();
  const palette = [glowHex, glowHex, 0xffffff, 0xffe14d];
  for (let i = 0; i < CONFETTI_N; i++) {
    const c = confettiParts[i];
    c.pos.set(x + (Math.random()-0.5)*10, 0.5 + Math.random()*2, z + (Math.random()-0.5)*10);
    c.vel.set((Math.random()-0.5)*7, 9 + Math.random()*9, (Math.random()-0.5)*7);
    c.spin.set(Math.random()*9, Math.random()*9, Math.random()*9);
    c.rot.set(Math.random()*6, Math.random()*6, Math.random()*6);
    dummy.position.copy(c.pos); dummy.updateMatrix();
    confetti.setMatrixAt(i, dummy.matrix);
    confetti.setColorAt(i, col.setHex(palette[Math.floor(Math.random()*palette.length)]));
  }
  confetti.instanceMatrix.needsUpdate = true;
  if (confetti.instanceColor) confetti.instanceColor.needsUpdate = true;
  confetti.visible = true; confettiT = 0;
}
function confettiStep(dt) {
  if (confettiT < 0) return;
  confettiT += dt;
  const dummy = new THREE.Object3D();
  for (let i = 0; i < CONFETTI_N; i++) {
    const c = confettiParts[i];
    c.vel.y -= 9 * dt;
    c.vel.multiplyScalar(Math.pow(0.6, dt)); // air drag — flutter, don't plummet
    c.pos.addScaledVector(c.vel, dt);
    if (c.pos.y < 0.05) { c.pos.y = 0.05; c.vel.set(0,0,0); }
    c.rot.x += c.spin.x*dt; c.rot.y += c.spin.y*dt; c.rot.z += c.spin.z*dt;
    dummy.position.copy(c.pos); dummy.rotation.copy(c.rot); dummy.updateMatrix();
    confetti.setMatrixAt(i, dummy.matrix);
  }
  confetti.instanceMatrix.needsUpdate = true;
  confetti.material.opacity = THREE.MathUtils.clamp(1 - (confettiT - 3) / 1.2, 0, 1);
  if (confettiT > 4.5) { confetti.visible = false; confettiT = -1; confetti.material.opacity = 1; }
}

// ============ COMMENTARY TICKER ============
const elTicker = document.getElementById('tickertext');
const tickerEvents = ['WELCOME TO THE CYBERLIGA GRAND ARENA — NEON FC vs VOLT UTD — FULLY AUTONOMOUS AI MATCH — SEASON 2077 — MATCHDAY 1'];
let lastCommentT = -10;
function commentate(msg, force) {
  // throttle so the ticker reads like commentary, not spam
  if (!force && state.clock - lastCommentT < 8) return;
  lastCommentT = state.clock;
  tickerEvents.push(`${fmtClock(state.clock)}' ${msg}`);
  if (tickerEvents.length > 7) tickerEvents.shift();
  elTicker.textContent = tickerEvents.join('  —  ') + '  —  ';
}

// ============ BALL PHYSICS ============
function ballStep(dt) {
  // gravity, drag, Magnus lift/curve, knuckle wander, spin-coupled bounces, rolling — all in the module
  flight.step(ball, dt);

  // deflections off player bodies (shins/torso) — no more ghosting through defenders
  if (ball.pos.y < 1.5) {
    for (const p of players) {
      // the striking player owns the ball during a kick — don't deflect off them
      if (p.kickAnim) continue;
      const dx = ball.pos.x - p.pos.x, dz = ball.pos.z - p.pos.z;
      const d = Math.hypot(dx, dz);
      if (d < 0.48 && d > 0.0001) {
        const nx = dx/d, nz = dz/d;
        ball.pos.x = p.pos.x + nx * 0.48; ball.pos.z = p.pos.z + nz * 0.48;
        const vn = ball.vel.x*nx + ball.vel.z*nz;
        if (vn < 0) {
          ball.vel.x -= 1.55 * vn * nx; ball.vel.z -= 1.55 * vn * nz;
          ball.vel.multiplyScalar(0.5);                 // bodies absorb energy
          ball.vel.addScaledVector(p.vel, 0.3);          // and impart their motion
          state.lastTouchTeam = p.team; state.lastTouchPlayer = p;
          if (ball.vel.length() > 4) kickFlash(ball.pos, 0xffffff);
        }
      }
    }
  }

  // goal check (crossing the line within the goal mouth)
  if (state.mode === 'play') {
    for (const side of [-1, 1]) {
      if (side * ball.pos.x > HALF_W + 0.3 && Math.abs(ball.pos.z) < GOAL_WIDTH/2 && ball.pos.y < GOAL_HEIGHT) {
        // team that attacks this side scores: team defending `side` is the one with dir === side
        const scorer = side === 1 ? TEAM_A.dirTeam : null; // placeholder, resolved below
        goalScored(side);
        return;
      }
    }
  }

  // side walls: keep ball in play (arena style — bounces off invisible walls just outside lines)
  if (Math.abs(ball.pos.z) > HALF_H) {
    ball.pos.z = Math.sign(ball.pos.z) * HALF_H; ball.vel.z *= -0.7;
    ball.spin.multiplyScalar(0.5); // ricochets kill spin so curlers don't keep bending
  }
  if (Math.abs(ball.pos.x) > HALF_W) {
    // outside the goal mouth → bounce; inside is handled by goal check
    if (Math.abs(ball.pos.z) > GOAL_WIDTH/2 || ball.pos.y > GOAL_HEIGHT) {
      // shot just wide or over at pace → the crowd gasps
      if (Math.abs(ball.vel.x) > 9 && Math.abs(ball.pos.z) < GOAL_WIDTH/2 + 4 && state.mode === 'play') {
        crowd.onNearMiss();
        crowdExcitement = Math.max(crowdExcitement, 0.45);
        if (state.lastTouchPlayer) commentate(`${state.lastTouchPlayer.name} INCHES WIDE! SO CLOSE`);
      }
      ball.pos.x = Math.sign(ball.pos.x) * HALF_W; ball.vel.x *= -0.7;
      ball.spin.multiplyScalar(0.5);
    } else if (Math.abs(ball.pos.x) > HALF_W + GOAL_DEPTH - 0.2) {
      ball.pos.x = Math.sign(ball.pos.x) * (HALF_W + GOAL_DEPTH - 0.2); ball.vel.multiplyScalar(0.2); // in the net
    }
  }

  ball.mesh.position.copy(ball.pos);
  ball.mesh.rotation.x += ball.vel.z * dt * 2;
  ball.mesh.rotation.z -= ball.vel.x * dt * 2;

  // trail
  trailPts.pop(); trailPts.unshift(ball.pos.clone());
  const attr = trailGeo.attributes.position;
  for (let i = 0; i < TRAIL_N; i++) attr.setXYZ(i, trailPts[i].x, trailPts[i].y, trailPts[i].z);
  attr.needsUpdate = true;
  trailLine.material.opacity = THREE.MathUtils.clamp(ball.vel.length() / 18, 0, 0.6);
}

// ============ GOALS / FLOW ============
const elClock = document.getElementById('clock'), elHalf = document.getElementById('half');
const elSA = document.getElementById('sA'), elSB = document.getElementById('sB');
const elFlash = document.getElementById('goalflash'), elGoalText = document.getElementById('goaltext'), elGoalSub = document.getElementById('goalsub');

function goalScored(side) {
  // ball crossed line at x = side*HALF_W. The team attacking that side scores.
  // TEAM_A has dir -1 (defends left), so it attacks right (+1).
  const scoringTeam = side === 1 ? TEAM_A : TEAM_B;
  if (scoringTeam === TEAM_A) state.scoreA++; else state.scoreB++;
  elSA.textContent = state.scoreA; elSB.textContent = state.scoreB;
  state.mode = 'goal'; state.modeT = 0; state.goalTeam = scoringTeam;
  const lt = state.lastTouchPlayer;
  state.scorer = (lt && lt.team === scoringTeam) ? lt : null;
  document.documentElement.style.setProperty('--goalcolor', '#' + scoringTeam.glow.toString(16).padStart(6,'0'));
  elGoalText.style.color = '#fff';
  elGoalSub.textContent = (state.scorer ? `#${state.scorer.number} ${state.scorer.name}  ·  ` : 'OWN GOAL  ·  ')
    + scoringTeam.name + '  ·  ' + fmtClock(state.clock);
  elFlash.classList.add('show');
  crowdExcitement = 1.6;
  // crowd sections were built for the original two refs — map by home/away end
  crowd.onGoal(scoringTeam === TEAM_A ? LEAGUE_TEAMS[0] : LEAGUE_TEAMS[1]);
  roar(); whistle(1);
  burstConfetti(side * (HALF_W - 6), ball.pos.z * 0.5, scoringTeam.glow);
  commentate(state.scorer
    ? `GOOOAL! #${state.scorer.number} ${state.scorer.name} SCORES FOR ${scoringTeam.name}! ${state.scoreA}-${state.scoreB}`
    : `OWN GOAL! IT FALLS TO ${scoringTeam.name}! ${state.scoreA}-${state.scoreB}`, true);
}

function fmtClock(t) {
  const m = Math.floor(t/60), s = Math.floor(t%60);
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

// ============ FOULS / CARDS / SET PIECES ============
function beginFoul(ruling, offender, victim) {
  state.foul = { ruling, offender, victim, cardShown: false, done: false };
  state.mode = 'foul'; state.modeT = 0;
  whistle(1);
  ball.vel.set(0, 0, 0); ball.spin.set(0, 0, 0); ball.knuckle = 0;
  for (const q of players) { q.kickAnim = null; q.pendingSkillExit = null; }
  commentate(present.lines.foul(victim.name, offender.name), true);
  crowdExcitement = Math.max(crowdExcitement, ruling.verdict === 'foul' ? 0.35 : 0.85);
}

function sendOff(p) {
  scene.remove(p.mesh);
  p.mesh.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
  });
  players.splice(players.indexOf(p), 1);
  const left = players.filter(q => q.team === p.team).length;
  commentate(`${p.name} IS OFF! ${p.team.name} DOWN TO ${left} MEN`, true);
  crowdExcitement = Math.max(crowdExcitement, 1);
}

function beginSetPiece(f) {
  const r = f.ruling, atkTeam = f.victim.team;
  if (r.penalty) {
    const gx = f.offender.dir; // the goal the offender defends
    ball.pos.set(gx * 24, 0.32, 0); ball.vel.set(0,0,0); ball.spin.set(0,0,0);
    const kicker = players.filter(q => q.team === atkTeam && q.role !== 'GK')
      .sort((a, b) => b.flair - a.flair)[0] || f.victim;
    kicker.pos.set(gx * 21, 0, 0); kicker.vel.set(0,0,0);
    kicker.yaw = Math.atan2(gx*HALF_W - kicker.pos.x, -kicker.pos.z);
    // everyone else out of the box, defending keeper on his line
    for (const q of players) {
      if (q === kicker) continue;
      if (q.role === 'GK' && q.team !== atkTeam) { q.pos.set(q.dir * (HALF_W - 1), 0, 0); q.vel.set(0,0,0); continue; }
      if (Math.sign(q.pos.x) === gx && Math.abs(q.pos.x) > 18 && Math.abs(q.pos.z) < 10) {
        q.pos.x = gx * 15 + (Math.random()-0.5)*4;
        q.pos.z = (Math.random()-0.5)*16;
      }
    }
    state.setpiece = { kind: 'penalty', kicker, gx };
    const line = present.lines.penalty(atkTeam.name);
    commentate(line, true);
    present.showEvent({ kind: 'penalty', title: line, subtitle: `${kicker.name} STEPS UP`, color: hex6(atkTeam.glow) });
    crowdExcitement = Math.max(crowdExcitement, 0.9);
  } else {
    ball.pos.set(
      THREE.MathUtils.clamp(r.freeKick.x, -HALF_W+1, HALF_W-1), 0.32,
      THREE.MathUtils.clamp(r.freeKick.z, -HALF_H+1, HALF_H-1));
    ball.vel.set(0,0,0); ball.spin.set(0,0,0);
    const gx = -f.victim.dir; // direction the victim's team attacks
    let kicker = null, kd = 1e9;
    for (const q of players) {
      if (q.team !== atkTeam || q.role === 'GK') continue;
      const d = q.pos.distanceTo(ball.pos);
      if (d < kd) { kd = d; kicker = q; }
    }
    if (kicker) { kicker.pos.set(ball.pos.x - gx*1.6, 0, ball.pos.z + 0.3); kicker.vel.set(0,0,0); }
    // opponents retreat the regulation-ish distance
    for (const q of players) {
      if (q.team === atkTeam || q.role === 'GK') continue;
      if (q.pos.distanceTo(ball.pos) < 7) {
        const away = q.pos.clone().sub(ball.pos).setY(0);
        if (away.lengthSq() < 0.01) away.set(-gx, 0, 0); else away.normalize();
        q.pos.copy(ball.pos).addScaledVector(away, 7);
        q.pos.x = THREE.MathUtils.clamp(q.pos.x, -HALF_W+1, HALF_W-1);
        q.pos.z = THREE.MathUtils.clamp(q.pos.z, -HALF_H+1, HALF_H-1);
      }
    }
    state.setpiece = { kind: 'freekick', kicker, gx };
    const line = present.lines.freekick(atkTeam.name);
    commentate(line, true);
    present.showEvent({ kind: 'freekick', title: line, subtitle: 'SET PIECE', color: hex6(atkTeam.glow) });
  }
  state.mode = 'setpiece'; state.modeT = 0;
}

function takeSetPiece() {
  const s = state.setpiece, k = s.kicker;
  if (!k || !players.includes(k)) { state.mode = 'play'; return; }
  state.lastTouchTeam = k.team; state.lastTouchPlayer = k;
  let flightParams;
  const distToGoal = Math.hypot(s.gx*HALF_W - ball.pos.x, ball.pos.z);
  if (s.kind === 'penalty') {
    const corner = (Math.random() < 0.5 ? -1 : 1) * (2 + Math.random()*1.8);
    const dir = new THREE.Vector3(s.gx*HALF_W - ball.pos.x, 0, corner - ball.pos.z).normalize();
    flightParams = { dir, power: 0.85 + Math.random()*0.15, technique: 'driven', curve: 0 };
    stats[k.team === TEAM_A ? 'shotsA' : 'shotsB']++;
  } else if (distToGoal < 24) {
    // direct free kick: curl it around everything
    const dir = new THREE.Vector3(s.gx*HALF_W - ball.pos.x, 0, (Math.random()-0.5)*5 - ball.pos.z).normalize();
    flightParams = { dir, power: 0.8 + Math.random()*0.15, technique: 'curler', curve: Math.sign(ball.pos.z || 0.5) * s.gx };
    stats[k.team === TEAM_A ? 'shotsA' : 'shotsB']++;
  } else {
    // lofted delivery to the most advanced teammate
    let mate = null, best = -1e9;
    for (const q of players) {
      if (q.team !== k.team || q === k || q.role === 'GK') continue;
      const sc = s.gx * q.pos.x + Math.random()*5;
      if (sc > best) { best = sc; mate = q; }
    }
    const aim = mate ? mate.pos.clone() : new THREE.Vector3(s.gx*16, 0, 0);
    const dir = aim.sub(ball.pos).setY(0).normalize();
    flightParams = { dir, power: THREE.MathUtils.clamp(distToGoal/40, 0.5, 0.85), technique: 'cross', curve: Math.sign(ball.pos.z || 0.5) * s.gx };
  }
  k.kickAnim = { t: 0, struck: false, type: flightParams.technique, flight: flightParams, leg: 0, windup: 0.18, follow: 0.3 };
  state.setpiece = null;
  state.mode = 'play';
}

// ============ CAMERA (broadcast) ============
const camTarget = new THREE.Vector3();
let camShake = 0;
function cameraStep(dt, t) {
  if (state.mode === 'replay' && replay) {
    // cinematic low replay cam: tight, ground-level, tracking the ball
    const bp = ball.mesh.position;
    const desired = new THREE.Vector3(bp.x - replay.side*9, 2.4, bp.z + 11);
    camera.position.lerp(desired, 1 - Math.exp(-2.5*dt));
    camTarget.lerp(new THREE.Vector3(bp.x, 1, bp.z), 1 - Math.exp(-4*dt));
    camera.lookAt(camTarget);
    return;
  }
  // main broadcast cam: side-on, follows ball with damping
  const fx = THREE.MathUtils.clamp(ball.pos.x * 0.78, -HALF_W*0.7, HALF_W*0.7);
  const fz = THREE.MathUtils.clamp(ball.pos.z * 0.3, -8, 8);
  const desired = new THREE.Vector3(fx, 21 + Math.sin(t*0.1)*0.6, 44 + fz*0.4);
  camera.position.lerp(desired, 1 - Math.exp(-1.6 * dt));
  camTarget.lerp(new THREE.Vector3(ball.pos.x*0.85, 1.2, ball.pos.z*0.55), 1 - Math.exp(-2.2 * dt));
  if (state.mode === 'goal') {
    // push in on goal
    const gd = new THREE.Vector3(ball.pos.x*0.8, 8, ball.pos.z + 18);
    camera.position.lerp(gd, 1 - Math.exp(-1.2*dt));
  }
  camShake = Math.max(0, camShake - dt*2);
  const shake = camShake * 0.4;
  camera.position.x += (Math.random()-0.5)*shake;
  camera.position.y += (Math.random()-0.5)*shake;
  camera.lookAt(camTarget);
}

// ============ CROWD ANIMATION ============
let crowdExcitement = 0;
function crowdStep(t, dt) {
  crowdExcitement = Math.max(0, crowdExcitement - dt*0.3);
  crowd.setExcitement(Math.min(crowdExcitement, 1));
  crowd.update(t, dt);
  bloom.strength = 0.55 + crowdExcitement * 0.4;
  // crowd audio bed follows excitement (unless a goal roar envelope is playing)
  if (AC && performance.now() > roarUntil) {
    crowdGain.gain.value = 0.035 + 0.22 * Math.min(crowdExcitement, 1);
  }
}

// ============ PLAYER ANIM ============
const TURN_RATE = 5.5; // rad/s — players pivot, they don't snap
function shortestAngle(a) { return ((a + Math.PI) % (Math.PI*2) + Math.PI*2) % (Math.PI*2) - Math.PI; }
function animatePlayers(dt, t) {
  for (const p of players) {
    p.mesh.position.set(p.pos.x, 0, p.pos.z);
    const sp = p.vel.length();

    // yaw: face travel direction when moving; square up to the ball when slow or striking.
    // skill moves own the yaw (roulette/dragback spin it themselves below)
    let step = 0;
    if (!p.skillAnim) {
      let desiredYaw;
      if (p.kickAnim || sp < 1.0) {
        desiredYaw = Math.atan2(ball.pos.x - p.pos.x, ball.pos.z - p.pos.z);
      } else {
        desiredYaw = Math.atan2(p.vel.x, p.vel.z);
      }
      const dyaw = shortestAngle(desiredYaw - p.yaw);
      step = THREE.MathUtils.clamp(dyaw, -TURN_RATE*dt, TURN_RATE*dt);
      p.yaw += step;
    }
    p.mesh.rotation.y = p.yaw;

    // head tracks the ball independently of the body (within neck limits)
    const headYaw = shortestAngle(Math.atan2(ball.pos.x - p.pos.x, ball.pos.z - p.pos.z) - p.yaw);
    const hp = p.mesh.userData.headPivot;
    hp.rotation.y = THREE.MathUtils.lerp(hp.rotation.y, THREE.MathUtils.clamp(headYaw, -1.1, 1.1), 1 - Math.exp(-10*dt));

    // body lean: pitch forward with speed, roll into turns; staggers wobble, falls tip over
    const run = Math.min(sp / p.speed, 1);
    let leanX = run * 0.16;
    let roll = -step/Math.max(dt,1e-4)/TURN_RATE * run * 0.12;
    if (p.fallT > 0) {
      // knocked down: tip over hard, then climb back upright over the last 0.45s
      const down = THREE.MathUtils.clamp(p.fallT / 0.45, 0, 1);
      leanX = p.fallDir * 1.45 * down; roll = 0;
    } else if (p.stagger > 0) {
      roll = Math.sin(t * 16 + p.phase) * 0.2 * Math.min(p.stagger / 0.5, 1);
    }
    p.mesh.rotation.x = THREE.MathUtils.lerp(p.mesh.rotation.x, leanX, 1 - Math.exp(-(p.fallT > 0 ? 13 : 8)*dt));
    p.mesh.rotation.z = THREE.MathUtils.lerp(p.mesh.rotation.z, roll, 1 - Math.exp(-8*dt));

    const legs = p.mesh.userData.legs, arms = p.mesh.userData.arms;
    // GAIT: legs are driven by distance covered, not the clock — a slow jog takes
    // slow steps, a sprint takes quick ones. ~2.4 rad per meter ≈ 1.3m full stride.
    p.stridePhase += sp * dt * 2.4;
    const gaitAmp = THREE.MathUtils.clamp(sp / 7, 0, 1) * 0.6 + (sp > 0.3 ? 0.05 : 0);
    const stride = Math.sin(p.stridePhase) * gaitAmp;
    const armSwing = Math.sin(p.stridePhase) * gaitAmp * 0.85; // arms counter-swing the legs

    if (p.fallT > 0.45) {
      // sprawled on the turf
      legs[0].rotation.x = 0.4; legs[1].rotation.x = -0.25;
      arms[0].rotation.x = -1.0; arms[1].rotation.x = -0.7;
      p.mesh.position.y = 0;
    } else if (p.skillAnim) {
      // skill moves: each gets a distinct body shape
      const sa = p.skillAnim;
      sa.t += dt;
      const k = Math.min(sa.t / sa.dur, 1);
      if (sa.move === 'stepover') {
        legs[0].rotation.x = Math.sin(k * Math.PI * 2) * 1.1;
        legs[0].rotation.y = Math.sin(k * Math.PI) * 0.8;     // circling foot over the ball
        legs[1].rotation.x = 0.12;
        arms[0].rotation.x = -0.4; arms[1].rotation.x = 0.4;
      } else if (sa.move === 'bodyfeint') {
        p.mesh.rotation.z = Math.sin(k * Math.PI) * (k < 0.4 ? 0.45 : -0.3); // shoulder drop, whip back
        legs[0].rotation.x = 0.3; legs[1].rotation.x = -0.3;
      } else if (sa.move === 'dragback') {
        legs[0].rotation.x = -Math.sin(k * Math.PI) * 1.0;    // sole drags the ball back
        legs[1].rotation.x = 0.15;
        p.yaw += Math.PI * dt / sa.dur;                       // 180° turn over the move
      } else { // roulette
        p.yaw += Math.PI * 2 * dt / sa.dur;                   // full spin
        arms[0].rotation.z = -1.1; arms[1].rotation.z = 1.1;
        legs[0].rotation.x = 0.25; legs[1].rotation.x = -0.25;
      }
      p.mesh.rotation.y = p.yaw;
      if (sa.t >= sa.dur) { p.skillAnim = null; legs[0].rotation.y = 0; }
    } else if (p.kickAnim) {
      // wind-up → strike → follow-through on the chosen leg; plant leg stays under the body
      const k = p.kickAnim;
      const kickLeg = legs[k.leg], plantLeg = legs[1 - k.leg];
      let ang;
      if (k.t < k.windup) ang = THREE.MathUtils.lerp(0, 0.95, k.t / k.windup);            // back-swing
      else ang = THREE.MathUtils.lerp(0.95, -1.35, Math.min((k.t - k.windup) / k.follow, 1)); // snap through
      const amp = k.type === 'dribble' ? 0.45 : 1;
      kickLeg.rotation.x = ang * amp;
      plantLeg.rotation.x = THREE.MathUtils.lerp(plantLeg.rotation.x, 0.12, 0.4);
      // counter-rotating arms for balance
      arms[k.leg].rotation.x = -ang * 0.5 * amp;
      arms[1 - k.leg].rotation.x = ang * 0.5 * amp;
      p.mesh.position.y = 0;
    } else if (state.mode === 'goal' && p.team === state.goalTeam) {
      // arms up, bouncing
      arms[0].rotation.x = Math.PI - 0.4 + Math.sin(t*8+p.phase)*0.25;
      arms[1].rotation.x = Math.PI - 0.4 - Math.sin(t*8+p.phase)*0.25;
      legs[0].rotation.x = stride; legs[1].rotation.x = -stride;
      p.mesh.position.y = Math.abs(Math.sin(t * 7 + p.phase)) * 0.32;
    } else {
      legs[0].rotation.x = stride;
      legs[1].rotation.x = -stride;
      arms[0].rotation.x = -armSwing;
      arms[1].rotation.x = armSwing;
      // GK spreads arms when a shot is incoming
      if (p.role === 'GK' && Math.abs(ball.pos.x - p.dir*HALF_W) < 14 && ball.vel.length() > 8) {
        arms[0].rotation.z = THREE.MathUtils.lerp(arms[0].rotation.z, -1.2, 0.2);
        arms[1].rotation.z = THREE.MathUtils.lerp(arms[1].rotation.z, 1.2, 0.2);
      } else {
        arms[0].rotation.z = THREE.MathUtils.lerp(arms[0].rotation.z, 0, 0.1);
        arms[1].rotation.z = THREE.MathUtils.lerp(arms[1].rotation.z, 0, 0.1);
      }
      p.mesh.position.y = Math.abs(Math.cos(p.stridePhase)) * run * 0.05;
    }
  }
}

// ============ AUDIO (fully synthesized — no asset files) ============
let AC = null, masterGain = null, crowdGain = null, roarUntil = 0;
function initAudio() {
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = AC.createGain(); masterGain.gain.value = 0.9; masterGain.connect(AC.destination);
  // crowd bed: looped noise through a bandpass — gain rides the excitement level
  const len = AC.sampleRate * 2;
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random()*2 - 1;
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 700; bp.Q.value = 0.6;
  crowdGain = AC.createGain(); crowdGain.gain.value = 0.05;
  src.connect(bp); bp.connect(crowdGain); crowdGain.connect(masterGain);
  src.start();
  const pill = document.getElementById('soundpill'); if (pill) pill.remove();
}
addEventListener('pointerdown', initAudio, { once: true });

function thump(power) { // ball contact — pitch and volume scale with kick power
  if (!AC) return;
  const t0 = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(110 + power*3, t0);
  o.frequency.exponentialRampToValueAtTime(40, t0 + 0.12);
  g.gain.setValueAtTime(Math.min(0.5, 0.08 + power*0.018), t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.15);
  o.connect(g); g.connect(masterGain); o.start(t0); o.stop(t0 + 0.16);
}
function whistle(blasts) { // 1 = kickoff/goal, 2 = halftime, 3 = full time (long last blast)
  if (!AC) return;
  for (let i = 0; i < blasts; i++) {
    const t0 = AC.currentTime + i * 0.45;
    const long = blasts === 3 && i === 2;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'square'; o.frequency.value = 2350;
    const trill = AC.createOscillator(); trill.frequency.value = 34;
    const tg = AC.createGain(); tg.gain.value = 220;
    trill.connect(tg); tg.connect(o.frequency);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(0.1, t0 + 0.02);
    g.gain.setValueAtTime(0.1, t0 + (long ? 0.75 : 0.26));
    g.gain.exponentialRampToValueAtTime(0.001, t0 + (long ? 0.9 : 0.34));
    o.connect(g); g.connect(masterGain);
    o.start(t0); o.stop(t0 + 1); trill.start(t0); trill.stop(t0 + 1);
  }
}
function roar() { // goal eruption swells over the crowd bed, decays for ~5s
  if (!AC) return;
  const t0 = AC.currentTime;
  crowdGain.gain.cancelScheduledValues(t0);
  crowdGain.gain.setValueAtTime(Math.max(crowdGain.gain.value, 0.06), t0);
  crowdGain.gain.linearRampToValueAtTime(0.55, t0 + 0.25);
  crowdGain.gain.exponentialRampToValueAtTime(0.07, t0 + 5);
  roarUntil = performance.now() + 5200;
}

// ============ REPLAY SYSTEM ============
const frames = [];
function recordFrame() {
  const f = { tt: state.clock, b: [ball.pos.x, ball.pos.y, ball.pos.z], p: new Float32Array(players.length*3) };
  for (let i = 0; i < players.length; i++) {
    f.p[i*3] = players[i].pos.x; f.p[i*3+1] = players[i].pos.z; f.p[i*3+2] = players[i].yaw;
  }
  frames.push(f);
  while (frames.length && frames[0].tt < state.clock - 6.5) frames.shift();
}
let replay = null;
function startReplay() {
  if (frames.length < 20) { backToKickoff(); return; }
  replay = { clip: frames.slice(), t: 0, idx: 0, side: state.goalTeam === TEAM_A ? 1 : -1 };
  frames.length = 0;
  state.mode = 'replay';
  document.getElementById('replaytag').classList.add('show');
}
function backToKickoff() {
  document.getElementById('replaytag').classList.remove('show');
  state.mode = 'kickoff'; state.modeT = 0;
  resetPositions(state.goalTeam ? (state.goalTeam === TEAM_A ? TEAM_B : TEAM_A) : TEAM_A);
  replay = null;
}
function replayStep(dt) {
  const c = replay.clip;
  replay.t += dt * 0.45; // slow motion
  const simT = c[0].tt + replay.t;
  while (replay.idx < c.length - 2 && c[replay.idx+1].tt < simT) replay.idx++;
  const f0 = c[replay.idx], f1 = c[Math.min(replay.idx+1, c.length-1)];
  const span = Math.max(f1.tt - f0.tt, 1e-4);
  const a = THREE.MathUtils.clamp((simT - f0.tt) / span, 0, 1);
  ball.mesh.position.set(
    THREE.MathUtils.lerp(f0.b[0], f1.b[0], a),
    THREE.MathUtils.lerp(f0.b[1], f1.b[1], a),
    THREE.MathUtils.lerp(f0.b[2], f1.b[2], a));
  const nRep = Math.min(players.length, Math.floor(f0.p.length / 3), Math.floor(f1.p.length / 3));
  for (let i = 0; i < nRep; i++) {
    const p = players[i];
    const x = THREE.MathUtils.lerp(f0.p[i*3], f1.p[i*3], a);
    const z = THREE.MathUtils.lerp(f0.p[i*3+1], f1.p[i*3+1], a);
    const sp = Math.hypot(x - p.mesh.position.x, z - p.mesh.position.z) / Math.max(dt, 1e-4);
    p.stridePhase += Math.min(sp, 9) * dt * 2.4 * 0.45;
    const amp = THREE.MathUtils.clamp(sp/7, 0, 1) * 0.6;
    const s = Math.sin(p.stridePhase) * amp;
    p.mesh.userData.legs[0].rotation.x = s; p.mesh.userData.legs[1].rotation.x = -s;
    p.mesh.userData.arms[0].rotation.x = -s*0.85; p.mesh.userData.arms[1].rotation.x = s*0.85;
    p.mesh.position.set(x, 0, z);
    p.mesh.rotation.y = f0.p[i*3+2];
  }
  if (simT >= c[c.length-1].tt - 0.02 || replay.t > 9) backToKickoff();
}

const elCard = document.getElementById('bigcard'), elPanel = document.getElementById('cardpanel');
const elTeamAEl = document.getElementById('teamA'), elTeamBEl = document.getElementById('teamB');
function pct(a, b) { const s = a + b; return s ? Math.round(a / s * 100) : 50; }

function showCard(title, score, withTable) {

    + (withTable ? '<div style="height:14px"></div>' + tableHTML() : '');

function hideCard() { elCard.classList.remove('show'); }

function finishMatch() {
  whistle(3);
  const ra = league.table[TEAM_A.name], rb = league.table[TEAM_B.name];
  ra.p++; rb.p++;
  ra.gf += state.scoreA; ra.ga += state.scoreB;
  rb.gf += state.scoreB; rb.ga += state.scoreA;
  if (state.scoreA > state.scoreB) { ra.w++; ra.pts += 3; rb.l++; }
  else if (state.scoreB > state.scoreA) { rb.w++; rb.pts += 3; ra.l++; }
  else { ra.d++; rb.d++; ra.pts++; rb.pts++; }
  league.fixture++;
  localStorage.setItem('cyberliga', JSON.stringify(league));
  showCard('FULL TIME', `${TEAM_A.name} ${state.scoreA} — ${state.scoreB} ${TEAM_B.name}`, true);
  commentate(`FULL TIME: ${TEAM_A.name} ${state.scoreA}-${state.scoreB} ${TEAM_B.name}`, true);
  state.mode = 'fulltime'; state.modeT = 0;
}

function clearTeams() {
  for (const p of players) {
    scene.remove(p.mesh);
    p.mesh.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
    });
  }
  players.length = 0;
}
function startMatch() {
  const [ia, ib] = FIXTURES[league.fixture % FIXTURES.length];
  TEAM_A = LEAGUE_TEAMS[ia]; TEAM_B = LEAGUE_TEAMS[ib];
  clearTeams();
  ref.reset(); // fresh book for the new fixture
  makeTeam(TEAM_A, -1); makeTeam(TEAM_B, 1);
  state.scoreA = 0; state.scoreB = 0; state.clock = 0; state.half = 1;
  state.lastTouchTeam = null; state.lastTouchPlayer = null; state.goalTeam = null; state.scorer = null;
  stats.reset(); frames.length = 0;
  elSA.textContent = '0'; elSB.textContent = '0'; elHalf.textContent = '1ST HALF';
  const cA = hex6(TEAM_A.glow), cB = hex6(TEAM_B.glow);
  elTeamAEl.innerHTML = `<span class="dot" style="background:${cA};box-shadow:0 0 10px ${cA}"></span>${TEAM_A.name}`;
  elTeamAEl.style.color = cA;
  elTeamBEl.innerHTML = `${TEAM_B.name}<span class="dot" style="background:${cB};box-shadow:0 0 10px ${cB}"></span>`;
  elTeamBEl.style.color = cB;
  resetPositions(Math.random() < 0.5 ? TEAM_A : TEAM_B);
  state.mode = 'kickoff'; state.modeT = 0;
  commentate(`MATCHDAY ${league.fixture + 1}: ${TEAM_A.name} vs ${TEAM_B.name} — KICKOFF AT THE GRAND ARENA`, true);
  updateJumbotron();
}

// ============ MAIN LOOP ============
const clock3 = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock3.getDelta(), 0.05);
  const t = clock3.elapsedTime;

  if (state.mode === 'kickoff') {
    state.modeT += dt;
    if (state.modeT > 1.4) { state.mode = 'play'; whistle(1); }
  } else if (state.mode === 'play') {
    state.clock += dt;
    if (state.lastTouchTeam === TEAM_A) stats.posA += dt;
    else if (state.lastTouchTeam === TEAM_B) stats.posB += dt;
    recordFrame();
    if (state.half === 1 && state.clock >= HALF_LEN) {
      whistle(2);
      showCard('HALF TIME', `${TEAM_A.name} ${state.scoreA} — ${state.scoreB} ${TEAM_B.name}`, false);
      state.mode = 'halftime'; state.modeT = 0;
    } else if (state.half === 2 && state.clock >= HALF_LEN*2) {
      finishMatch();
    }
    aiStep(dt);
  } else if (state.mode === 'goal') {
    state.modeT += dt;
    if (state.modeT > 0.1 && state.modeT < 0.2) camShake = 1;
    if (state.modeT > 3.0) {
      elFlash.classList.remove('show');
      startReplay();
    }
    aiStep(dt); // full-speed celebration mobbing
  } else if (state.mode === 'replay') {
    replayStep(dt);
  } else if (state.mode === 'halftime') {
    state.modeT += dt;
    if (state.modeT > 6.5) {
      hideCard();
      state.half = 2; elHalf.textContent = '2ND HALF';
      resetPositions(Math.random() < 0.5 ? TEAM_A : TEAM_B);
      state.mode = 'kickoff'; state.modeT = 0;
    }
  } else if (state.mode === 'fulltime') {
    state.modeT += dt;
    if (state.modeT > 11) { hideCard(); startMatch(); }
  } else if (state.mode === 'foul') {
    state.modeT += dt;
    const f = state.foul;
    if (state.modeT > 1.1 && !f.cardShown) {
      f.cardShown = true;
      const v = f.ruling.verdict, css = hex6(f.offender.team.glow);
      if (v === 'yellow' || v === 'red') {
        ref.raiseCard(v);
        const line = v === 'red'
          ? (f.ruling.reason === 'SECOND YELLOW' ? present.lines.secondYellow(f.offender.name) : present.lines.red(f.offender.name, f.ruling.reason))
          : present.lines.yellow(f.offender.name, f.ruling.reason);
        commentate(line, true);
        present.showEvent({ kind: v, title: line, subtitle: f.offender.team.name, color: css });
      } else {
        present.showEvent({ kind: 'foul', title: present.lines.foul(f.victim.name, f.offender.name), subtitle: f.offender.team.name, color: css });
      }
    }
    if (state.modeT > 2.9 && !f.done) {
      f.done = true;
      if (f.ruling.sendOff) sendOff(f.offender);
      beginSetPiece(f);
    }
  } else if (state.mode === 'setpiece') {
    state.modeT += dt;
    if (state.modeT > 1.7) takeSetPiece();
  }

  if (state.mode === 'play' || state.mode === 'kickoff') ballStep(dt);
  else if (state.mode !== 'replay') ball.mesh.position.copy(ball.pos);

  if (state.mode !== 'replay') {
    updateKicks(dt);
    animatePlayers(dt, t);
  }
  // fake blob shadow tracks the rendered ball, fading with height
  ballShadow.position.set(ball.mesh.position.x, 0.021, ball.mesh.position.z);
  const bh = Math.max(ball.mesh.position.y - 0.32, 0);
  ballShadow.scale.setScalar(1 + bh*0.18);
  ballShadow.material.opacity = 0.35 / (1 + bh*0.7);

  updateFlashes(dt);
  confettiStep(dt);
  crowdStep(t, dt);
  ref.update(t, dt, ball, players);
  cameraStep(dt, t);
  tick.f = (tick.f || 0) + 1;
  if (tick.f % 30 === 0) updateJumbotron();
  elClock.textContent = fmtClock(state.clock);

  composer.render();
}
startMatch();
tick();

// debug hook (harmless in prod, lets devtools poke the sim)
window.CL = { state, ball, players, goalScored, ref, beginFoul, flight, present };

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
