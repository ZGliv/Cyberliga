<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>kayrig test — KayKit player rigs</title>
<style>
  body { margin: 0; background: #0a0c12; overflow: hidden; font-family: monospace; }
  #label { position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    color: #c8ff4d; font-size: 22px; letter-spacing: 2px; text-shadow: 0 0 8px #000; z-index: 5; }
  #sub { position: fixed; top: 44px; left: 50%; transform: translateX(-50%);
    color: #8892aa; font-size: 13px; z-index: 5; }
</style>
</head>
<body>
<div id="label">loading…</div>
<div id="sub">click to skip to the next pose · arrow = group +Z (forward)</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { preloadHumanModel, buildPlayerRig } from './kayrig.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0c12);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 3.2, 9);
camera.lookAt(0, 1.1, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x8899ff, 0x223322, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(4, 8, 6); sun.castShadow = true; scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40),
  new THREE.MeshStandardMaterial({ color: 0x14301c }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
scene.add(new THREE.GridHelper(40, 40, 0x224433, 0x1a2a22));

await preloadHumanModel();

// 4 characters in team colors: outfield red, outfield blue, GK, captain
const rigs = [
  buildPlayerRig({ kitColor: 0xff2255, glowColor: 0x33ffd0, isGK: false, captain: false, character: 'Knight' }),
  buildPlayerRig({ kitColor: 0x2266ff, glowColor: 0xffe14d, isGK: false, captain: true, headband: true, character: 'Barbarian' }),
  buildPlayerRig({ kitColor: 0xff2255, glowColor: 0x33ffd0, isGK: true, character: 'Skeleton_Mage' }),
  buildPlayerRig({ kitColor: 0x2266ff, glowColor: 0xffe14d, isGK: false, character: 'Skeleton_Rogue' }),
];
rigs.forEach((r, i) => {
  r.group.position.x = (i - 1.5) * 2.2;
  scene.add(r.group);
  // forward arrow: must match the way the model faces
  scene.add(new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1),
    new THREE.Vector3((i - 1.5) * 2.2, 0.05, 0.8), 1, 0xc8ff4d, 0.25, 0.15));
});

// ---- test sequence: locomotion sweep, then every pose ----
const SEQ = [
  { name: 'LOCOMOTION idle→walk→run→idle', dur: 8, fn: (r, k, t) => { /* speed handled below */ } },
  { name: 'poseKick', dur: 2.5, loopK: 1.1, fn: (r, k) => r.poseKick(k, 1, 1) },
  { name: 'poseHeader', dur: 2.5, loopK: 1.2, fn: (r, k) => r.poseHeader(k) },
  { name: 'poseThrowIn', dur: 2.5, loopK: 1.4, fn: (r, k) => r.poseThrowIn(k) },
  { name: 'poseFall', dur: 3, loopK: 1.4, fn: (r, k) => r.poseFall(k) },
  { name: 'poseGetUp', dur: 3, loopK: 1.6, fn: (r, k) => r.poseGetUp(k) },
  { name: 'poseCelebrate ×4 variants', dur: 6, fn: (r, k, t, i) => r.poseCelebrate(t, i) },
  { name: 'poseSkill stepover/bodyfeint/dragback/roulette', dur: 4, loopK: 1.2,
    fn: (r, k, t, i) => r.poseSkill(['stepover', 'bodyfeint', 'dragback', 'roulette'][i], k, 1) },
  { name: 'poseSlideTackle', dur: 3, loopK: 1.3, fn: (r, k) => r.poseSlideTackle(k, 1) },
  { name: 'poseJockey (L / R)', dur: 4, fn: (r, k, t, i) => r.poseJockey(t, i % 2 ? -1 : 1) },
  { name: 'poseShield', dur: 3, fn: (r, k) => r.poseShield(k) },
  { name: 'poseGKSet', dur: 3, fn: (r, k, t) => r.poseGKSet(t) },
  { name: 'poseGKCatch', dur: 2.5, loopK: 1.4, fn: (r, k) => r.poseGKCatch(k) },
  { name: 'poseGKPunch', dur: 2.5, loopK: 1.3, fn: (r, k) => r.poseGKPunch(k) },
  { name: 'poseDive (L / R)', dur: 3, loopK: 1.5, fn: (r, k, t, i) => r.poseDive(i % 2 ? -1 : 1, k) },
  { name: 'poseLimp (speedNorm 0.12)', dur: 4, speed: 0.12, fn: (r, k, t) => r.poseLimp(t, 1) },
  { name: 'poseTrudge (speedNorm 0.1)', dur: 4, speed: 0.1, fn: (r, k, t) => r.poseTrudge(t) },
  { name: 'poseExhausted', dur: 4, fn: (r, k, t) => r.poseExhausted(t) },
  { name: 'poseKneeSlide', dur: 3, loopK: 1.2, fn: (r, k) => r.poseKneeSlide(k) },
  { name: 'posePointToSpot', dur: 3, fn: (r, k, t) => r.posePointToSpot(t) },
  { name: 'poseWhistle', dur: 3, fn: (r, k, t) => r.poseWhistle(t) },
  { name: 'back to pure locomotion (run)', dur: 4, speed: 0.85, fn: () => {} },
];

let seqIdx = 0, seqT = 0, hold = false;
const label = document.getElementById('label');
addEventListener('click', () => { seqT = 1e9; });
// debug hook: jump to pose i and stop auto-advance; setSeq(i, k) also pins k
let pinK = null;
window.setSeq = (i, k = null) => { seqIdx = i; seqT = 0.5; hold = true; pinK = k; };
window.go = () => { hold = false; pinK = null; };
window.rigs = rigs; window.THREE = THREE;

const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  seqT += dt;
  const item = SEQ[seqIdx];
  if (!hold && seqT > item.dur) { seqT = 0; seqIdx = (seqIdx + 1) % SEQ.length; }
  if (hold && seqT > item.dur) seqT = 0.5;
  const cur = SEQ[seqIdx];
  label.textContent = (seqIdx + 1) + '/' + SEQ.length + ' — ' + cur.name;

  let speed = cur.speed ?? 0;
  if (seqIdx === 0) { // locomotion sweep 0 -> 1 -> 0
    const u = seqT / cur.dur;
    speed = u < 0.5 ? u * 2 : (1 - u) * 2;
  }
  let k = cur.loopK ? (seqT * cur.loopK / cur.dur) % 1 : Math.min(seqT / cur.dur, 1);
  if (pinK !== null) k = pinK;
  rigs.forEach((r, i) => {
    if (seqIdx !== 0) cur.fn(r, k, seqT, i);
    r.headPivot.rotation.y = Math.sin(t * 0.7) * 0.7; // head tracking exercise
    r.update(dt, speed, { accel: 0, turn: 0 });
  });
  renderer.render(scene, camera);
}
frame();
</script>
</body>
</html>
