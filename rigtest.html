<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>RIG SPIKE</title>
<style>body{margin:0;background:#02030a;overflow:hidden}#info{position:fixed;top:10px;left:10px;color:#7ef0ff;font:14px monospace;white-space:pre}</style>
</head>
<body>
<div id="info">loading…</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02030a);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 2.2, 7); camera.lookAt(0, 1, 0);
scene.add(new THREE.HemisphereLight(0x4a5da0, 0x0a0d1a, 1.2));
const sun = new THREE.DirectionalLight(0xeaf4ff, 2.2); sun.position.set(4, 8, 5); sun.castShadow = true; scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x0e4d2c }));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);

const info = document.getElementById('info');
const loader = new GLTFLoader();
const URL_GLB = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/models/gltf/Soldier.glb';

loader.load(URL_GLB, (gltf) => {
  const lines = [];
  lines.push('clips: ' + gltf.animations.map(a => a.name).join(', '));
  // list bones from the source
  const bones = [];
  gltf.scene.traverse(o => { if (o.isBone) bones.push(o.name); });
  lines.push('bones(' + bones.length + '): ' + bones.slice(0, 14).join(','));
  window.BONES = bones;

  const COLORS = [0x00e5ff, 0xff2d78, 0xffc24d];
  const mixers = [];
  for (let i = 0; i < 3; i++) {
    const clone = SkeletonUtils.clone(gltf.scene);
    clone.position.set((i - 1) * 2.2, 0, 0);
    clone.traverse(o => {
      if (o.isMesh) {
        o.castShadow = true;
        o.material = o.material.clone();
        if (o.material.color) o.material.color.lerp(new THREE.Color(COLORS[i]), 0.55);
      }
    });
    scene.add(clone);
    const mixer = new THREE.AnimationMixer(clone);
    const runClip = gltf.animations.find(a => /run/i.test(a.name)) || gltf.animations[0];
    const idleClip = gltf.animations.find(a => /idle/i.test(a.name));
    const action = mixer.clipAction(i === 2 && idleClip ? idleClip : runClip);
    action.timeScale = i === 0 ? 1 : 1.3;
    action.play();
    mixers.push(mixer);
    if (i === 2) {
      // procedural bone override test: grab the right thigh and swing it (the "kick" proof)
      let thigh = null;
      clone.traverse(o => { if (o.isBone && /UpLeg.*R|RightUpLeg|R_UpLeg|UpLegR/i.test(o.name)) thigh = o; });
      if (!thigh) clone.traverse(o => { if (!thigh && o.isBone && /leg/i.test(o.name)) thigh = o; });
      window.THIGH = thigh;
      lines.push('thigh bone found: ' + (thigh ? thigh.name : 'NO'));
    }
  }
  info.textContent = lines.join('\n');
  window.SPIKE_OK = true;

  const clock = new THREE.Clock();
  (function tick() {
    requestAnimationFrame(tick);
    const dt = clock.getDelta();
    mixers.forEach(m => m.update(dt));
    // override AFTER mixer: swing the thigh like a kick — proves procedural control wins
    if (window.THIGH) window.THIGH.rotation.x = -0.6 + Math.sin(clock.elapsedTime * 3) * 0.9;
    renderer.render(scene, camera);
  })();
}, undefined, (err) => { info.textContent = 'LOAD FAILED: ' + err; window.SPIKE_OK = false; });
</script>
</body>
</html>
