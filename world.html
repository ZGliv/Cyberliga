  <meta charset="utf-8" />

  <link rel="stylesheet" href="world-desk.css" />
  <link rel="stylesheet" href="app-shell.css" />
</head>
<body data-surface="live" data-cyberliga-presence-manual>
  <div class="loading" id="loading" role="status"><span></span><p>Opening tonight’s world</p></div>

  <header class="cl-app-header">
    <a class="cl-app-brand" href="world.html" aria-label="Cyberliga Home">
      <strong>CYBERLIGA</strong>
      <span>World sports, always on</span>
    </a>
    <nav class="cl-app-nav" aria-label="Primary navigation">
      <a href="world.html" aria-current="page">Home</a>
      <a href="league.html?sport=soccer">Leagues</a>
    </nav>
  </header>

  <nav class="surface-tabs" aria-label="Home view">
    <button class="surface-tab active" id="surface-live" type="button" data-surface-target="live" aria-pressed="true">Live</button>
    <button class="surface-tab" id="surface-world" type="button" data-surface-target="world" aria-pressed="false">World</button>
  </nav>

  <main class="home-shell">
    <section class="world-stage" id="world-stage" aria-labelledby="world-heading">
      <canvas id="globe" aria-label="Interactive globe showing the selected Cyberliga fixture"></canvas>
      <div class="globe-labels" id="globe-labels" aria-hidden="true"></div>
      <div class="world-heading">
        <p>World view</p>
        <h1 id="world-heading">One world.<br />Always playing.</h1>
        <span id="world-selection">Select a game to locate it on the globe.</span>
      </div>
      <div class="world-instruction" aria-hidden="true"><span></span>Drag to explore</div>
      <article class="world-match-card" id="world-match-card" aria-label="Selected world fixture"></article>
    </section>

    <aside class="liveboard" aria-label="Tonight’s Cyberliga schedule">
      <header class="liveboard-header">
        <div>
          <p>Live now</p>
          <h2>Tonight</h2>
        </div>
        <div class="slate-meta">
          <strong>24 games · 48 clubs</strong>
          <span id="tonight-date">Around the world</span>
        </div>
      </header>

      <section class="featured-slot" id="featured-slot" aria-label="Featured game"></section>

      <section class="schedule" aria-labelledby="schedule-heading">
        <header class="schedule-heading">
          <h3 id="schedule-heading">All channels</h3>
          <span class="presence-quiet" data-cyberliga-presence data-presence-mode="quiet">Schedule updates automatically</span>
        </header>
        <div class="filter-tabs" id="filter-tabs" role="group" aria-label="Filter games by sport"></div>
        <div class="game-drawer" id="game-drawer">
          <div class="game-list" id="game-list"></div>
        </div>
      </section>
    </aside>
  </main>

  <noscript>Cyberliga Home requires JavaScript to load the live schedule and world map.</noscript>
  <script src="worlddata.js"></script>
  <script src="branddata.js"></script>
  <script src="universe.js"></script>
  <script src="presence.js"></script>
  <script src="livebridge.js"></script>
  <script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js" } }</script>
  <script type="module" src="world-home.js"></script>
</body>
</html>
